<html lang="pt-BR">
<head>

<style>
  :root{--bg:#0f1420;--card:#161d2c;--line:#2a3548;--tx:#e8edf7;--tx2:#8b99b5;--azul:#3b82f6;--verde:#22c55e;--verm:#ef4444;--amb:#fbbf24}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:15px -apple-system,system-ui,sans-serif;
       padding:calc(16px + env(safe-area-inset-top)) 16px 40px}
  .cx{max-width:1100px;margin:0 auto}
  h1{font-size:22px;margin:0}h1 i{color:var(--azul);font-style:normal}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx2);margin:26px 0 10px;font-weight:600}
  .topo{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
  .sub{color:var(--tx2);font-size:12.5px}
  .lk{background:none;border:0;color:var(--azul);font-size:14px;cursor:pointer;padding:6px 0}
  .grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}
  .k{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .k b{display:block;font-size:22px;white-space:nowrap;font-variant-numeric:tabular-nums;margin-top:2px}
  .k span{font-size:12px;color:var(--tx2)}
  .k small{display:block;font-size:11.5px;color:var(--tx2);margin-top:2px}
  .k.v b{color:var(--verde)}.k.a b{color:var(--amb)}.k.r b{color:var(--verm)}
  .filtro button{background:var(--bg);border:1px solid var(--line);color:var(--tx2);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}
  .filtro button.on{background:var(--azul);border-color:var(--azul);color:#fff}
  .filtro{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .filtro input{flex:1;min-width:180px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:14px}
  .tab{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:860px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--tx2);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--card)}
  td.n{text-align:right;font-variant-numeric:tabular-nums}th.n{text-align:right}
  tr:last-child td{border-bottom:0}
  .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11.5px;background:var(--bg);border:1px solid var(--line)}
  .tag.mensal,.tag.anual{border-color:var(--verde);color:var(--verde)}.tag.teste{border-color:var(--azul);color:var(--azul)}
  .tag.cortesia,.tag.cortesia_app{border-color:var(--amb);color:var(--amb)}.tag.vencida,.tag.pendente{border-color:var(--verm);color:var(--verm)}
  .zap{color:var(--verde);text-decoration:none}
  .mini{background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:4px 8px;font-size:12px;cursor:pointer;margin-left:4px}
  .form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-items:end}
  .form label{font-size:12px;color:var(--tx2);display:block;margin-bottom:4px}
  .form input,.form select{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:14px}
  .form button{padding:10px;border:0;border-radius:9px;background:var(--azul);color:#fff;font-weight:700;cursor:pointer}
  /* gráficos: um por assunto */
  .graficos{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
  .gr{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 10px;min-width:0}
  .grt{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .grt h3{margin:0;font-size:13px;font-weight:600;color:var(--tx2)}
  .grt b{font-size:18px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .grn{font-size:11.5px;color:var(--tx2);margin-top:2px}
  .cols{display:flex;gap:2px;height:110px;margin-top:10px;position:relative;border-bottom:1px solid var(--line)}
  .cols .c{flex:1;min-width:0;display:flex;flex-direction:column;cursor:pointer;position:relative;z-index:1}
  .cols .c:hover{background:rgba(255,255,255,.04)}
  .cols .p{display:flex;align-items:flex-end;justify-content:center}
  .cols .n{display:flex;align-items:flex-start;justify-content:center}
  .cols i{display:block;width:100%;max-width:26px;min-height:1px;opacity:.75}
  .cols .p i{border-radius:4px 4px 0 0}.cols .n i{border-radius:0 0 4px 4px}
  .cols .c.at i{opacity:1}
  .cols.linha svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .xs{display:flex;gap:2px;margin-top:4px}
  .xs span{flex:1;min-width:0;text-align:center;font-size:10px;color:var(--tx2);white-space:nowrap;overflow:visible}
  #dica{position:fixed;display:none;z-index:20;pointer-events:none;background:#0b0f18;border:1px solid var(--line);color:var(--tx);
        font-size:12.5px;padding:6px 9px;border-radius:8px;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  @media(max-width:600px){.graficos{grid-template-columns:1fr}}
  .ok-msg{color:var(--verde);font-size:13px;margin-top:8px;min-height:18px}
  .form.ed{border-color:var(--amb)}
  .form button.sec{background:var(--bg);border:1px solid var(--line);color:var(--tx)}
  /* log da pessoa */
  .fundo{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;justify-content:center;align-items:flex-start;
         padding:calc(20px + env(safe-area-inset-top)) 12px 20px;z-index:10;overflow-y:auto}
  .janela{background:var(--card);border:1px solid var(--line);border-radius:16px;width:100%;max-width:720px;padding:16px}
  .janela .topo h3{margin:0;font-size:17px}
  .ev{display:flex;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13.5px;align-items:baseline}
  .ev:last-child{border-bottom:0}
  .ev time{flex:none;width:118px;color:var(--tx2);font-size:12px;font-variant-numeric:tabular-nums}
  .ev .tag{flex:none;width:86px;text-align:center}
  .ev span.t{flex:1;min-width:0;overflow-wrap:anywhere}
  .tag.conta,.tag.acesso{border-color:var(--azul);color:var(--azul)}.tag.pagamento,.tag.credito{border-color:var(--verde);color:var(--verde)}
  .tag.voucher,.tag.gestao{border-color:var(--amb);color:var(--amb)}.tag.banco{border-color:#a78bfa;color:#a78bfa}
  @media(max-width:600px){.ev{flex-wrap:wrap}.ev time{width:auto}.ev span.t{flex-basis:100%}}
  /* janela de dar cortesia / créditos */
  .janela.peq{max-width:440px;margin-top:8vh}
  .janela .quem{color:var(--tx2);font-size:13px;margin:4px 0 14px}
  .janela .rot{font-size:12px;color:var(--tx2);margin:14px 0 6px}
  .opcs{display:grid;gap:8px}
  .opc{display:block;text-align:left;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--tx);cursor:pointer;font:inherit}
  .opc b{display:block;font-size:14.5px}.opc small{display:block;color:var(--tx2);font-size:12.5px;margin-top:2px}
  .opc.on{border-color:var(--amb);box-shadow:0 0 0 1px var(--amb)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip{background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:20px;padding:7px 13px;font-size:13.5px;cursor:pointer}
  .chip.on{background:var(--azul);border-color:var(--azul);color:#fff}
  .chips input{width:110px;padding:7px 10px;border-radius:20px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:13.5px}
  .bts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .bts button{padding:10px 16px;border-radius:10px;border:0;font-weight:700;cursor:pointer;font-size:14px}
  .bts .sim{background:var(--azul);color:#fff}.bts .nao{background:var(--bg);border:1px solid var(--line);color:var(--tx)}
  .bts button:disabled{opacity:.6;cursor:default}
  .zona{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
  .zona h4{margin:0 0 4px;font-size:14.5px}.zona p{margin:0 0 10px;color:var(--tx2);font-size:12.5px;line-height:1.45}
  .zona.perigo{border-color:rgba(239,68,68,.5)}.zona.perigo h4{color:var(--verm)}
  .zona label.ck{display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:10px;cursor:pointer}
  .zona input[type=email]{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:14px;margin-bottom:10px}
  .zona button{padding:9px 14px;border-radius:10px;border:0;font-weight:700;cursor:pointer;font-size:13.5px;background:var(--amb);color:#1a1300}
  .zona.perigo button{background:var(--verm);color:#fff}
  .zona button:disabled{opacity:.45;cursor:default}
  .janela .resumo{font-size:13px;color:var(--tx2);margin-top:12px;min-height:18px}
  /* abertura: a logo grande no meio, some quando os dados chegam */
  #abertura{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .45s}
  #abertura img{width:112px;height:112px;border-radius:26px;box-shadow:0 12px 40px rgba(59,130,246,.35);animation:pulsa 1.6s ease-in-out infinite}
  #abertura b{font-size:22px;letter-spacing:.02em}#abertura b i{color:var(--azul);font-style:normal}
  #abertura small{color:var(--tx2);font-size:13px}
  #abertura.some{opacity:0;pointer-events:none}
  @keyframes pulsa{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  h1 img{width:30px;height:30px;border-radius:8px;vertical-align:-7px;margin-right:9px}
  .abas{display:flex;gap:6px;margin:14px 0 4px;border-bottom:1px solid var(--line);overflow-x:auto}
  .abas button{background:none;border:0;border-bottom:2px solid transparent;color:var(--tx2);padding:10px 14px;font-size:14.5px;font-weight:600;cursor:pointer;white-space:nowrap}
  .abas button.on{color:var(--tx);border-bottom-color:var(--azul)}
  /* saldo da IA: o número grande, o medidor e quanto dura */
  .heroi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:center}
  .heroi .rot{font-size:12px;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em}
  .heroi .num{font-size:40px;font-weight:800;line-height:1.1;margin:4px 0;font-variant-numeric:tabular-nums}
  .heroi .num.r{color:var(--verm)}.heroi .num.v{color:var(--verde)}
  .heroi .sub2{color:var(--tx2);font-size:13px}
  .medidor{height:12px;border-radius:7px;background:var(--bg);border:1px solid var(--line);overflow:hidden;margin:10px 0 6px}
  .medidor i{display:block;height:100%;border-radius:6px}
  .heroi form,.heroi .acoes{display:grid;gap:8px}
  .heroi input{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:14px}
  .heroi button{padding:10px;border:0;border-radius:9px;background:var(--azul);color:#fff;font-weight:700;cursor:pointer}
  .heroi button.sec{background:var(--bg);border:1px solid var(--line);color:var(--tx)}
  @media(max-width:700px){.heroi{grid-template-columns:1fr}.heroi .num{font-size:34px}}
  .ranking{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
  .ranking .lin{display:grid;grid-template-columns:minmax(0,1.3fr) 2fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  .ranking .lin:last-child{border-bottom:0}
  .ranking .lin span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ranking .bar{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}.ranking .bar i{display:block;height:100%;background:var(--azul);border-radius:0 4px 4px 0}
  .ranking b{font-variant-numeric:tabular-nums;white-space:nowrap}
  .rodape{margin-top:28px;padding-top:12px;border-top:1px solid var(--line);color:var(--tx2);font-size:12px;text-align:center}
  /* login */
  .login{max-width:360px;margin:12vh auto 0}
  .login p{color:var(--tx2);font-size:14px;margin:6px 0 20px}
  .login input{width:100%;margin-bottom:10px;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:16px}
  .login button{width:100%;padding:14px;border:0;border-radius:12px;background:var(--azul);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
  .msg{font-size:14px;min-height:20px;margin-top:10px;color:var(--verm)}
</style>

<body>
<div id="abertura"><img src="img/icone-192.png" alt=""><b>Easy<i>APP</i> · Gestão</b><small>abrindo o painel…</small></div>
<div class="cx" id="cx"></div>
<script src="gestao-testes.js?v=3.1.0"></script>
<script>
/* Gestão do EasyAPP: só para o dono. A página não tem dado nenhum; os números
   vêm da função "gestao", que confere o e-mail de quem entrou. A chave abaixo
   é a pública do app. A sessão fica só nesta aba (sessionStorage). */
var URL_SB = 'https://nhngqhgxmrnqbcnklrwc.supabase.co';
var CHAVE = 'sb_publishable_SGsAAryHXSZjAuBFSZoYfQ_3D37nUeN';
var cx = document.getElementById('cx');
var DADOS = null, FILTRO = 'todos', BUSCA = '';
var EDITANDO = null;   // voucher aberto no formulário para editar (null = criar novo)
var LOG = null, LOG_FILTRO = 'todos';   // log da pessoa aberta na janela
// versão deste painel: suba a cada publicação (aparece no rodapé e no login)
var VERSAO_PAINEL = '1.9.0 · 08/10/2026';
var ABERTO_EM = Date.now();
/* O navegador guarda a página (o GitHub Pages manda guardar 10 min, e o painel
   instalado na tela de início segura mais). Ao abrir, confere a versão da
   página no servidor; se for outra, recarrega uma vez sem a cópia guardada. */
(function () {
  var minha = VERSAO_PAINEL;
  fetch(location.pathname + '?x=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
    var m = t.match(/VERSAO_PAINEL = '([^']+)'/), nova = m && m[1];
    if (!nova || nova === minha) return;
    var ja = ''; try { ja = sessionStorage.getItem('gestao:recarregou') || ''; } catch (e) {}
    if (ja === nova) return;                          // já tentou: não fica em laço
    try { sessionStorage.setItem('gestao:recarregou', nova); } catch (e) {}
    location.replace(location.pathname + '?v=' + encodeURIComponent(nova.split(' ')[0]));
  }).catch(function () {});
})();
function tirarAbertura() {
  var a = document.getElementById('abertura'); if (!a || a.classList.contains('some')) return;
  setTimeout(function () { a.classList.add('some'); setTimeout(function () { a.remove(); }, 500); }, Math.max(0, 2600 - (Date.now() - ABERTO_EM)));   // a logo fica um tempo na tela (pedido do Rodrigo)
}
var ABA = (function () { try { return localStorage.getItem('gestao:aba') || 'geral'; } catch (e) { return 'geral'; } })();
function trocarAba(a) { TestePrimeiroAcesso.pause(); ABA = a; try { localStorage.setItem('gestao:aba', a); } catch (e) {} desenhar(); window.scrollTo(0, 0); }
function rodape() { return '<div class="rodape">Painel de gestão · versão ' + VERSAO_PAINEL + '</div>'; }
var VERSAO = '';   // a do APK publicado no site (versao.json, copiado pelo publicar-site --apk)
fetch('versao.json', { cache: 'no-store' }).then(function (r) { return r.json(); })
  .then(function (v) { VERSAO = v.maior + '.' + v.menor + '.' + v.build; if (DADOS) desenhar(); }).catch(function () {});

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function brl(n) { return 'R$ ' + Number(n || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function usd(n) { return 'US$ ' + Number(n || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function dt(s) { return s ? new Date(s).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' }) : '—'; }
/* A sessão fica só nesta aba (sessionStorage), a não ser que, no código das
   duas etapas, a pessoa marque "lembrar neste aparelho": aí vai também para o
   localStorage por 30 dias (só sessão já confirmada com o código). Sair apaga. */
/* Biometria do aparelho (digital/rosto) para abrir o painel lembrado. Usa o
   autenticador do próprio celular/computador (WebAuthn): a biometria nunca sai
   do aparelho. É uma trava local - a proteção forte continua sendo senha +
   código a cada 30 dias. */
var b64u = function (buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
var deB64u = function (s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
function bioDisponivel() {
  return window.PublicKeyCredential && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable
    ? PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().catch(function () { return false; }) : Promise.resolve(false);
}
function cadastrarBio() {
  var rnd = function (n) { return crypto.getRandomValues(new Uint8Array(n)); };
  return navigator.credentials.create({ publicKey: {
    challenge: rnd(32), rp: { name: 'EasyAPP Gestão' },
    user: { id: rnd(16), name: 'gestao', displayName: 'Painel EasyAPP' },
    pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
    authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
    timeout: 60000 } }).then(function (c) { localStorage.setItem('gestao:bio', b64u(c.rawId)); });
}
function destravarBio() {
  var id = localStorage.getItem('gestao:bio');
  if (!id) return Promise.reject(new Error('sem biometria'));
  return navigator.credentials.get({ publicKey: {
    challenge: crypto.getRandomValues(new Uint8Array(32)), timeout: 60000, userVerification: 'required',
    allowCredentials: [{ type: 'public-key', id: deB64u(id), transports: ['internal'] }] } })
    .then(function (a) { if (!a || !(new Uint8Array(a.response.authenticatorData)[32] & 4)) throw new Error('biometria não confirmada'); window.BIO_OK = true; });
}
function telaBio(erro) {
  cx.innerHTML = '<div class="login"><h1><img src="img/icone-192.png" alt="">Easy<i>APP</i> · Gestão</h1>' +
    '<p>Use a digital ou o rosto para abrir o painel.</p><button id="b">Abrir com biometria</button>' +
    '<div class="msg" id="e">' + esc(erro || '') + '</div>' +
    '<button class="lk" id="outra" style="margin-top:10px;background:none;color:var(--azul);width:auto">Entrar com senha e código</button></div>' + rodape();
  tirarAbertura();
  var vai = function () { destravarBio().then(carregar).catch(function () { document.getElementById('e').textContent = 'não deu certo: tente de novo ou entre com senha e código'; }); };
  document.getElementById('b').onclick = vai;
  document.getElementById('outra').onclick = function () { sessao(null); telaLogin(); };
  vai();
}

function sessao(v) {
  try {
    if (v === undefined) {
      var s = JSON.parse(sessionStorage.getItem('gestao') || 'null');
      if (s) return s;
      var l = JSON.parse(localStorage.getItem('gestao:lembrar') || 'null');
      // a lembrada só vale depois da digital/rosto (destravarBio)
      if (l && l.lembrar_ate > Date.now() && window.BIO_OK) { sessionStorage.setItem('gestao', JSON.stringify(l)); return l; }
      if (!l || !(l.lembrar_ate > Date.now())) { localStorage.removeItem('gestao:lembrar'); localStorage.removeItem('gestao:bio'); }
      return null;
    }
    if (!v) { sessionStorage.removeItem('gestao'); localStorage.removeItem('gestao:lembrar'); localStorage.removeItem('gestao:bio'); return; }
    var antes = JSON.parse(sessionStorage.getItem('gestao') || 'null');
    if (v.lembrar_ate === undefined && antes && antes.lembrar_ate) v.lembrar_ate = antes.lembrar_ate;   // renovação do token
    sessionStorage.setItem('gestao', JSON.stringify(v));

/* Verificação em duas etapas (obrigatória no painel). Na primeira vez,
   cadastra um app autenticador (Google Authenticator, Microsoft Authenticator,
   1Password...) lendo o QR; depois, só o código de 6 dígitos a cada entrada. */
function authMfa(caminho, metodo, corpo) {
  return token().then(function (t) {
    return fetch(URL_SB + '/auth/v1/' + caminho, { method: metodo || 'GET',
      headers: { apikey: CHAVE, Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' },
      body: corpo ? JSON.stringify(corpo) : undefined });
  }).then(function (r) { return r.text().then(function (x) {
    var d = {}; try { d = x ? JSON.parse(x) : {}; } catch (e) {}
    if (!r.ok) throw new Error(d.msg || d.message || d.error_description || ('erro ' + r.status));
    return d;
  }); });
}
function telaMfa(erro) {
  cx.innerHTML = '<div class="login"><h1><img src="img/icone-192.png" alt="">Easy<i>APP</i> · Gestão</h1><p class="sub">conferindo a verificação em duas etapas…</p></div>' + rodape();
  tirarAbertura();
  authMfa('user').then(function (u) {
    var f = (u.factors || []).filter(function (x) { return x.factor_type === 'totp' && x.status === 'verified'; })[0];
    if (f) return pedirCodigo(f.id, false, erro);
    // apaga tentativas de cadastro que não foram até o fim e cadastra de novo
    var soltos = (u.factors || []).filter(function (x) { return x.factor_type === 'totp' && x.status !== 'verified'; });
    return Promise.all(soltos.map(function (x) { return authMfa('factors/' + x.id, 'DELETE').catch(function () {}); }))
      .then(function () { return authMfa('factors', 'POST', { factor_type: 'totp', friendly_name: 'Painel EasyAPP ' + Date.now(), issuer: 'EasyAPP Gestão' }); })
      .then(function (n) { pedirCodigo(n.id, n.totp || {}, erro); });
  }).catch(function (x) { sessao(null); telaLogin(x.message); });
}
// o Supabase manda o QR como "data:image/svg+xml;utf-8,<svg ...>" cru: o "#"
// das cores corta o endereço e a imagem não aparece. Recodifica o SVG.
function qrSrc(q) {
  q = String(q || ''); var i = q.indexOf('<svg');
  if (i < 0) return q;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(q.slice(i));
}
function pedirCodigo(fatorId, novo, erro) {

        '<div style="background:#fff;border-radius:12px;padding:10px;width:200px;margin:10px auto"><img alt="QR" style="width:180px;height:180px;display:block" src="' +
          esc(qrSrc(novo.qr_code)) + '"></div>' +
        // no celular, o QR fica na própria tela e o autenticador não consegue ler:
        // o botão entrega o cadastro direto ao app autenticador (endereço otpauth://)
        (novo.uri ? '<a href="' + esc(novo.uri) + '" style="display:block;text-align:center;background:var(--azul);color:#fff;border-radius:12px;padding:13px;margin:10px 0;text-decoration:none;font-weight:700">' +
          '📲 Abrir no app autenticador deste celular</a>' : '') +
        '<p class="sub" style="word-break:break-all">Ou digite esta chave no app: <b id="chaveMfa">' + esc(novo.secret || '') + '</b> ' +
        '<button class="lk" id="copiaChave" style="background:none;color:var(--azul);width:auto;padding:0;margin:0">copiar</button></p>' +
        '<p>Depois digite o código de 6 dígitos que aparecer:</p>'

    '<input id="c" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000" style="text-align:center;letter-spacing:6px;font-size:22px">' +
    '<label style="display:flex;gap:8px;align-items:center;font-size:14px;margin:4px 0 10px;justify-content:flex-start">' +
      '<input type="checkbox" id="lembrar" style="width:auto;margin:0"> Lembrar neste aparelho por 30 dias (abre com a digital ou o rosto)</label>' +
    '<button id="b">Confirmar</button><div class="msg" id="e">' + esc(erro || '') + '</div>' +
    '<button class="lk" id="sairMfa" style="margin-top:10px;background:none;color:var(--azul);width:auto">Sair</button></div>' + rodape();
  var c = document.getElementById('c'); c.focus();
  var cc = document.getElementById('copiaChave');

    var k = (novo && novo.secret) || '';

      .catch(function () { cc.textContent = 'segure na chave para copiar'; });
  };
  // sem digital/rosto no aparelho, não dá para lembrar (abriria sem trava nenhuma)
  bioDisponivel().then(function (tem) { if (!tem) { var l = document.getElementById('lembrar'); if (l) l.closest('label').style.display = 'none'; } });
  document.getElementById('sairMfa').onclick = function () { sessao(null); telaLogin(); };
  function vai() {
    var cod = c.value.replace(/\D/g, ''); if (cod.length !== 6) { document.getElementById('e').textContent = 'o código tem 6 dígitos'; return; }
    var b = document.getElementById('b'); b.disabled = true;
    authMfa('factors/' + fatorId + '/challenge', 'POST', {}).then(function (ch) {
      return authMfa('factors/' + fatorId + '/verify', 'POST', { challenge_id: ch.id, code: cod });
    }).then(function (d) {
      if (!d.access_token) throw new Error('código não confere');
      var nova = { at: d.access_token, rt: d.refresh_token, exp: Date.now() + (d.expires_in - 60) * 1000, lembrar_ate: 0 };
      if (!document.getElementById('lembrar').checked) { sessao(nova); return carregar(); }

      return cadastrarBio().then(function () {

      }).catch(function () { sessao(nova); carregar(); alert('Não cadastrei a biometria: o painel não vai ficar lembrado neste aparelho.'); });
    }).catch(function (x) { b.disabled = false; document.getElementById('e').textContent = /invalid|expired/i.test(x.message) ? 'código não confere ou venceu: confira e tente de novo' : x.message; });
  }
  document.getElementById('b').onclick = vai;
  c.onkeydown = function (ev) { if (ev.key === 'Enter') vai(); };
}

function token() {
  var s = sessao();
  if (!s) return Promise.reject(new Error(''));
  if (Date.now() < s.exp) return Promise.resolve(s.at);
  return fetch(URL_SB + '/auth/v1/token?grant_type=refresh_token', {
    method: 'POST', headers: { apikey: CHAVE, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: s.rt })
  }).then(function (r) { return r.json(); }).then(function (d) {
    if (!d.access_token) throw new Error('entre de novo');
    sessao({ at: d.access_token, rt: d.refresh_token, exp: Date.now() + (d.expires_in - 60) * 1000 });
    return d.access_token;
  });
}

function carregar() {
  if (!sessao()) {
    var lembrada = null; try { lembrada = JSON.parse(localStorage.getItem('gestao:lembrar') || 'null'); } catch (e) {}
    if (lembrada && lembrada.lembrar_ate > Date.now() && localStorage.getItem('gestao:bio') && !window.BIO_OK) return telaBio();
    return telaLogin();
  }
  if (!DADOS) cx.innerHTML = '<p class="sub">carregando...</p>';
  token().then(function (t) {
    return fetch(URL_SB + '/functions/v1/gestao', {
      method: 'POST', headers: { apikey: CHAVE, Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' }, body: '{}'
    });
  }).then(function (r) { return r.json().then(function (d) { return [r.status, d]; }); }).then(function (x) {
    if (x[1].mfa) return telaMfa();
    if (x[1].erro) { if (x[0] === 401 || x[0] === 403) sessao(null); return telaLogin(x[1].erro); }
    DADOS = x[1]; desenhar();
  }).catch(function (x) {
    // sem internet não é sessão inválida: não esquece o aparelho, só oferece tentar de novo
    if (x instanceof TypeError || /fetch|network|Failed/i.test(String(x && x.message))) {
      cx.innerHTML = '<div class="login"><p>Sem conexão com o servidor agora.</p><button id="denovo">Tentar de novo</button></div>' + rodape();
      tirarAbertura(); document.getElementById('denovo').onclick = carregar; return;
    }
    sessao(null); telaLogin(x.message);
  });
}

function acao(o) {
  return token().then(function (t) {
    return fetch(URL_SB + '/functions/v1/gestao', { method: 'POST',
      headers: { apikey: CHAVE, Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' }, body: JSON.stringify(o) });
  }).then(function (r) { return r.json(); }).then(function (d) {
    if (d.mfa) { telaMfa(); return d; }
    if (d.erro) { alert(d.erro); return d; }
    carregar(); return d;
  });
}

// Barras: um gráfico por assunto. pts = [{rot, v, dica}]; negativos descem da linha do zero, em vermelho.
function grafico(o) {
  var pts = o.pts, max = Math.max.apply(null, pts.map(function (p) { return p.v; }).concat([0])),
      min = Math.min.apply(null, pts.map(function (p) { return p.v; }).concat([0]));
  var tot = (max - min) || 1, pos = max / tot * 100, cada = o.cada || 1;
  return '<div class="gr"><div class="grt"><h3>' + esc(o.titulo) + '</h3>' + (o.destaque != null ? '<b>' + o.destaque + '</b>' : '') + '</div>' +
    (o.nota ? '<div class="grn">' + o.nota + '</div>' : '') +
    '<div class="cols">' + pts.map(function (p, i) {
      var h = Math.abs(p.v) / tot * 100, neg = p.v < 0;
      return '<div class="c' + (i === pts.length - 1 ? ' at' : '') + '" data-dica="' + esc(p.dica) + '">' +
        '<div class="p" style="height:' + pos + '%">' + (neg ? '' : '<i style="height:' + (h / pos * 100 || 0) + '%;background:' + (o.cor || 'var(--azul)') + '"></i>') + '</div>' +
        '<div class="n" style="height:' + (100 - pos) + '%">' + (neg ? '<i style="height:' + (h / (100 - pos) * 100) + '%;background:var(--verm)"></i>' : '') + '</div></div>';
    }).join('') + '</div>' +
    '<div class="xs">' + pts.map(function (p, i) {
      return '<span>' + ((pts.length - 1 - i) % cada === 0 ? esc(p.rot) : '') + '</span>'; }).join('') + '</div></div>';
}
// Linha (para o saldo, que sobe e desce): SVG esticado + colunas invisíveis para a dica
function graficoLinha(o) {
  var pts = o.pts, vs = pts.map(function (p) { return p.v; });
  var max = Math.max.apply(null, vs.concat([0])), min = Math.min.apply(null, vs.concat([0])), tot = (max - min) || 1;
  var y = function (v) { return (max - v) / tot * 100; }, n = Math.max(pts.length - 1, 1);
  var linha = pts.map(function (p, i) { return (i / n * 100).toFixed(2) + ',' + y(p.v).toFixed(2); }).join(' ');
  var cada = Math.max(1, Math.ceil(pts.length / 8));
  return '<div class="gr"><div class="grt"><h3>' + esc(o.titulo) + '</h3>' + (o.destaque != null ? '<b>' + o.destaque + '</b>' : '') + '</div>' +
    (o.nota ? '<div class="grn">' + o.nota + '</div>' : '') +
    '<div class="cols linha"><svg viewBox="0 0 100 100" preserveAspectRatio="none">' +
      (min < 0 ? '<line x1="0" x2="100" y1="' + y(0) + '" y2="' + y(0) + '" stroke="var(--verm)" stroke-dasharray="2 2" vector-effect="non-scaling-stroke"/>' : '') +
      '<polygon points="0,' + y(0) + ' ' + linha + ' 100,' + y(0) + '" fill="' + (o.cor || 'var(--azul)') + '" opacity=".14"/>' +
      '<polyline points="' + linha + '" fill="none" stroke="' + (o.cor || 'var(--azul)') + '" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>' +
      pts.map(function (p) { return '<div class="c" data-dica="' + esc(p.dica) + '"></div>'; }).join('') + '</div>' +
    '<div class="xs">' + pts.map(function (p, i) { return '<span>' + ((pts.length - 1 - i) % cada === 0 ? esc(p.rot) : '') + '</span>'; }).join('') + '</div></div>';

    '<b>Útil</b> = quanto do que o banco manda é movimentação (o resto é propaganda, código, fatura). As outras colunas: das movimentações, quantas trazem a informação. ' +
    'Final do cartão e crédito/débito contam só as compras com cartão. Banco que ainda não apareceu não está aqui: entra sozinho no primeiro aviso.</div>';
  if (!L.length) return h + '<div class="sub">Nenhum aviso ainda.</div>';
  h += '<div class="tab"><table><thead><tr><th>Banco</th><th class="n">Avisos</th><th class="n">Útil</th><th class="n">Fornecedor</th>' +
    '<th class="n">Data e hora</th><th class="n">Final do cartão</th><th class="n">Diz créd./déb.</th><th class="n">Em dólar</th><th class="n">Parcelas</th></tr></thead><tbody>' +
    L.map(function (b) {
      return '<tr><td><b>' + esc(b.banco) + '</b><br><small style="color:#8b95a8">' + b.usuarios + ' pessoa' + (b.usuarios > 1 ? 's' : '') +
          (b.ultimo ? ' · último ' + dt(b.ultimo) : '') + '</small></td>' +
        '<td class="n">' + b.avisos + '<br><small style="color:#8b95a8">' + b.transacoes + ' mov.</small></td>' +
        pc(b.pct_util) + pc(b.pct_fornecedor) + pc(b.pct_data_hora) +
        pc(b.pct_final_cartao, b.compras_cartao ? b.compras_cartao + ' compras' : undefined) + pc(b.pct_diz_tipo) +
        '<td class="n">' + (b.moeda_estrangeira || '—') + '</td><td class="n">' + (b.parcelas || '—') + '</td></tr>' +
        (b.exemplo ? '<tr><td colspan="9" style="padding-top:0;border-top:0"><small style="color:#8b95a8">ex.: ' + esc(b.exemplo) + '</small></td></tr>' : '');
    }).join('') + '</tbody></table></div>';
  return h;
}

function k(rot, val, nota, cls) {
  return '<div class="k ' + (cls || '') + '"><span>' + rot + '</span><b>' + val + '</b>' + (nota ? '<small>' + nota + '</small>' : '') + '</div>';
}

function desenhar() {
  var d = DADOS, r = d.resumo, p = r.planos;
  var aba = function (k, t) { return '<button class="' + (ABA === k ? 'on' : '') + '" onclick="trocarAba(\'' + k + '\')">' + t + '</button>'; };
  var h = '<div class="topo"><h1><img src="img/icone-192.png" alt="">Easy<i>APP</i> · Gestão</h1><div><button class="lk" id="at">Atualizar</button> · <button class="lk" id="sair">Sair</button></div></div>' +
    '<div class="sub">atualizado ' + new Date(d.gerado_em).toLocaleString('pt-BR') + (VERSAO ? ' · app no site: versão ' + esc(VERSAO) : '') + '</div>' +
    '<div class="abas">' + aba('geral', '📊 Visão geral') + aba('ia', '✦ IA e créditos') + aba('pessoas', '👥 Pessoas e vouchers') + aba('avisos', '🔔 Avisos dos bancos') + aba('testes', '🧪 Testar primeiro acesso') + '</div>';

  if (ABA === 'testes') {
    h += TestePrimeiroAcesso.html();
  } else if (ABA === 'avisos') {
    h += blocoAvisos(d.avisos || []);
  } else if (ABA === 'ia') {
    h += blocoApi(d.api || {}) + blocoClientesIa(d) + blocoMotores(d.motores);
  } else if (ABA === 'pessoas') {
    h += '<h2>Pessoas</h2><div class="filtro"><input id="busca" placeholder="buscar nome, e-mail ou WhatsApp" value="' + esc(BUSCA) + '">' +
      [['todos', 'Todos'], ['pagantes', 'Pagantes'], ['teste', 'Em teste'], ['vencida', 'Vencidos'], ['ia', 'Usam IA']].map(function (o) {
        return '<button data-f="' + o[0] + '"' + (FILTRO === o[0] ? ' class="on"' : '') + '>' + o[1] + '</button>';
      }).join('') + '</div><div class="tab" id="tab">' + tabela() + '</div>' +
      '<h2>Vouchers</h2>' + formVoucher() +
      (d.vouchers && d.vouchers.length ? '<div class="tab" style="margin-top:10px"><table><thead><tr><th>Código</th><th>Dá</th><th>Usos</th><th>Até</th><th>Nota</th><th></th></tr></thead><tbody>' +
        d.vouchers.map(function (v) {
          return '<tr style="' + (v.ativo ? '' : 'opacity:.45') + '"><td><b>' + esc(v.codigo) + '</b> <button class="mini" onclick="copiar(\'' + esc(v.codigo) + '\')">copiar</button></td>' +
            '<td>' + (v.tipo === 'creditos' ? brl(v.valor) + ' em créditos' : (v.tipo === 'cortesia_app' ? 'cortesia só do app' : 'cortesia') + (v.dias ? ' ' + v.dias + ' dias' : ' sem prazo')) + '</td>' +
            '<td class="n">' + v.usos + ' / ' + v.usos_max + '</td><td>' + (v.validade ? dt(v.validade) : '—') + '</td><td>' + esc(v.nota || '') + '</td>' +
            '<td><button class="mini" onclick="editarVoucher(\'' + esc(v.codigo) + '\')">editar</button>' +
            (v.ativo ? '<button class="mini" onclick="if(confirm(\'Desligar ' + esc(v.codigo) + '?\'))acao({acao:\'voucher_desligar\',codigo:\'' + esc(v.codigo) + '\'})">desligar</button>' : ' desligado') + '</td></tr>';
        }).join('') + '</tbody></table></div>' : '');
  } else {
    var a = d.api || {};
    h += (a.saldo != null ? '<div class="sub" style="margin-top:10px">✦ Crédito da IA: <b style="color:' + (a.saldo < 3 || (a.dias !== null && a.dias < 7) ? 'var(--verm)' : 'var(--verde)') + '">' +
          usdTxt(a.saldo) + '</b> (' + emReais(a.saldo) + ')' + (a.dias !== null && a.dias !== undefined ? ' · dura uns ' + a.dias + ' dias' : '') +
          ' · <a href="#" style="color:var(--azul)" onclick="trocarAba(\'ia\');return false">ver</a></div>'
        : '<div class="sub" style="margin-top:10px">✦ Saldo da IA ainda desconhecido · <a href="#" style="color:var(--azul)" onclick="trocarAba(\'ia\');return false">informar agora</a></div>') +
      '<h2>Inscritos</h2><div class="grade">' +
      k('Inscritos', r.inscritos, '+' + r.novos_7d + ' na semana · +' + r.novos_30d + ' no mês') +
      k('Entraram em 7 dias', r.ativos_7d, r.inscritos ? Math.round(r.ativos_7d / r.inscritos * 100) + '% da base' : '') +
      k('Sem confirmar e-mail', r.sem_confirmar, '', r.sem_confirmar ? 'a' : '') +
      k('Sem primeiro acesso', r.sem_primeiro_acesso, 'criaram e não terminaram', r.sem_primeiro_acesso ? 'a' : '') +
      k('Com Open Finance', r.com_open_finance, r.erros_open_finance ? r.erros_open_finance + ' com erro' : '', r.erros_open_finance ? 'a' : '') +
      '</div>' +
      '<h2>Assinaturas</h2><div class="grade">' +
      k('Pagantes', r.pagantes, p.mensal + ' mensal · ' + p.anual + ' anual', 'v') +
      k('Receita recorrente', brl(r.mrr), 'por mês (MRR)', 'v') +
      k('Em teste', p.teste, '14 dias grátis') +
      k('Cortesia', p.cortesia) +
      k('Cortesia só app', p.cortesia_app || 0) +
      k('Vencidos', p.vencido, 'teste ou plano acabou', p.vencido ? 'r' : '') +
      k('Recusados (30 dias)', r.pagamentos_recusados_30d, 'cartão recusado no MP', r.pagamentos_recusados_30d ? 'r' : '') +
      '</div>' +
      '<h2>Este mês</h2><div class="grade">' +
      k('Receita bruta', brl(r.receita_mes), 'mensalidades + anual + créditos', 'v') +
      k('Taxa do Mercado Pago', '− ' + brl(r.taxa_mp_mes), ((d.taxa_mp || 0) * 100).toLocaleString('pt-BR') + '% das compras', 'a') +
      k('Receita líquida', brl(r.receita_liquida_mes), 'o que fica com você', 'v') +
      k('Créditos vendidos', brl(r.creditos_mes), brl(r.creditos_total) + ' desde o início') +
      k('Custo da IA', usdTxt(r.ia_custo_mes_usd), brl(r.ia_custo_mes_brl) + (d.motores && d.motores.fonte === 'anthropic' ? ' · real da Anthropic' : ' · anotado pelo app')) +
      k('IA cobrada dos clientes', brl(r.ia_cobrado_mes), 'margem ' + brl(r.ia_margem_mes) + ' (já sem taxa MP)', r.ia_margem_mes < 0 ? 'r' : '') +
      k('Resultado', brl(r.resultado_mes), 'receita líquida − custo da IA', r.resultado_mes < 0 ? 'r' : 'v') +
      '</div>' + blocoMeses();
  }
  h += rodape();
  cx.innerHTML = h;
  if (ABA === 'testes') TestePrimeiroAcesso.mount();
  tirarAbertura();

  document.getElementById('at').onclick = carregar;
  document.getElementById('sair').onclick = function () { TestePrimeiroAcesso.pause(); sessao(null); DADOS = null; telaLogin(); };
  Array.prototype.forEach.call(cx.querySelectorAll('[data-f]'), function (b) { b.onclick = function () { FILTRO = b.dataset.f; desenhar(); }; });
  var bu = document.getElementById('busca');
  if (bu) bu.oninput = function (ev) { BUSCA = ev.target.value; document.getElementById('tab').innerHTML = tabela(); };
}
// quem mais usa a IA neste mês: barras de um tom só, do maior para o menor
function blocoClientesIa(d) {
  var ps = (d.pessoas || []).filter(function (p) { return p.ia_pedidos_mes > 0; })
    .sort(function (a, b) { return b.ia_custo_mes_usd - a.ia_custo_mes_usd; }).slice(0, 12);
  if (!ps.length) return '<h2>Consumo por cliente · este mês</h2><div class="sub">Ninguém usou o assistente este mês.</div>';
  var max = ps[0].ia_custo_mes_usd || 1, tot = ps.reduce(function (t, p) { return t + p.ia_custo_mes_usd; }, 0);
  return '<h2>Consumo por cliente · este mês</h2><div class="sub" style="margin-bottom:8px">custo na Anthropic (US$) de cada cliente; ao lado, o que ele pagou ou usou de franquia/créditos · total ' + usdTxt(tot) + '</div>' +
    '<div class="ranking">' + ps.map(function (p) {
      return '<div class="lin" title="' + esc(p.ia_pedidos_mes + ' pedidos · custo ' + usdTxt(p.ia_custo_mes_usd) + ' · cobrado ' + brl(p.ia_cobrado_mes)) + '">' +
        '<span>' + esc(p.nome || p.email) + ' <small style="color:var(--tx2)">· ' + esc(p.plano || '—') + ' · ' + p.ia_pedidos_mes + ' pedidos</small></span>' +
        '<div class="bar"><i style="width:' + Math.max(2, p.ia_custo_mes_usd / max * 100).toFixed(1) + '%"></i></div>' +
        '<b>' + usdTxt(p.ia_custo_mes_usd) + ' <small style="color:var(--tx2);font-weight:500">' + brl(p.ia_cobrado_mes) + '</small></b></div>';
    }).join('') + '</div>';
}
function tabela() {
  var b = BUSCA.trim().toLowerCase(), bd = b.replace(/\D/g, '');
  var ps = DADOS.pessoas.filter(function (p) {
    if (FILTRO === 'pagantes' && !(/mensal|anual/.test(p.plano) && p.status !== 'vencida')) return false;
    if (FILTRO === 'teste' && !(p.plano === 'teste' && p.status !== 'vencida')) return false;
    if (FILTRO === 'vencida' && p.status !== 'vencida') return false;
    if (FILTRO === 'ia' && !p.ia_pedidos_mes) return false;
    if (!b) return true;
    return (p.nome + ' ' + p.email).toLowerCase().indexOf(b) >= 0 || (bd && p.whatsapp.indexOf(bd) >= 0);
  });
  if (!ps.length) return '<p class="sub" style="padding:14px">ninguém aqui</p>';
  return '<table><thead><tr><th>Nome</th><th>E-mail</th><th>WhatsApp</th><th>Cadastro</th><th>Último acesso</th>' +
    '<th>Plano</th><th>Vale até</th><th class="n">Créditos</th><th class="n">IA no mês</th><th class="n">Bancos</th><th>Dar</th><th></th></tr></thead><tbody>' +
    ps.map(function (p) {
      var st = p.status === 'vencida' || p.status === 'pendente' ? p.status : p.plano;
      return '<tr><td>' + esc(p.nome || '—') + (p.primeiro_acesso ? '' : ' <span class="tag pendente" title="não terminou o primeiro acesso">novo</span>') + '</td>' +
        '<td>' + esc(p.email) + (p.confirmado ? '' : ' <span class="tag pendente">não confirmado</span>') + '</td>' +
        '<td>' + (p.whatsapp ? '<a class="zap" target="_blank" rel="noopener" href="https://wa.me/55' + esc(p.whatsapp.replace(/^55(?=\d{10,11}$)/, '')) + '">' + esc(p.whatsapp) + '</a>' : '—') + '</td>' +
        '<td>' + dt(p.criado) + '</td><td>' + dt(p.ultimo) + '</td>' +
        '<td>' + (p.plano ? '<span class="tag ' + esc(st) + '">' + esc(p.plano) + (p.status === 'cancelada' ? ' (cancelou)' : '') + (st !== p.plano ? ' · ' + esc(st) : '') + '</span>' : '—') + '</td>' +
        '<td>' + (/^cortesia/.test(p.plano) && !p.valido_ate ? 'sempre' : dt(p.valido_ate)) + '</td>' +
        '<td class="n">' + (p.creditos_comprados ? brl(p.creditos_comprados) : '—') + '</td>' +
        '<td class="n">' + (p.ia_pedidos_mes ? p.ia_pedidos_mes + ' · ' + brl(p.ia_cobrado_mes) : '—') + '</td>' +
        '<td class="n">' + (p.bancos || '—') + '</td>' +
        '<td><button class="mini" onclick="darCreditos(\'' + p.id + '\',\'' + esc((p.nome || p.email).replace(/'/g, '')) + '\')">+ créditos</button>' +
        '<button class="mini" onclick="darCortesia(\'' + p.id + '\',\'' + esc((p.nome || p.email).replace(/'/g, '')) + '\')">⭐ cortesia</button></td>' +
        '<td><button class="mini" onclick="abrirLog(\'' + p.id + '\')">📋 log</button>' +
        '<button class="mini" onclick="gerirConta(\'' + p.id + '\')">⚙ conta</button></td></tr>';
    }).join('') + '</tbody></table>';
}

carregar();
</script>
</body>
</html>
