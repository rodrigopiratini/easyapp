<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>EasyAPP Financial · Entrar com o Google</title>
<link rel="icon" href="img/icone-192.png">
<style>
  :root{--bg:#0f1420;--card:#161d2c;--line:#2a3548;--tx:#e8edf7;--tx2:#8b99b5;--azul:#3b82f6;--verde:#22c55e;--verm:#ef4444}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--tx);
       font:16px -apple-system,system-ui,sans-serif;padding:24px 16px;text-align:center}
  .cx{width:min(380px,100%)}
  img{width:72px;height:72px;border-radius:18px;margin-bottom:14px}
  h1{font-size:24px;margin:0 0 6px}h1 i{color:var(--azul);font-style:normal}
  p{color:var(--tx2);margin:0 0 22px;font-size:14.5px;line-height:1.5}
  #gis{display:flex;justify-content:center;min-height:44px}
  .msg{font-size:14px;min-height:20px;margin-top:16px;color:var(--tx2)}.msg.erro{color:var(--verm)}
  a{color:var(--azul)}
</style>
</head>
<body>
<div class="cx">
  <img src="img/icone-192.png" alt="">
  <h1>EasyAPP <i>Financial</i></h1>
  <p>Escolha a sua conta do Google para entrar no app.</p>
  <div id="gis"></div>
  <div class="msg" id="msg">Carregando o Google…</div>
  <p style="margin-top:22px"><a href="#" id="voltar">Voltar ao app</a></p>
</div>
<script>
/* Login com o Google do app instalado (Android/iPhone). O app abre esta página
   no navegador com ?n=<hash do nonce>; o Google abre em nome de
   easyappfinancial.com.br (e não do endereço do Supabase). A identidade
   (id_token) volta para o app pelo endereço br.com.easyapp.financial://login;
   o app troca por uma sessão no Supabase com o nonce original, que nunca sai
   do aparelho (sem ele o id_token não serve para nada). */
var CLIENTE = '333765211962-dsa5itg6q3e0h6mb5qpuvsmouqf8mg00.apps.googleusercontent.com';
var VOLTA = 'br.com.easyapp.financial://login';
var n = new URLSearchParams(location.search).get('n') || '';
var msg = document.getElementById('msg');
function erro(t) { msg.textContent = t; msg.className = 'msg erro'; }
function voltar(q) { location.href = VOLTA + '?' + q; }
document.getElementById('voltar').onclick = function (e) { e.preventDefault(); voltar('error_description=' + encodeURIComponent('entrada cancelada')); };
if (!/^[0-9a-f]{64}$/.test(n)) erro('Abra esta página pelo botão "Continuar com o Google" do app.');
else {
  var sc = document.createElement('script');
  sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true;
  sc.onerror = function () { erro('Não deu para carregar o Google. Confira a internet e tente de novo.'); };
  sc.onload = function () {
    try {
      google.accounts.id.initialize({ client_id: CLIENTE, nonce: n, ux_mode: 'popup', auto_select: false, itp_support: true, use_fedcm_for_button: true, use_fedcm_for_prompt: true,
        callback: function (r) {
          if (!r || !r.credential) return erro('O Google não confirmou. Tente de novo.');
          msg.className = 'msg'; msg.textContent = 'Voltando para o app…';
          voltar('gis=' + encodeURIComponent(r.credential));
        } });
      google.accounts.id.renderButton(document.getElementById('gis'), { type: 'standard', theme: 'outline', size: 'large', shape: 'pill',
        text: 'continue_with', logo_alignment: 'center', locale: 'pt-BR', width: 300 });
      google.accounts.id.prompt();
      msg.textContent = '';
    } catch (x) { erro('Não deu para abrir o Google: ' + x.message); }
  };
  document.head.appendChild(sc);
}
</script>
</body>
</html>
