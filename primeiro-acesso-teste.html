<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>EasyAPP · Primeiro acesso em avaliação</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101726;color:#eef3fc;font:15px -apple-system,BlinkMacSystemFont,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;min-height:46px;border-radius:12px;padding:12px 16px;border:1px solid #35455e;background:#1b2940;color:#eef3fc}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #88baff;outline-offset:2px}.test{background:#293249;color:#c5d9fd;text-align:center;font-size:11px;padding:9px}.wrap{max-width:490px;margin:auto;padding:22px 20px 30px}.brand{font-weight:800;font-size:20px;margin-bottom:22px}.brand b{color:#73aaff}.meta{display:flex;justify-content:space-between;font-size:12px;color:#a9bad3}.progress{height:5px;background:#2a3951;border-radius:10px;margin:10px 0 25px}.progress i{display:block;background:#6d9fff;height:100%;border-radius:10px}h1{font-size:27px;line-height:1.18;margin:0 0 12px;letter-spacing:-.5px}h2{font-size:17px;margin:16px 0 8px}p{line-height:1.55;color:#b5c4dc;margin:0 0 18px}.card{background:#19253a;border:1px solid #314360;border-radius:16px;padding:16px;margin:12px 0}.choice{display:block;width:100%;text-align:left;padding:19px;margin:12px 0}.choice b{display:block;font-size:17px;margin-bottom:6px}.choice small{display:block;color:#b5c4dc;line-height:1.5}.primary{background:#397def;color:#fff;border-color:#397def;font-weight:700}.recommended{border-color:#609bff}.actions{display:flex;gap:9px;margin-top:24px}.actions button:last-child{flex:1}.quiet{background:transparent;color:#b5c4dc}.small{font-size:12px;color:#a9bad3}.pill{font-size:11px;display:inline-block;padding:5px 9px;border-radius:20px;background:#244575;color:#cce0ff;margin-bottom:12px}label{display:block;color:#b5c4dc;font-size:13px;margin:16px 0 7px}input,select{display:block;width:100%;background:#101c30;color:#f2f6ff;border:1px solid #435371;border-radius:10px;padding:12px;min-height:46px}input[type=checkbox]{width:20px;min-height:20px;margin:0}.check{display:flex;align-items:center;gap:10px}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.error{color:#ffb4b4;font-size:13px;margin:12px 0}.success{color:#96e2bf}.value{font-size:26px;font-weight:750;margin-top:5px}.account{border-bottom:1px solid #30405a;padding:12px 0}.account:last-child{border:0}.account b{display:block}.badge{color:#a9bad3;font-size:12px}.demo{font-size:12px;color:#e5cb8d;border-left:3px solid #c5a467;padding:10px 12px;background:#252937;margin:12px 0}.finish{background:#163a33;border-color:#387968}.wide{width:100%}[hidden]{display:none!important}
</style></head><body><div class="test">AMBIENTE DE TESTE · DADOS FICTÍCIOS · FLUXO EM AVALIAÇÃO</div><main class="wrap" id="root"><p>Aguardando a Gestão…</p></main>
<script>
(function(){
'use strict';
var S, channel, last=0, paused=false;
var root=document.getElementById('root');
var names=['Começar','Seu caminho','Conferir','Seu mês','Seu app'];
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function brl(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function send(type,data){parent.postMessage({type:type,channel:channel,data:data},'*');}
function count(){if(!S||paused)return;var now=Date.now();var d=Math.min(15000,Math.max(0,now-last));last=now;S.times[S.step]=(S.times[S.step]||0)+d;}
function save(){if(!S)return;count();send('easyapp:test-state',S);}
function event(name){S.events.push({name:name,step:S.step,at:new Date().toISOString()});if(S.events.length>200)S.events.shift();}
function fresh(scenario){return {schema:1,id:Date.now().toString(36),scenario:scenario,step:0,path:'',name:'',goal:'Organizar meu mês',accounts:[],bills:[],amount:'',purchase:'',pending:[],times:{},events:[],created:new Date().toISOString(),complete:false,connection:'depois',imported:false,ambiguous:false,networkFailed:false};}
function go(n){read();count();S.step=n;paused=false;last=Date.now();event('etapa');render();save();}
function fail(msg){document.getElementById('error').textContent=msg;S.errors=(S.errors||0)+1;event('validacao');save();}
function actions(next,back){return '<div id="error" class="error" role="alert"></div><div class="actions">'+(back?'<button class="quiet" data-action="back">Voltar</button>':'')+'<button class="primary" data-action="next">'+next+'</button></div>';}
function fields(){return '<label for="name">Como quer ser chamado?</label><input id="name" maxlength="40" autocomplete="off" placeholder="Ex.: Alex" value="'+esc(S.name)+'"><label for="goal">O que quer organizar primeiro?</label><select id="goal">'+['Organizar meu mês','Controlar cartões','Separar pessoal e empresa','Começar a guardar'].map(function(x){return '<option'+(S.goal===x?' selected':'')+'>'+x+'</option>';}).join('')+'</select>';}
function sample(){S.accounts=[{name:'Conta Horizonte',kind:'Conta',owner:'Pessoal'},{name:'Cartão Aurora · 1234',kind:'Cartão',owner:'Pessoal'}];S.bills=[{name:'Moradia',value:1500,on:true},{name:'Internet',value:120,on:true},{name:'Mercado',value:650,on:true}];if(S.scenario==='empresa')S.accounts.push({name:'Conta do Estúdio',kind:'Conta',owner:'Empresa'});S.imported=true;S.ambiguous=S.scenario==='duvidas';event('importacao_simulada');}
function read(){if(!S)return;['name','goal','purchase','amount'].forEach(function(k){var x=document.getElementById(k);if(x)S[k]=x.value;});root.querySelectorAll('[data-account]').forEach(function(x){S.accounts[+x.dataset.account][x.dataset.key]=x.value;});root.querySelectorAll('[data-bill]').forEach(function(x){var b=S.bills[+x.dataset.bill];b[x.dataset.key]=x.type==='checkbox'?x.checked:x.value;});var v=document.getElementById('meaning');if(v)S.meaning=v.value;}
function render(){
var h='<div class="brand">Easy<b>APP</b></div><div class="meta"><span>Etapa '+(S.step+1)+' de 5 · '+names[S.step]+'</span><span>'+['~30 s','~1 min','~1 min','~2 min','~1 min'][S.step]+'</span></div><div class="progress"><i style="width:'+((S.step+1)*20)+'%"></i></div>';
if(S.step===0){h+='<span class="pill">Seu primeiro resultado em cerca de 5 minutos</span><h1>Vamos montar um app que parece seu.</h1><p>Comece pelo que você já tem. Você pode parar e continuar depois.</p>'+fields()+'<button class="choice recommended" data-action="sheet"><b>📎 Tenho uma planilha</b><small>Aproveitar meus nomes, contas e despesas.</small></button><button class="choice" data-action="manual"><b>✨ Quero começar do zero</b><small>Escolher o essencial, com ajuda em cada etapa.</small></button><div id="error" class="error" role="alert"></div><p class="small">Estimativas para esta proposta, ainda em avaliação.</p>';}
if(S.step===1 && S.path==='sheet'){h+='<h1>Seu ponto de partida já existe.</h1><p>No fluxo proposto, você envia sua planilha e confere o que encontramos.</p><div class="demo">Neste teste, usamos uma planilha fictícia. Não há envio de arquivo, leitura por IA ou cobrança.</div><div class="card"><b>'+(S.scenario==='duvidas'?'Planilha com valores a conferir':'Meu mês · exemplo')+'</b><p class="small" style="margin:8px 0 0">Contas, cartão e três despesas mensais.</p></div>'+actions(S.networkFailed?'Tentar novamente':'Simular importação',true);}
if(S.step===1 && S.path==='manual'){h+='<h1>Vamos começar com uma conta.</h1><p>Adicione só o que mais usa. As outras contas podem ficar para depois.</p>'+accountFields()+'<button class="quiet wide" data-action="add">+ Adicionar conta ou cartão</button><div class="demo">A conexão via Pluggy continua disponível no produto. Aqui podemos simular uma conta conectada, sem acessar bancos.</div><button class="wide" data-action="connect">Simular conexão bancária</button>'+actions('Conferir minhas contas',true);}
if(S.step===2){h+='<h1>'+(S.path==='sheet'?'Reconhece estas contas?':'Está com a sua cara?')+'</h1><p>Você pode trocar os nomes. Eles vão aparecer assim no seu app.</p>'+accountFields()+(S.ambiguous?'<div class="card"><b>Uma dúvida na planilha</b><p class="small">“Mercado · R$ 650” é um gasto que já aconteceu ou uma previsão para o mês?</p><label for="meaning">O que este valor significa?</label><select id="meaning"><option value="">Escolher</option><option value="previsto"'+(S.meaning==='previsto'?' selected':'')+'>Previsão mensal</option><option value="realizado"'+(S.meaning==='realizado'?' selected':'')+'>Gasto já realizado</option></select></div>':'')+actions('Organizar meu mês',true);}
if(S.step===3){h+='<h1>O que faz parte do seu mês?</h1><p>Marque o que você tem. Se não souber o valor agora, deixe em branco.</p>'+S.bills.map(function(b,i){return '<div class="card"><label class="check"><input type="checkbox" data-bill="'+i+'" data-key="on"'+(b.on?' checked':'')+'>'+esc(b.name)+'</label><label for="bill'+i+'">Valor mensal aproximado</label><input id="bill'+i+'" type="number" min="0" step="0.01" inputmode="decimal" data-bill="'+i+'" data-key="value" placeholder="Não sei agora" value="'+esc(b.value)+'"></div>';}).join('')+actions('Ver meu app',true);}
if(S.step===4){var total=S.bills.reduce(function(n,b){return n+(b.on?Number(b.value)||0:0);},0);h+='<h1>'+esc(S.name)+', seu mês começou.</h1><p>'+esc(S.goal)+'. Aqui estão as coisas que você escolheu.</p><div class="card"><span class="badge">Previsão mensal informada</span><div class="value">'+brl(total)+'</div><div class="small">'+S.bills.filter(function(b){return b.on&&b.value!=='';}).length+' despesas com valor · saldo bancário ainda não informado</div></div><div class="card"><b>Suas contas e cartões</b>'+S.accounts.map(function(a){return '<div class="account"><b>'+esc(a.name)+'</b><span class="badge">'+esc(a.kind)+' · '+esc(a.owner)+'</span></div>';}).join('')+'</div><h2>Experimente o primeiro registro</h2><p class="small">Preencha uma compra fictícia. Ela ficará pendente para conferir.</p><label for="purchase">Onde comprou?</label><input id="purchase" maxlength="80" placeholder="Ex.: Mercado da Praça" value="'+esc(S.purchase)+'"><label for="amount">Valor</label><input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="87,00" value="'+esc(S.amount)+'"><button class="wide" data-action="purchase" style="margin-top:12px">Guardar para classificar</button>'+S.pending.map(function(p){return '<div class="card"><b>'+esc(p.name)+' · '+brl(p.value)+'</b><div class="badge">Pendente · você confere depois</div></div>';}).join('')+(S.complete?'<div class="card finish"><b>✓ Primeiro acesso concluído</b><p style="margin:8px 0 0">Seus dados de teste estão guardados. Avalie a experiência ao lado ou reinicie para tentar novamente.</p></div>':'')+actions(S.complete?'Teste concluído':'Concluir primeiro acesso',true);}
root.innerHTML=h;
root.querySelectorAll('[data-action]').forEach(function(b){b.onclick=function(){act(b.dataset.action);};});root.oninput=function(){read();save();};root.onchange=function(){read();save();};
if(S.complete){var next=root.querySelector('[data-action="next"]');if(next)next.disabled=true;}
}
function accountFields(){return S.accounts.map(function(a,i){return '<div class="card"><label for="account'+i+'">Nome da conta ou cartão</label><input id="account'+i+'" data-account="'+i+'" data-key="name" maxlength="60" placeholder="Ex.: Meu cartão" value="'+esc(a.name)+'"><div class="row"><div><label>Tipo<select data-account="'+i+'" data-key="kind">'+['Conta','Cartão'].map(function(x){return '<option'+(a.kind===x?' selected':'')+'>'+x+'</option>';}).join('')+'</select></label></div><div><label>De quem<select data-account="'+i+'" data-key="owner">'+['Pessoal','Empresa'].map(function(x){return '<option'+(a.owner===x?' selected':'')+'>'+x+'</option>';}).join('')+'</select></label></div></div>'+(S.accounts.length>1?'<button class="quiet" data-action="remove:'+i+'">Remover deste teste</button>':'')+'</div>';}).join('');}
function act(a){read();if(a==='back'){S.complete=false;go(Math.max(0,S.step-1));return;}if(a==='sheet'||a==='manual'){if(!S.name.trim()){fail('Como podemos chamar você neste teste?');return;}if(S.path!==a){S.accounts=a==='manual'?[{name:'',kind:'Conta',owner:'Pessoal'}]:[];S.bills=[];S.imported=false;S.ambiguous=false;S.meaning='';S.pending=[];}S.path=a;go(1);return;}
if(a==='add'){if(S.accounts.length>=6){fail('Neste teste, comece com até seis contas.');return;}S.accounts.push({name:'',kind:'Conta',owner:'Pessoal'});render();save();return;}
if(a.indexOf('remove:')===0){S.accounts.splice(+a.split(':')[1],1);render();save();return;}
if(a==='connect'){S.accounts=S.accounts.filter(function(x){return x.name.trim();});if(!S.accounts.some(function(x){return x.name==='Conta Horizonte';}))S.accounts.push({name:'Conta Horizonte',kind:'Conta',owner:'Pessoal'});S.connection='simulada';event('conexao_simulada');render();save();return;}
if(a==='purchase'){if(!S.purchase.trim()||!(Number(S.amount)>0)){fail('Informe o local e um valor maior que zero.');return;}S.pending.push({name:S.purchase.trim(),value:Number(S.amount)});S.purchase='';S.amount='';event('primeiro_registro');render();save();return;}
if(a==='next'){
 if(S.step===1&&S.path==='sheet'){if(S.scenario==='falha'&&!S.networkFailed){S.networkFailed=true;render();fail('Conexão interrompida (simulação). Nada se perdeu. Tente novamente.');return;}sample();go(2);return;}
 if((S.step===1||S.step===2)&&S.accounts.some(function(x){return !x.name.trim();})){fail('Dê um nome à conta para reconhecê-la no app.');return;}
 if(S.step===2&&S.ambiguous&&!S.meaning){fail('Confira o valor de Mercado antes de continuar.');return;}
 if(S.step===2){if(!S.bills.length)S.bills=[{name:'Moradia',value:'',on:true},{name:'Internet',value:'',on:true},{name:'Mercado',value:'',on:true}];if(S.ambiguous){var market=S.bills.find(function(x){return x.name==='Mercado';});market.on=S.meaning==='previsto';S.pending=S.pending.filter(function(x){return !x.fromImport;});if(S.meaning==='realizado')S.pending.push({name:'Mercado',value:650,fromImport:true});}}
 if(S.step===3&&S.bills.some(function(b){return b.on&&b.value!==''&&(!Number.isFinite(Number(b.value))||Number(b.value)<0);})){fail('Use um valor positivo ou deixe em branco para informar depois.');return;}
 if(S.step===4){if(!S.pending.length){fail('Faça um registro fictício para experimentar o primeiro resultado.');return;}S.complete=true;event('concluido');count();paused=true;render();send('easyapp:test-state',S);return;}
 go(S.step+1);
}}
addEventListener('message',function(e){if(e.source!==parent||!e.data||e.data.type!=='easyapp:test-init')return;channel=e.data.channel;S=e.data.data&&e.data.data.schema===1?e.data.data:fresh(e.data.scenario||'manual');last=Date.now();paused=!!S.complete;render();send('easyapp:test-state',S);});
addEventListener('visibilitychange',function(){if(document.hidden){save();paused=true;}else{last=Date.now();paused=!!(S&&S.complete);}});
setInterval(function(){if(S&&!paused)save();},5000);
send('easyapp:test-ready',null);
})();
</script></body></html>
