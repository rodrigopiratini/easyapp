/* Agora que e app, o botao de atualizar joga fora TUDO - inclusive o que o
   servidor guardou - e monta a tela do zero. */
/* O botão de atualizar (e o assistente, depois de mudar dados) esquece TUDO
   que as telas guardaram - mês, ano, extrato, plano, metas, patrimônio,
   contas - e redesenha a tela aberta. Antes só o Mês voltava novo: uma conta
   renomeada continuava com o nome velho no Config até fechar o app. */
function atualizarTudo(silencioso){
  ST.cacheMes={}; ST.extras=null; ST.ano=null; ST.extrato=null; ST.plano=null; ST.patrimonio=null;
  ST.config=null; ST.metas=null; ST.projLonga=null;
  if(!silencioso) toast('Atualizando tudo...');
  var depois=function(){
    carregar();
    if(ST.telaAtual && ST.telaAtual!=='mes') irParaTela(ST.telaAtual);
  };
  google.script.run.withSuccessHandler(depois).withFailureHandler(depois).apiLimparCache();
}

function chaveMes(m){ return m+'|'+ST.filtro; }

/* Guarda no celular o mes ja carregado e adianta os vizinhos em segundo plano.
   Trocar de mes era uma ida ao servidor de 4 a 11 segundos, toda vez, mesmo
   para um mes que voce acabou de ver. */
function guardarMes(d){
  if(!d || !d.mes) return;
  ST.cacheMes = ST.cacheMes || {};
  ST.cacheMes[chaveMes(d.mes)] = { quando: Date.now(), dados: d };
}
function mesGuardado(m){
  var e = ST.cacheMes && ST.cacheMes[chaveMes(m)];
  if(!e) return null;
  if(Date.now() - e.quando > 120000) return null;   // 2 min: depois disso, rebusca
  return e.dados;
}
/* Adianta os meses vizinhos UM DE CADA VEZ. Disparar os dois junto com a tela
   principal deixava tres pedidos rodando ao mesmo tempo no mesmo script - e o
   Google respondia vazio a um deles, que era o "Falhei ao desenhar a tela". */
function adiantarVizinhos(m){
  if(ST.adiantando) return;
  var p=m.split('-'), a=Number(p[0]), n=Number(p[1]);
  var fila=[];
  [n+1, n-1].forEach(function(k){
    var aa=a, kk=k;
    if(kk<1){ kk=12; aa=a-1; } if(kk>12){ kk=1; aa=a+1; }
    var alvo = aa+'-'+('0'+kk).slice(-2);
    if(!mesGuardado(alvo)) fila.push(alvo);
  });
  if(!fila.length) return;
  ST.adiantando=true;
  var proximo=function(){
    if(!fila.length){ ST.adiantando=false; return; }
    var alvo=fila.shift();
    google.script.run
      .withSuccessHandler(function(d){ guardarMes(d); setTimeout(proximo, 600); })
      .withFailureHandler(function(){ ST.adiantando=false; })
      .apiEstado(alvo, ST.filtro, 'TUDO');
  };
  proximo();
}

function carregar(mes, podeUsarCache){
  var bt=el('btAtualizar'); if(bt){ bt.disabled=true; bt.style.opacity=.4; }
  var alvo = mes || ST.mes || mesDeHoje();

  if(podeUsarCache){
    /* Trocar de mês não espera viagem nenhuma: mostra o que está guardado na
       hora e, se já tiver idade, rebusca POR TRÁS e redesenha quando chegar.
       Antes disso o cache vencia em 2 minutos e você pagava 2 segundos de
       novo por um mês que já tinha aberto. */
    var e = ST.cacheMes && ST.cacheMes[chaveMes(alvo)];
    if(e){
      aplicarEstado(e.dados, mes);
      if(bt){ bt.disabled=false; bt.style.opacity=1; }
      if(Date.now()-e.quando > 20000) revalidarMes(alvo);
      else adiantarVizinhos(alvo);
      return;
    }
  } else {
    ST.cacheMes={}; ST.extras=null;   // qualquer coisa que nao seja so trocar de mes invalida tudo
  }

  // A primeira chamada depois de uma republicacao pode passar de um minuto:
  // o Google recompila o script antes de responder. Em vez de jogar a tela de
  // erro na cara, esperamos mais e tentamos de novo uma vez.
  var respondeu=false;
  var alarme=setTimeout(function(){
    if(respondeu) return;
    if(!ST.jaTentou){
      ST.jaTentou=true;
      toast('O servidor está lento, tentando de novo...');
      carregar(mes, false);
      return;
    }
    mostrarFalha('O servidor não respondeu',
      'Mês pedido: '+alvo+'\nTente de novo em alguns segundos. Se insistir, '+
      'costuma ser o Google fora do ar.');
  },60000);

  google.script.run.withSuccessHandler(function(d){
    respondeu=true; clearTimeout(alarme); ST.jaTentou=false;
    if(bt){ bt.disabled=false; bt.style.opacity=1; }
    guardarMes(d);
    aplicarEstado(d, mes);
  }).withFailureHandler(function(e){
    respondeu=true; clearTimeout(alarme);
    if(bt){ bt.disabled=false; bt.style.opacity=1; }
    mostrarFalha('O servidor recusou o pedido', (e && e.message) || e);
  }).apiEstado(alvo, ST.filtro, 'TUDO');
}

/* Rebusca um mês sem tirar nada da tela: você já está vendo o guardado.
   Um pedido de cada vez, pela mesma razão do adiantarVizinhos - três
   chamadas simultâneas no mesmo script fazem o Google devolver vazio a uma
   delas. Só quando este volta é que os vizinhos começam. */
function revalidarMes(m){
  if(ST.revalidando || ST.adiantando){ adiantarVizinhos(m); return; }
  ST.revalidando = true;
  google.script.run.withSuccessHandler(function(d){
    ST.revalidando = false;
    if(d && d.mes){
      guardarMes(d);
      if(ST.mes===m && ST.telaAtual!=='classificar') aplicarEstado(d, m);
    }
    adiantarVizinhos(m);
  }).withFailureHandler(function(){ ST.revalidando = false; })
    .apiEstado(m, ST.filtro, 'TUDO');
}


/* Guarda onde a tela estava e devolve depois do redesenho. Reclassificar uma
   compra no meio da lista jogava voce de volta para o topo, e ai tinha que
   rolar tudo de novo para pegar a proxima. */
function guardarLugar(){ ST.lugar = window.scrollY || 0; }
function devolverLugar(){
  if(ST.lugar === undefined || ST.lugar === null) return;
  var y = ST.lugar; ST.lugar = null;
  var põe = function(){ window.scrollTo(0, y); };
  põe(); requestAnimationFrame(põe); setTimeout(põe, 120); setTimeout(põe, 380);
}

/* A abertura so sai quando ha o que mostrar - ou no limite de 6 segundos,
   para nunca prender a tela se o servidor engasgar. */
var ABRIU_EM=Date.now();
function fecharAbertura(){
  var a=el('abertura');
  if(!a || a.classList.contains('sai')) return;
  // deixa a entrada terminar: as barras levam ~1s para nascer e o nome subir
  var falta=3200-(Date.now()-ABRIU_EM);   // ver a logo com calma (pedido do Rodrigo)
  if(falta>0){ setTimeout(fecharAbertura, falta); return; }
  a.classList.add('sai');
  setTimeout(function(){ if(a.parentNode) a.parentNode.removeChild(a); }, 600);
}
setTimeout(fecharAbertura, 6000);

var BARRINHAS='<div class="ld" aria-label="carregando"><i></i><i></i><i></i></div>';
function trocarCarregando(raiz){
  (raiz.querySelectorAll ? raiz.querySelectorAll('.load:not([data-ld])') : []).forEach(function(d){
    d.setAttribute('data-ld','1'); d.style.padding='0'; d.innerHTML=BARRINHAS;
  });
}
new MutationObserver(function(ms){
  ms.forEach(function(m){ m.addedNodes.forEach(function(n){
    if(n.nodeType!==1) return;
    if(n.classList && n.classList.contains('load')) trocarCarregando(n.parentNode||n);
    else trocarCarregando(n);
  }); });
}).observe(document.body,{childList:true,subtree:true});
trocarCarregando(document);

function aplicarEstado(d, mes){
  // O Apps Script as vezes devolve vazio sem dar erro. Antes de acusar falha,
  // tentamos mais uma vez - na segunda, quase sempre vem.
  if(!d || !d.mes){
    if(!ST.vazioUmaVez){
      ST.vazioUmaVez=true;
      setTimeout(function(){ carregar(mes, false); }, 1200);
      return;
    }
    mostrarFalha('O servidor devolveu uma resposta vazia',
      'Isso costuma passar sozinho. Toque em Recarregar.');
    return;
  }
  ST.vazioUmaVez=false;
  try{
    ST.mes=d.mes; ST.pendentes=d.pendentes||[]; ST.resumo=d.resumo;
    ST.cartao=d.cartao; ST.categorias=d.categorias||[];
    ST.semCategoria=d.semCategoria; ST.filtro=d.filtro||ST.filtro;
    ST.extrato=null; ST.saldos=d.saldos;
    ST.proximos=d.proximos; ST.projecaoAnual=d.projecaoAnual;

    renderCabecalho();
    var sc=(ST.semCategoria&&ST.semCategoria.quantos)||0;
    el('badge').textContent = (ST.pendentes.length + sc) + ' a ver';
    fecharAbertura();
    render();
    devolverLugar();
    carregarAno(Number(d.mes.split('-')[0]));
    setTimeout(function(){ adiantarVizinhos(d.mes); }, 2500);
    // o plano leva 15s na primeira vez: busca sozinho enquanto voce usa o
    // resto, para estar pronto quando abrir a aba
    setTimeout(adiantarExtras, 900);
    if(mes === undefined) toast('Atualizado');
  }catch(err){
    mostrarFalha('Falhei ao desenhar a tela', (err && err.stack) || err);
  }
}

function render(){ renderPendentes(); renderMes(); renderPainel(); renderCartao();
                   renderExtrato(); renderNovo(); ajustarFiltros(); }

/* Plano, Painel e Classificar nao dependem do mes: escondem a barra de filtros */
function ajustarFiltros(){
  var t=ST.telaAtual||'mes';
  var sem=(t==='analise'||t==='pendentes'||t==='config');
  document.querySelectorAll('header .filtros').forEach(function(f){
    f.classList.toggle('hide', sem); });

  var fam=el('linhaFamilia');
  if(fam) fam.classList.toggle('hide', sem || t==='extrato');

/* O painel do ano e pesado: busca depois que a tela ja apareceu, e so
   quando o ano muda. Assim abrir o app nao espera por ele. */
function carregarAno(ano){
  if(ST.ano && ST.ano.ano === ano){ renderCabecalho(); renderPainel(); return; }
  el('tela-painel').innerHTML=abasAnalise()+'<div class="load">Montando o painel do ano...</div>';
  google.script.run.withSuccessHandler(function(a){
    try{ ST.ano=a; renderCabecalho(); renderPainel(); }
    catch(err){ el('tela-painel').innerHTML='<div class="vazio">Erro no painel:<br>'+
      ((err&&err.message)||err)+'</div>'; }
  }).withFailureHandler(function(e){
    el('tela-painel').innerHTML='<div class="vazio">Não consegui montar o painel.<br>'+tx(e.message)+'</div>';
  }).apiAno(ano);
}

  }
  c.innerHTML = h + filaSemCategoria();
  setTimeout(reaplicarCriada, 0);
}

/* As compras vindas das faturas ja estao confirmadas, mas sem categoria.
   Ficam aqui, agrupadas por fornecedor: classificar uma vez resolve todas. */
function filaSemCategoria(){
  var s=ST.semCategoria;
  if(!s || !s.fornecedores || !s.fornecedores.length) return '';
  var h='<div class="card" style="border-color:#7c5310;background:#2a1f0d;margin-top:4px">'+
    '<b>'+s.quantos+' fornecedores sem categoria · '+moeda(s.total)+'</b>'+
    '<div class="m" style="margin-top:3px">Vieram das faturas. Classifique o fornecedor '+
    'uma vez e todas as compras dele entram na conta certa.</div></div>';

  s.fornecedores.forEach(function(f,i){
    h+='<div class="card" style="padding:9px 11px"><div class="forn" style="border:0;padding:0">'+
       '<div class="row"><div style="min-width:0">'+
       '<div class="d" style="font-size:13.5px;line-height:1.25">'+tx(f.exemplo)+'</div>'+
       '<div class="m" style="font-size:11px">'+f.vezes+'x · '+f.qtdMeses+' '+(f.qtdMeses>1?'meses':'mês')+
       (f.ultima?' · última '+f.ultima:'')+
       (f.chave&&f.chave!==f.exemplo?' · vira a regra <b>'+tx(f.chave)+'</b>':'')+'</div></div>'+
       '<div class="big" style="font-size:16px;white-space:nowrap;padding-left:8px">'+
       moeda(f.valor)+'</div></div>'+
       botaoConta('sc'+i, '', f.natureza||'DESPESA', 'mudouFila('+i+')')+
       '<div id="nf'+i+'"></div>'+
       '<button class="bt-ok" style="width:100%;margin-top:7px;padding:8px;font-size:13px" '+
       'id="sb'+i+'" disabled '+
       'onclick="classificarFornecedor('+i+')">Classificar as '+f.vezes+'</button>'+
       '</div></div>';
  });
  setTimeout(function(){ reaplicarCriada(); },0);
  return h;
}

function mudouFila(i){
  el('nf'+i).innerHTML='';
  var b=el('sb'+i); if(b) b.disabled = !el('sc'+i).value;
}

/* Depois de criar uma conta, o app recarrega: aqui devolvemos a escolha. */
function reaplicarCriada(){
  if(!ST.recemCriada) return;
  var s=el(ST.recemCriada.select);
  if(s){
    s.value=ST.recemCriada.categoria;
    var bt=el('btn_'+ST.recemCriada.select);
    if(bt) bt.innerHTML = ponto(familiaDe(s.value))+tx(s.value)+
      '<span style="margin-left:auto;color:var(--dim)">&#9662;</span>';
    var i=ST.recemCriada.select.replace(/^\D+/,'');
    var b=el(ST.recemCriada.select.charAt(0)==='c' ? 'b'+i : 'sb'+i);
    if(b) b.disabled=false;
    s.scrollIntoView({block:'center'});
  }
  ST.recemCriada=null;
}

function classificarFornecedor(i){
  var f=ST.semCategoria.fornecedores[i], cat=el('sc'+i).value;
  if(!cat) return;
  var bt=el('sb'+i); bt.disabled=true; bt.textContent='Classificando...';
  google.script.run.withSuccessHandler(function(r){
    if(!r || r.ok===false){
      bt.disabled=false; bt.textContent='Erro, tentar de novo';
      return toast('Falhou: '+((r&&r.erro)||'sem resposta'));
    }
    var q=r.atualizadas!=null ? r.atualizadas : r.quantos;
    toast(q===1 ? '1 compra classificada' : (q||0)+' compras classificadas');
    ST.ano=null;
    carregar(ST.mes);
  }).withFailureHandler(function(e){
    bt.disabled=false; bt.textContent='Erro, tentar de novo';
    toast('Falhou: '+((e&&e.message)||e));
  }).apiClassificarFornecedor(f.chave, cat);
}

/* Reparte um lancamento entre varias contas - o boleto unico que traz
   aluguel, IPTU e seguro juntos. O rateio ja vem na proporcao do previsto. */
function abrirRateio(i){
  ST.rateio = (ST.rateio===i) ? null : i;
  ST.partes = ST.partes || [];
  if(ST.rateio===i && !ST.partes.length) ST.partes=[{cat:'',valor:0},{cat:'',valor:0}];
  renderPendentes();
}

function painelRateio(p, i){
  var op=ST.categorias.filter(function(x){return x.natureza===p.natureza;})
    .map(function(x){return x.nome;});
  var h='<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px">'+
    '<div class="lbl" style="margin-bottom:6px">Distribuir '+moeda(p.valor)+' entre contas</div>';
  ST.partes.forEach(function(pt,k){
    h+='<div class="row" style="gap:6px;margin-bottom:6px">'+
       '<div style="flex:2">'+
         botaoEscolha('rc'+k, pt.cat||'', 'conta…', 'conta',
                      op.map(function(n){ return { valor:n, rotulo:n, grupo:familiaDe(n) }; }),
                      'recalcularRateio('+i+')')+'</div>'+
       '<label style="flex:1;display:flex;align-items:center;gap:4px;min-width:0">'+
         '<span style="color:var(--dim);font-size:13px">R$</span>'+
         '<input id="rv'+k+'" style="flex:1;min-width:0;text-align:right" inputmode="decimal" value="'+
         (pt.valor?num(pt.valor):'')+'" placeholder="0,00" oninput="mascaraMoeda(this)" '+
         'onchange="recalcularRateio('+i+')"></label>'+
       (ST.partes.length>2?'<button class="bt-x" onclick="ST.partes.splice('+k+',1);renderPendentes()">&times;</button>':'')+
       '</div>';
  });
  var soma=ST.partes.reduce(function(s,x){return s+(Number(x.valor)||0);},0);
  var falta=p.valor-soma;
  h+='<div class="row" style="margin:6px 0;font-size:12px">'+
     '<button class="bt-mais" onclick="ST.partes.push({cat:\'\',valor:0});renderPendentes()">+ outra conta</button>'+
     '<span class="num '+(Math.abs(falta)<0.01?'pos':'wr')+'">'+
       (Math.abs(falta)<0.01?'fecha certo':'falta '+moeda(falta))+'</span></div>'+
     '<div class="row" style="gap:6px">'+
       '<button class="bt-no" style="flex:1" onclick="sugerirRateio('+i+')">Ratear pelo previsto</button>'+
       '<button class="bt-ok" style="flex:1" onclick="salvarRateio('+i+')">Lançar</button>'+
     '</div></div>';
  return h;
}

function lerPartes(){
  ST.partes.forEach(function(pt,k){
    var c=el('rc'+k), v=el('rv'+k);
    if(c) pt.cat=c.value;
    if(v) pt.valor=parseFloat(String(v.value).replace(/\./g,'').replace(',','.'))||0;
  });
}
function recalcularRateio(i){ lerPartes(); renderPendentes(); }

function sugerirRateio(i){
  lerPartes();
  var p=ST.pendentes[i];
  var cats=ST.partes.map(function(x){return x.cat;}).filter(Boolean);
  if(cats.length<2){ toast('Escolha ao menos duas contas'); return; }
  google.script.run.withSuccessHandler(function(r){
    ST.partes=r.partes.map(function(x){ return {cat:x.categoria, valor:x.valor}; });
    toast(r.temPrevisto?'Rateado pelo previsto do mês':'Sem previsto: dividi por igual');
    renderPendentes();
  }).apiSugerirRateio(ST.mes, cats, p.valor);
}

function salvarRateio(i){
  lerPartes();
  var p=ST.pendentes[i];
  var partes=ST.partes.filter(function(x){return x.cat && x.valor;})
    .map(function(x){ return {categoria:x.cat, valor:x.valor, aprender:false}; });
  if(partes.length<2){ toast('Preencha ao menos duas contas'); return; }
  google.script.run.withSuccessHandler(function(r){
    if(!r.ok){ toast(r.erro); return; }
    toast('Dividido em '+r.partes+' contas');
    ST.rateio=null; ST.partes=[]; ST.ano=null; carregar(ST.mes);
  }).apiDistribuir(p.linha, partes, p.id);
}

var CAT_TRANSFER='TRANSFERENCIA ENTRE CONTAS';

function confirmar(i){
  var p=ST.pendentes[i], cat=el('c'+i).value;
  // transferencia entre contas suas: o banco manda so um dos dois avisos, entao
  // o outro lado quem cria e o app - senao o saldo de uma das contas nunca mexe
  if(cat===CAT_TRANSFER){
    var destino = el('tr'+i) ? el('tr'+i).value : '';
    if(!destino){ toast('Escolha a outra conta'); return; }
    el('p'+i).style.opacity=.35;
    google.script.run.withSuccessHandler(function(r){
      toast(r && r.ok ? (r.criou?'Transferência lançada nas duas contas':'Os dois lados pareados')
                      : ((r&&r.erro)||'Não consegui'));
      carregar();
    }).withFailureHandler(function(){ toast('Falhou'); carregar(); })
      .apiEspelhoTransferencia(p.linha, p.id, destino);
    return;
  }
  var tipo = ST.tipoEscolhido && ST.tipoEscolhido[p.uuid];
  if(p.perguntarTipo && !tipo){ toast('Foi no crédito ou no débito?'); return; }
  if(p.perguntarTipo){
    el('p'+i).style.opacity=.35;
    google.script.run.withSuccessHandler(function(r){
      if(r && r.ok===false){ toast('Não salvei: '+(r.erro||'')); var c=el('p'+i); if(c) c.style.opacity=1; return; }
      p.perguntarTipo=false; if(tipo==='DEBITO'){ p.meio='CAIXA'; }
      confirmar(i);
    }).withFailureHandler(function(){ toast('Falhou'); var c=el('p'+i); if(c) c.style.opacity=1; })
      .apiDefinirTipo(p.uuid, tipo);
    return;
  }
  el('p'+i).style.opacity=.35;
  var vezes = (el('pc'+i) && p.meio==='CARTAO_CREDITO') ? Number(el('pc'+i).value)||1 : 1;
  google.script.run.withSuccessHandler(function(r){
    // falhou de verdade: avisa e devolve o cartão (antes dizia "Confirmado" e nada mudava)
    if(r && r.ok===false){ toast('Não salvei: '+(r.erro||'tente de novo')); var c=el('p'+i); if(c) c.style.opacity=1; return; }
    if(vezes>1){
      google.script.run.withSuccessHandler(function(r){
        toast(r&&r.ok ? 'Confirmado em '+r.vezes+'x de '+moeda(r.parcela) : 'Confirmado, mas não parcelei: '+((r&&r.erro)||''));
        ST.ano=null; carregar();
      }).withFailureHandler(function(){ toast('Confirmado, mas não parcelei'); carregar(); })
        .apiParcelar(p.uuid||p.id, vezes);
      return;
    }
    toast('Confirmado'); carregar();
  }).apiConfirmar(p.linha, cat, p.valor, p.id);
}
function escolherTipo(i, t){
  var p=ST.pendentes[i]; ST.tipoEscolhido=ST.tipoEscolhido||{};
  ST.tipoEscolhido[p.uuid]=t; renderPendentes();
}
function mostrarParcela(i){
  var p=ST.pendentes[i], v=Number(el('pc'+i).value)||1, e=el('pv'+i);
  if(e) e.textContent = v>1 ? v+' × '+moeda(Math.floor(p.valor*100/v)/100) : '';
}

/* O lancamento caiu numa conta que o app nao reconhece. Enquanto for assim ele
   aparece no extrato mas NAO entra em saldo nenhum - era isso que fazia o PIX
   entre contas suas debitar de um lado e nao creditar do outro. */
function avisoFaltaConta(p, i){
  /* Compra de cartao pede CARTAO; o resto pede conta. Antes daqui a lista era
     sempre a das contas com saldo - e cartao nao tem saldo, so fatura. Por isso
     uma compra que chegava sem dizer o cartao nao tinha como ser atribuida. */
  var cartao = (p.meio==='CARTAO_CREDITO');
  var opcoes = cartao
    ? ((ST.saldos&&ST.saldos.cadastroCartoes)||[]).map(function(n){
        return { valor:n, rotulo:n, grupo:'cartão' }; })
    : ((ST.saldos&&ST.saldos.contas)||[]).map(function(c){
        return { valor:c.conta, rotulo:c.conta, grupo:c.titular }; });
  if(!opcoes.length) return '';
  return '<div style="border:1px solid var(--warn);border-radius:10px;padding:9px;margin:8px 0;'+
    'background:#2a1f0d">'+
    '<div class="lbl" style="margin-bottom:5px;color:var(--warn)">'+
    (cartao ? 'Em qual cartão seu foi essa compra?' : 'Em qual conta sua isso caiu?')+'</div>'+
    botaoEscolha('fc'+i, '', 'escolher…', cartao?'cartão':'conta', opcoes,
                 'definirConta('+i+')')+
    '<div class="m" style="font-size:11px;margin-top:5px">Veio como <b>'+tx(p.conta||'sem conta')+
    '</b>, que não é '+(cartao?'um cartão':'uma conta')+' do app. Enquanto não disser, '+
    (cartao ? 'ela não entra em nenhuma fatura.' : 'este valor não mexe em nenhum saldo.')+
    '</div></div>';
}

function definirConta(i){
  var p=ST.pendentes[i], conta=el('fc'+i).value;
  if(!conta) return;
  google.script.run.withSuccessHandler(function(r){
    toast(r && r.ok ? 'Conta ajustada: '+conta : ((r&&r.erro)||'Não consegui'));
    ST.cacheMes={}; ST.extras=null; ST.ano=null; carregar(ST.mes);
  }).withFailureHandler(function(){ toast('Falhou'); })
    .apiDefinirConta(p.linha, p.id, conta);
}

/* Lista das suas contas, para dizer de onde veio / para onde foi. */
function seletorOutraConta(i, natureza, contaAtual){
  var contas=((ST.saldos&&ST.saldos.contas)||[]).filter(function(c){
    return c.conta!==contaAtual; });
  if(!contas.length) return '';
  var rotulo = (natureza==='RECEITA') ? 'De qual conta sua saiu?' : 'Para qual conta sua foi?';
  return '<div style="border:1px solid var(--acc);border-radius:10px;padding:9px;margin-top:8px">'+
    '<div class="lbl" style="margin-bottom:5px">'+rotulo+'</div>'+
    botaoEscolha('tr'+i, '', 'escolher…', 'conta',
                 contas.map(function(c){
                   return { valor:c.conta, rotulo:c.conta, grupo:c.titular }; }), '')+
    '<div class="m" style="font-size:11px;margin-top:5px">O app cria o outro lado '+
    'sozinho: sai daqui, entra lá, e o mês não conta isso como gasto.</div></div>';
}
function ignorar(i){
  var p=ST.pendentes[i];
  el('p'+i).style.opacity=.35;
  google.script.run.withSuccessHandler(function(){ toast('Ignorado'); carregar(); })
    .apiIgnorar(p.linha, p.id);
}
/* Botao que abre a folha de selecao no lugar do <select> nativo,
   que com 60 contas vira uma lista impossivel de usar no celular. */
function botaoConta(id, valor, natureza, aoEscolher){
  return '<input type="hidden" id="'+id+'" value="'+tx(valor||'')+'">'+
    '<button class="bt-conta" id="btn_'+id+'" onclick="abrirPicker(\''+id+'\',\''+
      natureza+'\',\''+aoEscolher.replace(/'/g,"\\'")+'\')">'+
    (valor ? ponto(familiaDe(valor))+tx(valor) : '<span style="color:var(--dim)">escolher conta…</span>')+
    '<span style="margin-left:auto;color:var(--dim)">&#9662;</span></button>';
}

function abrirPicker(id, natureza, aoEscolher, podeLimpar, fornecedor){
  ST.pk={ id:id, natureza:natureza, aoEscolher:aoEscolher,
          podeLimpar:!!podeLimpar, fornecedor:fornecedor||'', itens:null };
  el('pkBusca').placeholder='buscar conta...';
  var bn=el('pkNovo'); bn.classList.remove('hide'); bn.textContent='+ criar conta nova';
  // PIX solto e usado para mil coisas: o padrao e valer para o fornecedor
  // inteiro, mas voce pode desmarcar e mexer so nesta linha.
  var lt=el('pkTodos');
  lt.classList.toggle('hide', !fornecedor);
  if(fornecedor){
    el('pkTodosBox').checked=true;
    el('pkTodosTxt').textContent='aplicar a todos os lançamentos de '+fornecedor;
  }
  el('pkBusca').value='';
  montarPicker('');
  el('picker').classList.remove('hide');
  setTimeout(function(){ el('pkBusca').focus(); },80);
}
function fecharPicker(){ el('picker').classList.add('hide'); }
function filtrarPicker(){ montarPicker(el('pkBusca').value); }

/* Transferencia entre contas nao e receita nem despesa: ela vale para os dois
   lados. Filtrando so por natureza, ela sumia das duas listas - e nao havia
   como classificar o credito de um PIX que voce mandou de uma conta sua para
   outra. */
function serveParaNatureza(x, natureza){
  return x.natureza===natureza || x.natureza==='TRANSFERENCIA';
}

/* A mesma folha de escolha serve para qualquer lista, nao so para contas.
   Os <select> cinzas do sistema sumiram daqui: eles nao seguem o tema, abrem
   um menu do Android por cima do app e, numa lista de 15 famílias, obrigam a
   rolar sem poder buscar. */
function abrirEscolha(id, titulo, itens, aoEscolher, textoNovo){
  ST.pk={ id:id, itens:itens, titulo:titulo, aoEscolher:aoEscolher,
          textoNovo:textoNovo||'', podeLimpar:false, fornecedor:'' };
  el('pkTodos').classList.add('hide');
  el('pkBusca').value='';
  el('pkBusca').placeholder = 'buscar ' + (titulo||'').toLowerCase();
  var bt=el('pkNovo');
  bt.classList.toggle('hide', !textoNovo);
  bt.textContent = textoNovo || '';
  montarPicker('');
  el('picker').classList.remove('hide');
  setTimeout(function(){ el('pkBusca').focus(); },80);
}

/* Botao que abre a folha. Parece um campo, mas e um botao do proprio app. */
function botaoEscolha(id, valor, vazio, titulo, itens, aoEscolher, textoNovo){
  var achado=null;
  (itens||[]).forEach(function(x){
    var o=(typeof x==='string')?{valor:x,rotulo:x,grupo:''}:x;
    if(o.valor===valor) achado=o;
  });
  var pintar = valor
    ? ponto(achado?(achado.grupo||achado.rotulo):valor)+tx(achado?achado.rotulo:valor)
    : '<span style="color:var(--dim)">'+vazio+'</span>';
  return '<input type="hidden" id="'+id+'" value="'+String(valor||'').replace(/"/g,'&quot;')+'">'+
    '<button class="bt-conta" id="btn_'+id+'" onclick="abrirEscolha(\''+id+'\',\''+
      titulo+'\','+JSON.stringify(itens).replace(/&/g,'&amp;').replace(/"/g,'&quot;')+',\''+
      String(aoEscolher||'').replace(/'/g,"\\'")+'\',\''+(textoNovo||'')+'\')">'+
    pintar+'<span style="margin-left:auto;color:var(--dim)">&#9662;</span></button>';
}

function montarPicker(busca){
  var b=normaliza(busca);
  // lista solta (famílias, por exemplo)
  if(ST.pk.itens){
    // cada item pode ser um texto solto ou { valor, rotulo, grupo }
    var atual=el(ST.pk.id).value;
    var li=ST.pk.itens.map(function(x){
      return (typeof x==='string') ? { valor:x, rotulo:x, grupo:'' } : x;
    }).filter(function(x){
      return !b || normaliza(x.rotulo+' '+(x.grupo||'')).indexOf(b)>=0;
    });
    el('pkLista').innerHTML = li.length
      ? li.map(function(x){
          return '<div class="pk'+(x.valor===atual?' sel':'')+'" '+
            'onclick="escolherConta('+JSON.stringify(x.valor).replace(/"/g,'&quot;')+')">'+
            ponto(x.grupo||x.rotulo)+'<span>'+tx(x.rotulo)+'</span>'+
            (x.grupo?'<span class="fam">'+tx(x.grupo)+'</span>':'')+'</div>';
        }).join('')
      : '<div class="vazio" style="padding:26px">Nada com esse nome.</div>';
    return;
  }
  var lista=ST.categorias.filter(function(x){
    return serveParaNatureza(x, ST.pk.natureza) && (!b || normaliza(x.nome).indexOf(b)>=0 ||
           normaliza(familiaDe(x.nome)).indexOf(b)>=0);
  });
  // Errou a conta? Tem que haver caminho de volta. Sem esta linha, uma escolha
  // sem querer ficava grudada no lancamento para sempre.
  var limpar = (ST.pk.podeLimpar && !b)
    ? '<div class="pk" onclick="escolherConta(\'\')">'+
      '<span style="color:var(--dim)">— deixar sem conta —</span></div>' : '';
  el('pkLista').innerHTML = limpar + (lista.length
    ? lista.map(function(x){
        var f=familiaDe(x.nome);
        return '<div class="pk'+(x.nome===el(ST.pk.id).value?' sel':'')+'" '+
          'onclick="escolherConta('+JSON.stringify(x.nome).replace(/"/g,'&quot;')+')">'+
          ponto(f)+'<span>'+tx(x.nome)+'</span><span class="fam">'+tx(f)+'</span></div>';
      }).join('')
    : (limpar ? '' : '<div class="vazio" style="padding:26px">Nenhuma conta com esse nome.</div>'));
}
function normaliza(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}

function escolherLista(p, valor){
  el(p.id).value=valor;
  var achado=null;
  (p.itens||[]).forEach(function(x){
    var o=(typeof x==='string')?{valor:x,rotulo:x,grupo:''}:x;
    if(o.valor===valor) achado=o;
  });
  var rot = achado ? achado.rotulo : valor;
  var fam = achado ? (achado.grupo||achado.rotulo) : valor;
  var bt=el('btn_'+p.id);
  if(bt) bt.innerHTML = ponto(fam)+tx(rot)+
    '<span style="margin-left:auto;color:var(--dim)">&#9662;</span>';
  if(p.aoEscolher) eval(p.aoEscolher);
}

function escolherConta(nome){
  var p=ST.pk;
  if(p.itens){ fecharPicker(); escolherLista(p, nome); return; }
  el(p.id).value=nome;
  var bt=el('btn_'+p.id);
  if(bt) bt.innerHTML = (nome ? ponto(familiaDe(nome))+nome
                              : '<span style="color:var(--dim)">sem conta</span>')+
    '<span style="margin-left:auto;color:var(--dim)">&#9662;</span>';
  fecharPicker();
  if(p.aoEscolher) eval(p.aoEscolher);
}

function pickerCriar(){
  var p=ST.pk;
  fecharPicker();
  if(p.itens){                       // lista solta: cria um item novo digitado
    var nv=prompt(p.textoNovo.replace(/^\+\s*/,'')+':','');
    if(!nv || !nv.trim()) return;
    // na lista de "caiu em" o valor carrega o prefixo C| (cartao) ou D| (conta)
    var pref = /cart/i.test(p.textoNovo||'') ? 'C|' : '';
    escolherLista(p, pref+nv.trim().toUpperCase());
    return;
  }
  // vindo do Extrato (rcAlvo) nao ha cartao onde encaixar o formulario
  var alvo = (p.id==='rcAlvo') ? 'rcForm'
           : (p.id.charAt(0)==='c' ? 'nc'+p.id.slice(1) : 'nf'+p.id.slice(2));
  /* Telas sem um espaco reservado para o formulario (editar lancamento, o +
     do topo): abre logo abaixo do proprio botao da conta. Antes, el(alvo)
     voltava null e o app quebrava com "Cannot set properties of null". */
  if(!el(alvo)){
    alvo='cria_'+p.id;
    if(!el(alvo)){
      var bt=el('btn_'+p.id), d=document.createElement('div');
      d.id=alvo;
      if(bt && bt.parentNode) bt.parentNode.insertBefore(d, bt.nextSibling);
      else { toast('Crie a conta em Config → Contas'); return; }
    }
  }
  abrirCriar(alvo, p.id, p.natureza);
}

function destravar(i){
  var cat=el('c'+i).value;
  var p=ST.pendentes[i]||{};
  // guarda a escolha: o ⋯ e o crédito/débito redesenham o cartão
  if(p.uuid){ ST.catEscolhida=ST.catEscolhida||{}; ST.catEscolhida[p.uuid]=cat; }
  el('nc'+i).innerHTML = (cat===CAT_TRANSFER)
    ? seletorOutraConta(i, p.natureza, p.conta) : '';
  var b=el('b'+i); if(b) b.disabled = !cat;
}

/* Formulario de conta nova dentro da propria classificacao.
   Cria a conta (e a familia, se for nova) e ja deixa selecionada. */
function abrirCriar(alvo, selectId, natureza){
  var fams=((ST.resumo&&ST.resumo.familias)||[]);
  el(alvo).innerHTML =
    '<div style="border:1px solid var(--acc);border-radius:10px;padding:10px;margin-top:8px">'+
    '<div class="lbl" style="margin-bottom:7px">Nova conta</div>'+
    '<input id="xNome" placeholder="nome da conta (ex.: CASA - SEGURO PORTAO)">'+
    '<div class="lbl" style="margin-top:9px">Família</div>'+
    botaoEscolha('xFam', '', 'escolher a família…', 'família', fams, '',
                 '+ criar família nova')+
    '<div class="lbl" style="margin-top:9px">Previsto por mês</div>'+
    '<input id="xPrev" placeholder="0,00" inputmode="decimal" oninput="mascaraMoeda(this)">'+
    '<div class="row" style="gap:8px;margin-top:9px">'+
      '<button class="bt-no" style="flex:1" onclick="cancelarCriar(\''+alvo+'\',\''+selectId+'\')">Cancelar</button>'+
      '<button class="bt-ok" style="flex:2" onclick="criarNaClassificacao(\''+alvo+'\',\''+

function mostrarFamNova(){
  var s=el('xFam'), nv=el('xFamNova');
  if(!s||!nv) return;
  nv.classList.toggle('hide', s.value!=='__nova');
  if(s.value==='__nova') nv.focus();
}

function cancelarCriar(alvo, selectId){
  var box=el(alvo); if(box) box.innerHTML='';
  var s=el(selectId); if(s) s.value='';
  var i=selectId.replace(/^\D+/,'');
  if(selectId.charAt(0)==='c'){ var b=el('b'+i); if(b) b.disabled=true; }
  else { var sb=el('sb'+i); if(sb) sb.disabled=true; }
}

function criarNaClassificacao(alvo, selectId, natureza){
  var nome=el('xNome').value.trim();
  if(!nome){ toast('Dê um nome para a conta'); return; }
  var fam=(el('xFam').value||'').trim();
  if(!fam){ toast('Escolha a família'); return; }
  var prev=parseFloat(String(el('xPrev').value||'0').replace(/\./g,'').replace(',','.'))||0;
  toast('Criando...');
  google.script.run.withSuccessHandler(function(r){
    if(!r.ok){ toast('Não criei: '+r.erro); return; }
    // Antes daqui saia um carregar() inteiro - a tela toda de novo, do zero,
    // so para mostrar uma conta que o proprio app acabou de criar. Agora a
    // conta entra na lista aqui mesmo e ja fica escolhida na linha.
    ST.categorias.push({ nome:r.categoria, grupo:fam.toUpperCase(), natureza:natureza });
    var fams=((ST.resumo&&ST.resumo.familias)||[]);
    if(ST.resumo && fams.indexOf(fam.toUpperCase())<0) fams.push(fam.toUpperCase());
    var box=el(alvo); if(box) box.innerHTML='';
    ST.cacheMes={}; ST.extras=null; ST.ano=null;    // o servidor mudou; a proxima leitura rebusca
    if(selectId==='rcAlvo'){
      // criada ao trazer uma conta para o mes: ja aplica nela
      el('rcAlvo').value=r.categoria;
      confirmarTrazer();
      return;
    }
    ST.recemCriada={ categoria:r.categoria, select:selectId };
    reaplicarCriada();
    toast('Conta criada');
  }).withFailureHandler(function(e){ toast('Falhou: '+((e&&e.message)||e)); })
    .apiNovaCategoria(nome.toUpperCase(), fam.toUpperCase(), natureza, prev);
}
function confirmarTodos(){
  var itens=[];
  ST.pendentes.forEach(function(p,i){
    var cat=el('c'+i).value;
    if(cat) itens.push({ linha:p.linha, id:p.id, categoria:cat, valor:p.valor });

  el('tela-pendentes').innerHTML='<div class="load">Confirmando...</div>';
  google.script.run.withSuccessHandler(function(){ toast('Tudo confirmado'); carregar(); })

function renderMes(){
  var r=ST.resumo, c=el('tela-mes');

  var pctMes = r.diaDeHoje / r.diasNoMes;
  var h='';

  var cx=r.caixa;
  if(cx){
    h+='<div class="card" style="border-left:3px solid '+
       (cx.saldoProjetado>=0?'var(--ok)':'var(--bad)')+'">'+
      '<div class="lbl" style="margin-bottom:8px">Caixa — o que bate com o banco</div>'+
      '<div class="ln" style="grid-template-columns:1fr auto;grid-template-areas:none">'+
        '<span>Saldo em conta hoje</span><span class="n">'+moeda(cx.saldoHoje)+'</span></div>'+
      /* Mês futuro não começa com o saldo de hoje: começa com o que sobrar
         depois dos meses que vêm antes dele. */
      (Math.abs((cx.saldoAntes||0)-cx.saldoHoje)>0.005
        ? '<div class="ln" style="grid-template-columns:1fr auto;grid-template-areas:none">'+
          '<span>Este mês começa com<i class="sub">o que sobra dos meses até lá</i></span>'+
          '<span class="n '+((cx.saldoAntes||0)>=0?'pos':'neg')+'">'+
          moeda(cx.saldoAntes)+'</span></div>'
        : '')+
      '<div class="ln" style="grid-template-columns:1fr auto;grid-template-areas:none">'+
        '<span>'+setaMov('in')+'Ainda entra até o fim do mês</span>'+
        '<span class="n pos">'+moeda(cx.aReceber)+'</span></div>'+
      '<div class="ln" style="grid-template-columns:1fr auto;grid-template-areas:none">'+
        '<span>'+setaMov('out')+'Ainda sai até o fim do mês</span>'+
        '<span class="n neg">'+moeda(cx.aPagar)+'</span></div>'+
      (cx.fatura>0.005
        /* "Que cartao e esse?" - e a fatura de TODOS os cartoes que vence
           neste mes. Num mes futuro ela e estimativa: o que ja foi comprado
           nela mais a verba das contas do cartao ainda nao gasta. */

          'inclui a fatura de todos os cartões que vence neste mês · '+moeda(cx.fatura)+

          ((cx.faturaVerba||0)>0.005
            ? '<br>'+moeda(cx.faturaLancada||0)+' já comprados nela + '+moeda(cx.faturaVerba)+
              ' da verba das contas do cartão que ainda não foi gasta'
            : '')+'</div>'
        : '')+
      '<div style="border-top:1px solid var(--line);margin-top:8px;padding-top:9px">'+
        '<div class="lbl">Saldo projetado no fim do mês</div>'+
        '<div class="big '+(cx.saldoProjetado>=0?'pos':'neg')+'">'+
          moeda(cx.saldoProjetado)+'</div></div>'+
      blocoConferencia(cx);
    if(cx.itens && cx.itens.length){
      h+='<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:8px">'+
         '<div class="lbl" style="cursor:pointer" onclick="ST.abreCaixa=!ST.abreCaixa;renderMes()">'+
         '<span class="seta'+(ST.abreCaixa?' aberta':'')+'">&#9656;</span> '+
         'de onde vêm estes valores ('+cx.itens.length+' contas)</div>';
      if(ST.abreCaixa){
        h+='<div class="m" style="font-size:11px;margin:4px 0 6px">marque o que já '+
           'resolveu ou não vai acontecer — sai da conta na hora</div>';
        cx.itens.forEach(function(x,n){
          h+='<label class="lc">'+
             '<input type="checkbox" onchange="'+(x.fatura ? 'baixarFatura(this)'
               : 'baixarPrevisto('+JSON.stringify(x.categoria).replace(/"/g,'&quot;')+',this)')+'">'+

             '<span class="n '+(x.natureza==='RECEITA'?'pos':'neg')+'">'+
             (x.natureza==='RECEITA'?'+':'-')+moeda(x.falta)+'</span></label>';

  }

  if(ST.saldos && ST.saldos.contas.length){
    var s=ST.saldos;
    h+='<div class="card"><div class="row" style="cursor:pointer" onclick="ST.abreSaldos=!ST.abreSaldos;renderMes()">'+
       '<div class="lbl"><span class="seta'+(ST.abreSaldos?' aberta':'')+'">&#9656;</span> '+
       'Saldo em conta hoje</div>'+
       '<div class="num '+((s.totalPF+s.totalPJ)>=0?'pos':'neg')+'" style="font-weight:700">'+
       moeda(s.totalPF+s.totalPJ)+'</div></div>';
    if(ST.abreSaldos){
      h+='<div style="margin-top:8px">';
      // conta de investimento nao entra aqui: ela aparece no Patrimonio, e o
      // total desta lista e o que da para gastar
      // dois blocos (PJ e PF), cada um em ordem de banco: as contas do mesmo
      // banco ficam juntas
      var banco=function(x){ return String(x.instituicao||x.conta||'').trim().split(/\s+/)[0].toUpperCase(); };
      var blocos=[['PJ','Pessoa jurídica (PJ)',s.totalPJ],['PF','Pessoa física (PF)',s.totalPF]];
      blocos.forEach(function(bl){
       var doBloco=s.contas.filter(function(x){ return x.titular===bl[0]; })
         .sort(function(a,b){ return banco(a).localeCompare(banco(b),'pt-BR') || String(a.conta).localeCompare(String(b.conta),'pt-BR'); });
       if(!doBloco.length) return;

       doBloco.forEach(function(x){
        // A data do saldo informado e o divisor de aguas: o que e anterior a
        // ela ja esta dentro do numero que voce digitou, e por isso mexer num
        // lancamento velho muda a ABERTURA do mes, nunca o saldo de hoje.
        var dq = x.desdeMs ? new Date(x.desdeMs) : null;

      (cxOk && cx.comecou!==null
        ? '<div class="m" style="font-size:11.5px;margin-top:4px">começou com '+moeda(cx.comecou)+

  // despesas: tudo aberto, uma linha por conta, filtrado pela familia do cabecalho
  var lista=[];

    g.itens.forEach(function(d){ lista.push(d); });

  // agrupadas por familia, e dentro dela em ordem alfabetica
  lista.sort(function(a,b){

       '</span></div>';
  });
  ST.linhasMes=lista;
  h+=linhaMais('DESPESA')+
     '<div class="m" style="font-size:11px;margin-top:8px">o previsto é editável direto na linha · '+
     'contas sem movimento no mês ficam ocultas</div></div>';

  var rec=r.receitas.filter(function(d){return d.realizado>0||d.previsto>0;});
  if(rec.length && ST.familia==='TUDO'){
    h+='<div class="card"><div class="lbl" style="margin-bottom:8px">Entradas</div>'+
       '<div class="cab-ln"><span>conta</span><span>previsto</span><span>realizado</span><span>diferença</span></div>'+

    // o previsto da entrada tambem e editavel: antes so a despesa era, e nao

    var base=lista.length;
    rec.forEach(function(d,k){
      var j=base+k;
      h+='<div class="ln tab"><div class="nm">'+ponto('RECEITA')+'<span>'+tx(d.categoria)+'</span></div>'+
         '<input id="pv'+j+'" value="'+(d.previsto>0.005?num(d.previsto):'')+'" '+
           'placeholder="0,00"'+(Number(d.padrao)>0.005&&d.previsto<=0.005?' title="sem previsto neste mês (o padrão da conta é '+num(d.padrao)+')"':'')+' inputmode="decimal" '+
           'onfocus="this.select()" onblur="salvarPrevisto('+j+')" '+
           'onkeydown="if(event.key===\'Enter\')this.blur()">'+
         '<span class="n">'+moeda(d.realizado)+'</span>'+
         '<span class="n dif '+(d.saldo<0?'neg':'pos')+'">'+moeda(d.saldo)+

      ST.linhasMes.push(d);

    h+=linhaMais('RECEITA')+'</div>';
  }

  if(false){
    r.controle.forEach(function(d){
      h+='<div class="card" style="border-style:dashed">'+
         '<div class="row"><div><div class="lbl">'+tx(d.categoria)+'</div>'+
         '<div style="font-size:19px;font-weight:600">'+moeda(d.realizado)+'</div></div>'+
         '<div style="text-align:right"><div class="lbl">meta</div>'+
         '<div style="font-size:15px;color:var(--dim)">'+moeda(d.previsto)+'</div></div></div>'+
         '<div class="m" style="font-size:11.5px;margin-top:6px">não soma no total: cada compra '+
         'do cartão já está na sua conta acima</div></div>';

  }
  c.innerHTML=h;

/* O botao no fim da linha do mes:
   - com previsto: X, tira a conta do mes;
   - sem previsto mas COM valor cadastrado: ↻, devolve aquele valor;
   - sem previsto e sem cadastro: X, que oferece apagar a conta de vez.
   Antes o ↻ aparecia sempre que o previsto era zero - inclusive numa conta
   recém-criada, onde nao havia nada para devolver, e o toque nao fazia nada. */
/* Um ícone só, com um significado só.
   Antes havia dois - × e ↻ - e qual deles aparecia dependia de um dado que
   nao esta na tela (o previsto cadastrado da conta). Duas linhas iguais
   ganhavam botoes diferentes, e nao havia como adivinhar por que.

   Agora: tem previsto, o × tira do mes. Nao tem previsto mas teve gasto, nao
   ha botao nenhum - a despesa aconteceu, nao ha o que tirar; o valor
   cadastrado vira a sugestao dentro do campo. Nao tem nem um nem outro, a
   conta nao serve para nada neste mes e o × oferece apaga-la. */
/* A verba do cartao pagando por uma conta que nao tinha previsto - e o que
   sobrou dela quando a fatura ja fechou. Sem esta linha o previsto aparecia
   do nada e voce nao sabia de onde tinha vindo. */
function notaDaVerba(d){
  // um selo em vez de frase: 💳 = o previsto veio da verba do cartão
  var nota='';
  if(d.daVerba>0.005)
    nota='<span class="chip-verba" title="o previsto veio da verba do cartão">💳 '+num(d.daVerba)+'</span>';
  else if(d.distribuido>0.005)
    nota='<span class="chip-verba" title="já distribuído nas contas que gastaram">💳 ➜ '+num(d.distribuido)+'</span>';
  if(!nota) return '';
  return '<div style="margin:-4px 0 7px 20px">'+nota+'</div>';
}

function botaoLinhaMes(d){
  var cat = JSON.stringify(d.categoria).replace(/"/g,'&quot;');
  // Previsto que veio da verba nao existe na planilha - nao ha o que tirar
  // do mes, e o x tentaria apagar uma linha que nunca foi gravada.
  if(d.daVerba>0.005) return '<span class="bt-x vazio2"></span>';
  if(d.previsto>0.005)
    return '<button class="bt-x" title="tirar do mês" onclick="removerDoMes('+cat+
           ')">&times;</button>';
  if(Math.abs(d.realizado)>0.005) return '<span class="bt-x vazio2"></span>';
  return '<button class="bt-x" title="apagar esta conta" onclick="apagarDoMes('+cat+
         ')">&times;</button>';
}

/* Conta sem previsto nenhum e sem valor cadastrado: tirar do mes nao faz
   nada (ja esta zerada), entao o X oferece o que realmente resolve. */
function apagarDoMes(cat){
  if(!confirm('"'+cat+'" não tem previsto neste mês nem valor cadastrado.\n\n'+
              'Apagar esta conta de vez?')) return;
  toast('Apagando...');
  google.script.run.withSuccessHandler(function(r){
    if(r && r.ok){ toast('Conta apagada'); ST.cacheMes={}; ST.extras=null; ST.ano=null; carregar(ST.mes); return; }
    if(r && r.precisaDestino){
      toast(r.lancamentos+' lançamentos nessa conta — apague pela aba Config');
      return;
    }
    toast((r&&r.erro)||'Não consegui');
  }).withFailureHandler(function(e){ toast('Falhou: '+((e&&e.message)||e)); })
    .apiApagarConta(cat, '');
}

/* O saldo das contas ligadas ao banco é o do banco. O que foi lançado à mão
   nelas e o banco não mostrou (ou mostrou e foi lançado de novo) aparece aqui
   para a pessoa resolver - antes o app decidia sozinho, pela data, e o saldo
   projetado mudava de um dia para o outro sem nada ter acontecido. */
function blocoConferencia(cx){
  var lista=cx.conferir||[], sc=cx.semConta||{qtd:0};
  if(!lista.length && !sc.qtd) return '';
  var h='<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:9px">'+
        '<div class="lbl" style="color:#f59e0b">⚠ Conferir com o banco</div>';
  if(sc.qtd){
    h+='<div class="m" style="font-size:12px;margin:6px 0">'+sc.qtd+(sc.qtd>1?' saídas':' saída')+' do banco sem classificação ('+moeda(sc.valor)+
       '): o dinheiro já saiu da conta, mas o previsto que ela paga ainda conta em "ainda sai". Classifique para a projeção acertar.</div>';
  }
  lista.forEach(function(x){
    var dt=String(x.data).slice(8,10)+'/'+String(x.data).slice(5,7);
    var txt=x.situacao==='repetido'
      ? 'Lançado duas vezes? O banco já trouxe '+moeda(x.valor)+' em '+String(x.banco_data).slice(8,10)+'/'+String(x.banco_data).slice(5,7)+
        ' ('+tx(String(x.banco_descricao||'').slice(0,40))+') e você lançou à mão em '+dt+'.'
      : 'O extrato do '+tx(x.conta)+' não tem '+moeda(x.valor)+' em '+dt+' ('+tx(String(x.descricao||'').slice(0,40))+
        '). Ele conta como '+(x.natureza==='RECEITA'?'entrada':'saída')+' até você resolver. Saiu de outra conta? Edite no extrato.';
    h+='<div class="m" style="font-size:12px;margin:8px 0 4px">'+txt+'</div><div style="display:flex;gap:6px;flex-wrap:wrap">'+
       '<button class="bt sec" style="padding:5px 10px;font-size:12px" onclick="conferirBanco(\'apagar\',\''+x.id+'\',this)">'+
         (x.situacao==='repetido'?'Apagar o meu':'Não existiu, apagar')+'</button>'+
       '<button class="bt sec" style="padding:5px 10px;font-size:12px" onclick="conferirBanco(\''+(x.situacao==='repetido'?'diferente':'manter')+'\',\''+x.id+'\',this)">'+
         (x.situacao==='repetido'?'São diferentes':'Está certo, manter')+'</button></div>';
  });
  return h+'</div>';
}

    carregar(ST.mes);

function salvarPrevisto(i){
  var d=ST.linhasMes[i], inp=el('pv'+i);
  if(!d||!inp) return;
  var v=parseFloat(String(inp.value).replace(/\./g,'').replace(',','.'));
  if(isNaN(v) || Math.abs(v-d.previsto)<0.005){
    inp.value=num(d.previsto); return;
  }
  inp.style.borderColor='#f59e0b';
  google.script.run.withSuccessHandler(function(r){
    // Antes o app mostrava o valor novo mesmo quando o servidor recusava:
    // a conta renomeada nao tinha linha na FC e o previsto voltava sozinho
    // no proximo refresh, sem ninguem entender por que.
    if(!r || !r.ok){
      inp.style.borderColor='#ef4444';
      inp.value=num(d.previsto);
      toast((r&&r.erro) || 'Não consegui salvar esse previsto');
      return;
    }
    inp.style.borderColor='';
    d.previsto = (r.valor!==undefined) ? r.valor : v;
    inp.value = num(d.previsto);
    toast(d.categoria.split(' - ').pop()+': '+moeda(d.previsto));
    ST.cacheMes={}; ST.extras=null; ST.ano=null;
    oferecerReplicar(d.categoria, d.previsto);
  }).withFailureHandler(function(){
    inp.style.borderColor='#ef4444'; inp.value=num(d.previsto);
    toast('Não consegui salvar');
  }).apiSalvarPrevisto(ST.mes, d.categoria, v);
}

/* Depois de mudar o previsto de um mes, pergunta se vale para os proximos.
   So oferece os meses que JA TEM valor nessa conta: IPVA, seguro e IPTU nao
   caem todo mes, e repetir em todos inventaria despesa onde nao existe. */
function oferecerReplicar(categoria, valor){
  google.script.run.withSuccessHandler(function(r){
    if(!r || !r.ok || !r.meses || !r.meses.length){ atualizarPorTras(); return; }
    var m=r.meses;
    var iguais = m.filter(function(x){ return Math.abs(x.valor-valor)<0.005; }).length;
    if(iguais===m.length){ atualizarPorTras(); return; }   // ja estao todos assim
    var nomes = m.map(function(x){ return NOMES_MES[x.mes].substring(0,3); }).join(', ');
    if(!confirm('Aplicar '+moeda(valor)+' também nos outros meses que têm '+
                categoria.split(' - ').pop()+'?\n\n'+
                m.length+' '+(m.length>1?'meses':'mês')+': '+nomes+
                '\n\nOs meses em que esta conta não cai ficam como estão.')){
      atualizarPorTras(); return;
    }
    var linhas = m.map(function(x){ return { mes:x.ref, categoria:categoria, valor:valor }; });
    google.script.run.withSuccessHandler(function(rr){
      toast(rr && rr.ok ? 'Aplicado em '+rr.quantos+' meses' : 'Não consegui');
      ST.cacheMes={}; ST.extras=null; ST.ano=null; atualizarPorTras();
    }).withFailureHandler(function(){ toast('Falhou'); })
      .apiSalvarPrevistoEmVarios(linhas);
  }).withFailureHandler(function(){ atualizarPorTras(); })
    .apiMesesComPrevisto(ST.mes, categoria, 1);
}

/* A barra do cartao com o traço branco de "onde eu deveria estar hoje".
   Sem a marca, a barra so diz quanto falta para o teto do mes - e no dia 10
   estar com 40%% pode ser folga ou pode ser estouro, depende do ritmo. */
function barraComMarca(real, meta, marca){
  if(!(meta>0)) return barra(real, meta);
  var p=Math.min(100, real/meta*100);
  var m=Math.min(100, Math.max(0, (marca||0)/meta*100));
  var cor = real>(marca||0) ? 'var(--bad)' : 'var(--ok)';
  return '<div class="bar" style="position:relative;overflow:visible">'+
    '<i style="width:'+p.toFixed(1)+'%;background:'+cor+'"></i>'+
    '<b style="position:absolute;left:'+m.toFixed(1)+'%;top:-4px;bottom:-4px;width:3px;'+
      'background:#fff;border-radius:2px;box-shadow:0 0 0 1px #0008"></b></div>';
}

function pct(a,b){ return b>0 ? Math.round(a/b*100) : 0; }
function barra(real,prev){
  var p=Math.min(100,pct(real,prev));
  var cor = p>100?'var(--bad)':(p>85?'var(--warn)':'var(--ok)');
  return '<div class="bar"><i style="width:'+p+'%;background:'+cor+'"></i></div>';
}

/* Busca o plano calado, sem mexer em tela nenhuma. */
/* ============================== PLANO ==============================
   Estratégia, e só. Uma pergunta: quanto eu preciso guardar por mês para
   chegar no alvo — já com o apartamento valorizando, o carro desvalorizando
   e os juros compostos sobre o que for guardado. */

/* Busca de uma vez o que as outras telas vao pedir: os dois extratos, o
   plano e as metas. Medido por dentro, montar cada uma custa menos de 100ms
   - o que custa segundos e a viagem ate o Apps Script. Uma viagem, em
   segundo plano, e depois disso trocar de tela nao espera por nada. */
function adiantarExtras(){
  if(ST.buscandoExtras) return;
  if(ST.extras && ST.extras.mes===ST.mes) return;
  ST.buscandoExtras=true;
  var pedido=ST.mes;
  google.script.run.withSuccessHandler(function(x){
    ST.buscandoExtras=false;
    if(!x || !x.ok || x.mes!==pedido) return;
    ST.extras=x;
    if(!ST.plano) ST.plano=x.plano;
    if(!ST.metas) ST.metas=x.metas;
    if(ST.telaAtual==='analise'){
      if(ST.modoAnalise==='PLANO') renderPlano();
      if(ST.modoAnalise==='METAS') renderMetas();
    }
    if(ST.telaAtual==='extrato' && !ST.extrato) renderExtrato();
  }).withFailureHandler(function(){ ST.buscandoExtras=false; })
    .apiExtras(pedido, ST.filtro||'TUDO');
}

/* O extrato adiantado so serve para a lista limpa: com busca ou filtro de
   familia, a pergunta e outra e tem que ir ao servidor. */
function extratoAdiantado(){
  var x=ST.extras;
  if(!x || ST.busca) return null;
  if(ST.modoEx==='CARTAO'){
    if((ST.cartaoSel||'TUDO')!=='TUDO') return null;
    return (x.mesCartao===ST.mes) ? x.extratoCartao : null;
  }
  if((ST.filtro||'TUDO')!==(x.filtro||'TUDO')) return null;
  return (x.mes===ST.mes) ? x.extratoConta : null;
}

function carregarPlano(){
  if(!ST.plano && ST.extras && ST.extras.mes===ST.mes) ST.plano=ST.extras.plano;
  if(ST.plano){ renderPlano(); return; }
  el('tela-plano').innerHTML=abasAnalise()+'<div class="load">Montando o plano...</div>';
  google.script.run.withSuccessHandler(function(p){
    ST.plano=p; renderPlano();
  }).withFailureHandler(function(e){
    el('tela-plano').innerHTML=abasAnalise()+'<div class="vazio">Não consegui.<br>'+
      ((e&&e.message)||e)+'</div>';
  }).apiPlanoSimples();
}

function renderPlano(){
  var p=ST.plano, c=el('tela-plano');

  if(!p.ok){ c.innerHTML=abasAnalise()+'<div class="vazio">'+(p.erro||'')+'</div>'; return; }
  var h=abasAnalise();

  // ---------- onde você está (com plano definido, vai para "ver o plano") ----------
  if(!p.alvo || ST.trocandoAlvo) h+='<div class="card">'+
    '<div class="lbl">Patrimônio líquido hoje</div>'+
    '<div class="big" style="font-size:27px">'+moeda(p.hoje.liquido)+'</div>'+
    '<div class="m" style="font-size:11.5px;margin-top:5px">bens '+mil(p.hoje.bens)+
    ' + caixa '+mil(p.hoje.caixa)+' − dívidas '+mil(p.hoje.dividas)+'</div>'+
    '<div class="m" style="font-size:11.5px;margin-top:6px;color:var(--txt)">'+
    'Sem guardar mais nada, isso vira <b>'+mil(p.semAporte.liquido)+'</b> aos '+
    p.semAporte.idade+' anos — o apartamento valorizando e o financiamento acabando.'+
    '</div></div>';

  // ---------- o alvo ----------
  if(!p.alvo || ST.trocandoAlvo){
    h+='<div class="lbl" style="margin:14px 0 6px">Quanto você quer ter</div>';
    h+='<div class="card">'+
      '<div class="row" style="gap:8px">'+
        '<input id="alvoV" inputmode="decimal" placeholder="2.500.000,00" style="flex:2;margin:0" '+
          'oninput="mascaraMoeda(this)">'+
        '<div style="flex:1">'+
          botaoEscolha('alvoA', String(p.anoFinal), 'ano…', 'ano',
            p.anosDisponiveis.map(function(a){
              return { valor:String(a), rotulo:String(a), grupo:'ANO' }; }), '')+
        '</div></div>'+
      '<button class="bt-ac" style="width:100%;margin-top:9px" onclick="calcularAlvo()">'+
      'Quanto preciso guardar?</button>'+
      '<div id="alvoSaida"></div></div>';

    h+='<div class="lbl" style="margin:14px 0 6px">Ou comece por um destes</div>';
    if(!p.sugestoes.length){
      h+='<div class="card"><div class="m" style="font-size:12px">Nem com todos os cortes '+
         'sugeridos sobra dinheiro para guardar. Comece pelas alternativas abaixo — cada '+
         'uma que você fizer abre espaço para um plano.</div></div>';
    }
    p.sugestoes.forEach(function(x,i){
      h+='<div class="card" style="padding:11px 12px">'+
        '<div class="row"><div class="d" style="font-size:14px">'+tx(x.nome)+'</div>'+
        '<div class="n pos" style="font-weight:700;font-size:17px">'+mil(x.aporte)+
          '<i style="display:block;font-size:9px;color:var(--dim);font-style:normal;'+
          'font-weight:400">por mês</i></div></div>'+
        '<div class="m" style="font-size:11.5px;margin-top:4px">'+x.como+'</div>'+
        '<div class="m" style="font-size:12px;margin-top:4px;color:var(--txt)">'+
          'chega a <b>'+mil(x.patrimonio)+'</b> aos '+(window.EASYAPP_IDADE_META||60)+'</div>'+
        '<button class="bt-ok" style="width:100%;margin-top:9px" onclick="usarSugestao('+i+')">'+
        'Seguir este</button></div>';
    });
    h+=blocoDiagnostico(p, 0);
    if(p.alvo){
      h+='<button class="bt-no" style="width:100%;margin:10px 0 20px" '+
         'onclick="ST.trocandoAlvo=false;renderPlano()">Cancelar</button>';
    }
    c.innerHTML=h; return;
  }

  // ---------- o plano definido ----------
  // O que importa no dia a dia vem primeiro: como fecha ESTE mês, quanto
  // falta e onde cortar. A reta até a meta fica recolhida embaixo.
  h+=blocoDoMes(p.doMes);
  h+=graficoEvolucao(p);

  var cor = p.viavel ? 'var(--ok)' : 'var(--warn)';
  h+='<div class="card" style="border-left:3px solid '+cor+'">'+
    '<div class="row"><div class="lbl">O plano: guardar por mês</div>'+
      (p.alvo.nome?'<span class="pill">'+p.alvo.nome+'</span>':'')+'</div>'+
    '<div class="big" style="font-size:28px">'+moeda(p.aporteMes)+'</div>'+
    '<div class="m" style="font-size:11.5px;margin-top:4px">para chegar a '+mil(p.alvo.alvo)+
      ' em '+p.alvo.ano+'. Na média dos próximos '+p.capacidade.meses+' meses sobram '+
      mil(p.capacidade.mes)+' por mês.</div>'+
    '<details style="margin-top:8px"><summary class="m" style="font-size:12px;cursor:pointer">'+
      'ver o plano até '+p.alvo.ano+'</summary>'+
    '<div class="m" style="font-size:12px;margin-top:8px">patrimônio líquido hoje <b>'+
      mil(p.hoje.liquido)+'</b> (bens '+mil(p.hoje.bens)+' + caixa '+mil(p.hoje.caixa)+
      ' − dívidas '+mil(p.hoje.dividas)+')</div>'+
    (p.chegada?'<div class="m" style="font-size:12px;margin-top:4px">em '+p.chegada.ano+', aos '+
      p.chegada.idade+' anos: <b>'+mil(p.chegada.liquido)+'</b>'+
      (p.chegada.renda?' · renda de '+mil(p.chegada.renda)+' por mês':'')+'</div>':'');
  if(p.composicao && p.composicao.length){
    var G='grid-template-columns:44px 1fr 1fr 1fr 1.02fr';
    h+='<div class="cab-ln fica proj" style="'+G+';margin-top:8px">'+
        '<span style="text-align:left">ano</span><span>dinheiro</span><span>imóvel</span>'+
        '<span>carro</span><span>total</span></div>'+
      p.composicao.map(function(x){
        return '<div class="ln proj" style="'+G+'">'+
          '<span style="font-size:11.5px;color:var(--dim)">'+x.ano+'</span>'+
          '<span class="n pos">'+seco(x.investido)+'</span>'+
          '<span class="n">'+seco(x.imovel)+'</span>'+
          '<span class="n">'+seco(x.carro)+'</span>'+
          '<span class="n" style="font-weight:600">'+seco(x.liquido)+'</span></div>';
      }).join('');
  }
  h+='</details>'+
    '<button class="bt-no" style="width:100%;margin-top:10px" '+
      'onclick="ST.trocandoAlvo=true;renderPlano()">Mudar o alvo</button></div>';

  h+='<div style="height:20px"></div>';
  c.innerHTML=h;
}

/* O plano DESTE mês. O "guardar por mês" lá de cima é a média dos próximos
   meses - uma reta. Cada mês é uma história: aqui está quanto ele fecha de
   verdade, a meta dele (o aporte + o que ficou para trás, reprogramado) e,
   conta a conta, quanto mirar no que ainda não foi gasto para chegar lá.
   O que nem os cortes cobrem não some: volta como atraso no mês seguinte. */
function blocoDoMes(m){
  if(!m) return '';
  var nomeMes=NOMES_MES[Number(m.mes.split('-')[1])];
  /* Dois números diferentes, cada um com o seu nome:
     - "fim do mês" é o dinheiro em conta no último dia: o MESMO da tela Mês;
     - "resultado" é o que o mês entrega (entra - sai), e é ele que paga a
       reserva. Antes os dois se chamavam "saldo" e não batiam entre telas. */
  var falta=n2(m.meta-m.sobra);                  // quanto o resultado não cobre da reserva
  /* Lê-se de cima para baixo: hoje na conta + ainda entra - ainda sai = fim
     do mês. Depois a meta: para guardar a reserva o mês precisa terminar com
     o que começou + a reserva. A diferença é o tamanho do buraco. */
  var cv=m.curva||{}, inicio=n2((m.saldoFim||0)-(m.sobra||0));
  var hojeS = cv.saldoHoje!==undefined ? cv.saldoHoje : inicio;
  var entraR = cv.aindaEntra!==undefined ? cv.aindaEntra : m.receita;
  var saiR = cv.aindaSai!==undefined ? cv.aindaSai : m.despesa;
  var precisa = n2(inicio + m.meta);
  var h='<div class="lbl" style="margin:2px 0 6px">'+nomeMes+'</div>'+
    '<div class="mini" style="grid-template-columns:repeat(2,1fr)">'+
      miniCard('hoje', num(hojeS), hojeS>=0?'':'neg')+
      miniCard('fim do mês', num(m.saldoFim), m.saldoFim>=0?'pos':'neg')+
      miniCard('ainda entra', '+'+num(entraR), 'pos')+
      miniCard('ainda sai', '−'+num(saiR), 'neg')+
    '</div>'+
    '<div class="card" style="border-left:3px solid '+(falta>0?'var(--bad)':'var(--ok)')+'">'+
      '<div class="row"><div><div class="lbl">🐷 Meta do mês</div>'+
        '<div style="font-size:19px;font-weight:700">guardar '+num(m.meta)+'</div></div>'+
      '<div style="text-align:right"><div class="lbl">'+(falta>0?'🎯 Buraco':'✓ Sobra')+'</div>'+
        '<div style="font-size:22px;font-weight:800" class="'+(falta>0?'neg':'pos')+'">'+num(Math.abs(falta))+'</div></div></div>'+
      /* A conta por extenso: guardar é o mês ENTREGAR dinheiro novo (entra − sai),
         não só terminar com a meta na conta. Quem terminar com 2.150 tendo
         começado com 1.467 guardou 683, não 2.150. */
      '<div class="m" style="font-size:11.5px;margin-top:6px;line-height:1.5">'+
        'começou com '+num(inicio)+' → projeção '+'<b class="'+(m.saldoFim>=0?'pos':'neg')+'">'+num(m.saldoFim)+'</b>: '+
        (m.sobra<0 ? 'o mês gasta <b class="neg">'+num(-m.sobra)+'</b> a mais do que entra'
                   : 'o mês entrega <b class="pos">'+num(m.sobra)+'</b> (entra − sai)')+'.<br>'+
        'Guardar '+num(m.meta)+' é o mês entregar +'+num(m.meta)+', ou seja, terminar com <b>'+num(precisa)+'</b>.'+
        (falta>0 ? '<br>Buraco = '+(m.sobra<0 ? num(-m.sobra)+' (o que o mês consome) + ' : '')+num(m.meta)+' (a meta)'+
                   (m.sobra>0 ? ' − '+num(m.sobra)+' (o que o mês já entrega)' : '')+' = <b class="neg">'+num(falta)+'</b>.' : '')+
        (falta>0 && m.saldoFim<m.meta ? '<br><span style="color:var(--dim)">Só para ter '+num(m.meta)+' na conta no fim do mês faltariam '+
           num(n2(m.meta-m.saldoFim))+' — mas aí parte da "reserva" seria o dinheiro que já estava lá no dia 1.</span>' : '')+
      '</div>'+
    '</div>';

  var contas=(m.contas||[]).filter(function(x){ return x.economia>0; });
  if(falta>0 && contas.length){
    h+='<div class="lbl" style="margin:4px 0 6px">Ações deste mês</div>'+
       '<div class="card" style="padding:4px 12px">';
    contas.forEach(function(x){
      h+='<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)">'+
        '<div style="min-width:0"><div style="font-size:13px;white-space:nowrap;overflow:hidden;'+
          'text-overflow:ellipsis">'+tx(x.conta)+'</div>'+
          '<div class="m" style="font-size:11.5px">'+num(x.previsto)+' → <b style="color:var(--txt)">'+
          num(x.meta)+'</b> · '+num(x.porDia)+'/dia</div></div>'+
        '<div class="n pos" style="font-weight:700;white-space:nowrap">−'+num(x.economia)+'</div></div>';
    });
    var resta=n2(falta-m.economia);
    h+='<div class="row" style="padding:9px 0 6px;font-size:13px">'+
       (resta>0
         ? '<span>com as ações, ainda falta</span><b class="neg">'+num(resta)+'</b>'
         : '<span>com as ações, a reserva fecha</span><b class="pos">'+num(-resta)+'</b>')+'</div>'+
       (resta>0?'<div class="m" style="font-size:11px;padding-bottom:6px">'+num(resta)+
         ' vão para os próximos meses</div>':'')+
       '</div>';
  }
  return h;
}
function n2(v){ return Math.round((Number(v)||0)*100)/100; }

/* O saldo da conta ao longo do mês, como o "ritmo" do cartão: a linha cheia
   é o que já aconteceu, dia a dia; a tracejada vai de hoje até onde o mês
   termina pela projeção. Lê-se de relance: subindo ou descendo, acima ou
   abaixo do zero. */
function curvaDoMes(cv){
  var W=320, H=175, L=8, R=8, T=24, B=22, dias=cv.dias||30, pts=cv.real||[];
  var hoje=Math.min(dias, pts.length), atual=pts.length?pts[pts.length-1]:cv.inicio;
  var vals=pts.concat([cv.inicio, cv.fim, 0]);
  var mx=Math.max.apply(null,vals), mn=Math.min.apply(null,vals), folga=(mx-mn)*0.08||1;
  mx+=folga; mn-=folga;
  var X=function(d){ return L+(d-1)/((dias-1)||1)*(W-L-R); };
  var Y=function(v){ return T+(mx-v)/((mx-mn)||1)*(H-T-B); };
  var real=pts.map(function(v,i){ return (i?'L':'M')+X(i+1).toFixed(1)+','+Y(v).toFixed(1); }).join(' ');
  var area=real+' L'+X(hoje).toFixed(1)+','+(H-B)+' L'+X(1).toFixed(1)+','+(H-B)+' Z';
  var corFim=cv.fim>=0?'#22c55e':'#ef4444';
  var k=function(v){ var a=Math.abs(v); return (v<0?'−':'')+(a>=1000?(a/1000).toFixed(1).replace('.',',')+'k':Math.round(a)); };
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block">'+
    '<defs><linearGradient id="gMes" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3b82f6" stop-opacity=".35"/>'+
    '<stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></linearGradient></defs>'+
    '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(0).toFixed(1)+'" y2="'+Y(0).toFixed(1)+'" stroke="#475569" stroke-dasharray="3 4"/>'+
    '<text x="'+(W-R)+'" y="'+(Y(0)-4).toFixed(1)+'" text-anchor="end" font-size="9.5" fill="#64748b">zero</text>'+
    (pts.length>1?'<path d="'+area+'" fill="url(#gMes)"/>':'')+
    '<path d="M'+X(hoje).toFixed(1)+','+Y(atual).toFixed(1)+' L'+X(dias).toFixed(1)+','+Y(cv.fim).toFixed(1)+
      '" fill="none" stroke="'+corFim+'" stroke-width="2.5" stroke-dasharray="5 5"/>'+
    (pts.length>1?'<path d="'+real+'" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linejoin="round"/>':'')+
    '<circle cx="'+X(1).toFixed(1)+'" cy="'+Y(pts.length?pts[0]:cv.inicio).toFixed(1)+'" r="3.5" fill="#3b82f6"/>'+
    '<circle cx="'+X(hoje).toFixed(1)+'" cy="'+Y(atual).toFixed(1)+'" r="5" fill="#3b82f6" stroke="#0f1420" stroke-width="2"/>'+
    '<text x="'+X(hoje).toFixed(1)+'" y="'+(Y(atual)-10).toFixed(1)+'" text-anchor="middle" font-size="11.5" font-weight="800" fill="#93c5fd">hoje '+k(atual)+'</text>'+
    '<circle cx="'+X(dias).toFixed(1)+'" cy="'+Y(cv.fim).toFixed(1)+'" r="5" fill="'+corFim+'" stroke="#0f1420" stroke-width="2"/>'+
    '<text x="'+(X(dias)-2).toFixed(1)+'" y="'+(Y(cv.fim)+(cv.fim<atual?18:-10)).toFixed(1)+'" text-anchor="end" font-size="11.5" font-weight="800" fill="'+corFim+'">fim '+k(cv.fim)+'</text>'+
    '<text x="'+L+'" y="'+(H-6)+'" font-size="10" fill="#8b99b5">dia 1</text>'+
    (hoje>4 && hoje<dias-4 ? '<text x="'+X(hoje).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10" fill="#8b99b5">dia '+hoje+'</text>' : '')+
    '<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" font-size="10" fill="#8b99b5">dia '+dias+'</text>'+
    '</svg>'+
    '<div class="m" style="font-size:10.5px;text-align:center">cheio = o que já aconteceu · tracejado = até o fim do mês</div>';
}

/* A "ponte" do mês: com quanto começou, o que entrou (verde, sobe), o que
   saiu (vermelho, desce) e com quanto termina. Sem o começo, entra - sai não
   batia com o fim do mês e a conta parecia não fechar. */
function pontePlano(ini, ent, sai, fim){
  var W=320, H=150, topo=22, base=H-30;
  var vs=[0, ini, ini+ent, fim];
  var mx=Math.max.apply(null,vs), mn=Math.min.apply(null,vs);
  var y=function(v){ return topo+(mx-v)/((mx-mn)||1)*(base-topo); };
  var k=function(v){ v=Math.abs(v); return v>=1000 ? (v/1000).toFixed(v>=100000?0:1).replace('.',',')+'k' : Math.round(v)+''; };
  var bw=46, gap=(W-4*bw)/5;
  var bs=[
    {r:'começou', de:0, ate:ini, cor:'#64748b', t:k(ini)},
    {r:'entrou', de:ini, ate:ini+ent, cor:'#22c55e', t:'+'+k(ent)},
    {r:'saiu', de:ini+ent, ate:fim, cor:'#ef4444', t:'−'+k(sai)},
    {r:'terminou', de:0, ate:fim, cor:fim>=0?'#3b82f6':'#ef4444', t:(fim<0?'−':'')+k(fim)}];
  var g='<line x1="0" x2="'+W+'" y1="'+y(0).toFixed(1)+'" y2="'+y(0).toFixed(1)+'" stroke="#334155" stroke-dasharray="3 4"/>';
  bs.forEach(function(b,i){
    var x=gap+i*(bw+gap), y1=y(Math.max(b.de,b.ate)), y2=y(Math.min(b.de,b.ate));
    var hh=Math.max(2,y2-y1);
    g+='<rect x="'+x.toFixed(1)+'" y="'+y1.toFixed(1)+'" width="'+bw+'" height="'+hh.toFixed(1)+'" rx="6" fill="'+b.cor+'"/>';
    g+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y1-6).toFixed(1)+'" text-anchor="middle" font-size="12" font-weight="800" fill="'+
       (i===1?'#22c55e':i===2?'#f87171':'#e8edf7')+'">'+b.t+'</text>';
    g+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="10.5" fill="#8b99b5">'+b.r+'</text>';
    if(i<3){
      var yl=y(b.ate), xn=x+bw;
      g+='<line x1="'+xn.toFixed(1)+'" x2="'+(xn+gap).toFixed(1)+'" y1="'+yl.toFixed(1)+'" y2="'+yl.toFixed(1)+'" stroke="#475569" stroke-dasharray="2 3"/>';
    }
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block">'+g+'</svg>';
}

/* Rumo à aposentadoria: a curva verde do patrimônio, como na página do app.
   "12 meses" é o caminho perto (o que dá para acompanhar mês a mês); "até
   o ano do alvo" é a viagem inteira. O app não guarda nada semanal - por isso
   não há visão por semana: seria inventar número. */
function graficoEvolucao(p){
  var comp=p.composicao||[];
  if(comp.length<2) return '';
  var modo=ST.evo||'anos', pts=[];
  var rit=p.ritmo||[], porAno={};
  rit.forEach(function(x){ if(x) porAno[x.ano]=x; });
  if(modo==='anos'){
    pts=comp.map(function(x){ return { r:String(x.ano), v:x.liquido, v2:x.investido, idade:x.idade,
                                       v3:(porAno[x.ano]||{}).liquido }; });
  } else {
    // entre um ano e outro, o caminho mês a mês (cada ano vale em junho)
    var hoje=new Date(), nomes=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    var em=function(t, campo){
      for(var i=0;i<comp.length-1;i++){
        var a=comp[i].ano+0.5, b=comp[i+1].ano+0.5;
        if(t<=b || i===comp.length-2){
          var f=Math.max(0,(t-a)/(b-a));
          return comp[i][campo]+(comp[i+1][campo]-comp[i][campo])*f;
        }
      }
      return comp[0][campo];
    };
    var emR=function(t){
      for(var i=0;i<rit.length-1;i++){
        if(!rit[i]||!rit[i+1]) continue;
        var a=rit[i].ano+0.5, b=rit[i+1].ano+0.5;
        if(t<=b || i===rit.length-2){ var f=Math.max(0,(t-a)/(b-a)); return rit[i].liquido+(rit[i+1].liquido-rit[i].liquido)*f; }
      }
      return rit[0]?rit[0].liquido:undefined;
    };
    for(var m=0;m<=12;m++){
      var d=new Date(hoje.getFullYear(), hoje.getMonth()+m, 1);
      var t=d.getFullYear()+(d.getMonth()+0.5)/12;
      pts.push({ r:nomes[d.getMonth()]+(d.getMonth()===0||m===0?'/'+String(d.getFullYear()).slice(2):''),
                 v:em(t,'liquido'), v2:em(t,'investido'), v3:emR(t) });
    }
  }
  var W=320, H=170, L=6, R=6, T=26, B=24;
  // na visão de 12 meses a escala acompanha só o patrimônio (a partir do zero
  // a subida de um ano quase não aparecia) e a linha do investido sai
  var perto=(modo==='meses');
  var temR=pts.some(function(x){return x.v3!==undefined && x.v3!==null;});
  var vals=pts.map(function(x){return x.v;}).concat(perto?[]:pts.map(function(x){return x.v2;}))
    .concat(temR?pts.map(function(x){return x.v3||0;}):[]);
  var mx=Math.max.apply(null,vals), mn=perto ? Math.min.apply(null,vals) : Math.min(0, Math.min.apply(null,vals));
  if(perto){ var folga=(mx-mn)*0.25||mx*0.02; mn-=folga; mx+=folga*0.4; }
  var X=function(i){ return L+i*(W-L-R)/(pts.length-1); };
  var Y=function(v){ return T+(mx-v)/((mx-mn)||1)*(H-T-B); };
  var linha=pts.map(function(x,i){ return (i?'L':'M')+X(i).toFixed(1)+','+Y(x.v).toFixed(1); }).join(' ');
  var linha2=pts.map(function(x,i){ return (i?'L':'M')+X(i).toFixed(1)+','+Y(x.v2).toFixed(1); }).join(' ');
  var area=linha+' L'+X(pts.length-1).toFixed(1)+','+(H-B)+' L'+X(0).toFixed(1)+','+(H-B)+' Z';
  var passo=Math.ceil(pts.length/6), rot='';
  pts.forEach(function(x,i){
    if(i%passo===0 || i===pts.length-1)
      rot+='<text x="'+X(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="'+(i===0?'start':i===pts.length-1?'end':'middle')+
           '" font-size="10" fill="#8b99b5">'+x.r+'</text>';
  });
  var ult=pts[pts.length-1], pri=pts[0];
  var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block">'+
    '<defs><linearGradient id="gEvo" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#22c55e" stop-opacity=".45"/>'+

        mil(ult.v3||0)+'</text>':'')+
    '<text x="'+(X(0)+6).toFixed(1)+'" y="'+(Y(pri.v)-8).toFixed(1)+'" font-size="10.5" font-weight="700" fill="#e8edf7">hoje '+mil(pri.v)+'</text>'+
    '<circle cx="'+X(0).toFixed(1)+'" cy="'+Y(pri.v).toFixed(1)+'" r="4" fill="#22c55e"/>'+
    '<circle cx="'+X(pts.length-1).toFixed(1)+'" cy="'+Y(ult.v).toFixed(1)+'" r="5" fill="#22c55e" stroke="#0f1420" stroke-width="2"/>'+

  if(modo==='anos' && p.chegadaRitmo) fimTxt+='<br>no ritmo de hoje: <b style="color:#f59e0b">'+mil(p.chegadaRitmo.liquido)+'</b> · '+
    'diferença <b>'+mil((p.chegada?p.chegada.liquido:0)-p.chegadaRitmo.liquido)+'</b>';
  return '<div class="card"><div class="row" style="margin-bottom:8px"><div class="lbl">🏁 Rumo à aposentadoria</div></div>'+
