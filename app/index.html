<script>window.EASYAPP_CFG = {"url": "https://nhngqhgxmrnqbcnklrwc.supabase.co", "anon": "sb_publishable_SGsAAryHXSZjAuBFSZoYfQ_3D37nUeN", "versao": "1.6.1 \u00b7 07/10/2026"};</script>
<script>/* Ponte: o app fala `google.script.run`, o Supabase responde.
 *
 * O Index.html tem 3.700 linhas e chama o servidor por
 * `google.script.run.withSuccessHandler(f).apiEstado(...)`. Em vez de
 * reescrever as 3.700 linhas, a gente troca o INTERLOCUTOR: este arquivo
 * define um `google.script.run` com a mesma cara, que por baixo faz consulta
 * REST no Postgres.
 *
 * Duas vantagens que valem o truque: a tela continua sendo a que voce ja
 * conhece (nada de "ficou diferente"), e dá para migrar uma funcao por vez -
 * o que ainda nao existe aqui grita na tela em vez de falhar calado.
 */
(function () {
  'use strict';

  var CFG = window.EASYAPP_CFG || {};
  var URL_BASE = CFG.url, ANON = CFG.anon;
  var sessao = null;   // { token, user_id }

  /* ------------------------------------------------------------ rede */
  /* Enquanto nao ha sessao, as chamadas ESPERAM em vez de falhar. O app
     dispara o primeiro carregar() antes de voce digitar a senha; sem isto,
     ele mostraria erro e so funcionaria no segundo refresh. */
  var esperando = [];
  function comSessao() {
    if (sessao) return Promise.resolve();
    return new Promise(function (r) { esperando.push(r); });
  }

  function rest(caminho, opcoes) {
    opcoes = opcoes || {};
    var h = {
      'apikey': ANON,
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + (sessao ? sessao.token : ANON)
    };
    if (opcoes.prefer) h['Prefer'] = opcoes.prefer;
    return comSessao().then(emDia).then(function () {
    h['Authorization'] = 'Bearer ' + (sessao ? sessao.token : ANON);
    return fetch(URL_BASE + caminho, {
      method: opcoes.metodo || 'GET', headers: h,
      body: opcoes.corpo ? JSON.stringify(opcoes.corpo) : undefined
    }).then(function (r) {
      return r.text().then(function (t) {
        if (r.ok) return t ? JSON.parse(t) : null;

        /* Dois 401 sao recuperaveis, e o app nao deve morrer por eles:
         *
         * PGRST303 "JWT issued at future" - o relogio do banco esta uma
         *   fracao de segundo atras do relogio de quem emitiu o token. O
         *   mesmo token funciona um instante depois; entao esperamos e
         *   tentamos de novo, uma vez.
         *
         * "JWT expired" - o token vale uma hora. Renovamos com o
         *   refresh_token e repetimos, sem pedir a senha de novo.
         */
        var recomecar = (opcoes.tentativa || 0) < 1;
        // A ORDEM importa: o PostgREST usa o mesmo PGRST303 para as duas
        // coisas, e "expirado" tem que ser testado ANTES. Testando o código
        // primeiro, um token vencido caía no ramo de esperar-e-repetir e
        // repetia com o mesmo token vencido - falhava sempre.
        if (r.status === 401 && recomecar && /expired/i.test(t)) {
          return renovar().then(function () {
            return rest(caminho, Object.assign({}, opcoes, { tentativa: 1 }));
          });
        }
        if (r.status === 401 && recomecar && t.indexOf('PGRST303') >= 0) {
          return new Promise(function (ok) { setTimeout(ok, 1200); })
            .then(function () {
              return rest(caminho, Object.assign({}, opcoes, { tentativa: 1 }));
            });
        }
        throw new Error(caminho + ' -> ' + r.status + ' ' + t.slice(0, 200));
      });
    });
    });
  }

  /* Sessao perdida nao e erro para mostrar na cara: e hora de pedir o login
     de novo. Some o token guardado e a tela de entrar reaparece. */
  function pedirLogin(motivo) {
    sessao = null;
    try { localStorage.removeItem('easyapp:sessao'); } catch (e) {}
    var caixa = document.getElementById('entrar');
    if (caixa) caixa.hidden = false;
    return Promise.reject(new Error(motivo || 'faça login de novo'));
  }

  /* Renovar o login, UMA vez só. Quando o token de 1 hora vence com a tela
     carregando, dezenas de consultas recebem 401 juntas; cada uma pedia a
     própria renovação - 32 no mesmo segundo em 05/10 - e o Supabase barrava
     algumas por excesso (429). O app lia isso como "sessão inválida" e
     pedia a senha. Agora as consultas esperam a mesma renovação, e só uma
     recusa DO LOGIN (refresh token inválido) leva à tela de entrar: rede
     fora, 429 ou servidor fora do ar não derrubam a sessão. */
  var renovando = null;
  function renovar() {
    if (renovando) return renovando;
    // outra aba / janela pode ter renovado antes: o refresh token gira a cada
    // renovação, e o guardado é o mais novo
    try {
      var g = JSON.parse(localStorage.getItem('easyapp:sessao') || 'null');
      if (g && g.refresh && sessao && g.user_id === sessao.user_id && g.refresh !== sessao.refresh) {
        sessao = g;
        if (g.expira && g.expira - Date.now() > 60e3) return Promise.resolve(sessao);
      }
    } catch (e) {}
    if (!sessao || !sessao.refresh) return pedirLogin('sessão expirada');
    var usado = sessao.refresh;
    renovando = fetch(URL_BASE + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'apikey': ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: usado })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (d.access_token) {
          sessao = { token: d.access_token, refresh: d.refresh_token, user_id: sessao.user_id,
                     expira: Date.now() + (Number(d.expires_in) || 3600) * 1000 };
          try { localStorage.setItem('easyapp:sessao', JSON.stringify(sessao)); } catch (e) {}
          return sessao;
        }
        // só o "esse refresh token não vale mais" pede a senha de novo
        if (r.status === 400 || r.status === 401 || r.status === 403) return pedirLogin('sessão expirada');
        throw new Error('não consegui renovar o login agora (' + r.status + '): tente de novo');
      });
    }).finally(function () { renovando = null; });
    return renovando;
  }
  // antes de cada consulta: faltando menos de 1 minuto, renova primeiro (uma
  // vez), em vez de deixar todas baterem no 401 juntas
  function emDia() {
    if (sessao && sessao.refresh && sessao.expira && sessao.expira - Date.now() < 60e3) {
      return renovar().catch(function () {});
    }
    return Promise.resolve();
  }

  function entrar(email, senha) {
    return fetch(URL_BASE + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'apikey': ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: senha })
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.access_token) throw new Error(traduzErro(d) || 'login falhou');
      return usarSessao(d);
    });
  }

  /* As mensagens do Supabase vêm em inglês; o cliente lê em português. */
  function traduzErro(d) {
    var m = String((d && (d.error_description || d.msg || d.message || d.error)) || '');
    var t = [
      [/invalid login credentials/i, 'e-mail ou senha não conferem'],
      [/email not confirmed/i, 'falta confirmar o e-mail: use o código que mandamos'],
      [/user already registered|already been registered/i, 'este e-mail já tem cadastro: entre ou use "esqueci minha senha"'],
      [/password should be at least (\d+)/i, 'a senha precisa de pelo menos $1 caracteres'],
      [/token has expired or is invalid|otp.*(expired|invalid)/i, 'código errado ou vencido: peça outro'],
      [/signups not allowed|signup.*disabled/i, 'o cadastro está fechado no momento'],
      [/error sending .*email|sending.*(confirmation|recovery)/i, 'não consegui mandar o e-mail agora: tente de novo mais tarde'],
      [/rate limit|security purposes/i, 'muitas tentativas: espere um minuto e tente de novo'],
      [/unable to validate email|invalid.*email/i, 'e-mail inválido'],
      [/same.*password|different from the old/i, 'a senha nova precisa ser diferente da antiga']
    ];
    for (var i = 0; i < t.length; i++) {
      if (t[i][0].test(m)) return t[i][1].replace('$1', (m.match(/at least (\d+)/i) || [])[1] || '6');
    }
    return m;
  }

  /* Chamada ao /auth/v1 do Supabase (cadastro, código, senha nova). */
  function auth(caminho, corpo, metodo, token) {
    var h = { 'apikey': ANON, 'Content-Type': 'application/json' };
    if (token) h['Authorization'] = 'Bearer ' + token;
    return fetch(URL_BASE + '/auth/v1/' + caminho, {
      method: metodo || 'POST', headers: h, body: JSON.stringify(corpo || {})
    }).then(function (r) {
      return r.text().then(function (t) {
        var d = {}; try { d = t ? JSON.parse(t) : {}; } catch (e) {}
        if (!r.ok) throw new Error(traduzErro(d) || ('erro ' + r.status));
        return d;
      });
    });
  }

  /* Uma resposta de login (senha, código, cadastro) vira a sessão do app. */
  function usarSessao(d) {
    sessao = { token: d.access_token, refresh: d.refresh_token, user_id: d.user.id,
               expira: Date.now() + (Number(d.expires_in) || 3600) * 1000 };
    try { localStorage.setItem('easyapp:sessao', JSON.stringify(sessao)); } catch (e) {}
    // solta a fila com uma folga: disparar no mesmo instante em que o
    // token nasce e o que expoe a diferenca de relogio entre os servicos
    setTimeout(function () { esperando.splice(0).forEach(function (f) { f(); }); }, 400);
    return sessao;
  }
  try {
    var guardada = JSON.parse(localStorage.getItem('easyapp:sessao') || 'null');
    if (guardada && guardada.token) sessao = guardada;
  } catch (e) {}

  /* ------------------------------------------------------- utilidades */
  function n(v) { return Math.round((Number(v) || 0) * 100) / 100; }
  function diasNoMes(ref) {
    var p = ref.split('-');
    return new Date(Number(p[0]), Number(p[1]), 0).getDate();
  }
  function hojeRef() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
  }
  function diaDeHoje(ref) {
    return ref === hojeRef() ? new Date().getDate() : diasNoMes(ref);
  }
  function mesSeguinte(ref) {
    var a = Number(String(ref).slice(0, 4)), m = Number(String(ref).slice(5, 7)) + 1;
    if (m > 12) { m = 1; a++; }
    return a + '-' + ('0' + m).slice(-2);
  }

  /* Le TODAS as linhas de uma consulta, de mil em mil.
     O Supabase corta qualquer resposta em 1.000 linhas, calado: pedir
     `limit=5000` nao muda nada. Previsto de tres anos passa disso, e a
     projecao lia so o comeco dele sem ninguem perceber. */
  function lerTudo(caminho) {
    var passo = 1000, fora = [];
    function pagina(de) {
      return rest(caminho + '&limit=' + passo + '&offset=' + de).then(function (r) {
        fora = fora.concat(r || []);
        return (r && r.length === passo) ? pagina(de + passo) : fora;
      });
    }
    return pagina(0);
  }

  /* Dia em que a fatura de um mes fecha. O padrao vem do Config, e o banco
     as vezes antecipa ou adia - fim de semana, feriado. Cada mes pode ter o
     seu, anotado em FECHAMENTOS como "2026-10:28;2026-11:30". */
  function diaDeFechamento(c, ref) {
    var padrao = cfgNum(c, 'DIA_FECHAMENTO_FATURA', 29);
    var m = {};
    String(c.FECHAMENTOS || '').split(';').forEach(function (p) {
      var x = p.split(':');
      if (x.length === 2 && /^\d{4}-\d{2}$/.test(x[0].trim())) {
        var d = Number(x[1]);
        if (d >= 1 && d <= 31) m[x[0].trim()] = d;
      }
    });
    return m[String(ref)] || padrao;
  }

  /* A fatura "de outubro" (paga em 05/10) fecha em setembro. Fechada quer
     dizer: nao entra mais compra nela. */
  /* O ciclo inteiro, igual ao do Apps Script. Antes daqui so havia o fim e o
     "fechada": a tela do Cartao ficava sem o inicio, sem o total de dias e
     sem o dia de hoje, e por isso dizia "dia 30 de 30" e "fatura de " em
     branco num mes que mal tinha comecado.

     O INICIO segue o fechamento do mes ANTERIOR: se um mes foi adiado, o
     seguinte comeca mais tarde, senao um dia ficaria em duas faturas. */
  function cicloDaFatura(c, ref) {
    var ano = Number(ref.split('-')[0]), mes = Number(ref.split('-')[1]);
    var a2 = ano, m2 = mes - 1;
    if (m2 < 1) { m2 = 12; a2--; }
    var refAnt = a2 + '-' + ('0' + m2).slice(-2);
    var fim = new Date(ano, mes - 2, diaDeFechamento(c, ref));
    var ini = new Date(ano, mes - 3, diaDeFechamento(c, refAnt) + 1);
    var DIA = 86400000;
    var dias = Math.round((fim - ini) / DIA) + 1;
    /* O dia do ciclo conta por DATA, não por horas: às 18h do 4º dia ainda é
       o dia 4 (com as horas arredondadas o app dizia "dia 5" à tarde). E a
       fatura só fecha quando o dia do fechamento ACABA - compra no próprio
       dia 28 ainda é deste ciclo. */
    var agoraHora = new Date();
    var agora = new Date(agoraHora.getFullYear(), agoraHora.getMonth(), agoraHora.getDate());
    var hoje = agora > fim ? dias : (agora < ini ? 0 : Math.round((agora - ini) / DIA) + 1);
    var dd = function (d) {
      return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2);
    };
    return { ini: ini, fim: fim, dias: dias,
             hoje: Math.max(0, Math.min(dias, hoje)),
             fechada: agora > fim, rotulo: dd(ini) + ' a ' + dd(fim) };
  }

  /* ------------------------------------------------------------ dados */
  function categorias() {
    return rest('/rest/v1/categorias?select=nome,grupo,natureza,sai_por,previsto_padrao'
                + '&ativa=is.true&order=nome');
  }

  /* ------------------------------------------------------- verba do cartao */
  var CAT_VERBA_CARTAO = 'CARTAO - A CLASSIFICAR';

  /**
   * A verba do cartao paga o que ainda nao tem conta propria.
   *
   * Voce reserva um valor por mes para o cartao sem destino certo. Cada compra
   * de cartao que cai numa conta SEM previsto naquele mes desconta dessa verba.
   * Enquanto houver saldo a compra aparece coberta; quando a verba zera, o que
   * passar vira estouro. Antes daqui as duas coisas apareciam ao mesmo tempo -
   * a verba parada, cheia, e a conta gritando estouro pelo mesmo dinheiro.
   *
   * Cobre da MENOR para a maior, de proposito: assim o estouro que sobra fica
   * na maior despesa nao planejada, que e onde voce quer olhar.
   *
   * O que a verba cobriu vai num campo a parte (`daVerba`), para ninguem
   * gravar sem querer um previsto que nunca existiu.
   *
   * Fatura fechada devolve o que sobrou: nao entra mais compra naquela fatura,
   * entao guardar espaco para ela seria mentira.
   */
  function distribuirVerbaCartao(fechada, despesas, realCartao) {
    var verba = null;
    for (var i = 0; i < despesas.length; i++) {
      if (despesas[i].categoria === CAT_VERBA_CARTAO) { verba = despesas[i]; break; }
    }
    if (!verba) return despesas;
    var saldo = verba.previsto - verba.realizado;
    if (saldo <= 0.005) return despesas;

    despesas.filter(function (d) {
      return d !== verba && d.previsto <= 0.005 && (realCartao[d.categoria] || 0) > 0;
    }).sort(function (a, b) {
      return (realCartao[a.categoria] || 0) - (realCartao[b.categoria] || 0);
    }).forEach(function (d) {
      if (saldo <= 0.005) return;
      var cobre = Math.min(saldo, realCartao[d.categoria] || 0);
      d.previsto = n(d.previsto + cobre);
      d.saldo = n(d.previsto - d.realizado);
      d.daVerba = n(cobre);
      saldo -= cobre;
    });

    verba.distribuido = n(verba.previsto - verba.realizado - saldo);
    if (fechada) saldo = 0;
    verba.previsto = n(verba.realizado + saldo);
    verba.saldo = n(saldo);

    // Verba zerada nao precisa ocupar uma linha: ou a fatura fechou, ou ela ja
    // esta inteira dentro das contas que gastaram.
    if (verba.previsto <= 0.005 && Math.abs(verba.realizado) <= 0.005) {
      despesas = despesas.filter(function (d) { return d !== verba; });
    }
    return despesas;
  }

  /* ----------------------------------------------------------- caixa */
  /**
   * Quanto ENTRA e quanto SAI da conta em cada mes de [de, ate]. So dinheiro.
   *
   * Compra no cartao NAO e saida de caixa na hora: o dinheiro so sai quando a
   * fatura e paga. Quem sai por CAIXA entra pelo que falta gastar; quem sai
   * por CARTAO nao entra aqui - sai pela fatura, que entra inteira pelo que
   * ainda nao foi paga dela. Antes cada compra no cartao reduzia o "ainda
   * sai", e o saldo projetado melhorava a cada compra - o contrario do certo.
   *
   * A tela do Mes, o Painel e o Consolidado usam esta mesma conta. Enquanto
   * eram contas diferentes, cada tela dizia um numero para o mesmo mes.
   *
   * Devolve uma funcao: fluxo('2026-10') -> { aReceber, aPagar, fatura, ... }
   */
  function carregarFluxo(de, ate) {
    return Promise.all([
      config(),
      lerTudo('/rest/v1/resumo_mes?select=mes_ref,categoria,natureza,sai_por,previsto,realizado'
              + '&mes_ref=gte.' + de + '&mes_ref=lte.' + ate),
      lerTudo('/rest/v1/lancamentos?select=mes_ref,valor,meio,natureza'
              + '&meio=in.(CARTAO_CREDITO,PAGAMENTO_FATURA)&status=neq.IGNORADO'
              + '&mes_ref=gte.' + de + '&mes_ref=lte.' + ate),
      // o que de fato passou pela conta: tudo que não é compra no cartão
      lerTudo('/rest/v1/lancamentos?select=mes_ref,valor,meio,natureza,categorias(natureza)'
              + '&meio=neq.CARTAO_CREDITO&status=neq.IGNORADO'
              + '&mes_ref=gte.' + de + '&mes_ref=lte.' + ate)
    ]).then(function (R) {
      var c = R[0], porMes = {}, fat = {}, naConta = {};
      R[3].forEach(function (l) {
        /* Transferência entre contas suas sai de uma e entra na outra: no
           mês ela não é entrada nem saída. Contada, o Plano mostrava os
           a transferência da PJ para a PF dos dois lados (entrada e saída infladas).
           O pagamento da fatura fica: ele é dinheiro saindo de verdade. */
        if (((l.categorias || {}).natureza) === 'TRANSFERENCIA' && l.meio !== 'PAGAMENTO_FATURA') return;
        var x = naConta[l.mes_ref] = naConta[l.mes_ref] || { entrou: 0, saiu: 0 };
        var v = Number(l.valor) || 0;
        if (l.meio === 'PAGAMENTO_FATURA' || l.natureza === 'DESPESA') x.saiu += v;
        else if (l.natureza === 'RECEITA') x.entrou += v;
      });
      R[1].forEach(function (l) { (porMes[l.mes_ref] = porMes[l.mes_ref] || []).push(l); });
      R[2].forEach(function (l) {
        var f = fat[l.mes_ref] = fat[l.mes_ref] || { fatura: 0, pago: 0 };
        if (l.meio === 'PAGAMENTO_FATURA') f.pago += Number(l.valor) || 0;
        // So compra (e estorno, que e despesa negativa) faz a fatura. O
        // credito do pagamento que o Open Finance traz DENTRO do cartao e
        // RECEITA: somado aqui, ele inflava a fatura pelo que ja foi pago.
        else if (l.natureza === 'DESPESA') f.fatura += Number(l.valor) || 0;
      });

      return function fluxo(ref) {
        var fechada = cicloDaFatura(c, ref).fechada;
        var aReceber = 0, aPagar = 0, aindaCabe = 0, itens = [];
        (porMes[ref] || []).forEach(function (l) {
          var nt = l.natureza;
          if (!nt || nt === 'CONTROLE' || nt === 'TRANSFERENCIA') return;
          var falta = (Number(l.previsto) || 0) - (Number(l.realizado) || 0);
          if (falta <= 0.005) return;
          if (nt === 'RECEITA') {
            aReceber += falta;
          } else if (l.sai_por === 'CARTAO') {
            // verba de cartao ainda nao gasta so vira dinheiro saindo se a
            // fatura deste mes ainda estiver aberta para receber compra
            if (!fechada) aindaCabe += falta;
            return;
          } else {
            aPagar += falta;
          }
          itens.push({ categoria: l.categoria, natureza: nt, falta: n(falta) });
        });
        var f = fat[ref] || { fatura: 0, pago: 0 };
        var paga = Math.max(0, f.fatura + aindaCabe - f.pago);
        // fatura fechada que o banco já debitou: a sobra de centavos (tarifa,
        // arredondamento, compra que o banco jogou para a seguinte) não é
        // conta a pagar - antes ficava "R$ 1,93 a pagar" para sempre
        if (fechada && f.pago > 0 && paga <= sobraDeFatura(f.fatura)) paga = 0;
        if (paga > 0.005) {
          aPagar += paga;
          itens.push({ categoria: 'FATURA DO CARTAO', natureza: 'DESPESA',
                       falta: n(paga), fatura: true });
        }
        itens.sort(function (a, b) { return b.falta - a.falta; });
        /* o que JÁ passou pela conta neste mês, lido dos lançamentos que não
           são compra no cartão. Pelo "realizado" das contas dava errado: conta
           que sai por caixa também recebe compra no cartão (presentes, festa),
           e essa já está na fatura - contava duas vezes. */
        var nc = naConta[ref] || { entrou: 0, saiu: 0 };
        var jaEntrou = nc.entrou, jaSaiu = nc.saiu;
        return { aReceber: aReceber, aPagar: aPagar, fatura: paga,
                 jaEntrou: jaEntrou, jaSaiu: jaSaiu,
                 faturaLancada: Math.max(0, f.fatura - f.pago), faturaVerba: aindaCabe,
                 fechada: fechada, itens: itens };
      };
    });
  }

  /**
   * O cartao de cima da tela Mes. Para chegar ao fim de um mes futuro o
   * dinheiro passa por TODOS os meses entre hoje e ele: novembro nao parte
   * do saldo de hoje como se outubro nao existisse.
   */
  function caixaDoMes(mes) {
    var hoje = hojeRef();
    var de = mes < hoje ? mes : hoje, ate = mes > hoje ? mes : hoje;
    return Promise.all([
      carregarFluxo(de, ate),
      rest('/rest/v1/saldos_contas?select=tipo,titular,saldo'),
      /* o que o app soma por cima do saldo do banco e o banco não confirmou,
         e o que foi lançado duas vezes - a pessoa decide (ver 030) */
      rest('/rest/v1/conferencia_banco?select=id,conta,data,valor,natureza,descricao,situacao,banco_data,banco_descricao'
           + '&situacao=in.(fora_do_banco,repetido)&order=data').catch(function () { return []; }),
      /* saiu da conta pelo banco e ainda não tem conta: o previsto que ele
         paga continua "ainda sai" até a classificação */
      mes === hoje ? rest('/rest/v1/lancamentos?select=valor&mes_ref=eq.' + mes + '&categoria_id=is.null'
           + '&natureza=eq.DESPESA&status=neq.IGNORADO&meio=neq.CARTAO_CREDITO&origem=eq.OPENFINANCE').catch(function () { return []; }) : []
    ]).then(function (R) {
      var fluxo = R[0], saldoHoje = 0;
      R[1].forEach(function (s) {
        if (s.tipo === 'CORRENTE' && s.titular !== 'INV') saldoHoje += Number(s.saldo) || 0;
      });
      var f = fluxo(mes);
      var antes = saldoHoje, ref = hoje, voltas = 0;
      while (ref < mes && voltas < 36) {
        var g = fluxo(ref);
        antes += g.aReceber - g.aPagar;
        ref = mesSeguinte(ref);
        voltas++;
      }
      return {
        saldoHoje: n(saldoHoje), saldoAntes: n(antes),
        aReceber: n(f.aReceber), aPagar: n(f.aPagar),
        fatura: n(f.fatura), faturaFechada: f.fechada,
        faturaLancada: n(Math.min(f.fatura, f.faturaLancada)),
        faturaVerba: n(Math.max(0, f.fatura - Math.min(f.fatura, f.faturaLancada))),
        saldoProjetado: n(antes + f.aReceber - f.aPagar),
        // o que JÁ passou pela conta neste mês (compra no cartão só conta
        // quando a fatura é paga) e com quanto o mês começou: começou +
        // entrou - saiu = saldo de hoje, centavo a centavo
        jaEntrou: n(f.jaEntrou || 0), jaSaiu: n(f.jaSaiu || 0),
        comecou: mes === hoje ? n(saldoHoje - (f.jaEntrou || 0) + (f.jaSaiu || 0)) : null,
        conferir: R[2] || [],
        semConta: { qtd: (R[3] || []).length, valor: n((R[3] || []).reduce(function (s, l) { return s + (Number(l.valor) || 0); }, 0)) },
        itens: f.itens.slice(0, 20)
      };
    });
  }

  function resumo(mes) {
    return Promise.all([
      lerTudo('/rest/v1/resumo_mes?select=categoria,grupo,natureza,previsto,realizado'
           + '&mes_ref=eq.' + mes + '&order=categoria'),
      categorias(),
      caixaDoMes(mes),
      lerTudo('/rest/v1/lancamentos?select=valor,categorias(nome)&mes_ref=eq.' + mes
              + '&meio=eq.CARTAO_CREDITO&status=neq.IGNORADO'),
      config()
    ]).then(function (r) {
      var linhas = r[0], cats = r[1], caixa = r[2], cfg = r[4];
      var realCartao = {};
      r[3].forEach(function (l) {
        var nome = (l.categorias || {}).nome || '';
        realCartao[nome] = (realCartao[nome] || 0) + (Number(l.valor) || 0);
      });
      var padrao = {};
      cats.forEach(function (c) { padrao[c.nome] = Number(c.previsto_padrao) || 0; });

      var receitas = [], despesas = [], controle = [], familias = {};
      var tpr = 0, tpd = 0, trr = 0, trd = 0;
      linhas.forEach(function (l) {
        var item = {
          categoria: l.categoria, grupo: l.grupo, padrao: padrao[l.categoria] || 0,
          previsto: n(l.previsto), realizado: n(l.realizado),
          // receita lê-se ao contrário da despesa: enquanto o dinheiro não
          // entra o saldo é negativo (vermelho); entrou a mais, fica positivo
          saldo: l.natureza === 'RECEITA' ? n(l.realizado - l.previsto) : n(l.previsto - l.realizado)
        };
        familias[l.grupo] = true;
        if (l.natureza === 'RECEITA') {
          receitas.push(item); tpr += item.previsto; trr += item.realizado;
        } else if (l.natureza === 'DESPESA') {
          despesas.push(item);
        } else if (l.natureza === 'CONTROLE') {
          controle.push(item);
        }
      });
      // os totais de despesa saem DEPOIS da verba: o que ela cobriu passa a
      // ser previsto da conta que gastou, e sai da linha da verba
      despesas = distribuirVerbaCartao(cicloDaFatura(cfg, mes).fechada, despesas, realCartao);
      despesas.forEach(function (d) { tpd += d.previsto; trd += d.realizado; });
      // mesma ordem do app: alfabetica dentro da familia
      var ordena = function (a, b) {
        return (a.grupo || '').localeCompare(b.grupo || '', 'pt-BR')
            || a.categoria.localeCompare(b.categoria, 'pt-BR');
      };
      despesas.sort(ordena); receitas.sort(ordena);

      // A tela do Mes desenha a lista a partir das FAMILIAS, nao da lista
      // solta. Sem isto ela mostrava "Despesas (0)" com 39 contas no mes.
      var mapaGrupo = {};
      despesas.forEach(function (d) {
        var g = d.grupo || 'OUTROS';
        var x = mapaGrupo[g] = mapaGrupo[g] || { grupo: g, previsto: 0, realizado: 0, itens: [] };
        x.previsto += d.previsto; x.realizado += d.realizado; x.itens.push(d);
      });
      var grupos = Object.keys(mapaGrupo).map(function (g) {
        var x = mapaGrupo[g];
        x.previsto = n(x.previsto); x.realizado = n(x.realizado);
        x.saldo = n(x.previsto - x.realizado);
        return x;
      }).sort(function (p, q) { return q.realizado - p.realizado; });

      return {
        mes: mes, receitas: receitas, despesas: despesas, controle: controle, grupos: grupos,
        familias: Object.keys(familias).sort(),
        diaDeHoje: diaDeHoje(mes), diasNoMes: diasNoMes(mes),
        totalPrevistoReceita: n(tpr), totalPrevistoDespesa: n(tpd),
        totalRealizadoReceita: n(trr), totalRealizadoDespesa: n(trd),
        caixa: caixa
      };
    });
  }

  /* A fatura que ainda recebe compra hoje - o mesDaFatura_(new Date())
     do Codigo.gs. Compra até o fechamento cai na fatura do mês seguinte;
     depois dele, na outra. Em 01/10 isso é NOVEMBRO, não outubro. */
  function faturaAberta(c) {
    var d = new Date();
    var ref = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
    var base = mesSeguinte(ref);
    return d.getDate() <= diaDeFechamento(c, base) ? base : mesSeguinte(base);
  }

  /* `cartoes` é a fatura ABERTA, não a do mês da tela: é por ela que as
     abas Cartão e Extrato > Cartão sabem para onde ir. Devolvendo o mês da
     tela, quem estava em outubro continuava em outubro. */
  function saldos() {
    return config().then(function (c) {
      var mes = faturaAberta(c);
      return Promise.all([
        rest('/rest/v1/saldos_contas?select=nome,tipo,titular,saldo_inicial,saldo_desde,movimento,saldo&order=nome'),
        rest('/rest/v1/fatura_mes?select=mes_ref,cartao,compras,total&mes_ref=eq.' + mes),
        mes
      ]);
    }).then(function (r) {
      var mes = r[2];
      var contas = [], tPF = 0, tPJ = 0, tINV = 0, cadastroCartoes = [];
      r[0].forEach(function (c) {
        if (c.tipo === 'CARTAO') { cadastroCartoes.push(c.nome); return; }
        var x = { conta: c.nome, titular: c.titular, inicial: n(c.saldo_inicial),
                  desdeMs: c.saldo_desde ? new Date(c.saldo_desde).getTime() : 0,
                  movimento: n(c.movimento), saldo: n(c.saldo), obs: '' };
        contas.push(x);
        // caixa é só conta corrente - a MESMA regra do "saldo em conta hoje"
        // do Mês. Conta de investimento marcada PF ou PJ (a aplicação
        // automática) entrava aqui e o Plano partia de um saldo diferente.
        if (c.tipo === 'INVESTIMENTO' || c.titular === 'INV') tINV += x.saldo;
        else if (c.titular === 'PF') tPF += x.saldo;
        else if (c.titular === 'PJ') tPJ += x.saldo;
        else tINV += x.saldo;
      });
      var cartoes = r[1].map(function (f) {
        return { cartao: f.cartao || 'NAO IDENTIFICADA', total: n(f.total), valor: n(f.total),
                 compras: f.compras };
      });
      var total = cartoes.reduce(function (a, c) { return a + c.total; }, 0);
      return { contas: contas, totalPF: n(tPF), totalPJ: n(tPJ), totalInvestido: n(tINV),
               cartoes: { mes: mes, total: n(total), cartoes: cartoes },
               // Todos os cartoes do cadastro, tenham ou nao fatura neste mes.
               // `cartoes` so traz os que ja gastaram, e era por isso que o app
               // nao tinha o que oferecer quando a compra chegava sem dizer o
               // cartao.
               cadastroCartoes: cadastroCartoes };
    });
  }

  function cartao(mes) {
    return Promise.all([
      rest('/rest/v1/fatura_total?select=compras,total&mes_ref=eq.' + mes),
      lerTudo('/rest/v1/resumo_mes?select=categoria,grupo,previsto,realizado,sai_por'
           + '&mes_ref=eq.' + mes + '&sai_por=eq.CARTAO&order=categoria'),
      config(),
      lerTudo('/rest/v1/lancamentos?select=data,valor&mes_ref=eq.' + mes
              + '&meio=eq.CARTAO_CREDITO&natureza=eq.DESPESA&status=neq.IGNORADO')
    ]).then(function (r) {
      var t = r[0][0] || { compras: 0, total: 0 };
      var cfg = r[2] || {};
      var meta = Number(cfg.META_CARTAO) || 0;
      // o cartao anda pelo CICLO da fatura (29/09 a 28/10), nao pelo mes
      var ciclo = cicloDaFatura(cfg, mes);
      var dias = ciclo.dias, dia = ciclo.hoje;

      /* O gráfico "Ritmo: meta x real", como o apiCartao do Codigo.gs: o
         gasto acumulado dia a dia DENTRO do ciclo (não do mês) contra a meta
         em linha reta. Faltava aqui e o gráfico aparecia vazio. */
      var porDia = {}, DIA = 86400000;
      r[3].forEach(function (l) {
        var p = String(l.data).split('-');
        var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
        var idx = Math.round((d - ciclo.ini) / DIA) + 1;
        idx = Math.max(1, Math.min(dias, idx));
        // data no futuro só existe em parcela gerada (dia 15 inventado): é
        // cobrança certa desta fatura, então pesa desde o primeiro dia - senão
        // a linha ficava abaixo do total que o quadro de cima mostra
        if (idx > dia) idx = 1;
        porDia[idx] = (porDia[idx] || 0) + (Number(l.valor) || 0);
      });
      var serie = [], acum = 0;
      for (var d2 = 1; d2 <= dias; d2++) {
        acum += porDia[d2] || 0;
        serie.push({ dia: d2, meta: n(meta / dias * d2), real: d2 <= dia ? n(acum) : null });
      }
      var porCategoria = r[1].map(function (l) {
        var m = n(l.previsto), g = n(l.realizado);
        return { categoria: l.categoria, grupo: l.grupo, meta: m, gasto: g,
                 fora: 0, sobra: n(m - g), metaDia: m ? n(m / dias) : 0,
                 metaAteHoje: m ? n(m * dia / dias) : null,
                 porDia: m > g ? n((m - g) / Math.max(1, dias - dia)) : 0 };
      }).sort(function (a, b) { return b.gasto - a.gasto; });
      return {
        total: n(t.total), meta: meta, dias: dias, hoje: dia,
        diasRestantes: Math.max(0, dias - dia),
        metaAteHoje: n(meta * dia / dias), desvio: n(t.total - meta * dia / dias),
        projecao: dia ? n(t.total / dia * dias) : 0,
        porDiaDisponivel: n((meta - t.total) / Math.max(1, dias - dia)),
        pendente: 0, fechada: ciclo.fechada, ciclo: ciclo.rotulo,
        serie: serie, porCategoria: porCategoria
      };
    });
  }

  /* Com quanto o mes COMECA.
   *
   * O saldo que voce informou vale como ABERTURA do dia dele. Para saber com
   * quanto um mes abriu, anda-se dessa ancora ate o dia 1o daquele mes - para
   * frente somando, para tras devolvendo. E a mesma conta do Apps Script.
   *
   * Sem isto o extrato abria em zero: o numero estava escrito na mao como 0
   * e o mes inteiro parecia vazio mesmo com dinheiro na conta. */
  var _aberturaCache = {};
  function saldoAberturaDoMes(mes, filtro) {
    var chave = mes + '|' + (filtro || 'TUDO');
    var g = _aberturaCache[chave];
    if (g && Date.now() - g.t < 120000) return Promise.resolve(g.v);   // 2 min, como a projeção
    return Promise.all([
      rest('/rest/v1/saldos_contas?select=nome,titular,saldo_inicial,saldo_desde'),
      lerTudo('/rest/v1/lancamentos?select=data,valor,natureza,meio,contas(nome)'
              + '&meio=neq.CARTAO_CREDITO&status=neq.IGNORADO&origem=neq.HISTORICO')
    ]).then(function (r) {
      var vale = {}, desde = {}, inicial = 0;
      r[0].forEach(function (c) {
        if (c.titular === 'INV') return;           // investimento nao e caixa do mes
        if (filtro && filtro !== 'TUDO' && c.titular !== filtro) return;
        vale[c.nome] = true;
        desde[c.nome] = c.saldo_desde ? new Date(c.saldo_desde + 'T12:00:00').getTime() : 0;
        inicial += Number(c.saldo_inicial) || 0;
      });
      var corte = new Date(Number(mes.slice(0, 4)), Number(mes.slice(5, 7)) - 1, 1).getTime();
      var mov = 0;
      r[1].forEach(function (l) {
        var nome = (l.contas || {}).nome || '';
        if (!vale[nome] || !l.data) return;
        var t = new Date(l.data + 'T12:00:00').getTime();
        var v = Number(l.valor) || 0;
        var sinal = (l.natureza === 'RECEITA') ? v : -v;
        var ancora = desde[nome] || 0;
        if (t >= ancora && t < corte) mov += sinal;
        else if (t >= corte && t < ancora) mov -= sinal;
      });
      _aberturaCache[chave] = { v: n(inicial + mov), t: Date.now() };
      return _aberturaCache[chave].v;
    });
  }

  /* ------------------------------------------------------------ extrato */
  function extratoConta(mes, filtro, busca) {
    var q = '/rest/v1/lancamentos?select=id,data,valor,natureza,descricao,fornecedor,meio,'
          + 'status,origem,origem_id,conta_id,categoria_id,criado_em,contas(nome),categorias(nome)'
          + '&mes_ref=eq.' + mes + '&meio=neq.CARTAO_CREDITO&order=data.desc,criado_em.desc,id.desc';
    if (busca) q += '&fornecedor=ilike.*' + encodeURIComponent(busca) + '*';
    // o mês inteiro (antes: só os 400 primeiros, e os totais saíam errados)
    return Promise.all([lerTudo(q), saldoAberturaDoMes(mes, filtro)]).then(function (r) {
      // o mais recente em cima; no mesmo dia, o que entrou por último
      var itens = r[0].map(function (l) { return paraItem(l); }).sort(maisNovoPrimeiro);
      var inicial = r[1];
      var cred = 0, deb = 0;
      // do mais antigo para o mais novo, para o saldo correr na ordem certa
      var ordem = itens.slice().reverse();
      /* Transferência entre contas suas com OS DOIS lados neste extrato (filtro
         Tudo, PF->PJ...) não é entrada nem saída: sai de uma, entra na outra.
         Os dois ficam na lista - são movimentos de cada conta -, mas não somam
         no Entrou/Saiu. Com só um lado à vista (filtro PF, e o outro lado no
         PJ), o dinheiro de fato entrou ou saiu daquele conjunto e soma. */
      var transf = itens.filter(function (x) { return x.categoria === CAT_TRANSF; });
      var anula = {};
      transf.forEach(function (a) {
        if (anula[a.id] || !a.credito) return;
        var b = transf.filter(function (y) {
          return !anula[y.id] && y.debito && Math.abs(y.debito - a.credito) < 0.005 &&
                 Math.abs(y.ordem - a.ordem) <= 4 * 864e5;
        })[0];
        if (b) { anula[a.id] = anula[b.id] = true; }
      });
      var saldo = inicial;
      ordem.forEach(function (x) {
        saldo += (x.credito || 0) - (x.debito || 0);
        x.saldo = n(saldo);
        if (anula[x.id]) { x.entreContas = true; return; }
        cred += x.credito || 0; deb += x.debito || 0;
      });
      return { mes: mes, itens: itens, total: itens.length,
               creditos: n(cred), debitos: n(deb),
               saldoInicial: n(inicial), saldoFinal: n(saldo) };
    });
  }

  function extratoCartao(mes, busca, cartaoSel) {
    var q = '/rest/v1/lancamentos?select=id,data,valor,natureza,descricao,fornecedor,meio,'
          + 'status,origem,origem_id,parcela_num,parcela_total,dados,criado_em,contas(nome),categorias(nome)'
          + '&mes_ref=eq.' + mes + '&meio=eq.CARTAO_CREDITO&status=neq.IGNORADO'
          // so compra e estorno: o credito do PAGAMENTO que o Open Finance poe
          // dentro do cartao (RECEITA) somava na fatura o que ja foi pago
          + '&natureza=eq.DESPESA&order=data.desc,id.desc';
    return lerTudo(q).then(function (linhas) {
      var itens = linhas.map(function (l) { return paraItem(l); });
      var alvo = String(busca || '').toLowerCase();
      itens = itens.filter(function (x) {
        if (cartaoSel && cartaoSel !== 'TUDO' && x.cartao !== cartaoSel) return false;
        if (alvo && [x.data, x.fornecedor, x.categoria, x.cartao, String(x.valor)]
                      .join(' ').toLowerCase().indexOf(alvo) < 0) return false;
        return true;
      });
      // Toda compra parcelada vai para o FIM, com o selo X/N: em cima ficam
      // as compras do ciclo, embaixo o que e prestacao. A parcela gerada pelo
      // app tem data inventada (dia 15) e no meio empurrava para baixo o que
      // voce acabou de comprar. Dentro de cada bloco, a mais nova primeiro.
      // A 1ª parcela é compra nova: fica com as compras, em cima. Só as
      // prestações seguintes (02/10, 03/10...) vão para o bloco de baixo.
      var prestacao = function (x) { return x.origem === 'PARCELA' || (x.parcelada && !/^01\//.test(x.parcela || '')); };
      itens.sort(function (a, b) {
        var pa = prestacao(a) ? 1 : 0, pb = prestacao(b) ? 1 : 0;
        return (pa - pb) || maisNovoPrimeiro(a, b);
      });
      var porCartao = {}, acum = 0;
      itens.forEach(function (x) {
        var c = x.cartao || 'NAO IDENTIFICADA';
        porCartao[c] = (porCartao[c] || 0) + (x.valor || 0);
      });
      for (var j = itens.length - 1; j >= 0; j--) { acum += itens[j].valor || 0; itens[j].acumulado = n(acum); }
      return { mes: mes, itens: itens, quantos: itens.length,
               total: n(itens.reduce(function (a, x) { return a + (x.valor || 0); }, 0)),
               porCartao: Object.keys(porCartao).map(function (k) {
                 return { cartao: k, valor: n(porCartao[k]) };
               }).sort(function (a, b) { return b.valor - a.valor; }) };
    });
  }

  /* O numero vem das colunas; na falta delas, do texto ("parcela 02/10"),
     como o Codigo.gs faz. "01/01" e compra a vista, nao parcela. */
  function parcelaDe(l) {
    var num = Number(l.parcela_num), tot = Number(l.parcela_total);
    if (!tot) {
      var m = /parcela\s*(\d{1,2})\s*\/\s*(\d{1,2})/i.exec(
        String(l.descricao || '') + ' ' + String(((l.dados || {}).obs) || ''));
      if (m) { num = Number(m[1]); tot = Number(m[2]); }
    }
    if (!tot || tot < 2) return '';
    return ('0' + num).slice(-2) + '/' + ('0' + tot).slice(-2);
  }

  /* Extrato: do mais recente para o mais antigo. No mesmo dia, o que entrou
     no app por último fica em cima - lançamento novo aparece sempre no topo. */
  function maisNovoPrimeiro(a, b) {
    return (b.ordem - a.ordem) || (b.criado < a.criado ? -1 : b.criado > a.criado ? 1 : 0);
  }

  function paraItem(l) {
    var d = String(l.data).split('-');
    // Valor negativo numa despesa e estorno: para quem olha o extrato, isso
    // e credito. O app velho mostrava como cobranca (usava abs) enquanto o
    // painel dele subtraia - a mesma linha com duas respostas.
    var v = n(l.valor);
    var entrou = l.natureza === 'RECEITA' || v < 0;
    return {
      id: l.origem_id || l.id, linha: 0,
      data: d[2] + '/' + d[1] + '/' + d[0],
      ordem: new Date(l.data).getTime(), criado: String(l.criado_em || ''),
      valor: v,
      credito: entrou ? Math.abs(v) : 0,
      debito: entrou ? 0 : v,
      fornecedor: l.fornecedor || l.descricao,
      categoria: (l.categorias || {}).nome || '',
      conta: (l.contas || {}).nome || '',
      cartao: l.meio === 'CARTAO_CREDITO' ? ((l.contas || {}).nome || '') : '',
      meio: l.meio, status: l.status, origem: l.origem,
      // "03/06", o mesmo formato do app da planilha
      parcela: parcelaDe(l),
      parcelada: !!parcelaDe(l) || l.origem === 'PARCELA',
      obs: ((l.dados || {}).obs) || '',
      natureza: l.natureza
    };
  }



  /* ======================================================== ESCRITA ======
   * Daqui para baixo, tudo grava. Três cuidados que valem para todas:
   *
   *   user_id  vai explícito em cada linha. O RLS exige que bata com quem
   *            está logado - é o banco recusando, não o código lembrando.
   *   id       o app conhece os lançamentos pelo id ANTIGO (hexadecimal da
   *            planilha). No banco novo ele virou `origem_id`, e a chave
   *            primária é um uuid. `acharLinha` resolve os dois.
   *   retorno  o app espera { ok: true, ... }. Quem falha devolve
   *            { ok:false, erro } - nunca lança calado.
   */

  function uid() { return sessao.user_id; }
  function ehUuid(v) {
    return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(v));
  }
  /** Devolve o uuid da linha, aceitando id novo ou id da planilha. */
  function acharLinha(id) {
    if (!id) return Promise.resolve(null);
    /* O id da tela é o origem_id quando há um (paraItem). O do Open Finance
       (Pluggy) também tem cara de uuid: buscando só por "id", o lançamento não
       era achado e Confirmar/Ignorar não faziam nada. Agora procura nos dois. */
    var q = ehUuid(id) ? 'or=(id.eq.' + id + ',origem_id.eq.' + id + ')' : 'origem_id=eq.' + encodeURIComponent(id);
    return rest('/rest/v1/lancamentos?select=id,origem_id&' + q + '&limit=2')
      .then(function (r) {
        if (!r.length) return null;
        var exato = r.filter(function (x) { return x.origem_id === id; })[0];
        return (exato || r[0]).id;
      });
  }
  function idDaCategoria(nome) {
    if (!nome) return Promise.resolve(null);
    return rest('/rest/v1/categorias?select=id&nome=eq.' + encodeURIComponent(nome) + '&limit=1')
      .then(function (r) { return r.length ? r[0].id : null; });
  }
  function idDaConta(nome) {
    if (!nome) return Promise.resolve(null);
    return rest('/rest/v1/contas?select=id&nome=eq.' + encodeURIComponent(nome) + '&limit=1')
      .then(function (r) { return r.length ? r[0].id : null; });
  }
  function gravar(tabela, linhas, conflito) {
    var caminho = '/rest/v1/' + tabela + (conflito ? '?on_conflict=' + conflito : '');
    var prefer = 'return=representation' + (conflito ? ',resolution=merge-duplicates' : '');
    linhas = linhas.map(function (x) { var y = {}; for (var k in x) y[k] = x[k]; y.user_id = uid(); return y; });
    return rest(caminho, { metodo: 'POST', corpo: linhas, prefer: prefer });
  }
  function mudar(tabela, filtro, campos) {
    return rest('/rest/v1/' + tabela + '?' + filtro,
                { metodo: 'PATCH', corpo: campos, prefer: 'return=representation' });
  }

  /* ---------------------------------------------------------- previsto */
  function salvarPrevisto(mes, categoria, valor) {
    return idDaCategoria(categoria).then(function (cid) {
      if (!cid) return { ok: false, erro: 'não achei a conta ' + categoria };
      return gravar('previstos', [{ categoria_id: cid, mes_ref: mes, valor: n(valor) }],
                    'user_id,categoria_id,mes_ref')
        .then(function () { return { ok: true, mes: mes, categoria: categoria, valor: n(valor) }; });
    });
  }

  function salvarPrevistoEmVarios(linhas) {
    var nomes = {};
    (linhas || []).forEach(function (l) { nomes[l.categoria] = true; });
    return rest('/rest/v1/categorias?select=id,nome&nome=in.('
                + Object.keys(nomes).map(function (x) { return '"' + x.replace(/"/g, '') + '"'; }).join(',') + ')')
      .then(function (cs) {
        var mapa = {};
        cs.forEach(function (c) { mapa[c.nome] = c.id; });
        var fora = linhas.filter(function (l) { return mapa[l.categoria]; })
          .map(function (l) {
            return { categoria_id: mapa[l.categoria], mes_ref: l.mes, valor: n(l.valor) };
          });
        if (!fora.length) return { ok: false, erro: 'nenhuma conta reconhecida' };
        return gravar('previstos', fora, 'user_id,categoria_id,mes_ref')
          .then(function () { return { ok: true, quantos: fora.length }; });
      });
  }

  /* Tirar do mês é zerar a verba, não apagar a conta - a conta continua
     existindo nos outros meses. */
  function removerDoMes(mes, categoria) {
    return salvarPrevisto(mes, categoria, 0)
      .then(function (r) { return r.ok ? { ok: true, categoria: categoria } : r; });
  }

  function mesesComPrevisto(mes, categoria, minimo) {
    return idDaCategoria(categoria).then(function (cid) {
      if (!cid) return { ok: true, meses: [] };
      var ano = mes.slice(0, 4);
      return rest('/rest/v1/previstos?select=mes_ref,valor&categoria_id=eq.' + cid
                  + '&mes_ref=gte.' + ano + '-01&mes_ref=lte.' + ano + '-12&order=mes_ref')
        .then(function (r) {
          return { ok: true, meses: r.filter(function (x) {
            return x.mes_ref !== mes && Number(x.valor) >= (minimo || 0);
          }).map(function (x) { return { ref: x.mes_ref, valor: n(x.valor) }; }) };
        });
    });
  }

  /* ---------------------------------------------------------- categorias */
  function novaCategoria(nome, grupo, natureza, previsto) {
    nome = String(nome || '').trim();
    if (!nome) return Promise.resolve({ ok: false, erro: 'dê um nome à conta' });
    return gravar('categorias', [{
      nome: nome, grupo: String(grupo || 'OUTROS').trim(),
      natureza: natureza || 'DESPESA', previsto_padrao: n(previsto),
      sai_por: 'CAIXA'
    }], 'user_id,nome').then(function (r) {
      var cid = r[0].id;
      var hoje = hojeRef();
      if (!n(previsto)) return { ok: true, categoria: nome };
      return gravar('previstos', [{ categoria_id: cid, mes_ref: hoje, valor: n(previsto) }],
                    'user_id,categoria_id,mes_ref')
        .then(function () { return { ok: true, categoria: nome }; });
    });
  }

  function apagarConta(nome, para) {
    return Promise.all([idDaCategoria(nome), idDaCategoria(para)]).then(function (r) {
      var de = r[0], destino = r[1];
      if (!de) return { ok: false, erro: 'não achei ' + nome };
      return rest('/rest/v1/lancamentos?select=id&categoria_id=eq.' + de + '&limit=1')
        .then(function (usados) {
          // Apagar conta com lançamento sem dizer para onde eles vão é perder
          // histórico. O app velho também recusava - e por isso mesmo.
          if (usados.length && !destino) {
            return { ok: false, erro: 'essa conta tem lançamentos; escolha para onde levá-los' };
          }
          var mover = usados.length
            ? mudar('lancamentos', 'categoria_id=eq.' + de, { categoria_id: destino })
            : Promise.resolve();
          return mover
            .then(function () { return rest('/rest/v1/categorias?id=eq.' + de, { metodo: 'DELETE' }); })
            .then(function () { return { ok: true, movidos: usados.length }; });
        });
    });
  }

  /* --------------------------------------------------------- classificar */
  function confirmar(linha, categoria, valor, id) {
    return Promise.all([acharLinha(id), idDaCategoria(categoria)]).then(function (r) {
      if (!r[0]) return { ok: false, erro: 'não achei o lançamento' };
      if (!r[1]) return { ok: false, erro: 'não achei a conta ' + categoria };
      return mudar('lancamentos', 'id=eq.' + r[0],
                   { categoria_id: r[1], status: 'CONFIRMADO' })
        .then(function () { return { ok: true }; });
    });
  }

  /* Compra parcelada no cartão: o aviso do banco traz só o total (599,98) e não
     diz em quantas vezes. Na hora de classificar, a pessoa escolhe "2x" e a
     compra vira as parcelas, uma em cada fatura: a 1ª fica no lançamento do
     aviso, as outras nascem como PARCELA nos meses seguintes. Quando o Open
     Finance trouxer as parcelas do banco, ele as reconhece (mesmo valor e
     mesmo número de parcela) em vez de duplicar. */
  function parcelar(id, vezes) {
    vezes = Math.max(2, Math.min(24, parseInt(vezes, 10) || 0));
    return rest('/rest/v1/lancamentos?select=id,data,mes_ref,valor,natureza,descricao,fornecedor,conta_id,categoria_id,meio,status,dados,parcela_total' +
                '&id=eq.' + id + '&limit=1').then(function (r) {
      var l = r && r[0];
      if (!l) return { ok: false, erro: 'não achei o lançamento' };
      if (l.parcela_total > 1) return { ok: false, erro: 'esta compra já está parcelada' };
      var total = Math.round(Number(l.valor) * 100), base = Math.floor(total / vezes), primeira = total - base * (vezes - 1);
      var d0 = new Date(l.data + 'T12:00:00'), mes = l.mes_ref, novas = [];
      for (var k = 1; k < vezes; k++) {
        mes = mesSeguinte(mes);
        var d = new Date(d0.getFullYear(), d0.getMonth() + k, 1, 12);
        var dia = Math.min(d0.getDate(), new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate());
        d.setDate(dia);
        novas.push({ data: d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2),
          mes_ref: mes, valor: base / 100, natureza: l.natureza, descricao: l.descricao, fornecedor: l.fornecedor,
          conta_id: l.conta_id, categoria_id: l.categoria_id, meio: l.meio, status: 'CONFIRMADO',
          origem: 'PARCELA', origem_id: l.id + '-p' + (k + 1), parcela_num: k + 1, parcela_total: vezes,
          dados: { obs: 'PARCELA FUTURA', parcelado_de: l.id, total: total / 100 } });
      }
      var dados = Object.assign({}, l.dados || {}, { parcelado_em: vezes, total: total / 100 });
      return mudar('lancamentos', 'id=eq.' + l.id, { valor: primeira / 100, parcela_num: 1, parcela_total: vezes, dados: dados })
        .then(function () { return gravar('lancamentos', novas); })
        .then(function () { return { ok: true, vezes: vezes, parcela: base / 100, primeira: primeira / 100 }; });
    });
  }

  /* Cartão múltiplo: o aviso não diz se foi crédito ou débito. Débito sai da
     conta corrente do mesmo banco (e do mesmo titular), no mês da compra. */
  function definirTipo(uuid, tipo) {
    return rest('/rest/v1/lancamentos?select=id,data,dados,conta_id,contas(instituicao,nome,titular)&id=eq.' + uuid + '&limit=1')
      .then(function (r) {
        var l = r && r[0];
        if (!l) return { ok: false, erro: 'não achei o lançamento' };
        var dados = Object.assign({}, l.dados || {}); delete dados.perguntar_tipo; dados.tipo_escolhido = tipo;
        if (tipo !== 'DEBITO') return mudar('lancamentos', 'id=eq.' + uuid, { dados: dados }).then(function () { return { ok: true }; });
        var c = l.contas || {}, banco = String(c.instituicao || c.nome || '').trim().split(/\s+/)[0].toUpperCase();
        return rest('/rest/v1/contas?select=id,nome,instituicao,titular,tipo&ativa=eq.true&tipo=neq.CARTAO').then(function (cs) {
          var mesmo = (cs || []).filter(function (x) {
            return String(x.instituicao || x.nome || '').trim().split(/\s+/)[0].toUpperCase() === banco; });
          var conta = mesmo.filter(function (x) { return x.titular === c.titular; })[0] || mesmo[0];
          if (!conta) return { ok: false, erro: 'não achei a conta corrente do ' + banco + ' (cadastre em Configurações → Bancos)' };
          return mudar('lancamentos', 'id=eq.' + uuid, { meio: 'CAIXA', conta_id: conta.id,
            mes_ref: String(l.data).slice(0, 7), dados: dados }).then(function () { return { ok: true, conta: conta.nome }; });
        });
      });
  }

  function confirmarTodos(itens) {
    return Promise.all((itens || []).map(function (x) {
      return confirmar(x.linha, x.categoria, x.valor, x.id);
    })).then(function (rs) {
      return { ok: true, quantos: rs.filter(function (x) { return x.ok; }).length };
    });
  }

  function ignorar(linha, id) {
    return acharLinha(id).then(function (uuid) {
      if (!uuid) return { ok: false, erro: 'não achei o lançamento' };
      return mudar('lancamentos', 'id=eq.' + uuid, { status: 'IGNORADO' })
        .then(function () { return { ok: true }; });
    });
  }

  /* Classificar o FORNECEDOR: vale para o que já entrou e para o que vier.
     É o que faz a segunda compra do mesmo lugar não perguntar nada. */
  function classificarFornecedor(chave, categoria) {
    /* Pega as mesmas compras que o semCategoria lista: sem conta OU numa das
       contas "a classificar", e o fornecedor (ou, sem ele, a descrição)
       começando pela chave. Antes só ia em categoria_id nulo e só olhava o
       fornecedor: a compra da fatura (que cai em "A CLASSIFICAR") ficava. */
    return Promise.all([idDaCategoria(categoria),
      rest('/rest/v1/categorias?select=id&nome=in.(%22CARTAO%20-%20A%20CLASSIFICAR%22,'
           + '%22CARTAO%20-%20NAO%20CLASSIFICADO%20(HISTORICO)%22)')]).then(function (r) {
      var cid = r[0], cats = r[1];
      if (!cid) return { ok: false, erro: 'não achei a conta ' + categoria };
      var semConta = cats.length
        ? 'or(categoria_id.is.null,categoria_id.in.(' + cats.map(function (c) { return c.id; }).join(',') + '))'
        : 'categoria_id.is.null';
      var q = '"' + String(chave).replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '*"';
      var quem = 'or(fornecedor.ilike.' + q + ',and(or(fornecedor.is.null,fornecedor.eq.""),descricao.ilike.' + q + '))';
      return mudar('lancamentos',
                   'and=' + encodeURIComponent('(' + semConta + ',' + quem + ')') + '&status=neq.IGNORADO',
                   { categoria_id: cid, status: 'CONFIRMADO' })
        .then(function (mexidos) {
          return gravar('regras', [{ chave: chave, categoria_id: cid, acertos: 0 }],
                        'user_id,chave')
            .then(function () { return { ok: true, atualizadas: mexidos.length }; });
        });
    });
  }

  function mudarCategoria(linha, categoria, todos) {
    return confirmar(linha, categoria, 0, linha);
  }

  function corrigirDestino(linha, id, dados) {
    return Promise.all([acharLinha(id), idDaCategoria(dados.categoria),
                        idDaConta(dados.conta)]).then(function (r) {
      if (!r[0]) return { ok: false, erro: 'não achei o lançamento' };
      var campos = {};
      if (dados.categoria && r[1]) campos.categoria_id = r[1];
      if (dados.conta) {
        if (!r[2]) return { ok: false, erro: 'não conheço a conta ' + dados.conta };
        campos.conta_id = r[2];
        campos.meio = dados.meio || 'PIX';
      }
      if (!Object.keys(campos).length) return { ok: false, erro: 'nada para mudar' };
      return mudar('lancamentos', 'id=eq.' + r[0], campos).then(function () {
        if (!dados.todos || !dados.categoria || !r[1]) return { ok: true };
        // "todos deste fornecedor": a regra que o app já oferecia marcada
        return rest('/rest/v1/lancamentos?select=fornecedor&id=eq.' + r[0])
          .then(function (x) {
            var f = (x[0] || {}).fornecedor;
            if (!f) return { ok: true };
            return mudar('lancamentos',
                         'fornecedor=eq.' + encodeURIComponent(f) + '&status=neq.IGNORADO',
                         { categoria_id: r[1] })
              .then(function (m) { return { ok: true, quantos: m.length }; });
          });
      });
    });
  }

  /* ------------------------------------------------------- lançar e editar */
  function lancarManual(d) {
    var data = d.data || new Date().toISOString().slice(0, 10);
    return Promise.all([idDaCategoria(d.categoria), idDaConta(d.conta)]).then(function (r) {
      var meio = d.meio === 'CARTAO_CREDITO' ? 'CARTAO_CREDITO'
               : (d.meio === 'TRANSFERENCIA' ? 'CAIXA' : (d.meio || 'PIX'));
      // No cartão a competência é o mês do PAGAMENTO da fatura, não o da
      // compra. Fora dele, é o mês da data.
      var mes = meio === 'CARTAO_CREDITO'
        ? (function () { var p = data.split('-'); var m = Number(p[1]) + 1, a = Number(p[0]);
            if (m > 12) { m = 1; a++; } return a + '-' + ('0' + m).slice(-2); })()
        : data.slice(0, 7);
      return gravar('lancamentos', [{
        data: data, mes_ref: mes, valor: n(Math.abs(d.valor)),
        natureza: d.natureza || 'DESPESA',
        descricao: d.descricao || 'LANCAMENTO', fornecedor: d.descricao || 'LANCAMENTO',
        categoria_id: r[0], conta_id: r[1], meio: meio,
        status: 'CONFIRMADO', origem: 'MANUAL',
        dados: d.obs ? { obs: String(d.obs) } : {}
      }]).then(function (x) { return { ok: true, mes: mes, id: x[0].id }; });
    });
  }

  function editarLancamento(linha, id, dados) {
    return acharLinha(id).then(function (uuid) {
      if (!uuid) return { ok: false, erro: 'não achei o lançamento' };
      return rest('/rest/v1/lancamentos?select=origem&id=eq.' + uuid).then(function (x) {
        // Só o que VOCÊ lançou pode ser editado inteiro. O que veio do banco
        // tem que continuar espelhando o extrato - ali só o destino muda.
        if ((x[0] || {}).origem !== 'MANUAL') {
          return { ok: false, erro: 'só dá para editar lançamento manual' };
        }
        return Promise.all([idDaCategoria(dados.categoria), idDaConta(dados.conta)])
          .then(function (r) {
            var campos = { valor: n(Math.abs(dados.valor)) };
            if (dados.data) { campos.data = dados.data; campos.mes_ref = dados.data.slice(0, 7); }
            if (dados.descricao) { campos.descricao = dados.descricao; campos.fornecedor = dados.descricao; }
            if (dados.natureza) campos.natureza = dados.natureza;
            if (dados.meio) campos.meio = dados.meio;
            if (r[0]) campos.categoria_id = r[0];
            if (r[1]) campos.conta_id = r[1];
            return mudar('lancamentos', 'id=eq.' + uuid, campos)
              .then(function () { return { ok: true }; });
          });
      });
    });
  }

  /* Conferência com o banco (tela Mês): apagar o lançamento à mão repetido
     ou que não existiu, ou marcar como "são diferentes" / "manter assim". */
  function conferirBanco(acao, id) {
    if (!/^[0-9a-f-]{36}$/.test(String(id))) return Promise.resolve({ ok: false, erro: 'lançamento inválido' });
    var url = '/rest/v1/lancamentos?id=eq.' + id + '&origem=neq.OPENFINANCE';
    if (acao === 'apagar') return rest(url, { metodo: 'DELETE' }).then(function () { return { ok: true }; });
    if (acao !== 'diferente' && acao !== 'manter') return Promise.resolve({ ok: false, erro: 'ação inválida' });
    return rest('/rest/v1/lancamentos?select=dados&id=eq.' + id).then(function (r) {
      var d = (r && r[0] && r[0].dados) || {};
      d.conferido = acao;
      return rest(url, { metodo: 'PATCH', corpo: { dados: d }, prefer: 'return=minimal' });
    }).then(function () { return { ok: true }; });
  }

  function excluirLancamento(linha, id) {
    return acharLinha(id).then(function (uuid) {
      if (!uuid) return { ok: false, erro: 'não achei o lançamento' };
      return rest('/rest/v1/lancamentos?id=eq.' + uuid, { metodo: 'DELETE' })
        .then(function () { return { ok: true }; });
    });
  }

  /* ------------------------------------------------------------ fatura */
  var CAT_PAGAR_FATURA = 'PAGAMENTO DA FATURA DO CARTAO';

  /**
   * Marca a fatura de um mes como paga.
   *
   * O debito automatico da fatura nao gera notificacao - ele nunca chegou
   * sozinho no app. Sem ele, o caixa fica esperando um dinheiro que ja saiu
   * da conta, e o mes aparece no vermelho pelo valor inteiro da fatura.
   *
   * A DATA e a do VENCIMENTO, nao hoje: o saldo informado vale como abertura
   * do dia dele, e o pagamento lancado no vencimento cai antes dessa ancora
   * quando a fatura ja estava paga na hora em que voce olhou o extrato - ai
   * ele nao desconta o mesmo dinheiro de novo.
   */
  /* Até quanto a diferença entre a fatura somada no app e o que o banco
     debitou é "sobra" (não é conta a pagar): R$ 5 ou 0,3% da fatura. */
  function sobraDeFatura(fatura) { return Math.max(5, Math.abs(Number(fatura) || 0) * 0.003); }

  function pagarFatura(mes, valor, quando, conta) {
    mes = mes || hojeRef();
    return Promise.all([
      config(),
      lerTudo('/rest/v1/lancamentos?select=valor,meio,natureza&mes_ref=eq.' + mes
              + '&meio=in.(CARTAO_CREDITO,PAGAMENTO_FATURA)&status=neq.IGNORADO'),
      rest('/rest/v1/contas?select=nome,tipo,titular&ativa=is.true&tipo=eq.CORRENTE'
           + '&titular=eq.PF&order=criado_em,nome'),
      // a conta que pagou a última fatura (o débito automático do banco)
      rest('/rest/v1/lancamentos?select=contas(nome,ativa)&meio=eq.PAGAMENTO_FATURA&status=neq.IGNORADO'
           + '&conta_id=not.is.null&order=data.desc&limit=1')
    ]).then(function (R) {
      var c = R[0], fatura = 0, jaPago = 0;
      R[1].forEach(function (l) {
        if (l.meio === 'PAGAMENTO_FATURA') jaPago += Number(l.valor) || 0;
        else if (l.natureza === 'DESPESA') fatura += Number(l.valor) || 0;
      });
      var v = Number(valor) || n(fatura - jaPago);
      if (v <= 0.005) return { ok: false, erro: 'essa fatura já está paga' };
      // o banco já debitou e só sobrou diferença de centavos: não lança nada
      if (!valor && jaPago > 0 && v <= sobraDeFatura(fatura))
        return { ok: false, erro: 'essa fatura já foi paga pelo banco (sobrou só ' + 'R$ ' + v.toFixed(2).replace('.', ',') + ' de diferença)' };

      // de onde a fatura é debitada: a do Config, a que pagou a última fatura,
      // ou a primeira conta PF (antes ia direto para a primeira PF cadastrada)
      var ultima = ((R[3] || [])[0] || {}).contas || {};
      conta = conta || String(c.CONTA_DA_FATURA || '').trim() || (ultima.ativa ? ultima.nome : '') || ((R[2][0] || {}).nome || '');
      if (!conta) return { ok: false, erro: 'não sei de qual conta a fatura é debitada' };

      var dia = Math.min(28, Math.max(1, cfgNum(c, 'DIA_VENCIMENTO_FATURA', 5)));
      var data = quando || (mes + '-' + ('0' + dia).slice(-2));
      return lancarManual({
        valor: v, data: data, natureza: 'DESPESA',
        descricao: 'PAGAMENTO DA FATURA ' + mes,
        conta: conta, meio: 'PAGAMENTO_FATURA', categoria: CAT_PAGAR_FATURA,
        obs: 'fatura de ' + mes + ' quitada'
      }).then(function (r) {
        if (!r || !r.ok) return r;
        return { ok: true, valor: v, conta: conta, data: data, mes: mes };
      });
    });
  }

  /**
   * Joga uma compra para OUTRA fatura, sem tocar na data dela.
   *
   * O banco fecha a fatura pelo que ja PROCESSOU, nao pela data da compra:
   * o que cai nos ultimos dias do ciclo vai para a seguinte. A data fica
   * espelhando o extrato; o que muda e a competencia, e a observacao diz por
   * que.
   */
  function moverParaFatura(linha, id, mes, motivo) {
    mes = String(mes || '').trim();
    if (!/^\d{4}-\d{2}$/.test(mes)) return Promise.resolve({ ok: false, erro: 'mes invalido: ' + mes });
    return acharLinha(id || linha).then(function (uuid) {
      if (!uuid) return { ok: false, erro: 'nao achei esse lancamento' };
      return rest('/rest/v1/lancamentos?select=meio,mes_ref,dados&id=eq.' + uuid).then(function (x) {
        var l = x[0] || {};
        if (l.meio !== 'CARTAO_CREDITO') return { ok: false, erro: 'so compra de cartao tem fatura' };
        if (l.mes_ref === mes) return { ok: true, mes: mes, jaEstava: true };
        var dados = l.dados || {};
        var nota = 'fatura ' + l.mes_ref + ' -> ' + mes + (motivo ? ' (' + motivo + ')' : '');
        dados.obs = dados.obs ? dados.obs + ' | ' + nota : nota;
        return mudar('lancamentos', 'id=eq.' + uuid, { mes_ref: mes, dados: dados })
          .then(function () { return { ok: true, de: l.mes_ref, mes: mes }; });
      });
    });
  }

  /**
   * "Em qual conta sua isso caiu?" - e, para compra de cartao, "em qual
   * cartao". Cartao nao guarda saldo, so fatura; quem decide se o destino faz
   * sentido e o MEIO do lancamento, entao qualquer nome do cadastro vale.
   */
  function definirConta(linha, id, conta) {
    conta = String(conta || '').trim();
    if (!conta) return Promise.resolve({ ok: false, erro: 'escolha a conta' });
    return Promise.all([acharLinha(id || linha), idDaConta(conta)]).then(function (r) {
      if (!r[1]) return { ok: false, erro: 'nao conheco a conta ' + conta };
      if (!r[0]) return { ok: false, erro: 'nao achei esse lancamento' };
      return rest('/rest/v1/lancamentos?select=categorias(nome)&id=eq.' + r[0]).then(function (x) {
        var campos = { conta_id: r[1] };
        // PIX entre contas suas: com as duas pontas conhecidas, ele se resolve
        if (((x[0] || {}).categorias || {}).nome === 'TRANSFERENCIA ENTRE CONTAS') {
          campos.status = 'CONFIRMADO';
        }
        return mudar('lancamentos', 'id=eq.' + r[0], campos)
          .then(function () { return { ok: true, conta: conta }; });
      });
    });
  }

  /* Transferência entre contas suas (porte do apiEspelhoTransferencia do
     Codigo.gs). O banco avisa só um dos lados: este lança marca o aviso como
     TRANSFERENCIA ENTRE CONTAS e cria o outro lado na conta escolhida - sai de
     uma, entra na outra, e o mês não conta como receita nem gasto (a categoria
     tem natureza TRANSFERENCIA). Se o outro lado já existe (os dois avisos
     chegaram), só pareia. Sem este porte a tela chamava uma função que não
     existia aqui e nada era gravado. */
  var CAT_TRANSF = 'TRANSFERENCIA ENTRE CONTAS';
  function categoriaTransferencia() {
    return idDaCategoria(CAT_TRANSF).then(function (id) {
      if (id) return id;
      return gravar('categorias', [{ nome: CAT_TRANSF, grupo: 'TRANSFERENCIA', natureza: 'TRANSFERENCIA',
                                     sai_por: 'CAIXA' }], 'user_id,nome')
        .then(function (r) { return r[0].id; });
    });
  }
  function espelhoTransferencia(linha, id, contaDestino) {
    if (!contaDestino) return Promise.resolve({ ok: false, erro: 'escolha a outra conta' });
    return Promise.all([acharLinha(id || linha), idDaConta(contaDestino), categoriaTransferencia()]).then(function (r) {
      var uuid = r[0], destino = r[1], cat = r[2];
      if (!uuid) return { ok: false, erro: 'não achei esse lançamento' };
      if (!destino) return { ok: false, erro: 'não conheço a conta ' + contaDestino };
      return rest('/rest/v1/lancamentos?select=id,data,valor,natureza,meio,conta_id,fornecedor,contas(nome)&id=eq.' + uuid)
        .then(function (x) {
          var l = x[0];
          if (!l) return { ok: false, erro: 'não achei esse lançamento' };
          if (l.conta_id === destino) return { ok: false, erro: 'a outra conta tem que ser diferente desta' };
          var oposta = l.natureza === 'RECEITA' ? 'DESPESA' : 'RECEITA';
          var dia = new Date(l.data + 'T12:00:00'), de = new Date(dia - 4 * 864e5), ate = new Date(+dia + 4 * 864e5);
          var iso = function (d) { return d.toISOString().slice(0, 10); };
          var marca = { categoria_id: cat, status: 'CONFIRMADO' };
          // o outro lado já chegou?
          return rest('/rest/v1/lancamentos?select=id&conta_id=eq.' + destino + '&natureza=eq.' + oposta +
                      '&valor=eq.' + n(l.valor) + '&status=neq.IGNORADO&id=neq.' + uuid +
                      '&data=gte.' + iso(de) + '&data=lte.' + iso(ate) + '&limit=1')
            .then(function (par) {
              var feito = mudar('lancamentos', 'id=eq.' + uuid, marca);
              if (par.length) {
                return feito.then(function () { return mudar('lancamentos', 'id=eq.' + par[0].id, marca); })
                  .then(function () { return { ok: true, criou: false, pareou: true }; });
              }
              var origem = (l.contas || {}).nome || 'OUTRA CONTA';
              var desc = (oposta === 'DESPESA' ? 'TRANSFERENCIA PARA ' : 'TRANSFERENCIA DE ') + origem;
              return feito.then(function () {
                // repetir o toque não cria um terceiro lado
                return rest('/rest/v1/lancamentos?select=id&origem=eq.ESPELHO&origem_id=eq.esp-' + uuid + '&limit=1');
              }).then(function (ja) {
                if (ja.length) return null;
                return gravar('lancamentos', [{
                  data: l.data, mes_ref: String(l.data).slice(0, 7), valor: n(l.valor), natureza: oposta,
                  descricao: desc, fornecedor: desc, conta_id: destino, categoria_id: cat,
                  meio: l.meio === 'CARTAO_CREDITO' ? 'TED' : (l.meio || 'PIX'), status: 'CONFIRMADO',
                  origem: 'ESPELHO', origem_id: 'esp-' + uuid, espelho_de: uuid,
                  dados: { obs: 'outro lado de ' + origem }
                }]);
              }).then(function () { return { ok: true, criou: true }; });
            });
        });
    });
  }

  /* Transferência lançada à mão ("+ lançar" -> transferência): grava este
     lado e cria o outro, como o apiLancarTransferencia do Codigo.gs. */
  function lancarTransferencia(dados, contaDestino) {
    if (!contaDestino) return Promise.resolve({ ok: false, erro: 'diga para qual conta foi' });
    if (String((dados || {}).conta || '') === String(contaDestino)) {
      return Promise.resolve({ ok: false, erro: 'a conta de destino tem que ser diferente da de origem' });
    }
    return lancarManual(dados).then(function (r) {
      if (!r.ok) return r;
      return espelhoTransferencia(null, r.id, contaDestino).then(function (e) {
        if (!e.ok) return e;
        return { ok: true, mes: r.mes, valor: (dados || {}).valor, de: dados.conta, para: contaDestino };
      });
    });
  }

  /* "Distribuir": um gasto repartido entre várias contas (o mercado que foi
     metade comida, metade limpeza). As partes nascem confirmadas; o original
     fica IGNORADO em vez de apagado - apagar deixaria o Open Finance ou o aviso
     trazê-lo de volta na próxima vez. */
  function distribuir(linha, partes, id) {
    partes = (partes || []).filter(function (p) { return p && p.categoria && Number(p.valor); });
    if (!partes.length) return Promise.resolve({ ok: false, erro: 'faltou dizer as partes' });
    return acharLinha(id || linha).then(function (uuid) {
      if (!uuid) return { ok: false, erro: 'lançamento não encontrado' };
      return Promise.all([
        rest('/rest/v1/lancamentos?select=*&id=eq.' + uuid),
        Promise.all(partes.map(function (p) { return idDaCategoria(p.categoria); }))
      ]).then(function (R) {
        var o = R[0][0], ids = R[1];
        if (!o) return { ok: false, erro: 'lançamento não encontrado' };
        var total = n(Math.abs(Number(o.valor)));
        var soma = n(partes.reduce(function (a, p) { return a + (Number(p.valor) || 0); }, 0));
        if (Math.abs(soma - total) > 0.05) {
          return { ok: false, erro: 'as partes somam ' + soma.toFixed(2) + ' e o lançamento é ' + total.toFixed(2) };
        }
        for (var k = 0; k < ids.length; k++) if (!ids[k]) return { ok: false, erro: 'não achei a conta ' + partes[k].categoria };
        var desc = o.fornecedor || o.descricao || '';
        var novas = partes.map(function (p, i) {
          return { data: o.data, mes_ref: o.mes_ref, valor: n(Number(p.valor) * (Number(o.valor) < 0 ? -1 : 1)),
                   natureza: o.natureza, descricao: desc + ' (' + (i + 1) + '/' + partes.length + ')', fornecedor: desc,
                   conta_id: o.conta_id, categoria_id: ids[i], meio: o.meio, status: 'CONFIRMADO',
                   origem: 'RATEIO', origem_id: 'rat-' + uuid + '-' + i, espelho_de: uuid,
                   dados: { obs: 'rateio de ' + total.toFixed(2) } };
        });
        return gravar('lancamentos', novas)
          .then(function () {
            var d = o.dados || {}; d.obs = (d.obs ? d.obs + ' | ' : '') + 'distribuído em ' + partes.length + ' contas';
            return mudar('lancamentos', 'id=eq.' + uuid, { status: 'IGNORADO', dados: d });
          })
          .then(function () {
            var aprender = partes.filter(function (p) { return p.aprender; });
            if (!aprender.length || !desc) return null;
            return gravar('regras', [{ chave: desc, categoria_id: ids[partes.indexOf(aprender[0])], acertos: 0 }], 'user_id,chave');
          })
          .then(function () { return { ok: true, partes: novas.length, total: total }; });
      });
    });
  }

  /* Sugere como repartir um valor entre contas, na proporção do previsto do
     mês (sem previsto, por igual). */
  function sugerirRateio(mesRef, categorias, valor) {
    categorias = categorias || [];
    var v = Number(valor) || 0;
    return Promise.all(categorias.map(function (c) {
      return idDaCategoria(c).then(function (id) {
        if (!id) return 0;
        return rest('/rest/v1/previstos?select=valor&categoria_id=eq.' + id + '&mes_ref=eq.' + mesRef + '&limit=1')
          .then(function (r) { return r.length ? Number(r[0].valor) || 0 : 0; });
      });
    })).then(function (prev) {
      var soma = prev.reduce(function (a, x) { return a + x; }, 0);
      var out = categorias.map(function (c, i) {
        return { categoria: c, previsto: prev[i], valor: n(soma > 0 ? v * prev[i] / soma : v / (categorias.length || 1)) };
      });
      var dif = n(v - out.reduce(function (a, x) { return a + x.valor; }, 0));
      if (Math.abs(dif) >= 0.01 && out.length) {
        var maior = out.reduce(function (a, b) { return b.valor > a.valor ? b : a; });
        maior.valor = n(maior.valor + dif);
      }
      return { valor: v, partes: out, temPrevisto: soma > 0 };
    });
  }

  /* Fim da auditoria: some com os ajustes de fechamento do mês. */
  function apagarAjustes(mesRef) {
    return idDaCategoria('CARTAO - AJUSTE DE FATURA').then(function (id) {
      if (!id) return { ok: true, apagados: 0 };
      return rest('/rest/v1/lancamentos?categoria_id=eq.' + id + '&mes_ref=eq.' + mesRef,
                  { metodo: 'DELETE', prefer: 'return=representation' })
        .then(function (r) { return { ok: true, apagados: (r || []).length }; });
    });
  }

  /* Colar o texto da fatura: na versão nova quem lê fatura é o assistente
     (print ou PDF, com prévia antes de gravar). */
  function textoFaturaNoAssistente() {
    return Promise.resolve({ ok: false, erro: 'Para importar a fatura, abra o assistente ✦ e anexe 📎 o PDF ou um print dela: ele mostra a prévia antes de gravar.' });
  }

  /* ------------------------------------------------------- a classificar */
  /* A cotação do dólar do dia, para o aviso do celular converter compra no
     exterior (o banco grava na hora em que o aviso chega). Uma vez por dia. */
  function guardarCambio() {
    var hoje = new Date().toLocaleDateString('sv-SE', { timeZone: 'America/Sao_Paulo' });
    try { if (localStorage.getItem('easyapp:cambio') === hoje) return; } catch (e) {}
    fetch('https://economia.awesomeapi.com.br/json/last/USD-BRL').then(function (r) { return r.json(); })
      .then(function (j) {
        var v = Number(j && j.USDBRL && j.USDBRL.ask);
        if (!(v > 1 && v < 50)) return;
        return rest('/rest/v1/config?on_conflict=user_id,chave', { metodo: 'POST', prefer: 'resolution=merge-duplicates,return=minimal',
          corpo: { user_id: uid(), chave: 'CAMBIO_USD', valor: v.toFixed(4).replace('.', ',') + '|' + hoje } })
          .then(function () { try { localStorage.setItem('easyapp:cambio', hoje); } catch (e) {} });
      }).catch(function () {});
  }

  function pendentes() {
    guardarCambio();
    return rest('/rest/v1/lancamentos?select=id,data,valor,natureza,descricao,fornecedor,'
                + 'meio,status,origem,origem_id,dados,criado_em,conta_id,contas(nome,instituicao,titular),categorias(nome)'
                + '&status=eq.PENDENTE&order=criado_em.desc&limit=60')
      .then(function (linhas) {
        /* O cartão de pendente do Index lê o formato do linhaParaObj_ do
           Codigo.gs (descricao, dataHora, conta, categoria). Com o paraItem,
           que é o formato do extrato, a tela mostrava "undefined". */
        return linhas.map(function (l) {
          var x = paraItem(l);
          var c = new Date(l.criado_em || l.data);
          x.descricao = l.descricao || l.fornecedor || '';
          x.dataHora = ('0' + c.getDate()).slice(-2) + '/' + ('0' + (c.getMonth() + 1)).slice(-2)
                     + ' ' + ('0' + c.getHours()).slice(-2) + ':' + ('0' + c.getMinutes()).slice(-2);
          x.mes = String(l.data).slice(0, 7);
          x.sugestao = '';
          x.novo = ((l.dados || {}).obs) === 'FORNECEDOR NOVO' || !x.categoria;
          // compra no cartão não tem conta de saldo: só vira caixa na fatura
          x.faltaConta = l.meio !== 'CARTAO_CREDITO' && !x.conta;
          x.mensagem = String(((l.dados || {}).mensagem) || '').slice(0, 200);
          var dd = l.dados || {};
          x.uuid = l.id;
          x.moeda = dd.moeda && dd.moeda !== 'BRL' ? dd.moeda : '';
          x.valorOriginal = Number(dd.valor_original) || 0;
          x.cotacao = Number(dd.cotacao) || 0;
          x.cotacaoAprox = dd.cotacao_dia === 'aproximada';
          x.parcelasAviso = Number(dd.parcelas_aviso) || 0;
          x.perguntarTipo = !!dd.perguntar_tipo && l.meio === 'CARTAO_CREDITO';
          return x;
        });
      });
  }

  /* Fornecedores sem conta, agrupados - o app pergunta uma vez por
     fornecedor, não uma vez por compra. */
  function semCategoria(mes) {
    /* Como o apiSemCategoria do GS: entra quem não tem conta OU está numa
       das contas "a classificar". E PENDENTE fica de fora - ele já tem o
       cartão próprio no topo (Ignorar/Distribuir/Confirmar); sem isto a
       mesma compra aparecia duas vezes. */
    return rest('/rest/v1/categorias?select=id&nome=in.(%22CARTAO%20-%20A%20CLASSIFICAR%22,'
                + '%22CARTAO%20-%20NAO%20CLASSIFICADO%20(HISTORICO)%22)')
      .then(function (cats) {
        var semConta = cats.length
          ? '&or=(categoria_id.is.null,categoria_id.in.(' + cats.map(function (c) { return c.id; }).join(',') + '))'
          : '&categoria_id=is.null';
        return lerTudo('/rest/v1/lancamentos?select=data,mes_ref,valor,natureza,fornecedor,descricao'
                    + semConta + '&status=eq.CONFIRMADO&origem=neq.MANUAL'
                    + '&mes_ref=gte.' + (mes || hojeRef()) + '&order=id');
      })
      .then(function (linhas) {
        var por = {}, total = 0;
        linhas.forEach(function (l) {
          var chave = String(l.fornecedor || l.descricao || '').slice(0, 24).trim();
          if (!chave) return;
          if (!por[chave]) {
            por[chave] = { chave: chave, exemplo: l.descricao || chave, vezes: 0,
                           valor: 0, ultima: '', natureza: l.natureza, origem: 'SEM CATEGORIA',
                           meses: {} };
