/* Para onde vai o dinheiro e como fazer o plano caber.
   Sem isto o app so dizia "nao cabe" - e voce ficava sem saber por onde
   comecar. Cada alternativa diz quanto libera por mes e o que fazer. */
function blocoDiagnostico(p, falta){
  var d=p.diagnostico; if(!d) return '';
  var h='';

  if(d.maiores && d.maiores.length){
    h+='<div class="lbl" style="margin:14px 0 6px">Para onde vai o dinheiro</div>'+
       '<div class="card" style="padding:10px 12px">'+
       '<div class="m" style="font-size:11.5px;margin-bottom:6px">entram '+mil(d.receita)+
       ' por mês em média; '+(d.sobra>=0?'sobram '+mil(d.sobra):'<b class="neg">faltam '+
       mil(-d.sobra)+'</b>')+'. As maiores contas:</div>';
    d.maiores.forEach(function(x){
      h+='<div class="ln" style="grid-template-columns:1fr auto auto;grid-template-areas:none">'+
         '<span style="font-size:12.5px">'+tx(x.conta)+'</span>'+
         '<span class="n" style="font-size:12px">'+seco(x.gasto)+'</span>'+
         '<span class="n" style="font-size:11px;color:var(--dim);min-width:46px">'+
           num(x.pct)+'%</span></div>';
    });
    h+='</div>';
  }

  var alav=(d.alavancas||[]).slice();
  if(alav.length || d.renda){
    h+='<div class="lbl" style="margin:14px 0 6px">'+(falta>0
         ? 'Como abrir os '+mil(falta)+' que faltam' : 'Onde dá para mexer')+'</div>';
    var acum=0;
    alav.forEach(function(a){
      acum+=a.ganho;
      h+='<div class="card" style="padding:10px 12px">'+
         '<div class="row"><div class="d" style="font-size:13.5px;font-weight:600">'+tx(a.titulo)+'</div>'+
         '<div class="n pos" style="font-weight:700">+'+seco(a.ganho)+
           '<i style="display:block;font-size:9px;color:var(--dim);font-style:normal;'+
           'font-weight:400;text-align:right">por mês</i></div></div>'+
         '<div class="m" style="font-size:11px;margin-top:2px">hoje '+mil(a.gasto)+' por mês'+
           (a.corte?' · cortar '+Math.round(a.corte*100)+'%':'')+'</div>'+
         '<div class="m" style="font-size:12px;margin-top:5px;color:var(--txt)">'+a.dica+'</div>'+
         (falta>0?'<div class="m" style="font-size:10.5px;margin-top:5px;opacity:.75">somando até '+
           'aqui: '+mil(acum)+(acum>=falta?' — já cobre o plano':' de '+mil(falta))+'</div>':'')+
         '</div>';
    });
    if(d.renda && d.renda.ganho){
      h+='<div class="card" style="padding:10px 12px;border-left:3px solid var(--acc)">'+
         '<div class="row"><div class="d" style="font-size:13.5px;font-weight:600">Aumentar a renda</div>'+
         '<div class="n pos" style="font-weight:700">+'+seco(d.renda.ganho)+
           '<i style="display:block;font-size:9px;color:var(--dim);font-style:normal;'+
           'font-weight:400;text-align:right">por mês</i></div></div>'+
         '<div class="m" style="font-size:12px;margin-top:5px;color:var(--txt)">'+d.renda.dica+'</div>'+
         (falta>0 && acum<falta?'<div class="m" style="font-size:10.5px;margin-top:5px;opacity:.75">'+
           'com os cortes: '+mil(acum+d.renda.ganho)+(acum+d.renda.ganho>=falta
             ?' — cobre o plano':' de '+mil(falta)+'. Ainda falta: alongue o prazo ou baixe o alvo')+
           '</div>':'')+
         '</div>';
    }
  }

  if(d.folgas && d.folgas.length){
    h+='<div class="lbl" style="margin:14px 0 6px">Folgas que já estão contratadas</div>'+
       '<div class="card" style="padding:10px 12px">'+
       '<div class="m" style="font-size:11.5px;margin-bottom:6px">contas que acabam sozinhas — '+
       'a partir daí esse dinheiro pode ir para o plano</div>';
    d.folgas.forEach(function(f){
      h+='<div class="ln" style="grid-template-columns:1fr auto;grid-template-areas:none">'+
         '<span style="font-size:12.5px">'+tx(f.conta)+
           '<i class="sub">acaba em '+f.ate.substring(5)+'/'+f.ate.substring(0,4)+'</i></span>'+
         '<span class="n pos">+'+seco(f.libera)+'</span></div>';
    });
    h+='</div>';
  }
  return h;
}

function calcularAlvo(){
  var v=parseFloat(String(el('alvoV').value||'0').replace(/\./g,'').replace(',','.'))||0;
  var a=Number(el('alvoA').value)||0;
  if(!v){ toast('Digite quanto você quer ter'); return; }
  el('alvoSaida').innerHTML='<div class="m" style="margin-top:8px">Calculando…</div>';
  google.script.run.withSuccessHandler(function(r){
    if(!r||!r.ok){ el('alvoSaida').innerHTML='<div class="m neg" style="margin-top:8px">'+
      ((r&&r.erro)||'')+'</div>'; return; }
    ST.alvoCalc=r;
    var txt='<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:9px">';
    if(r.bastaOqueTenho){
      txt+='<div class="m" style="font-size:12.5px;color:var(--ok)">O que você já tem vira '+
        mil(r.semAporte.liquido)+' sozinho até '+r.ano+'. Esse alvo não exige guardar nada.</div>';
    } else {
      txt+='<div class="lbl">Guardar por mês</div>'+
        '<div class="big" style="font-size:28px;color:'+(r.viavel?'var(--ok)':'var(--bad)')+'">'+
        moeda(r.aporte)+'</div>'+
        '<div class="m" style="font-size:12px;margin-top:4px">'+
        (r.viavel ? 'Cabe — a projeção diz que sobram '+mil(r.capacidade)+' por mês.'
                  : 'Não cabe: sobram só '+mil(r.capacidade)+' por mês.')+'</div>'+
        '<button class="'+(r.viavel?'bt-ok':'bt-no')+'" style="width:100%;margin-top:9px" '+
        'onclick="usarAlvo()">Seguir este plano</button>';
    }
    el('alvoSaida').innerHTML=txt+'</div>';
  }).withFailureHandler(function(e){ toast('Falhou: '+((e&&e.message)||e)); })
    .apiCalcularAlvo(v, a);
}

function gravarAlvo(dados){
  toast('Guardando…');
  google.script.run.withSuccessHandler(function(r){
    if(!r||!r.ok){ toast((r&&r.erro)||'Não consegui'); return; }
    toast('Plano definido. As metas já seguem ele.');
    ST.plano=null; ST.metas=null; ST.trocandoAlvo=false;
    carregarPlano();
  }).withFailureHandler(function(e){ toast('Falhou: '+((e&&e.message)||e)); })
    .apiDefinirAlvo(dados);
}

function usarSugestao(i){
  var x=ST.plano.sugestoes[i];
  gravarAlvo({ aporte:x.aporte, alvo:x.patrimonio, ano:ST.plano.anoFinal, nome:x.nome });
}
function usarAlvo(){
  var r=ST.alvoCalc; if(!r) return;
  gravarAlvo({ aporte:r.aporte, alvo:r.alvo, ano:r.ano,
               nome:mil(r.alvo)+' em '+r.ano });
}

/* A projecao ate a meta custa segundos e nao depende do mes escolhido. Ela
   vem sozinha quando o Painel abre, e o que estava na tela continua valendo
   enquanto ela nao chega. */
function garantirProjecaoLonga(){
  if(ST.projLonga || ST.buscandoProj) return;
  ST.buscandoProj=true;
  google.script.run.withSuccessHandler(function(p){
    ST.buscandoProj=false;
    if(!p || !p.meses) return;
    ST.projLonga=p;
    if(ST.telaAtual==='analise' && ST.modoAnalise==='PAINEL') renderPainel();
  }).withFailureHandler(function(){ ST.buscandoProj=false; })
    .apiProjecaoFutura(0);
}

function blocoProximos(){
  garantirProjecaoLonga();
  var p=ST.projLonga || ST.projecaoAnual;
  if(!p || !p.meses) return '';
  var h='<div class="card"><div class="row" style="margin-bottom:6px">'+
    '<div class="lbl">Caixa projetado</div>'+
    '<span class="num" style="font-weight:700;font-size:13px">parte de '+
      moeda(p.saldoInicial)+'</span></div>'+
    '<div class="m" style="font-size:11px;margin-bottom:8px">cada mês começa com o que '+
    'sobrou do anterior. <b>no mês</b> é o que ele próprio produziu (entra menos sai); '+
    '<b>fecha com</b> é o saldo em conta no último dia dele. Valores em reais.</div>';

  var anoAgora = Number((ST.mes||'').split('-')[0]) || new Date().getFullYear();
  h+='<div class="lbl" style="margin:10px 0 2px">'+anoAgora+', mês a mês</div>'+
     '<div class="cab-ln fica proj" style="grid-template-columns:32px 1fr 1fr 1fr 1.02fr">'+
     '<span style="text-align:left">mês</span><span>entra</span><span>sai</span>'+
     '<span>no mês</span><span>fecha com</span></div>';
  p.meses.filter(function(m){return m.ano===anoAgora;}).forEach(function(m){
    h+='<div class="ln proj" style="grid-template-columns:32px 1fr 1fr 1fr 1.02fr">'+
       '<span style="font-size:11.5px;color:var(--dim)">'+CURTO[m.mes]+'</span>'+
       '<span class="n pos">'+seco(m.receita)+'</span>'+
       '<span class="n neg">'+seco(m.despesa)+'</span>'+
       '<span class="n '+(m.saldo>=0?'pos':'neg')+'">'+
         (m.saldo>=0?'+':'')+seco(m.saldo)+'</span>'+
       '<span class="n '+(m.acumulado>=0?'pos':'neg')+'" style="font-weight:600">'+
         seco(m.acumulado)+'</span></div>';
  });

  if(p.anos && p.anos.filter(function(a){return a.ano!==anoAgora;}).length){
    h+='<div style="border-top:1px solid var(--line);margin-top:10px;padding-top:9px">'+
       '<div class="lbl" style="margin-bottom:6px">Ano a ano</div>'+
       '<div class="m" style="font-size:11px;margin-bottom:6px">toque num ano para '+
       'abrir mês a mês</div>'+
       '<div class="cab-ln fica proj" style="grid-template-columns:46px 1fr 1fr 1fr 1.02fr">'+
       '<span style="text-align:left">ano</span><span>entra</span><span>sai</span>'+
       '<span>no ano</span><span>fecha com</span></div>';
    ST.anoAberto = ST.anoAberto || 0;
    // o ano corrente nao repete: ele ja esta aberto mes a mes aqui em cima
    p.anos.filter(function(a){ return a.ano!==anoAgora; }).forEach(function(a){
      var aberto = ST.anoAberto===a.ano;
      h+='<div class="ln proj" style="grid-template-columns:46px 1fr 1fr 1fr 1.02fr;cursor:pointer" '+
         'onclick="ST.anoAberto=(ST.anoAberto===' +a.ano+ '?0:' +a.ano+ ');renderPainel()">'+
         '<span><span class="seta'+(aberto?' aberta':'')+'">&#9656;</span>'+a.ano+
           '<br><span style="font-size:9px;color:var(--dim)">'+
           a.meses+' meses</span></span>'+
         '<span class="n pos">'+seco(a.receita)+'</span>'+
         '<span class="n neg">'+seco(a.despesa)+'</span>'+
         '<span class="n '+(a.saldo>=0?'pos':'neg')+'">'+
           (a.saldo>=0?'+':'')+seco(a.saldo)+'</span>'+
         '<span class="n '+(a.acumulado>=0?'pos':'neg')+'" style="font-weight:600">'+
           seco(a.acumulado)+'</span></div>';
      if(!aberto) return;
      // resumo mensal do ano clicado
      h+='<div style="background:#0d1320;border-radius:8px;padding:6px 8px;margin:2px 0 8px">'+
         '<div class="cab-ln fica proj" style="grid-template-columns:30px 1fr 1fr 1fr 1.02fr">'+
         '<span style="text-align:left">mês</span><span>entra</span><span>sai</span>'+
         '<span>no mês</span><span>fecha com</span></div>';
      p.meses.filter(function(m){return m.ano===a.ano;}).forEach(function(m){
        h+='<div class="ln proj" style="grid-template-columns:30px 1fr 1fr 1fr 1.02fr;padding:3px 0">'+
           '<span style="font-size:11px;color:var(--dim)">'+CURTO[m.mes]+'</span>'+
           '<span class="n pos">'+seco(m.receita)+'</span>'+
           '<span class="n neg">'+seco(m.despesa)+'</span>'+
           '<span class="n '+(m.saldo>=0?'pos':'neg')+'">'+
             (m.saldo>=0?'+':'')+seco(m.saldo)+'</span>'+
           '<span class="n '+(m.acumulado>=0?'pos':'neg')+'" style="font-weight:600">'+
             seco(m.acumulado)+'</span></div>';
      });
      h+='</div>';
    });
    h+='</div>';
  }

  if(p.eventos && p.eventos.length){
    h+='<div class="m" style="font-size:11px;margin-top:8px">já inclui: '+
       p.eventos.map(function(e){
         return e.oque+' '+mil(e.valor)+' ('+CURTO[e.mes]+'/'+String(e.ano).substring(2)+')';
       }).join(' · ')+'</div>';
  }
  return h+'</div>';
}

function kpi(k,v,n,cor){
  return '<div class="kpi"><div class="k">'+k+'</div>'+
         '<div class="v '+(cor||'')+'">'+v+'</div><div class="n">'+n+'</div></div>';
}

function grafBarras(serie){
  var com=serie.filter(function(s){return s.temDados;});
  if(!com.length) return '';
  var W=340,H=150,base=H-18,topo=6;
  var max=Math.max.apply(null,com.map(function(s){return Math.max(s.receita,s.despesa);}))*1.1||1;
  var lar=(W-16)/com.length, bw=Math.min(9,lar*0.28);
  var y=function(v){ return base-(v/max)*(base-topo); };
  var s='';
  com.forEach(function(d,i){
    var cx=8+lar*i+lar/2;
    s+='<rect x="'+(cx-bw-1)+'" y="'+y(d.receita)+'" width="'+bw+'" height="'+(base-y(d.receita))+'" fill="#22c55e" rx="1.5"/>';
    s+='<rect x="'+(cx+1)+'" y="'+y(d.despesa)+'" width="'+bw+'" height="'+(base-y(d.despesa))+'" fill="'+
       (d.despesa>d.receita?'#ef4444':'#64748b')+'" rx="1.5"/>';
    s+='<text x="'+(cx-bw/2-1)+'" y="'+(y(d.receita)-3)+'" font-size="6.5" fill="#22c55e" '+
       'text-anchor="middle">'+(d.receita/1000).toFixed(0)+'</text>';
    s+='<text x="'+(cx+bw/2+1)+'" y="'+(y(d.despesa)-3)+'" font-size="6.5" fill="'+
       (d.despesa>d.receita?'#ef4444':'#94a3b8')+'" text-anchor="middle">'+
       (d.despesa/1000).toFixed(0)+'</text>';
    s+='<text x="'+cx+'" y="'+(H-5)+'" font-size="8.5" fill="#8b99b5" text-anchor="middle">'+CURTO[d.mes]+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'">'+s+
         '<line x1="8" y1="'+base+'" x2="'+(W-8)+'" y2="'+base+'" stroke="#2a3548"/></svg>'+
         '<div class="legend" style="margin-top:6px">'+
         '<span><i class="swatch" style="background:#22c55e"></i>entrou</span>'+
         '<span><i class="swatch" style="background:#64748b"></i>saiu</span>'+
         '<span><i class="swatch" style="background:#ef4444"></i>saiu mais que entrou</span>'+
         '<span style="opacity:.7">valores em mil</span></div>';
}

function grafLinha(serie, meta){
  // vai ate o fim do ano: os meses que ainda nao fecharam ja tem fatura
  // montada (parcelas e compras lancadas) e entram tracejados
  var com=serie.filter(function(s){return s.temDados || s.cartao>0;});
  if(!com.length) return '';
  var W=340,H=140,base=H-18,topo=8;
  var max=Math.max(meta,Math.max.apply(null,com.map(function(s){return s.cartao;})))*1.12||1;
  var x=function(i){ return 10+(com.length<2?0:i/(com.length-1)*(W-20)); };
  var y=function(v){ return base-(v/max)*(base-topo); };
  var p='',pf='',pts='';
  com.forEach(function(d,i){
    var fut=!d.temDados;
    var cor= fut?'#8b99b5':'#f59e0b';
    if(!fut) p+=(p?'L':'M')+x(i).toFixed(1)+' '+y(d.cartao).toFixed(1)+' ';
    // o tracejado comeca no ultimo mes fechado, para a linha nao ficar solta
    if(fut || (i+1<com.length && !com[i+1].temDados))
      pf+=(pf?'L':'M')+x(i).toFixed(1)+' '+y(d.cartao).toFixed(1)+' ';
    pts+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(d.cartao).toFixed(1)+'" r="2.6" fill="'+cor+'"'+
         (fut?' fill-opacity=".65"':'')+'/>';
    pts+='<text x="'+x(i).toFixed(1)+'" y="'+(y(d.cartao)-7).toFixed(1)+'" font-size="8" '+
         'fill="'+cor+'" text-anchor="middle">'+(d.cartao/1000).toFixed(1).replace('.',',')+'K</text>';
    pts+='<text x="'+x(i).toFixed(1)+'" y="'+(H-5)+'" font-size="8.5" fill="'+
         (fut?'#5b6880':'#8b99b5')+'" text-anchor="middle">'+CURTO[d.mes]+'</text>';
  });
  var lm = meta>0 ? '<line x1="10" y1="'+y(meta).toFixed(1)+'" x2="'+(W-10)+'" y2="'+y(meta).toFixed(1)+
      '" stroke="#64748b" stroke-dasharray="4 4"/><text x="'+(W-10)+'" y="'+(y(meta)-4).toFixed(1)+
      '" font-size="8.5" fill="#8b99b5" text-anchor="end">meta '+(meta/1000).toFixed(1).replace('.',',')+'K</text>' : '';
  return '<svg viewBox="0 0 '+W+' '+H+'">'+lm+
         '<path d="'+p+'" fill="none" stroke="#f59e0b" stroke-width="2"/>'+
         (pf?'<path d="'+pf+'" fill="none" stroke="#8b99b5" stroke-width="1.6" '+
             'stroke-dasharray="4 3"/>':'')+pts+
         '<line x1="10" y1="'+base+'" x2="'+(W-10)+'" y2="'+base+'" stroke="#2a3548"/></svg>'+
         '<div class="legend" style="margin-top:6px">'+
         '<span><i class="swatch" style="background:#f59e0b"></i>fatura fechada</span>'+
         '<span><i class="swatch" style="background:#8b99b5"></i>ainda em formação</span></div>';
}

function diagnostico(a, mediaDesp, mediaRec, mediaCart){
  var d=[];
  if(a.taxaPoupanca<0){
    d.push(['ruim','Você gasta mais do que ganha',
      'No ano, saíram '+moeda(a.despesaTotal)+' contra '+moeda(a.receitaTotal)+' que entraram. '+
      'São '+moeda(Math.abs(a.saldoTotal)/a.mesesComDados)+' de rombo por mês, em média.']);
  } else if(a.taxaPoupanca<20){
    d.push(['','Poupança abaixo do necessário',
      'Você guarda '+a.taxaPoupanca.toFixed(1).replace('.',',')+'% do que ganha. '+
      'Para construir independência, a referência é 20% a 30%.']);
  } else {
    d.push(['bom','Poupança em bom nível',
      'Você guarda '+a.taxaPoupanca.toFixed(1).replace('.',',')+'% do que ganha.']);
  }

  if(a.pesoCartao>25){
    d.push([a.pesoCartao>40?'ruim':'', 'O cartão come '+a.pesoCartao.toFixed(1).replace('.',',')+'% da sua renda',
      moeda(mediaCart)+' por mês em média. Acima de 25% da renda, o cartão deixa de ser meio '+
      'de pagamento e vira dívida rotativa esperando acontecer.']);
  }

  var top=a.categorias.filter(function(x){return x.valor>0;});
  if(top.length){
    var t=top[0];
    d.push(['','Maior destino: '+t.categoria,
      moeda(t.valor)+' no ano, '+moeda(t.valor/a.mesesComDados)+' por mês — '+
      Math.round(t.valor/a.despesaTotal*100)+'% de tudo que você gastou.']);
    var tres=top.slice(0,3).reduce(function(s,x){return s+x.valor;},0);
    d.push(['','As 3 maiores categorias somam '+Math.round(tres/a.despesaTotal*100)+'% do gasto',
      top.slice(0,3).map(function(x){return x.categoria;}).join(' · ')+'. '+
      'É aqui que um corte muda o resultado; o resto é migalha.']);
  }

  var naoClass=a.serie.reduce(function(s,x){return s+x.aClassificar;},0);
  if(naoClass>0){
    d.push(['','Ainda há '+moeda(naoClass)+' sem categoria',
      'São compras do cartão que o app não soube classificar. Enquanto elas existirem, '+
      'o diagnóstico acima tem essa margem de erro.']);
  }

  var piores=a.serie.filter(function(s){return s.temDados && s.saldo<0;});
  if(piores.length){
    piores.sort(function(x,y){return x.saldo-y.saldo;});
    d.push([piores.length>a.mesesComDados/2?'ruim':'',
      piores.length+' de '+a.mesesComDados+' meses fecharam no vermelho',
      'O pior foi '+NOMES_MES[piores[0].mes]+', com '+moeda(piores[0].saldo)+'.']);
  }

  return d.map(function(x){
    return '<div class="diag '+x[0]+'"><b>'+x[1]+'</b><span>'+x[2]+'</span></div>';
  }).join('');
}

function renderCartao(){
  var k=ST.cartao, c=el('tela-cartao');
  if(!k){ c.innerHTML=''; return; }
  var acima = k.total - k.metaAteHoje;      // >0 = gastando mais rapido que o permitido
  var h='';

  h+='<div class="card">'+
    '<div class="row"><div><div class="lbl">Onde estou</div>'+
      '<div class="big '+(acima>0?'neg':'pos')+'">'+moeda(k.total)+'</div></div>'+
    '<div style="text-align:right"><div class="lbl">Onde deveria estar</div>'+
      '<div class="num" style="font-size:22px;font-weight:700;color:var(--dim)">'+
      moeda(k.metaAteHoje)+'</div></div></div>'+
    '<div class="m" style="margin-top:4px;font-size:13px;color:'+(acima>0?'var(--bad)':'var(--ok)')+'">'+
      (acima>0 ? moeda(acima)+' acima do ritmo' : moeda(-acima)+' de folga')+
      ' · dia '+k.hoje+' de '+k.dias+' do ciclo</div>'+
    '<div class="m" style="font-size:11px">fatura de '+(k.ciclo||'')+
      (k.fechada?' · já fechada':' · fecha em '+(k.dias-k.hoje)+' dias')+'</div>'+
    barraComMarca(k.total, k.meta, k.metaAteHoje)+
    '<div class="m" style="font-size:11.5px;margin-top:5px">o traço branco é onde você '+
      'deveria estar hoje · meta do mês '+moeda(k.meta)+
      (k.pendente>0?' · '+moeda(k.pendente)+' ainda não confirmado':'')+'</div></div>';

  h+='<div class="kpis" style="margin-bottom:12px">'+
     kpi('Posso gastar por dia', moeda(k.porDiaDisponivel),
         (k.fechada?'fatura fechada':'nos '+k.diasRestantes+' dias que faltam'),
         k.porDiaDisponivel<0?'neg':'pos')+
     kpi('Meta por dia', moeda(k.meta/k.dias), 'se fosse parelho o mês todo','')+
     kpi('Projeção', moeda(k.projecao),
         k.projecao>k.meta?'estoura '+moeda(k.projecao-k.meta):'dentro da meta',
         k.projecao>k.meta?'neg':'pos')+
     kpi('Gasto médio/dia', moeda(k.hoje>0?k.total/k.hoje:0),
         'até agora neste mês','')+
     '</div>';

  h+='<div class="card"><div class="lbl" style="margin-bottom:8px">Ritmo: meta x real</div>'+
     grafico(k)+'</div>';

  var cats=(k.porCategoria||[]).filter(function(x){return x.gasto>0||x.meta>0;});
  // o filtro de família do cabeçalho também vale aqui: antes ele mudava a
  // barra de cima e a lista de verbas continuava a mesma
  if(ST.familia && ST.familia!=='TUDO'){
    cats = cats.filter(function(x){ return (x.grupo||familiaDe(x.categoria))===ST.familia; });
  }
  if(cats.length){
    // Tres blocos, nesta ordem: o que ja estourou (e onde doi), o que ainda
    // tem saldo, e o que nao tem meta nenhuma. Dentro de cada um, do maior
    // gasto para o menor.
    var porGasto = function(a,b){ return b.gasto-a.gasto; };
    var estourou = function(x){ return x.meta>0 && x.sobra<0; };
    var estouradas = cats.filter(estourou).sort(porGasto);
    var comSaldo   = cats.filter(function(x){return x.meta>0 && !estourou(x);}).sort(porGasto);
    var semMeta    = cats.filter(function(x){return !(x.meta>0);}).sort(porGasto);
    h+='<div class="card"><div class="lbl" style="margin-bottom:4px">Por tipo de gasto</div>';
    var desenha=function(x){
      var temMeta=x.meta>0;
      var usado=x.gasto+(x.fora||0);   // a verba inteira: cartao + o que saiu pela conta
      var atrasado=temMeta && x.metaAteHoje!==null && usado>x.metaAteHoje;
      var cc=!temMeta?'':(x.sobra<0?'neg':(atrasado?'wr':'pos'));
      var corBar=x.sobra<0?'var(--bad)':(atrasado?'var(--warn)':'var(--ok)');
      h+='<div class="tg"><div class="nm">'+ponto(familiaDe(x.categoria))+tx(x.categoria)+'</div>'+
         '<div class="tg-num"><span class="meta">'+
           (temMeta?'meta '+num(x.meta)+(x.fora>0?' · '+num(x.fora)+' pela conta':'')
                   :'sem meta')+'</span>'+
         '<span class="'+cc+'" style="font-weight:600">'+(temMeta?num(x.sobra):'—')+'</span>'+
         '<span class="'+cc+'">'+(!temMeta?'—':x.sobra<0
             ? Math.round(-x.sobra/x.meta*100)+'% acima' : num(x.porDia))+'</span></div>';
      // o gasto vai escrito na ponta da barra: dentro dela se couber, logo
      // depois se a barra ainda for curta
      var p=temMeta?Math.min(100,Math.round(usado/x.meta*100)):(usado>0?100:0);
      // o traço branco: onde esta conta deveria estar hoje (como na barra de cima)
      var mk=(temMeta && x.metaAteHoje!==null && x.metaAteHoje!==undefined)
        ? '<em class="marca" style="left:'+Math.min(100,Math.max(0,x.metaAteHoje/x.meta*100)).toFixed(1)+'%"></em>' : '';
      h+='<div class="tgbar"><i style="width:'+p+'%;background:'+(temMeta?corBar:'#334155')+'"></i>'+mk+
         (usado<=0.005 ? ''
          : p>=34 ? '<b style="right:'+(100-p)+'%;padding-right:7px;color:'+
                    (temMeta?'#0f1420':'var(--txt)')+'">'+num(usado)+'</b>'
                  : '<b style="left:'+p+'%;padding-left:6px;color:var(--txt)">'+num(usado)+'</b>')+
         '</div></div>';
    };
    var bloco=function(titulo, cor, extra, lista){
      if(!lista.length) return;
      h+='<div class="lbl" style="margin:14px 0 6px;padding-top:10px;'+
         'border-top:1px solid var(--line);color:'+cor+'">'+titulo+
         (extra?'<span style="text-transform:none;letter-spacing:0;color:var(--dim);'+
                'font-weight:400"> — '+extra+'</span>':'')+'</div>';
      h+='<div class="tg-cab"><span></span><span>saldo</span><span>por dia</span></div>';
      lista.forEach(desenha);
    };
    if(estouradas.length){
      var passou=estouradas.reduce(function(t,x){return t-x.sobra;},0);
      bloco('Estourou a meta','var(--bad)',moeda(passou)+' acima no total',estouradas);
    }
    bloco('Ainda tem saldo','var(--ok)','',comSaldo);
    bloco('Sem meta definida','var(--dim)','defina na aba Mês para entrar no controle',semMeta);
    h+='</div>';
  }
  c.innerHTML=h;
}

function familiaDe(cat){
  var g=(ST.resumo&&ST.resumo.grupos)||[];
  for(var i=0;i<g.length;i++){
    for(var j=0;j<g[i].itens.length;j++) if(g[i].itens[j].categoria===cat) return g[i].grupo;
  }
  return 'OUTROS';
}

/* Calendario do mes: verde = dia dentro do ritmo, vermelho = acima */
function calendario(k){
  if(!k.serie||!k.serie.length) return '';
  var h='<div class="dias">';
  k.serie.forEach(function(s){
    var c='#141b28', t='var(--dim)';
    if(s.real!==null){
      var dentro = s.real <= s.meta;
      c = dentro ? 'rgba(34,197,94,.22)' : 'rgba(239,68,68,.25)';
      t = dentro ? '#86efac' : '#fca5a5';
    }
    h+='<div style="background:'+c+';color:'+t+'" title="'+tx(s.rotulo||'')+'">'+
       (s.rotulo?s.rotulo.split('/')[0]:s.dia)+'</div>';
  });
  return h+'</div><div class="m" style="font-size:10.5px;margin-top:6px">'+
    'cada quadradinho é um dia: verde = acumulado dentro da meta, vermelho = acima</div>';
}

function grafico(k){
  /* O ritmo do cartão: a área é o gasto acumulado dia a dia (verde dentro da
     meta, vermelho acima dela), o tracejado é a meta por dia. Três rótulos só:
     onde estou hoje, a projeção do fim e a meta. */
  var W=320, H=165, L=6, R=6, T=22, B=20;
  var serie=k.serie||[], dias=k.dias||30;
  var reais=serie.filter(function(x){return x.real!==null;});
  var hoje=reais.length?reais[reais.length-1]:{dia:1,real:0};
  var proj=k.projecao||k.total||0;
  var max=Math.max(k.meta, k.total, proj)*1.08||1;
  var X=function(d){ return L+(d-1)/((dias-1)||1)*(W-L-R); };
  var Y=function(v){ return T+(1-v/max)*(H-T-B); };
  var acima=k.total>k.metaAteHoje, corR=acima?'#ef4444':'#22c55e';
  var pm='', pr='';
  serie.forEach(function(x){ pm+=(pm?'L':'M')+X(x.dia).toFixed(1)+','+Y(x.meta).toFixed(1)+' '; });
  reais.forEach(function(x){ pr+=(pr?'L':'M')+X(x.dia).toFixed(1)+','+Y(x.real).toFixed(1)+' '; });
  var area=pr?pr+'L'+X(hoje.dia).toFixed(1)+','+(H-B)+' L'+X(reais[0].dia).toFixed(1)+','+(H-B)+' Z':'';
  var kk=function(v){ return v>=1000?(v/1000).toFixed(1).replace('.',',')+'k':Math.round(v)+''; };
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block">'+
    '<defs><linearGradient id="gRit" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="'+corR+'" stop-opacity=".4"/>'+
    '<stop offset="1" stop-color="'+corR+'" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+pm+'" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4 4"/>'+
    (area?'<path d="'+area+'" fill="url(#gRit)"/>':'')+
    (!k.fechada?'<path d="M'+X(hoje.dia).toFixed(1)+','+Y(hoje.real).toFixed(1)+' L'+X(dias).toFixed(1)+','+Y(proj).toFixed(1)+
      '" fill="none" stroke="'+corR+'" stroke-opacity=".45" stroke-width="1.8" stroke-dasharray="2 4"/>':'')+
    (pr?'<path d="'+pr+'" fill="none" stroke="'+corR+'" stroke-width="3" stroke-linejoin="round"/>':'')+
    '<circle cx="'+X(hoje.dia).toFixed(1)+'" cy="'+Y(hoje.real).toFixed(1)+'" r="5" fill="'+corR+'" stroke="#0f1420" stroke-width="2"/>'+
    '<text x="'+Math.min(W-60,X(hoje.dia)+8).toFixed(1)+'" y="'+(Y(hoje.real)-8).toFixed(1)+'" font-size="11.5" font-weight="800" fill="'+corR+'">hoje '+kk(hoje.real)+'</text>'+
    '<text x="'+(W-R)+'" y="'+(Y(k.meta)-6).toFixed(1)+'" text-anchor="end" font-size="10.5" fill="#94a3b8">meta '+kk(k.meta)+'</text>'+
    (!k.fechada?'<text x="'+(W-R)+'" y="'+(Y(proj)+(proj>k.meta?-6:14)).toFixed(1)+'" text-anchor="end" font-size="10.5" font-weight="700" fill="'+corR+'">projeção '+kk(proj)+'</text>':'')+
    '</svg><div class="m" style="font-size:10.5px">área = seu gasto acumulado · tracejado = meta por dia</div>';
}

      'onclick="trocarExtrato(\'CARTAO\')">Cartão</button></div>';

  // tudo numa linha so: o campo largo e os tres botoes ocupavam meia tela
  var busca='<div class="card" style="padding:8px 10px">'+
    '<div class="row" style="gap:6px">'+
      '<input id="busca" placeholder="buscar" style="margin:0;flex:1;padding:7px 9px;font-size:13px" '+
        'value="'+(ST.busca||'').replace(/"/g,'&quot;')+'" '+
        'oninput="buscaAoDigitar(this.value)" '+
        'onkeydown="if(event.key===\'Enter\')aplicarBusca()">'+
      (ST.busca?'<button class="bt-no" style="padding:7px 10px;font-size:12.5px" '+
        'onclick="limparBusca()">Limpar</button>':'')+
      '<button class="bt-no" style="padding:7px 11px;font-size:12.5px;background:var(--acc);color:#fff" '+
        'onclick="abrirLancar()">+&nbsp;lançar</button>'+
    '</div></div>';

  if(!ST.extrato){
    var pronto=extratoAdiantado();
    if(pronto){ ST.extrato=pronto; }
  }
  if(!ST.extrato){
    c.innerHTML=abas+busca+'<div class="load">Buscando...</div>';
    var ok=function(e){ ST.extrato=e; renderExtrato(); };
    var erro=function(err){ c.innerHTML=abas+'<div class="vazio">Erro: '+
      ((err&&err.message)||err)+'</div>'; };
    if(ST.modoEx==='CONTA')
      google.script.run.withSuccessHandler(ok).withFailureHandler(erro)

    else
      google.script.run.withSuccessHandler(ok).withFailureHandler(erro)

    (ST.modoEx==='CONTA' ? extratoConta(ST.extrato) : extratoCartao(ST.extrato));
}

function trocarExtrato(m){ ST.modoEx=m; ST.extrato=null; mesDoExtrato(); renderExtrato(); }

/* Conta corrente mostra o mes corrente; cartao mostra a fatura que esta correndo. */
function mesDoExtrato(){
  var alvo = (ST.modoEx==='CARTAO' && ST.saldos && ST.saldos.cartoes && ST.saldos.cartoes.mes)
    ? ST.saldos.cartoes.mes : mesDeHoje();
  if(ST.mes!==alvo){ ST.extrato=null; carregar(alvo, true); }
}
function aplicarBusca(){
  var e=el('busca'); if(e) ST.busca=e.value;
  ST.extrato=null; renderExtrato();
}

/* Busca enquanto digita. O servidor so e chamado depois de uma pausa: a cada
   tecla seria uma ida ao Apps Script, e ele leva segundos para responder.
   O foco e a posicao do cursor voltam para onde estavam. */
var _buscaTimer=null;
function buscaAoDigitar(v){
  ST.busca=v;
  if(_buscaTimer) clearTimeout(_buscaTimer);
  _buscaTimer=setTimeout(function(){
    var e=el('busca');
    var pos=e?e.selectionStart:null;
    ST.extrato=null; renderExtrato();
    var n=el('busca');
    if(n){ n.focus(); try{ if(pos!==null) n.setSelectionRange(pos,pos); }catch(x){} }
  }, 420);
}
/* O Limpar zerava ST.busca e chamava aplicarBusca, que lia o campo de novo
   e devolvia o texto para ST.busca - por isso nunca limpava nada. */
function limparBusca(){
  ST.busca='';
  var e=el('busca'); if(e) e.value='';
  ST.extrato=null; renderExtrato();
}

/* So o que VOCE lancou na mao pode ser editado. O que veio do banco fica como
   o banco mandou - senao o extrato do app deixa de servir para conferir o de
   verdade. O selo verde e o botao de editar. */
function seloManual(x){
  if(String(x.origem||'')!=='MANUAL') return '';
  return '<b class="man" onclick="event.stopPropagation();abrirEditar(\''+(x.id||'')+'\','+
         x.linha+')">manual · editar</b>';
}

/* De onde veio cada lançamento, num ícone: 📲 aviso do celular (MacroDroid),
   🏦 banco (Open Finance), ⇄ outro lado de transferência, ➗ dividido.
   O manual já tem o selo "manual · editar". */
function origemIc(x){
  var o=String(x.origem||'');
  var ic={PUSH:'📲',OPENFINANCE:'🏦',ESPELHO:'⇄',RATEIO:'➗'}[o];
  return ic?'<span title="'+o.toLowerCase()+'">'+ic+'</span> ':'';
}

function acharNoExtrato(id, linha){
  /* Pelo id, sempre que houver. A versão nova manda linha 0 em todos os
     lançamentos: "id OU linha" devolvia o primeiro da lista, e o lápis de
     um abria a ficha de outro. A linha só vale no app da planilha (> 0). */
  var itens=(ST.extrato&&ST.extrato.itens)||[], i;
  if(id){
    for(i=0;i<itens.length;i++) if(String(itens[i].id)===String(id)) return itens[i];
  }
  if(linha>0){
    for(i=0;i<itens.length;i++) if(itens[i].linha===linha) return itens[i];
  }
  return null;
}

  el('edForm').innerHTML =

      '<div style="flex:1"><div class="lbl">Data</div>'+
        '<input id="edData" type="date" value="'+iso+'"></div></div>'+
    '<div class="lbl" style="margin-top:8px">Pagou com</div>'+
    botaoEscolha('edOnde', atual, 'escolher…', 'onde', ondeItens(), '')+
    '<div class="lbl" style="margin-top:8px">É</div>'+
    segEscolha('edNat', receita?'RECEITA':'DESPESA', ['DESPESA','RECEITA'])+
    '<div class="lbl" style="margin-top:9px">Conta</div>'+
    '<input type="hidden" id="edCat" value="'+String(x.categoria||'').replace(/"/g,'&quot;')+'">'+
    '<button class="bt-conta" id="btn_edCat" onclick="abrirPicker(\'edCat\',\''+
      (receita?'RECEITA':'DESPESA')+'\',\'\')">'+
      (x.categoria ? ponto(familiaDe(x.categoria))+x.categoria

      '<span style="margin-left:auto;color:var(--dim)">&#9662;</span></button>'+

/* No que veio do banco, descricao, valor e data tem que continuar espelhando

/* Pinta a mudanca na propria lista e confirma por tras. Recarregar a tela
   inteira para trocar um cartao custava varios segundos - e a linha volta
   igual de qualquer jeito. */
function salvarDestino(){
  var e=ST.editando; if(!e) return;
  var onde=String(el('dsOnde').value||'');
  var ehCartao = onde.charAt(0)==='C';
  var dados={
    conta: onde.slice(2),
    meio: ehCartao ? 'CARTAO_CREDITO' : 'PIX',
    categoria: el('dsCat').value,
    todos: !!(el('dsTodos') && el('dsTodos').checked)
  };
  if(!dados.conta && !dados.categoria){ toast('Nada para mudar'); return; }
  fecharEditar();

  var itens=(ST.extrato&&ST.extrato.itens)||[], alvo=null;
  for(var i=0;i<itens.length;i++){ if(String(itens[i].id)===String(e.id)){ alvo=itens[i]; break; } }
  var mexidas=0;
  if(alvo){
    itens.forEach(function(x){
      if(x!==alvo && !(dados.todos && dados.categoria && x.fornecedor===alvo.fornecedor)) return;
      if(dados.categoria) x.categoria=dados.categoria;
      if(x===alvo && dados.conta){
        if(ehCartao){ x.cartao=dados.conta; x.meio='CARTAO_CREDITO'; }
        else { x.conta=dados.conta; x.meio='PIX'; }
      }
      mexidas++;
    });
    var y=window.scrollY||0;
    renderExtrato();
    window.scrollTo(0,y);
    requestAnimationFrame(function(){ window.scrollTo(0,y); });
  }
  toast(mexidas>1 ? mexidas+' lançamentos ajustados' : 'Destino corrigido');

  google.script.run.withSuccessHandler(function(r){
    if(!r||!r.ok){ toast((r&&r.erro)||'Não consegui salvar'); return; }
    ST.cacheMes={}; ST.extras=null; ST.ano=null;
    atualizarPorTras();
  }).withFailureHandler(function(err){ toast('Falhou: '+((err&&err.message)||err)); })
    .apiCorrigirDestino(e.linha, e.id, dados);
}

function fecharEditar(){
  el('edForm').classList.add('hide');
  el('edFundo').classList.add('hide');
  ST.editando=null;
}

function salvarEditado(){
  var e=ST.editando; if(!e) return;
  var onde=String(el('edOnde').value||'');
  var ehCartao = onde.charAt(0)==='C';
  var dados={
    descricao: el('edDesc').value,
    valor: parseFloat(String(el('edVal').value||'0').replace(/\./g,'').replace(',','.'))||0,
    data: el('edData').value,
    natureza: el('edNat').value,
    categoria: el('edCat').value,
    meio: ehCartao ? 'CARTAO_CREDITO' : 'PIX',
    conta: onde.slice(2)
  };
  if(!dados.valor){ toast('Informe o valor'); return; }
  fecharEditar();
  toast('Salvando...');
  // Recarregar o mes inteiro custava uma viagem de varios segundos so para
  // ver a propria linha mudar. As outras telas se acertam por tras.
  google.script.run.withSuccessHandler(function(r){
    if(!r||!r.ok){ toast((r&&r.erro)||'Não consegui salvar'); return; }
    toast('Lançamento atualizado');
    ST.extrato=null; ST.extras=null; ST.cacheMes={}; ST.ano=null;
    renderExtrato();
    atualizarPorTras();
  }).withFailureHandler(function(err){ toast('Falhou: '+((err&&err.message)||err)); })
    .apiEditarLancamento(e.linha, e.id, dados);
}

/* Lapis ao lado do x: troca a conta do lancamento. Antes so dava para corrigir
   uma classificacao errada pela aba Classificar - e la so aparece o que ainda
   nao tem conta nenhuma. O que entrou na conta errada ficava sem conserto. */
function botaoTrocarConta(x, natureza){
  // No que VOCE lancou a mao, o lapis abre a ficha inteira - valor, data,
  // descricao, conta. No que veio do banco, ele so troca a conta: o resto
  // tem que continuar igual ao extrato de verdade.
  if(String(x.origem||'')==='MANUAL'){
    return '<button class="bt-x" title="editar" style="color:#86efac" '+
      'onclick="abrirEditar(\''+(x.id||'')+'\','+x.linha+')">&#9998;</button>';
  }
  return '<button class="bt-x" title="corrigir o destino" style="color:#9fb4d8" '+
    'onclick="abrirDestino(\''+(x.id||'')+'\','+x.linha+')">&#9998;</button>';
}

/* Refaz os numeros das OUTRAS telas em segundo plano. Nao toca no extrato nem
   na rolagem - voce continua exatamente onde estava. */
function atualizarPorTras(){
  google.script.run.withSuccessHandler(function(d){
    if(!d || !d.mes || d.mes!==ST.mes) return;
    ST.resumo=d.resumo; ST.cartao=d.cartao; ST.semCategoria=d.semCategoria;
    ST.pendentes=d.pendentes||[]; ST.saldos=d.saldos;
    ST.proximos=d.proximos; ST.projecaoAnual=d.projecaoAnual;
    guardarMes(d);

    el('badge').textContent = (ST.pendentes.length + sc) + ' a ver';
    renderMes(); renderCartao(); renderPendentes();

/* Compra nova pelo aviso do celular aparece na hora: com o app aberto, a cada
   15 s (e sempre que ele volta para a frente) olha o último aviso recebido;
   chegou um novo, avisa e refaz o Classificar por trás, sem mexer na tela. */
var _ultPush=null, _pushTimer=null;
function vigiarPush(){
  clearTimeout(_pushTimer);
  var P=window.EASYAPP_PONTE;
  if(!P || !P.sessao() || document.hidden){ _pushTimer=setTimeout(vigiarPush, 15000); return; }
  P.rest('/rest/v1/push_log?select=recebido,status,lancamento&order=recebido.desc&limit=5').then(function(r){
    r=r||[];
    var novo=r.length?r[0].recebido:'';
    if(_ultPush!==null && novo && novo>_ultPush){
      var lancou=r.filter(function(x){ return x.recebido>_ultPush && x.lancamento; });
      if(lancou.length){
        var pend=lancou.filter(function(x){ return x.status==='PENDENTE'; }).length;
        toast(pend ? (pend===1?'Compra nova para classificar':'Compras novas para classificar: '+pend) : 'Compra nova lançada');
        if(ST.mes){ ST.extrato=null; atualizarPorTras(); }
      }
    }
    if(novo) _ultPush=novo; else if(_ultPush===null) _ultPush='';
  }).catch(function(){}).then(function(){ _pushTimer=setTimeout(vigiarPush, 15000); });
}
document.addEventListener('visibilitychange', function(){ if(!document.hidden) vigiarPush(); });
setTimeout(vigiarPush, 4000);

function extratoCartao(e){
  /* Previsto (a meta do cartão), realizado, saldo e compras - como na conta
     corrente. Filtrando um cartão, o previsto é a meta dividida pelos
     cartões da fatura. O mês já está no filtro de cima. */
  var filtrado = ST.cartaoSel && ST.cartaoSel!=='TUDO';
  if(!filtrado) ST.nCartoesFatura = Math.max(1, e.porCartao.length);
  var metaC = (ST.cartao && ST.cartao.meta) || 0;
  var prevC = filtrado ? metaC/(ST.nCartoesFatura||1) : metaC;
  var saldoC = prevC - e.total;
  var h='<div class="mini" style="grid-template-columns:repeat(2,1fr)">'+
    miniCard('previsto', num(prevC))+
    miniCard('realizado', num(e.total), 'neg')+
    miniCard('saldo', num(saldoC), saldoC>=0?'pos':'neg')+
    miniCard('compras', String(e.quantos))+
    '</div>';
  /* Um cartão por linha, em letra pequena - e tocar nele filtra. Antes havia
     a fileira de botões E a lista, os dois com os mesmos nomes. */
  if(e.porCartao.length>1 || ST.cartaoSel){
    var sel=ST.cartaoSel&&ST.cartaoSel!=='TUDO'?ST.cartaoSel:'';
    // uma linha por cartão (como era) e um botãozinho para filtrar
    var linha=function(nome, valor, chave){
      var on=(chave===sel);
      return '<div class="row" style="font-size:12.5px;padding:4px 0;gap:8px">'+
        '<span style="flex:1;'+(on?'color:var(--acc);font-weight:600':'color:var(--dim)')+'">'+nome+'</span>'+
        '<span class="num" style="'+(on?'color:var(--acc);font-weight:600':'')+'">'+num(valor)+'</span>'+
        '<button class="flt'+(on?' on':'')+'" onclick="ST.cartaoSel=\''+((on||!chave)?'TUDO':chave)+'\';ST.extrato=null;renderExtrato()">'+
          (on?'✓ só este':(chave?'filtrar':'ver todos'))+'</button></div>';
    };
    h+='<div class="card" style="padding:7px 12px;margin-bottom:10px">'+
      e.porCartao.map(function(x){
        return linha(x.cartao.replace('CARTAO ',''), x.valor, x.cartao);
      }).join('')+
      (sel?linha('todos os cartões', e.total, ''):'')+'</div>';
  }

  h+='<div class="card" style="padding:10px"><div class="tabela">';
  e.itens.forEach(function(x){
    h+='<div class="li">'+
       '<span class="d1">'+String(x.data).substring(0,5)+'</span>'+
       '<span class="d2">'+tx(x.fornecedor)+
         // a parcela vinha no fim da linha de baixo, que e cortada com "..."
         // O numero vem pronto do servidor; a OBS e so o plano B.
         (x.parcela
           ? ' <b class="parc">'+x.parcela+'</b>'
           : (/parcela\s*\d/i.test(x.obs||'')
               ? ' <b class="parc">'+String(x.obs).replace(/parcela\s*/i,'')+'</b>' : ''))+
         seloManual(x)+
         '<i>'+origemIc(x)+tx(x.categoria||'sem categoria')+' · '+tx(x.cartao.replace('CARTAO ',''))+
         '</i></span>'+
       '<span class="d3">'+moeda(x.valor)+'<i>'+moeda(x.acumulado)+'</i></span>'+
       botaoTrocarConta(x, 'DESPESA')+
       '<button class="bt-x" title="excluir" onclick="excluirLanc('+x.linha+',this,\''+(x.id||'')+'\')">&times;</button>'+
       '</div>';
  });
  if(!e.itens.length) h+='<div class="vazio" style="padding:24px">Nenhuma compra nesta fatura.</div>';
  return h+'</div></div>';
}

/* Cartões e contas na mesma lista, com o prefixo dizendo o que é cada um.
   Antes era um <select> com optgroup: menu cinza do Android, fora do tema e
   sem busca. */
function ondeItens(){
  // Todo cartao que ja teve compra entra na lista. Filtrar por nome comecando
  // com CARTAO deixava de fora um dos cartões - e o cartao que faltava era
  // justamente um que o push nao sabia nomear.
  var cart=((ST.saldos&&ST.saldos.cartoes&&ST.saldos.cartoes.cartoes)||[])
           .filter(function(c){ return c.cartao && c.cartao!=='NAO IDENTIFICADA'; })
           .map(function(c){ return c.cartao; });
  // Todo cartao do cadastro entra, tenha gasto ou nao neste ciclo. Um cartao
  // novo - o XP - so aparecia depois da primeira compra reconhecida, e a
  // primeira compra era justamente a que ninguem conseguia atribuir.
  ((ST.saldos&&ST.saldos.cadastroCartoes)||[]).forEach(function(n){
    if(cart.indexOf(n)<0) cart.push(n);
  });
  var ctas=((ST.saldos&&ST.saldos.contas)||[]);
  return cart.map(function(n){
      return { valor:'C|'+n, rotulo:n.replace('CARTAO ',''), grupo:'CARTAO' };
    }).concat(ctas.map(function(c){
      return { valor:'D|'+c.conta, rotulo:c.conta,
               grupo: c.titular==='INV' ? 'INVESTIMENTO' : c.titular };
    }));
}

      '<div class="lbl" style="margin:0">Lançar à mão</div></div>'+
    '<div class="card">'+
    '<div class="lbl">Valor</div>'+
    '<input id="nv" type="text" inputmode="decimal" placeholder="0,00" '+
      'oninput="mascaraMoeda(this)">'+
    '<div class="lbl" style="margin-top:12px">Descrição</div><input id="nd" placeholder="Ex: farmácia">'+

    '<div class="card"><div class="lbl" style="margin-bottom:4px">Colar a fatura em aberto</div>'+
    '<div class="m" style="font-size:11.5px;margin-bottom:7px">No internet banking pelo '+

/* Transferencia entre contas suas precisa dos DOIS lados. Quando nenhuma das
   notificacoes chega - o app de empresas de um dos bancos nao avisa PIX enviado -
   este e o unico jeito de registrar sem contar o dinheiro duas vezes. */
/* Le o texto colado e MOSTRA o que entendeu, antes de gravar. Importar no
   escuro uma fatura mal lida enche a planilha de lixo dificil de achar. */
function lerFatura(){
  var cart=el('fcart').value, txt=el('ftxt').value;
  if(!cart){ toast('Escolha o cartão'); return; }
  if(!txt.trim()){ toast('Cole o texto da fatura'); return; }
  el('fprev').innerHTML='<div class="load">Lendo...</div>';
  google.script.run.withSuccessHandler(function(r){
    if(!r || !r.ok){ el('fprev').innerHTML='<div class="vazio">'+((r&&r.erro)||'não consegui ler')+'</div>'; return; }
    ST.fatLida=r;
    var h='<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px">'+
      '<div class="row"><div class="lbl">'+r.quantas+' compras</div>'+
      '<div class="num" style="font-weight:700">'+moeda(r.total)+'</div></div>';
    if(!r.quantas){
      h+='<div class="m" style="margin-top:6px">Não reconheci nenhuma linha. '+
         'Me mostre como o texto veio que eu ajusto a leitura.</div>';
    } else {
      h+='<div class="tabela" style="margin-top:8px">'+
        r.compras.slice(0,40).map(function(c){
          return '<div class="li"><span class="d1">'+c.data.substring(0,5)+'</span>'+
            '<span class="d2">'+tx(c.descricao)+'<i>'+tx(c.categoria)+
            (c.parcela?' · parcela '+c.parcela:'')+
            (c.parceladaAntiga?' · compra antiga':'')+
            ' · fatura '+c.mes+'</i></span>'+
            '<span class="d3 neg">'+moeda(c.valor)+'</span></div>';
        }).join('')+'</div>';
      if(r.quantas>40) h+='<div class="m" style="font-size:11px">…e mais '+(r.quantas-40)+'</div>';
      h+='<button class="bt-ok" style="width:100%;margin-top:10px;padding:9px" '+
         'onclick="importarFatura()">Importar as '+r.quantas+'</button>';
    }
    if(r.quantasIgnoradas){
      h+='<div class="m" style="font-size:11px;margin-top:8px">'+r.quantasIgnoradas+
         ' linhas que não são compra foram deixadas de fora:<br><span style="opacity:.7">'+
         r.ignoradas.join('<br>')+'</span></div>';
    }
    el('fprev').innerHTML=h+'</div>';
  }).withFailureHandler(function(e){
    el('fprev').innerHTML='<div class="vazio">Falhou: '+((e&&e.message)||e)+'</div>';
  }).apiLerTextoFatura(txt, cart, ST.mes);
}

function importarFatura(){
  if(!ST.fatLida) return;
  el('fprev').innerHTML='<div class="load">Importando...</div>';
  google.script.run.withSuccessHandler(function(r){
    if(!r || !r.ok){ toast((r&&r.erro)||'não consegui'); return; }
    toast(r.importadas+' compras · '+moeda(r.valor)+(r.puladas?' · '+r.puladas+' já existiam':''));
    el('ftxt').value=''; el('fprev').innerHTML=''; ST.fatLida=null;
    carregar();
  }).withFailureHandler(function(e){
    el('fprev').innerHTML='<div class="vazio">Falhou: '+((e&&e.message)||e)+'</div>';
  }).apiImportarTextoFatura(ST.fatLida.compras, ST.fatLida.cartao);
}

function mudouCatNovo(){
  var ehTransf = el('nc') && el('nc').value===CAT_TRANSFER;
  var box=el('nparaBox'), rot=el('rotOnde');
  if(box) box.classList.toggle('hide', !ehTransf);
  if(rot) rot.textContent = ehTransf ? 'Saiu de qual conta' : 'Pagou com';
}
function salvarNovo(){
  // "129,89" num campo type=number volta vazio no Android - o lancamento
  // morria calado aqui. Agora o campo e texto e a virgula vale.
  var bruto=String(el('nv').value||'').replace(/\./g,'').replace(',','.');
  var v=parseFloat(bruto);
  if(!v || isNaN(v)){ toast('Informe o valor'); el('nv').focus(); return; }
  var cat=(el('nc')&&el('nc').value)||'';
  if(!cat){ toast('Escolha a conta'); return; }
  var nat=catNatureza(cat)||'DESPESA';

  var onde=(el('nonde')&&el('nonde').value)||'';
  if(!onde){ toast('Diga se pagou com cartão ou pela conta'); return; }
  var ehCartao = onde.charAt(0)==='C';
  var alvo = onde.slice(2);

  var ehTransf = cat===CAT_TRANSFER;
  var para = (el('npara')&&el('npara').value)||'';
  if(ehTransf){
    if(ehCartao){ toast('Transferência sai de uma conta, não do cartão'); return; }
    if(!para){ toast('Diga para qual conta foi'); return; }
    if(para===alvo){ toast('As duas contas são a mesma'); return; }
  }

  var bt=event&&event.target; if(bt){ bt.disabled=true; bt.textContent='Lançando...'; }
  var solta=function(){ if(bt){ bt.disabled=false; bt.textContent='Lançar'; } };

  var dados={ valor:v, descricao:el('nd').value||(ehTransf?'TRANSFERENCIA':'LANCAMENTO'),
              categoria:cat, natureza: ehTransf?'DESPESA':nat,
              data:el('nda').value,
              meio: ehCartao?'CARTAO_CREDITO':(ehTransf?'TRANSFERENCIA':'PIX'),
              conta: alvo };
  var chamada=google.script.run.withSuccessHandler(function(r){
    solta();
    if(!r || !r.ok){ toast((r&&r.erro)||'Não consegui lançar'); return; }
    toast(ehTransf ? ('Saiu de '+r.de+', entrou em '+r.para) : ('Lançado em '+(r.mes||'')));
    el('nv').value=''; el('nd').value='';
    carregar();
  }).withFailureHandler(function(e){
    solta(); toast('Falhou: '+((e&&e.message)||e));
  });
  if(ehTransf) chamada.apiLancarTransferencia(dados, para);
  else         chamada.apiLancarManual(dados);
}
function colarMsg(){
  var t=el('nm').value;
  if(!t){ toast('Cole a mensagem'); return; }
  google.script.run.withSuccessHandler(function(r){
    toast(r.status==='PENDENTE'?'Lido, confirme na primeira aba':'Não entendi a mensagem');
    el('nm').value=''; carregar();
  }).registrarMensagem('MANUAL','', t, null, 'COLADA');
}


/* ============================== METAS ==============================
   A vida real contra o plano. Uma pergunta por vez:
     1. do jeito que o mês está indo, vai sobrar o que o plano pede?
     2. se não vai, ONDE está a torneira aberta
     3. o que faltou nos meses fechados volta diluído nos que faltam   */

/* Metas: o ACOMPANHAMENTO do plano, com os mesmos números do Plano (a
   mesma conta do mês). O que fazer no mês - as ações - fica no Plano. */
function carregarMetas(){
  if(ST.plano){ renderMetas(); return; }
  el('tela-metas').innerHTML=abasAnalise()+'<div class="load">Medindo o mês...</div>';
  google.script.run.withSuccessHandler(function(p){
    ST.plano=p; renderMetas();
  }).withFailureHandler(function(e){
    el('tela-metas').innerHTML=abasAnalise()+'<div class="vazio">Não consegui.<br>'+
      ((e&&e.message)||e)+'</div>';
  }).apiPlanoSimples();
}

function renderMetas(){
  var p=ST.plano, c=el('tela-metas');
  var h=abasAnalise();
  if(!p){ c.innerHTML=h; return; }
  var m=p.doMes;
  if(!p.alvo || !m){
    c.innerHTML=h+'<div class="card"><div class="m" style="font-size:13px">Defina o plano '+
      'primeiro.</div><button class="bt-ac" style="width:100%;margin-top:10px" '+
      'onclick="trocarAnalise(\'PLANO\')">Ir para o Plano</button></div>';
    return;
  }
  var nomeMes=NOMES_MES[Number(m.mes.split('-')[1])];
  var ok=m.sobra>=m.meta;
  var pct=m.meta>0?Math.max(0,Math.min(100,m.sobra/m.meta*100)):0;

  h+='<div class="lbl" style="margin:2px 0 6px">'+nomeMes+'</div>'+
    '<div class="mini">'+
      miniCard('meta', num(m.meta))+
      miniCard('resultado do mês', num(m.sobra), m.sobra>=0?'pos':'neg')+
      miniCard(ok?'folga':'falta', num(Math.abs(m.sobra-m.meta)), ok?'pos':'neg')+
    '</div>'+
    '<div class="bar" style="margin:-4px 0 4px"><i style="width:'+pct.toFixed(0)+'%;background:'+
      (ok?'var(--ok)':'var(--bad)')+'"></i></div>'+
    '<div class="m" style="font-size:11.5px;margin-bottom:6px">resultado = o que entra − o que sai no mês (pela projeção). '+
      (m.sobra<0?'Negativo: o mês usa '+num(-m.sobra)+' do que já estava na conta. ':'')+'É dele que sai a reserva.</div>'+
    (!ok?'<div class="m" style="font-size:12px;margin-bottom:12px">o que fazer: '+
      '<a href="#" onclick="trocarAnalise(\'PLANO\');return false" style="color:var(--acc)">'+
      'ações no Plano</a></div>':'<div style="height:12px"></div>');

  var hist=m.historico||[];
  h+='<div class="lbl" style="margin:6px 0 6px">Meses do plano</div>'+
    '<div class="card" style="padding:8px 12px">';
  if(!hist.length){
    h+='<div class="m" style="font-size:12px">o plano começou em '+
      NOMES_MES[Number(m.inicio.split('-')[1])].toLowerCase()+' — ainda não há mês fechado</div>';
  } else {
    hist.forEach(function(x){
      var bom=x.sobra>=m.aporte;
      h+='<div class="row" style="padding:5px 0;font-size:13px">'+
        '<span style="color:var(--dim)">'+CURTO[Number(x.mes.split('-')[1])]+'</span>'+
        '<span class="num '+(bom?'pos':'neg')+'">'+num(x.sobra)+'</span></div>';
    });
  }
  h+='</div>';

  if(hist.length) h+='<div class="lbl" style="margin:12px 0 6px">'+m.mes.substring(0,4)+'</div>'+
    '<div class="mini">'+
      miniCard('guardado', num(m.guardadoAno), m.guardadoAno>=0?'pos':'neg')+
      miniCard('devia', num(m.deviaAno))+
      miniCard('diferença', num(m.guardadoAno-m.deviaAno), m.guardadoAno>=m.deviaAno?'pos':'neg')+
    '</div>'+
    (m.reprogramado>0?'<div class="m" style="font-size:11.5px">o atraso de '+num(m.atraso)+
      ' entra nas próximas metas: +'+num(m.reprogramado)+' por mês</div>':'');
  c.innerHTML=h+'<div style="height:20px"></div>';
}

/* ============================ PATRIMÔNIO ==============================
   Saiu das Configurações e virou a quarta aba da Análise: patrimônio não é
   ajuste, é resultado — é o que o plano está construindo. Dois blocos que
   abrem e fecham: BENS (com as dívidas) e INVESTIMENTOS.

   Investimento vem de dois lugares. A CONTA de investimento é uma conta como
   as outras, só que fora do caixa: o PIX da sobra para ela é lido como
   transferência entre contas suas, o saldo sobe sozinho e nada disso conta
   como despesa. A LINHA manual é para o que não tem extrato aqui dentro —
   previdência, consórcio — e o valor você digita. */

function carregarPatrimonio(){
  if(ST.patrimonio){ renderPatrimonio(); return; }
  el('tela-patrimonio').innerHTML=abasAnalise()+'<div class="load">Somando tudo...</div>';
  google.script.run.withSuccessHandler(function(p){
    ST.patrimonio=p; renderPatrimonio();
  }).withFailureHandler(function(e){
    el('tela-patrimonio').innerHTML=abasAnalise()+'<div class="vazio">Não consegui.<br>'+
      ((e&&e.message)||e)+'</div>';
  }).apiPatrimonio();
}

function recarregarPatrimonio(){ ST.patrimonio=null; ST.config=null; carregarPatrimonio(); }

function renderPatrimonio(){
  var p=ST.patrimonio, c=el('tela-patrimonio');
  if(!p){ c.innerHTML=abasAnalise()+'<div class="load">Somando tudo...</div>'; return; }
  var h=abasAnalise();

  h+='<div class="card" style="border-left:3px solid '+(p.liquido>=0?'var(--ok)':'var(--bad)')+'">'+
    '<div class="lbl">Patrimônio líquido</div>'+
    '<div class="big '+(p.liquido>=0?'pos':'neg')+'" style="font-size:30px">'+
      moeda(p.liquido)+'</div>'+
    '<div class="ln" style="grid-template-columns:1fr auto;border:0;padding:6px 0;margin-top:6px">'+
      '<span>Bens</span><span class="n">'+moeda(p.totalBens)+'</span></div>'+
    '<div class="ln" style="grid-template-columns:1fr auto;border:0;padding:6px 0">'+
      '<span>Investimentos</span><span class="n pos">'+moeda(p.totalInvestido||0)+'</span></div>'+
    '<div class="ln" style="grid-template-columns:1fr auto;border:0;padding:6px 0">'+
      '<span>Caixa hoje</span><span class="n">'+moeda(p.caixa)+'</span></div>'+
    '<div class="ln" style="grid-template-columns:1fr auto;border:0;padding:6px 0">'+
      '<span>Dívidas</span><span class="n neg">−'+moeda(p.totalDividas)+'</span></div></div>';

  // ---------- bens ----------
  h+=patTitulo('BENS', 'Bens e dívidas',
               moeda(p.totalBens - p.totalDividas), ST.abrePatBens);
  if(ST.abrePatBens){
    h+=patLista(p.bens, 'BEM');
    h+='<div class="lbl" style="margin:12px 0 6px">Dívidas</div>';
    h+=patLista(p.dividas, 'DIVIDA');
    if(ST.patNovo && ST.patNovo.tipo!=='INVESTIMENTO') h+=patForm(ST.patNovo.tipo);
    h+='<div class="row" style="gap:8px;margin:10px 0 4px">'+
       '<button class="bt-no" style="flex:1" onclick="patAbrirNovo(\'BEM\')">+ bem</button>'+
       '<button class="bt-no" style="flex:1" onclick="patAbrirNovo(\'DIVIDA\')">+ dívida</button>'+
       '<button class="bt-no" style="flex:1" onclick="atualizarFipe()">FIPE</button></div>';
  }

  // ---------- investimentos ----------
  h+=patTitulo('INV', 'Investimentos', moeda(p.totalInvestido||0), ST.abrePatInv);
  if(ST.abrePatInv){
    var contas=p.contasInvestimento||[];
    if(contas.length){
      h+='<div class="card" style="padding:10px 11px">'+
        contas.map(function(x){
          return '<div class="ln" style="grid-template-columns:1fr auto">'+
            '<span style="font-size:13px">'+tx(x.conta)+
              '<i class="sub">saldo pelos aportes</i></span>'+
            '<span class="n pos" style="font-weight:600">'+moeda(x.saldo)+'</span></div>';
        }).join('')+
        '<div class="m" style="font-size:11px;margin-top:8px">estas são contas de '+
        'verdade: transfira a sobra para elas e o saldo sobe sozinho, sem virar '+
        'despesa no mês</div></div>';
    }
    h+=patLista(p.investimentos||[], 'INVESTIMENTO');
    if(ST.patNovo && ST.patNovo.tipo==='INVESTIMENTO') h+=patForm('INVESTIMENTO');
    if(ST.patContaNova) h+=patFormConta();
    h+='<div class="row" style="gap:8px;margin:10px 0 4px">'+
       '<button class="bt-ok" style="flex:1" '+
         'onclick="ST.patContaNova=!ST.patContaNova;ST.patNovo=null;renderPatrimonio()">'+
         '+ conta de investimento</button>'+
       '<button class="bt-no" style="flex:1" onclick="patAbrirNovo(\'INVESTIMENTO\')">'+
         '+ valor manual</button></div>';
  }
  h+='<div style="height:20px"></div>';
  c.innerHTML=h;
}

function patTitulo(chave, titulo, valor, aberto){
  return '<div class="card" style="padding:11px 12px;margin-top:12px;cursor:pointer" '+
    'onclick="patAbrir(\''+chave+'\')">'+
    '<div class="row"><div class="lbl" style="margin:0">'+
      '<span class="seta'+(aberto?' aberta':'')+'">&#9656;</span> '+titulo+'</div>'+
    '<div class="num" style="font-weight:700">'+valor+'</div></div></div>';
}
function patAbrir(k){
  if(k==='BENS') ST.abrePatBens=!ST.abrePatBens; else ST.abrePatInv=!ST.abrePatInv;
  renderPatrimonio();
}
function patAbrirNovo(t){
  ST.patNovo = (ST.patNovo && ST.patNovo.tipo===t) ? null : { tipo:t };
  ST.patContaNova=false; renderPatrimonio();
}

function patLista(lista, tipo){
  if(!lista.length){
    return '<div class="card"><div class="m">nada por aqui ainda</div></div>';
  }
  return lista.map(function(b){
    var ed = ST.patEdit===b.descricao;
    return '<div class="card" style="padding:9px 11px'+(ed?';border-color:var(--acc)':'')+'">'+
      '<div class="row"><div style="min-width:0">'+
        '<div class="d" style="font-size:13.5px">'+tx(b.descricao)+'</div>'+
        '<div class="m" style="font-size:11px">'+String(b.fonte||'').toLowerCase()+
          (b.atualizado?' · '+b.atualizado:'')+'</div></div>'+
        '<div class="big '+(tipo==='DIVIDA'?'neg':'')+'" style="font-size:16px">'+
          moeda(b.valor)+'</div></div>'+
      '<div class="row" style="gap:6px;margin-top:8px">'+
        '<button class="bt-no" style="flex:1;padding:6px;font-size:12px" onclick="patEditar('+
          JSON.stringify(b.descricao).replace(/"/g,'&quot;')+')">'+(ed?'Fechar':'Editar')+'</button>'+
        '<button class="bt-no" style="padding:6px 10px;font-size:12px;color:var(--bad)" '+
          'onclick="patExcluir('+JSON.stringify(b.descricao).replace(/"/g,'&quot;')+
          ')">Excluir</button></div>'+
      (ed?'<div style="border-top:1px solid var(--line);margin-top:9px;padding-top:9px">'+
        '<div class="lbl">Descrição</div><input id="pbNome" value="'+
          b.descricao.replace(/"/g,'&quot;')+'">'+
        '<div class="lbl" style="margin-top:8px">Valor</div>'+
        '<input id="pbVal" inputmode="decimal" value="'+num(b.valor)+'" oninput="mascaraMoeda(this)">'+
        '<div class="row" style="margin-top:10px;gap:8px">'+
          '<button class="bt-no" style="flex:1" onclick="ST.patEdit=null;renderPatrimonio()">Cancelar</button>'+
          '<button class="bt-ok" style="flex:2" onclick="patSalvar('+
            JSON.stringify(b.descricao).replace(/"/g,'&quot;')+',\''+tipo+'\')">Salvar</button>'+
        '</div></div>':'')+
      '</div>';
  }).join('');
}

function patEditar(d){ ST.patEdit=(ST.patEdit===d)?null:d; ST.patNovo=null; renderPatrimonio(); }

function patSalvar(antigo, tipo){
  var nome=(el('pbNome').value||'').trim();
  var v=parseFloat(String(el('pbVal').value||'0').replace(/\./g,'').replace(',','.'))||0;
  if(!nome){ toast('Dê uma descrição'); return; }
  google.script.run.withSuccessHandler(function(r){
    toast(r&&r.ok?'Salvo':'Não consegui');
    ST.patEdit=null; recarregarPatrimonio();
  }).withFailureHandler(function(){ toast('Falhou'); })
    .apiGravarBem(antigo, v, tipo, '', '', nome!==antigo?nome:'');
}

function patExcluir(d){
  if(!confirm('Excluir "'+d+'" do patrimônio?')) return;
  google.script.run.withSuccessHandler(function(r){
    toast(r&&r.ok?'Excluído':'Não consegui');
    recarregarPatrimonio();
  }).withFailureHandler(function(){ toast('Falhou'); }).apiExcluirBem(d);
}

function patForm(tipo){
  var rot = tipo==='DIVIDA' ? 'Dívida nova'
          : (tipo==='INVESTIMENTO' ? 'Investimento (valor digitado)' : 'Bem novo');
  var dica = tipo==='DIVIDA' ? 'ex.: Financiamento do carro'

}

/* ============================ CONFIGURAÇÕES ============================
   Tudo que se ajusta uma vez: as contas, o patrimônio e os percentuais que
   alimentam a projeção. Existe para você não precisar abrir a planilha —
   mexer lá fora foi o que trouxe as contas duplicadas de volta. */

function carregarConfig(){
  if(ST.config){ renderConfig(); return; }
  el('tela-config').innerHTML='<div class="load">Abrindo as configurações...</div>';
  google.script.run.withSuccessHandler(function(c){
    ST.config=c; renderConfig();
  }).withFailureHandler(function(e){
    el('tela-config').innerHTML='<div class="vazio">Não consegui abrir.<br>'+
      ((e&&e.message)||e)+'</div>';
  }).apiConfiguracoes();
}

function recarregarConfig(){ ST.config=null; ST.cacheMes={}; ST.extras=null; ST.ano=null; carregarConfig(); }

function abasConfig(){
  var m=ST.modoCfg||'CONTAS';
  function b(k,r){ return '<button style="flex:1" class="'+(m===k?'on':'')+'" '+
    'onclick="trocarConfig(\''+k+'\')">'+r+'</button>'; }
  return '<div class="seg sub-fixo" style="width:100%;margin-bottom:10px">'+
    b('CONTAS','Contas')+b('BANCOS','Bancos')+b('AJUSTES','Ajustes')+b('CONTA','Minha conta')+'</div>';
}
function trocarConfig(m){ ST.modoCfg=m; ST.cfgEditando=null; renderConfig(); aoTopo(); }

function renderConfig(){
  var c=el('tela-config');
  if(!ST.config){ c.innerHTML='<div class="load">Abrindo...</div>'; return; }
  ST.modoCfg = ST.modoCfg || 'CONTAS';
  var h = abasConfig();
  if(ST.modoCfg==='PATRIM') ST.modoCfg='CONTAS';   // patrimonio virou aba da Analise
  if(ST.modoCfg==='CONTAS')      h+=cfgContas();
  else if(ST.modoCfg==='AUDIT')  h+=cfgAuditoria();
  else if(ST.modoCfg==='BANCOS') h+='<div id="cfgBancos"><div class="load">Abrindo os bancos...</div></div>';
  else if(ST.modoCfg==='CONTA')  h+='<div id="minhaConta"><div class="load">Abrindo...</div></div>';
  else                           h+=cfgAjustes();
  c.innerHTML=h;
  // plano, avisos do celular, Open Finance, termos e excluir conta (conta.js)
  if(ST.modoCfg==='CONTA' && window.EASYAPP_CONTA) window.EASYAPP_CONTA.render(el('minhaConta'));
  if(ST.modoCfg==='BANCOS') bancosCarregar();
}

/* ---------- BANCOS: as contas de banco e cartões ----------
   Para quem não liga o Open Finance (ou para o banco que não liga): a conta
   entra à mão, com o saldo de um dia. Quando o mesmo banco chega pelo Open
   Finance, a pessoa diz qual das manuais ele é e a manual sai - senão o
   saldo contaria duas vezes. */
var BANCOS_LISTA=['Banco do Brasil','Banrisul','Bradesco','BTG','C6','Caixa','Cora','Inter','Itaú','Mercado Pago',
  'Neon','Nubank','PagBank','PicPay','Safra','Santander','Sicoob','Sicredi','Stone','XP'];
function ponteRest(c,o){ return window.EASYAPP_PONTE.rest(c,o); }
function ponteFn(nome, corpo){
  return ponteRest('/rest/v1/perfis?select=id&limit=1').then(function(){
    var cfg=window.EASYAPP_CFG||{};
    return fetch(cfg.url+'/functions/v1/'+nome, { method:'POST',
      headers:{ apikey:cfg.anon, Authorization:'Bearer '+window.EASYAPP_PONTE.sessao().token, 'Content-Type':'application/json' },
      body:JSON.stringify(corpo||{}) });
  }).then(function(r){ return r.json(); }).then(function(d){ if(d&&d.erro) throw new Error(d.erro); return d; });
}
function ofNovasLer(){ try{ return JSON.parse(localStorage.getItem('easyapp:of-novas')||'[]'); }catch(e){ return []; } }
function ofNovasGravar(l){ try{ localStorage.setItem('easyapp:of-novas', JSON.stringify(l||[])); }catch(e){} }
// chamado pela sincronização do Open Finance quando ela cria contas novas
window.ofContasNovas=function(lista){
  if(!lista||!lista.length) return;
  var ja=ofNovasLer(), ids=ja.map(function(x){ return x.id; });
  lista.forEach(function(x){ if(ids.indexOf(x.id)<0) ja.push(x); });
  ofNovasGravar(ja);
  ST.bancos=null;
};
function bancosCarregar(){
  var box=el('cfgBancos'); if(!box) return;
  if(ST.bancos){ box.innerHTML=bancosHtml(); return; }
  Promise.all([
    ponteRest('/rest/v1/contas?select=id,nome,tipo,titular,instituicao,final,saldo_inicial,saldo_desde,pluggy_account_id,criado_em&ativa=eq.true&order=nome'),
    ponteRest('/rest/v1/saldos_contas?select=conta_id,saldo'),
    ponteRest('/rest/v1/config?select=valor&chave=eq.CARTOES_MULTIPLOS')
  ]).then(function(r){
    ST.multiplos=String((r[2][0]||{}).valor||'').split(',').filter(Boolean);
    var sal={}; r[1].forEach(function(x){ sal[x.conta_id]=Number(x.saldo)||0; });
    r[0].forEach(function(c){ c.saldo=sal[c.id]; c.of=!!c.pluggy_account_id; });
    ST.bancos=r[0];
    // pendências de vínculo: só as contas novas que ainda existem e ainda têm manual parecida
    var vivas={}; ST.bancos.forEach(function(c){ vivas[c.id]=c; });
    ofNovasGravar(ofNovasLer().filter(function(x){ return vivas[x.id]; }));
    var b=el('cfgBancos'); if(b) b.innerHTML=bancosHtml();
  }).catch(function(e){ var b=el('cfgBancos'); if(b) b.innerHTML='<div class="vazio">Não consegui abrir.<br>'+tx(e.message)+'</div>'; });
}
function bancoDe(c){ return String(c.instituicao||c.nome||'').trim().split(/\s+/)[0].toUpperCase(); }
/* Só pergunta "é a sua conta manual?" quando pode ser: mesmo banco, mesmo
   titular (PF/PJ), conta com conta e cartão com cartão, e o final do número
   não diz o contrário. Antes oferecia qualquer conta manual (o C6 PF aparecia
   como "é a Santander AZR?") e a pessoa não sabia o que marcar. */
function manuaisParecidas(o){
  return (ST.bancos||[]).filter(function(m){
    if(m.of || (m.tipo==='CARTAO')!==(o.tipo==='CARTAO')) return false;
    if(bancoDe(m)!==bancoDe(o)) return false;
    if(m.titular && o.titular && m.titular!==o.titular) return false;
    if(m.final && o.final && String(m.final).slice(-4)!==String(o.final).slice(-4)) return false;
    return true;
  }).sort(function(a,b){ return a.nome.localeCompare(b.nome,'pt-BR'); });
}
function bancosHtml(){
  var L=ST.bancos||[], h='';
  // 1) o Open Finance trouxe contas novas: alguma era manual?
  // (as avisadas pela sincronização deste aparelho e, para as que chegaram pela
  // sincronização automática, as criadas nos últimos 30 dias com manual do mesmo banco)
  var avisadas=ofNovasLer().map(function(x){ return x.id; }), recusadas=ofNaoLer();
  var pend=L.filter(function(o){
    if(!o.of || recusadas.indexOf(o.id)>=0) return false;
    var cands=manuaisParecidas(o);
    if(!cands.length) return false;
    if(avisadas.indexOf(o.id)>=0) return true;
    return o.criado_em && Date.now()-new Date(o.criado_em).getTime()<30*864e5;
  });
  pend.forEach(function(o){
    var cands=manuaisParecidas(o);
    h+='<div class="card" style="border-color:var(--acc)"><div class="lbl" style="margin-bottom:4px">🏦 Chegou pelo Open Finance</div>'+
      '<div style="font-size:14px;font-weight:600">'+tx(o.nome)+'</div>'+
      '<div class="m" style="font-size:12px;margin:4px 0 8px">Ela é alguma conta que você lançou à mão? Se for, marque: a manual sai e o saldo não conta duas vezes.</div>'+
      cands.map(function(m){
        return '<button class="bt-no" style="width:100%;margin-top:6px;text-align:left" onclick="bancoVincular(\''+m.id+'\',\''+o.id+'\')">'+
          'É a <b>'+tx(m.nome)+'</b> <span style="color:var(--dim)">· '+m.titular+' · saldo '+moeda(m.saldo||0)+'</span></button>';
      }).join('')+
      '<button class="bt-no" style="width:100%;margin-top:6px" onclick="bancoNaoE(\''+o.id+'\')">Não, é uma conta nova</button></div>';
  });
  // 2) nova conta manual
  h+='<div class="card" style="padding:8px 10px"><div class="row" style="gap:6px">'+
     '<div class="m" style="font-size:12px;flex:1">Contas e cartões. As do Open Finance chegam sozinhas; as outras, lance aqui com o saldo.</div>'+
     '<button class="bt-no" style="padding:7px 11px;font-size:12.5px;background:var(--acc);color:#fff;flex:none" onclick="ST.bancoNovo=!ST.bancoNovo;ST.bancoEd=null;bancosCarregar()">'+(ST.bancoNovo?'Fechar':'+&nbsp;conta manual')+'</button></div>'+
     (ST.bancoNovo?bancoForm(null):'')+'</div>';
  // 3) a lista, em dois blocos (PJ e PF), em ordem de banco
  [['PJ','Pessoa jurídica (PJ)'],['PF','Pessoa física (PF)'],['INV','Investimento']].forEach(function(bl){
    var doBloco=L.filter(function(c){ return c.titular===bl[0]; })
      .sort(function(a,b){ return bancoDe(a).localeCompare(bancoDe(b),'pt-BR') || (a.tipo==='CARTAO')-(b.tipo==='CARTAO') || a.nome.localeCompare(b.nome,'pt-BR'); });
    if(!doBloco.length) return;
    h+='<div class="lbl" style="margin:14px 0 6px">'+bl[1]+'</div>';
    doBloco.forEach(function(c){
      var ed=ST.bancoEd===c.id, ligando=ST.bancoLigar===c.id;
      h+='<div class="card" style="padding:9px 11px'+(ed||ligando?';border-color:var(--acc)':'')+'"><div class="row"><div style="min-width:0">'+
        '<div style="font-size:13.5px;font-weight:600">'+(c.tipo==='CARTAO'?'💳 ':'🏦 ')+tx(c.nome)+'</div>'+
        '<div class="m" style="font-size:11px">'+(c.of?'Open Finance':'manual')+(c.final?' · final '+c.final:'')+
          (!c.of && c.saldo_desde?' · saldo de '+moeda(c.saldo_inicial)+' em '+c.saldo_desde.split('-').reverse().join('/'):'')+'</div></div>'+
        (c.tipo==='CARTAO'?'':'<div style="text-align:right;white-space:nowrap;padding-left:8px"><div class="lbl">hoje</div>'+
          '<div class="'+((c.saldo||0)<0?'neg':'')+'" style="font-size:14px">'+moeda(c.saldo||0)+'</div></div>')+'</div>'+
        (c.of?'' :
          '<div class="row" style="gap:6px;margin-top:8px">'+
            '<button class="bt-no" style="flex:1;padding:6px;font-size:12px" onclick="ST.bancoEd=ST.bancoEd===\''+c.id+'\'?null:\''+c.id+'\';ST.bancoLigar=null;ST.bancoNovo=false;bancosCarregar()">'+(ed?'Fechar':'Editar')+'</button>'+
            '<button class="bt-no" style="flex:1;padding:6px;font-size:12px" onclick="ST.bancoLigar=ST.bancoLigar===\''+c.id+'\'?null:\''+c.id+'\';ST.bancoEd=null;bancosCarregar()">Já conectei no Open Finance</button>'+
            '<button class="bt-no" style="padding:6px 10px;font-size:12px;color:var(--bad)" onclick="bancoExcluir(\''+c.id+'\')">Excluir</button>'+
          '</div>')+
        (c.tipo==='CARTAO'
          ? '<label class="row" style="gap:8px;margin-top:7px;justify-content:flex-start;font-size:12.5px;cursor:pointer">'+
            '<input type="checkbox" style="width:auto;margin:0" '+((ST.multiplos||[]).indexOf(c.id)>=0?'checked':'')+
            ' onchange="bancoMultiplo(\''+c.id+'\',this.checked)"> Cartão múltiplo (crédito e débito)</label>'
          : '')+
        (ed?bancoForm(c):'')+
        (ligando?bancoLigarHtml(c):'')+
        '</div>';
    });
  });
  if(!L.length) h+='<div class="vazio">Nenhuma conta ainda. Conecte o Open Finance em Minha conta ou lance uma conta manual.</div>';
  return h;
}
function bancoForm(c){
  var hoje=new Date(), iso=hoje.getFullYear()+'-'+('0'+(hoje.getMonth()+1)).slice(-2)+'-'+('0'+hoje.getDate()).slice(-2);
  var tit=c?c.titular:'PF';
  return '<div style="border-top:1px solid var(--line);margin-top:9px;padding-top:9px">'+
    '<div class="lbl">Banco</div><input id="bkBanco" list="bkLista" placeholder="ex.: Santander" value="'+(c?String(c.instituicao||bancoDe(c)).replace(/"/g,'&quot;'):'')+'">'+
    '<datalist id="bkLista">'+BANCOS_LISTA.map(function(b){ return '<option value="'+b+'">'; }).join('')+'</datalist>'+
    '<div class="lbl" style="margin-top:8px">Número da conta (opcional)</div><input id="bkNum" inputmode="numeric" placeholder="agência/conta ou só o final" value="'+(c&&c.final?c.final:'')+'">'+
    '<div class="row" style="gap:8px;margin-top:8px"><div style="flex:1"><div class="lbl">Saldo</div>'+
      '<input id="bkSaldo" inputmode="decimal" placeholder="0,00" oninput="mascaraMoedaSinal(this)" value="'+(c?num(c.saldo_inicial):'')+'"></div>'+
      '<div style="flex:1"><div class="lbl">Saldo do dia</div><input id="bkData" type="date" value="'+(c&&c.saldo_desde?c.saldo_desde:iso)+'"></div></div>'+
    '<div class="m" style="font-size:11px;margin-top:4px">O saldo que a conta tinha no FIM desse dia. Os lançamentos depois dele mexem no saldo; os de antes, não. Saldo negativo: comece com o sinal de menos.</div>'+
    '<div class="lbl" style="margin-top:8px">É conta de</div>'+
    '<input type="hidden" id="bkTit" value="'+tit+'"><div class="seg" style="width:100%" id="seg_bkTit">'+
    [['PF','Pessoa física (PF)'],['PJ','Empresa (PJ)']].map(function(o){
      return '<button style="flex:1" data-v="'+o[0]+'" class="'+(o[0]===tit?'on':'')+'" onclick="el(\'bkTit\').value=\''+o[0]+'\';'+
        'Array.prototype.forEach.call(el(\'seg_bkTit\').children,function(b){b.classList.toggle(\'on\',b.dataset.v===\''+o[0]+'\');})">'+o[1]+'</button>';
    }).join('')+'</div>'+
    '<div class="row" style="margin-top:10px;gap:8px">'+
      '<button class="bt-ok" style="flex:1" onclick="bancoSalvar('+(c?'\''+c.id+'\'':'null')+')">'+(c?'Salvar':'Criar conta')+'</button></div></div>';
}
// a máscara de dinheiro, aceitando o sinal de menos (cheque especial)
function mascaraMoedaSinal(inp){
  var neg=/^\s*-/.test(inp.value); mascaraMoeda(inp); if(neg && inp.value) inp.value='-'+inp.value;
}
function bancoSalvar(id){
  var banco=(el('bkBanco').value||'').trim(), numero=(el('bkNum').value||'').replace(/\D/g,'');
  var tit=el('bkTit').value||'PF', dia=el('bkData').value;
  var txt=String(el('bkSaldo').value||'0'), neg=/^\s*-/.test(txt);
  var saldo=(parseFloat(txt.replace(/[^\d,]/g,'').replace(',','.'))||0)*(neg?-1:1);
  if(!banco){ toast('Diga o banco'); return; }
  if(!dia){ toast('Diga o dia do saldo'); return; }
  var fim=numero?numero.slice(-4):null;
  var dados={ instituicao:banco, titular:tit, final:fim, saldo_inicial:Math.round(saldo*100)/100, saldo_desde:dia };
  var feito;
  if(id){
    feito=ponteRest('/rest/v1/contas?id=eq.'+id, { metodo:'PATCH', corpo:dados, prefer:'return=minimal' });
  } else {
    var base=(normaliza(banco).toUpperCase()+' '+tit+(fim?' '+fim:'')).slice(0,56), nome=base, k=2;
    var usados=(ST.bancos||[]).map(function(c){ return c.nome; });
    while(usados.indexOf(nome)>=0) nome=base+' '+(k++);
    dados.nome=nome; dados.tipo='CORRENTE'; dados.user_id=window.EASYAPP_PONTE.sessao().user_id;
    feito=ponteRest('/rest/v1/contas', { metodo:'POST', corpo:dados, prefer:'return=minimal' });
  }
  feito.then(function(){
    toast(id?'Conta salva':'Conta criada'); ST.bancoNovo=false; ST.bancoEd=null; ST.bancos=null;
    ST.cacheMes={}; ST.extras=null; ST.saldos=null; bancosCarregar();
  }).catch(function(e){ toast('Não salvei: '+e.message); });
}
/* Cartão múltiplo: o aviso do celular não diz se a compra foi no crédito ou
   no débito. Marcado, toda compra dele vai ao Classificar perguntar. */
function bancoMultiplo(id, sim){
  var l=(ST.multiplos||[]).filter(function(x){ return x!==id; });
  if(sim) l.push(id);
  ponteRest('/rest/v1/config?on_conflict=user_id,chave', { metodo:'POST', prefer:'resolution=merge-duplicates,return=minimal',
    corpo:{ user_id:window.EASYAPP_PONTE.sessao().user_id, chave:'CARTOES_MULTIPLOS', valor:l.join(',') } })
  .then(function(){ ST.multiplos=l; toast(sim?'Marcado: as compras dele vão perguntar crédito ou débito':'Desmarcado'); })
  .catch(function(e){ toast('Não salvei: '+e.message); bancosCarregar(); });
}
function bancoExcluir(id){
  var c=(ST.bancos||[]).filter(function(x){ return x.id===id; })[0]; if(!c) return;
  if(!confirm('Excluir a conta '+c.nome+'? Os lançamentos dela ficam, sem conta.')) return;
  ponteRest('/rest/v1/contas?id=eq.'+id, { metodo:'DELETE', prefer:'return=minimal' }).then(function(){
    toast('Conta excluída'); ST.bancos=null; ST.cacheMes={}; ST.extras=null; bancosCarregar();
  }).catch(function(e){ toast('Não excluí: '+e.message); });
}
function bancoLigarHtml(m){
  var ofs=(ST.bancos||[]).filter(function(o){ return o.of && (o.tipo==='CARTAO')===(m.tipo==='CARTAO'); })
    .sort(function(a,b){ return (bancoDe(b)===bancoDe(m))-(bancoDe(a)===bancoDe(m)) || a.nome.localeCompare(b.nome,'pt-BR'); });
  if(!ofs.length) return '<div class="m" style="font-size:12px;margin-top:8px">Nenhuma conta do Open Finance ainda. Conecte o banco em Configurações → Minha conta → Open Finance e volte aqui.</div>';
  return '<div style="border-top:1px solid var(--line);margin-top:9px;padding-top:9px"><div class="m" style="font-size:12px">Qual conta do Open Finance é esta? A manual sai e fica a do banco, com o saldo do banco.</div>'+
    ofs.map(function(o){ return '<button class="bt-no" style="width:100%;margin-top:6px;text-align:left" onclick="bancoVincular(\''+m.id+'\',\''+o.id+'\')">'+
      o.nome+' <span style="color:var(--dim)">· saldo '+moeda(o.saldo||0)+'</span></button>'; }).join('')+'</div>';
}
function bancoVincular(manual, of){
  var m=(ST.bancos||[]).filter(function(x){ return x.id===manual; })[0], o=(ST.bancos||[]).filter(function(x){ return x.id===of; })[0];
  if(!m||!o) return;
  if(!confirm(m.nome+' é a '+o.nome+'?\n\nA conta manual sai e fica a do Open Finance, com o saldo do banco. '+
              'O que você lançou à mão e o banco também trouxe não fica repetido.')) return;
  toast('Juntando...');
  ponteFn('openfinance', { acao:'vincular_manual', manual:manual, openfinance:of }).then(function(r){
    ofNovasGravar(ofNovasLer().filter(function(x){ return x.id!==of; }));
    toast('Pronto: '+r.conta+(r.removidos?' · '+r.removidos+' lançamento(s) repetido(s) saíram':''));
    ST.bancoLigar=null; ST.bancos=null; ST.cacheMes={}; ST.extras=null; ST.saldos=null; bancosCarregar();
  }).catch(function(e){ toast('Não juntei: '+e.message); });
}
function ofNaoLer(){ try{ return JSON.parse(localStorage.getItem('easyapp:of-nao')||'[]'); }catch(e){ return []; } }
function bancoNaoE(of){
  ofNovasGravar(ofNovasLer().filter(function(x){ return x.id!==of; }));
  var n=ofNaoLer(); n.push(of); try{ localStorage.setItem('easyapp:of-nao', JSON.stringify(n)); }catch(e){}
  bancosCarregar();
}

/* ---------- CONTAS ---------- */
/* A busca troca só a lista: redesenhar a tela inteira trocava o campo por
   outro a cada letra e o teclado do celular fechava. */
function cfgBuscar(v){
  ST.cfgBusca=v;
  var t=document.createElement('div'); t.innerHTML=cfgContas();
  var a=t.querySelector('#cfgLista'), b=el('cfgLista');
  var q=t.querySelector('#cfgQtd'), q2=el('cfgQtd');
  if(!a || !b){ renderConfig(); return; }
  b.innerHTML=a.innerHTML; if(q && q2) q2.textContent=q.textContent;
}
