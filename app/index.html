    return !busca || normaliza(x.nome+' '+x.grupo).indexOf(busca)>=0; });

  var h='<div class="card" style="padding:8px 10px"><div class="row" style="gap:6px">'+
    '<input id="cfgBusca" placeholder="buscar conta" style="margin:0;flex:1;padding:7px 9px;font-size:13px" '+
      'value="'+(ST.cfgBusca||'').replace(/"/g,'&quot;')+'" oninput="cfgBuscar(this.value)">'+
    '<button class="bt-no" style="padding:7px 11px;font-size:12.5px;background:var(--acc);color:#fff" '+
      'onclick="cfgNovaConta()">+&nbsp;conta</button>'+
    '</div><div class="m" style="font-size:11px;margin-top:6px"><span id="cfgQtd">'+lista.length+
    ' contas</span> · o previsto mostrado é o de '+NOMES_MES[mes]+'</div></div>';

  if(ST.cfgCriando) h+=cfgFormNova();

  var fams={};
  lista.forEach(function(x){ (fams[x.grupo]=fams[x.grupo]||[]).push(x); });
  h+='<div id="cfgLista">';
  Object.keys(fams).sort().forEach(function(g){
    h+='<div class="lbl" style="margin:14px 0 6px">'+ponto(g)+g+'</div>';
    fams[g].forEach(function(x){
      var prev = x.previsto ? x.previsto[mes-1] : 0;
      var aberta = ST.cfgEditando===x.nome;
      h+='<div class="card" style="padding:9px 11px;border-left:4px solid '+cor(g)+(aberta?';border-color:var(--acc);border-left-color:'+cor(g):'')+'">'+
         '<div class="row"><div style="min-width:0">'+
           '<div class="d" style="font-size:13.5px;line-height:1.25">'+tx(x.nome)+'</div>'+
           '<div class="m" style="font-size:11px">'+x.natureza.toLowerCase()+
             ' · sai por '+String(x.saiPor).toLowerCase()+
             (x.reajuste?' · reajusta '+num(x.reajuste*100)+'% em '+
               (x.mesReajuste?NOMES_MES[x.mesReajuste].substring(0,3):'jan'):'')+
             (x.ate?' · até '+x.ate.substring(5)+'/'+x.ate.substring(0,4):'')+'</div></div>'+
           '<div style="text-align:right;white-space:nowrap;padding-left:8px">'+
             '<div class="lbl">previsto</div>'+
             '<div style="font-size:14px">'+moeda(prev)+'</div></div></div>'+
         '<div class="row" style="gap:6px;margin-top:8px">'+
           '<button class="bt-no" style="flex:1;padding:6px;font-size:12px" '+
             'onclick="cfgEditar('+JSON.stringify(x.nome).replace(/"/g,'&quot;')+')">'+
             (aberta?'Fechar':'Editar')+'</button>'+
           '<button class="bt-no" style="flex:1;padding:6px;font-size:12px" '+
             'onclick="cfgReplicar('+JSON.stringify(x.nome).replace(/"/g,'&quot;')+')">Meses</button>'+
           '<button class="bt-no" style="padding:6px 10px;font-size:12px;color:var(--bad)" '+
             'onclick="cfgExcluir('+JSON.stringify(x.nome).replace(/"/g,'&quot;')+')">Excluir</button>'+
         '</div>'+
         (aberta?cfgFormEditar(x):'')+
         (ST.cfgReplicando===x.nome?cfgFormMeses(x):'')+
         '</div>';
    });
  });
  h+='</div>';
  return h;
}

function cfgEditar(nome){
  ST.cfgEditando = (ST.cfgEditando===nome) ? null : nome;
  ST.cfgReplicando=null;
  renderConfig();
}

/* Duas ou tres opcoes nao merecem uma folha inteira: viram um segmento. */
function segEscolha(id, valor, opcoes){
  return '<input type="hidden" id="'+id+'" value="'+valor+'">'+
    '<div class="seg" style="width:100%" id="seg_'+id+'">'+
    opcoes.map(function(o){
      return '<button style="flex:1" class="'+(o===valor?'on':'')+'" '+
        'onclick="escolherSeg(\''+id+'\',\''+o+'\')">'+
        o.charAt(0)+o.slice(1).toLowerCase()+'</button>';
    }).join('')+'</div>';
}
function escolherSeg(id, valor){
  el(id).value=valor;
  var box=el('seg_'+id);
  Array.prototype.forEach.call(box.querySelectorAll('button'), function(b){
    b.classList.toggle('on', normaliza(b.textContent)===normaliza(valor));
  });
}

function cfgSalvarConta(nome){
  var fam=(el('cfFam').value||'').trim();
  if(!fam){ toast('Escolha a família'); return; }
  var rj=parseFloat(String(el('cfReaj').value||'0').replace(',','.'))||0;
  var ate=(el('cfAte').value||'').trim();
  if(ate && !/^\d{4}-\d{2}$/.test(ate)){ toast('Em "até quando", use AAAA-MM'); return; }
  var dados={ nome:(el('cfNome').value||'').trim(), grupo:fam.toUpperCase(),
              natureza:el('cfNat').value, reajuste:rj/100,
              mesReajuste:Number(el('cfReajMes').value)||0, ate:ate };
  toast('Salvando...');
  google.script.run.withSuccessHandler(function(r){
    if(!r||!r.ok){ toast((r&&r.erro)||'Não consegui'); return; }
    toast(r.renomeados ? 'Pronto — '+r.renomeados+' lançamentos acompanharam o nome novo'
                       : 'Conta salva');
    ST.cfgEditando=null; recarregarConfig();
  }).withFailureHandler(function(e){ toast('Falhou: '+((e&&e.message)||e)); })
    .apiSalvarConta(nome, dados);
}

/* Replicar o previsto: você escolhe em quais meses vale. Contas sazonais
   (IPVA, seguro, IPTU) não caem todo mês — por isso a escolha é por mês. */
function cfgReplicar(nome){
  ST.cfgReplicando = (ST.cfgReplicando===nome) ? null : nome;
  ST.cfgEditando=null;
  renderConfig();
}

function cfgFormMeses(x){
  var mesAtual=Number((ST.mes||mesDeHoje()).split('-')[1]);
  var ano = ST.cfgAno || ST.config.ano;
  var doAno = (x.porAno && x.porAno[ano]) ? x.porAno[ano] : (ano===ST.config.ano ? x.previsto : null);
  var base = doAno ? (doAno[mesAtual-1] || doAno.filter(function(v){return v>0;})[0] || 0) : 0;

  // uma aba de FC por ano: 2027 e 2028 só aparecem depois de abertos
  var abas = (ST.config.anos||[]).map(function(a){
    return '<button style="flex:1" class="'+(a.ano===ano?'on':'')+'" '+
      'onclick="cfgTrocarAno('+a.ano+','+(a.aberto?'true':'false')+')">'+a.ano+
      (a.aberto?'':' +')+'</button>';
  }).join('');

  var aberto = (ST.config.anos||[]).some(function(a){ return a.ano===ano && a.aberto; });
  var h='<div style="border-top:1px solid var(--line);margin-top:9px;padding-top:9px">'+
    '<div class="seg" style="width:100%;margin-bottom:9px">'+abas+'</div>';
  if(!aberto){
    return h+'<div class="m" style="font-size:12px">O ano de '+ano+' ainda não existe na '+
      'planilha. Ao abrir, ele já nasce com o que a projeção prevê para cada conta — '+
      'daí você ajusta o que quiser.</div>'+
      '<button class="bt-ok" style="width:100%;margin-top:9px" onclick="cfgAbrirAno('+ano+')">'+
      'Abrir '+ano+'</button></div>';
  }
  h+='<div class="lbl">Valor a aplicar</div>'+
    '<input id="cfVal" inputmode="decimal" value="'+num(base)+'" oninput="mascaraMoeda(this)">'+
    '<div class="lbl" style="margin-top:10px">Em quais meses de '+ano+'</div>'+
    '<div class="mesGrade">';
  for(var m=1;m<=12;m++){
    var v = doAno ? doAno[m-1] : 0;
    h+='<label class="mesBox"><input type="checkbox" class="cfMes" value="'+m+'" '+
       (v>0?'checked':'')+'><span>'+NOMES_MES[m].substring(0,3)+'</span>'+
       '<i>'+(v>0?mil(v):'—')+'</i></label>';
  }
  h+='</div>'+
    '<div class="row" style="gap:6px;margin-top:8px">'+
      '<button class="bt-no" style="flex:1;padding:6px;font-size:12px" '+
        'onclick="cfgMarcarMeses(true)">marcar todos</button>'+
      '<button class="bt-no" style="flex:1;padding:6px;font-size:12px" '+
        'onclick="cfgMarcarMeses(false)">desmarcar</button></div>'+
    '<div class="row" style="margin-top:10px;gap:8px">'+
      '<button class="bt-no" style="flex:1" onclick="ST.cfgReplicando=null;renderConfig()">Cancelar</button>'+
      '<button class="bt-ok" style="flex:2" onclick="cfgAplicarMeses('+
        JSON.stringify(x.nome).replace(/"/g,'&quot;')+')">Aplicar</button></div>'+
    '<div class="m" style="font-size:11px;margin-top:6px">Os meses desmarcados ficam com '+
    'previsto zero — é assim que uma conta deixa de aparecer num mês.</div></div>';
  return h;
}

function cfgTrocarAno(ano, aberto){ ST.cfgAno=ano; renderConfig(); }

function cfgAbrirAno(ano){
  toast('Abrindo '+ano+' na planilha...');
  google.script.run.withSuccessHandler(function(r){
    if(!r||!r.ok){ toast((r&&r.erro)||'Não consegui'); return; }
    toast(ano+' aberto com '+(r.contas||0)+' contas, já preenchido pela projeção');
    ST.cfgAno=ano; recarregarConfig();
  }).withFailureHandler(function(e){ toast('Falhou: '+((e&&e.message)||e)); })
    .apiAbrirAnoNaFC(ano);
}

function cfgMarcarMeses(v){
  Array.prototype.forEach.call(document.querySelectorAll('.cfMes'),
    function(b){ b.checked=v; });
}

function cfgAplicarMeses(nome){
  var v=parseFloat(String(el('cfVal').value||'0').replace(/\./g,'').replace(',','.'))||0;
  var marcados=[], ano=ST.cfgAno||ST.config.ano;
  var todos=[];
  Array.prototype.forEach.call(document.querySelectorAll('.cfMes'), function(b){
    var ref=ano+'-'+('0'+b.value).slice(-2);
    todos.push({ mes:ref, categoria:nome, valor: b.checked ? v : 0 });
    if(b.checked) marcados.push(ref);
  });
  toast('Aplicando em 12 meses...');
  google.script.run.withSuccessHandler(function(r){
    toast(r&&r.ok ? marcados.length+' meses de '+ano+' com '+moeda(v)+', o resto zerado'
                  : 'Não consegui');
    ST.cfgReplicando=null; recarregarConfig();
  }).withFailureHandler(function(e){ toast('Falhou: '+((e&&e.message)||e)); })
    .apiSalvarPrevistoEmVarios(todos);
}

function cfgExcluir(nome){
  if(!confirm('Excluir a conta "'+nome+'"?\n\nEla sai do cadastro e da FC.')) return;
  google.script.run.withSuccessHandler(function(r){
    if(r && r.ok){ toast('Conta excluída'); recarregarConfig(); return; }
    if(r && r.precisaDestino){ cfgEscolherDestino(nome, r.lancamentos); return; }
    toast((r&&r.erro)||'Não consegui');
  }).withFailureHandler(function(e){ toast('Falhou: '+((e&&e.message)||e)); })
    .apiApagarConta(nome, '');
}

/* A conta tem lançamentos. Apagar assim sumiria com a despesa do mês, então
   o app pergunta para onde eles vão antes de apagar. */
function cfgEscolherDestino(nome, quantos){
  ST.cfgApagando={ nome:nome, quantos:quantos };
  el('rcAlvo').value='';
  var nat='DESPESA';
  ST.config.contas.forEach(function(x){ if(x.nome===nome) nat=x.natureza; });
  abrirPicker('rcAlvo', nat, 'cfgConfirmarDestino()');
  toast(quantos+' lançamentos nessa conta — escolha para onde eles vão');
}

function cfgConfirmarDestino(){
  var a=ST.cfgApagando, destino=el('rcAlvo').value;
  if(!a || !destino) return;
  if(destino===a.nome){ toast('Escolha outra conta'); return; }
  if(!confirm('Mover os '+a.quantos+' lançamentos de "'+a.nome+'" para "'+destino+
              '" e apagar a conta?')) return;
  google.script.run.withSuccessHandler(function(r){
    toast(r&&r.ok ? (r.movidas||0)+' lançamentos movidos · conta apagada'
                  : ((r&&r.erro)||'Não consegui'));
    ST.cfgApagando=null; recarregarConfig();
  }).withFailureHandler(function(e){ toast('Falhou: '+((e&&e.message)||e)); })
    .apiApagarConta(a.nome, destino);
}

/* ---------- AJUSTES ---------- */
function cfgAjustes(){
  var h='<div class="card"><div class="m" style="font-size:12px">'+
    'São estes números que a projeção e o plano de aposentadoria usam. Mudou aqui, '+
    'muda em todas as telas no próximo refresh.</div></div>'+
    // o roteiro do primeiro acesso, para rever como um cliente novo vê (não grava nada)
    '<button class="bt-no" style="width:100%;margin-bottom:10px;font-size:12.5px" '+
    'onclick="window.EASYAPP_ENTRADA&&window.EASYAPP_ENTRADA.primeiroAcesso(true)">▶ Ver o primeiro acesso (simulação, não grava nada)</button>';
  ST.config.ajustes.forEach(function(a,i){
    var v=a.valor;
    var mostrar = a.tipo==='percent'  ? num(Number(v)*100)
                : a.tipo==='dinheiro' ? num(Number(v))
                : String(v===undefined||v===null?'':v);
    if(a.chave==='NASCIMENTO' && /^\d{4}-\d{2}-\d{2}$/.test(mostrar)) mostrar=mostrar.split('-').reverse().join('/');
    var dica = a.chave==='NASCIMENTO' ? 'DD/MM/AAAA' : (a.chave==='FECHAMENTOS' ? '2026-10:28;2026-11:30' : '');
    h+='<div class="card" style="padding:10px 11px">'+
      '<div class="lbl" style="margin-bottom:5px">'+tx(a.rotulo)+'</div>'+
      (a.tipo==='simnao'
        ? segEscolha('aj'+i, String(v)==='SIM'?'SIM':'NAO', ['SIM','NAO'])+
          '<button class="bt-no" style="width:100%;margin-top:7px;padding:7px;font-size:12.5px" '+
            'onclick="cfgSalvarAjuste('+i+')">Salvar</button>'
        : a.tipo==='texto'
        ? '<input id="aj'+i+'" value="'+String(mostrar).replace(/"/g,'&quot;')+'" '+
            'placeholder="'+dica+'" autocapitalize="off" spellcheck="false"'+(a.chave==='NASCIMENTO'?' inputmode="numeric" maxlength="10"':'')+'>'+
          '<button class="bt-no" style="width:100%;margin-top:7px;padding:7px;font-size:12.5px" '+
            'onclick="cfgSalvarAjuste('+i+')">Salvar</button>'
        : '<div class="row" style="gap:6px">'+
          '<input id="aj'+i+'" inputmode="decimal" style="margin:0;flex:1" value="'+mostrar+'">'+
          '<span class="m" style="font-size:12px;white-space:nowrap">'+
            (a.tipo==='percent'?'% ao ano':(a.tipo==='dinheiro'?'R$':''))+'</span>'+
          '<button class="bt-no" style="padding:7px 12px;font-size:12.5px" '+
            'onclick="cfgSalvarAjuste('+i+')">Salvar</button></div>')+
      (a.ajuda?'<div class="m" style="font-size:11px;margin-top:5px">'+a.ajuda+'</div>':'')+
      '</div>';
  });
  h+='<div class="card" style="margin-top:14px">'+
    '<div class="lbl" style="margin-bottom:6px">Projeção conta a conta na planilha</div>'+
    '<div class="m" style="font-size:11.5px;margin-bottom:8px">Escreve a aba '+
    '<b>Consolidado</b> com uma linha por conta e uma coluna por mês, até 2029. '+
    'É a projeção que o Plano usa, para você conferir na planilha.</div>'+
    '<button class="bt-ac" style="width:100%" '+
      'onclick="exportarPlanilha(\'expConfig\')">Gerar e baixar em Excel</button>'+
    '<div id="expConfig" style="margin-top:9px"></div></div>';
  return h;
}

  var mes = ST.audMes || ST.mes || mesDeHoje();
  var h='<div class="card">'+
    '<div class="lbl" style="margin-bottom:6px">Auditoria de '+
      NOMES_MES[Number(mes.split('-')[1])]+' de '+mes.split('-')[0]+'</div>'+
    '<div class="m" style="font-size:11.5px;margin-bottom:9px">Confere as telas entre si e, '+
    'se houver extratos na pasta <b>dados/'+mes+'</b> ao lado da planilha no Drive, compara '+
    'lançamento a lançamento com o banco. Aceito CSV, TXT, TSV e OFX — ponha o nome da conta '+
    'no nome do arquivo.</div>'+
    '<div class="row" style="gap:6px">'+
      '<div style="flex:1">'+
        botaoEscolha('audMes', mes, 'mês…', 'mês',
                     mesesDoAno().map(function(m){
                       return { valor:m, rotulo:NOMES_MES[Number(m.split('-')[1])], grupo:'MES' }; }),
                     'trocarMesAuditoria()')+'</div>'+
      '<button class="bt-ac" style="flex:1;margin:0" onclick="rodarAuditoria()">Rodar auditoria</button>'+
    '</div></div>';

  if(ST.audRodando) return h+'<div class="load">Conferindo tudo...</div>';
  var a=ST.audit;
  if(!a) return h;

  var cor = a.problemas.length ? 'var(--bad)' : 'var(--ok)';
  h+='<div class="card" style="border-left:3px solid '+cor+'">'+
    '<div class="big" style="font-size:19px;color:'+cor+'">'+
      (a.problemas.length ? a.problemas.length+' divergência'+(a.problemas.length>1?'s':'')
                          : 'Tudo bateu')+'</div>'+
    '<div class="m" style="margin-top:4px">'+a.conferido.length+' conferências ok · '+
      a.avisos.length+' aviso(s) · '+a.pendentes+' a confirmar · '+
      a.semCategoria+' sem conta</div></div>';

  if(a.problemas.length){
    h+='<div class="lbl" style="margin:14px 0 6px">O que não bate</div>';
    a.problemas.forEach(function(p){
      h+='<div class="card" style="padding:9px 11px;border-color:var(--bad)">'+
        '<div class="d" style="font-size:13px">'+p.oque+'</div>'+
        '<div class="row" style="margin-top:5px">'+
          '<span class="m">app '+moeda(p.app)+' · outro '+moeda(p.outro)+'</span>'+
          '<span class="n neg" style="font-weight:600">'+moeda(p.diferenca)+'</span></div></div>';
    });
  }

  if(a.avisos.length){
    h+='<div class="lbl" style="margin:14px 0 6px">Avisos</div><div class="card">'+
       a.avisos.map(function(x){ return '<div class="m" style="font-size:12px">• '+x+'</div>'; })
       .join('')+'</div>';
  }

  if(a.duplicados && a.duplicados.length){
    h+='<div class="lbl" style="margin:14px 0 6px">Possíveis lançamentos em dobro</div>';
    a.duplicados.forEach(function(d){
      h+='<div class="card" style="padding:9px 11px"><div class="row">'+
        '<span class="d" style="font-size:12.5px">'+d.data+' · '+tx(d.descricao)+'</span>'+
        '<span class="n">'+moeda(d.valor)+'</span></div>'+
        '<div class="m" style="font-size:11px">linhas '+d.linhas.join(', ')+'</div></div>';
    });
  }

  if(a.ajustes && a.ajustes.length){
    var tot=a.ajustes.reduce(function(s,x){return s+x.valor;},0);
    h+='<div class="lbl" style="margin:14px 0 6px">Ajustes de fechamento em aberto</div>'+
      '<div class="card" style="border-color:var(--warn)">'+
      a.ajustes.map(function(x){
        return '<div class="row"><span class="m">'+tx(x.descricao)+' · '+tx(x.conta)+'</span>'+
               '<span class="n">'+moeda(x.valor)+'</span></div>'; }).join('')+
      '<div class="m" style="font-size:11.5px;margin-top:7px">Somam '+moeda(tot)+'. '+
      'Depois que a auditoria explicar a diferença, apague — senão viram despesa de verdade.</div>'+
      '<button class="bt-no" style="width:100%;margin-top:8px;color:var(--bad)" '+
      'onclick="apagarAjustes()">Apagar os ajustes de '+
      NOMES_MES[Number(mes.split('-')[1])]+'</button></div>';
  }

  h+=auditoriaBanco(a.banco);
  return h;
}

function auditoriaBanco(b){
  if(!b) return '';
  var h='<div class="lbl" style="margin:14px 0 6px">Contra o extrato do banco</div>';
  if(!b.arquivos || !b.arquivos.length){
    return h+'<div class="card"><div class="m" style="font-size:12px">'+
      (b.recado||'')+'</div>'+
      (b.erro?'<div class="m" style="font-size:11px;margin-top:6px;color:var(--bad)">'+
        b.erro+'</div>':'')+'</div>';
  }
  b.arquivos.forEach(function(f){
    if(!f.lido){
      h+='<div class="card" style="padding:9px 11px"><div class="d" style="font-size:12.5px">'+
        tx(f.arquivo)+'</div><div class="m" style="font-size:11px">'+tx(f.motivo)+'</div></div>';
      return;
    }
    var ok = Math.abs(f.diferenca)<0.02 && !f.soNoBanco.length && !f.soNoApp.length;
    h+='<div class="card" style="padding:10px 11px;border-color:'+(ok?'var(--ok)':'var(--warn)')+'">'+
      '<div class="row"><span class="d" style="font-size:13px">'+tx(f.conta)+'</span>'+
      '<span class="n '+(ok?'pos':'neg')+'" style="font-weight:600">'+
        (ok?'bate':moeda(f.diferenca))+'</span></div>'+
      '<div class="m" style="font-size:11px">'+f.arquivo+' · banco '+f.linhasNoBanco+
        ' linhas ('+moeda(f.totalBanco)+') · app '+f.linhasNoApp+' ('+moeda(f.totalApp)+')</div>';
    if(f.soNoBanco.length){
      h+='<div class="lbl" style="margin:9px 0 4px;color:var(--warn)">só no banco — falta lançar</div>';
      f.soNoBanco.forEach(function(x){
        h+='<div class="row"><span class="m" style="font-size:11.5px">'+x.data+' '+
           x.descricao+'</span><span class="n">'+moeda(x.valor)+'</span></div>'; });
    }
    if(f.soNoApp.length){
      h+='<div class="lbl" style="margin:9px 0 4px;color:var(--warn)">só no app — não veio no extrato</div>';
      f.soNoApp.forEach(function(x){
        h+='<div class="row"><span class="m" style="font-size:11.5px">'+x.data+' '+
           x.descricao+'</span><span class="n">'+moeda(x.valor)+'</span></div>'; });
    }
    h+='</div>';
  });
  return h;
}

function mesesDoAno(){
  var ano=(ST.mes||mesDeHoje()).split('-')[0], out=[];
  for(var m=1;m<=12;m++) out.push(ano+'-'+('0'+m).slice(-2));
  return out;
}

function trocarMesAuditoria(){
  ST.audMes=el('audMes').value; ST.audit=null; renderConfig();
}

function rodarAuditoria(){
  var mes = ST.audMes || ST.mes || mesDeHoje();
  ST.audRodando=true; ST.audit=null; renderConfig();
  google.script.run.withSuccessHandler(function(a){
    ST.audRodando=false; ST.audit=a; renderConfig();
  }).withFailureHandler(function(e){
    ST.audRodando=false; toast('Falhou: '+((e&&e.message)||e)); renderConfig();
  }).apiAuditoria(mes);
}

function apagarAjustes(){
  var mes = ST.audMes || ST.mes || mesDeHoje();
  if(!confirm('Apagar os ajustes de fechamento de '+
      NOMES_MES[Number(mes.split('-')[1])]+'?\n\nSó faça isso depois que a auditoria '+
      'tiver explicado a diferença.')) return;
  google.script.run.withSuccessHandler(function(r){
    toast(r&&r.ok ? (r.apagadas||0)+' ajuste(s) apagado(s)' : 'Não consegui');
    ST.audit=null; ST.cacheMes={}; ST.extras=null; ST.ano=null; rodarAuditoria();
  }).withFailureHandler(function(){ toast('Falhou'); }).apiApagarAjustes(mes);
}

function cfgSalvarAjuste(i){
  var a=ST.config.ajustes[i], inp=el('aj'+i);
  var v=inp.value;
  if(a.tipo==='percent')  v=(parseFloat(String(v).replace(',','.'))||0)/100;
  else if(a.tipo==='dinheiro') v=parseFloat(String(v).replace(/\./g,'').replace(',','.'))||0;
  else if(a.tipo==='inteiro')  v=parseInt(String(v).replace(/\D/g,''),10)||0;
  else if(a.tipo==='texto')    v=String(v||'').trim();
  google.script.run.withSuccessHandler(function(r){
    if(!r||!r.ok){ toast((r&&r.erro)||'Não consegui'); return; }
    a.valor=r.valor; toast(a.rotulo+' salvo');
    ST.cacheMes={}; ST.extras=null; ST.ano=null; ST.plano=null; ST.metas=null;
  }).withFailureHandler(function(e){ toast('Falhou: '+((e&&e.message)||e)); })
    .apiSalvarAjuste(a.chave, v);
}

carregar(mesDeHoje());
