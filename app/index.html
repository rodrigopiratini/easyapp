  // ------------------------------------------------------- aparência
  // CSS por cima do app + nomes do menu. #iaTema = a aparência em vigor;
  // #iaPrevia = um rascunho sendo visto (vale por cima do tema).
  var MENU_ORIG = {};
  function guardarMenus() {
    Array.prototype.forEach.call(document.querySelectorAll('nav a[data-t]'), function (a) {
      if (a.classList.contains('ia-navmod')) return;
      var tn = a.lastChild;
      if (tn && tn.nodeType === 3) MENU_ORIG[a.dataset.t] = tn.nodeValue;
    });
  }
  function nomesMenu(menus) {
    Array.prototype.forEach.call(document.querySelectorAll('nav a[data-t]'), function (a) {
      if (a.classList.contains('ia-navmod')) return;
      var tn = a.lastChild, k = a.dataset.t;
      if (!tn || tn.nodeType !== 3 || MENU_ORIG[k] === undefined) return;
      tn.nodeValue = (menus && menus[k]) ? menus[k] : MENU_ORIG[k];
    });
  }
  function estilo(id, css) {
    var e = $(id);
    if (!css) { if (e) e.remove(); return; }
    if (!e) { e = document.createElement('style'); e.id = id; document.head.appendChild(e); }
    e.textContent = css;
  }
  var TEMA = { css: '', menus: {} };
  function carregarTemaAtivo() {
    return rest('/rest/v1/aparencia_versoes?select=id,css,menus,descricao,numero,criado_em&estado=eq.ativa&limit=1').then(function (r) {
      TEMA = r[0] || { css: '', menus: {} };
      estilo('iaTema', TEMA.css); nomesMenu(TEMA.menus);
    }).catch(function () {});
  }
  function previaAparencia(r, cartao) {
    estilo('iaPrevia', r.css || ''); nomesMenu(r.menus || {});
    $('ia').hidden = true; IA.aberto = false;
    $('iaPrevBar').hidden = false;
    var fim = function () { $('iaPrevBar').hidden = true; estilo('iaPrevia', ''); };
    $('iaPrevOk').onclick = function () { fim(); aplicarAparencia(r.versao_id, cartao); };
    $('iaPrevNo').onclick = function () { fim(); nomesMenu(TEMA.menus); descartarAparencia(r.versao_id, cartao); };
    $('iaPrevChat').onclick = function () { fim(); nomesMenu(TEMA.menus); abrir(); };
  }
  function aplicarAparencia(versao, cartao) {
    return rest('/rest/v1/rpc/ativar_aparencia', { metodo: 'POST', corpo: { p_versao: versao } })
      .then(carregarTemaAtivo).then(function () {
        if (cartao && cartao.querySelector('.ia-bts')) {
          cartao.querySelector('.sub').textContent = 'aplicado'; cartao.querySelector('.ia-bts').remove();
        }
        toastIA('Aparência aplicada');
      }).catch(function (e) { toastIA('Não consegui aplicar: ' + e.message); });
  }
  function descartarAparencia(versao, cartao) {
    return rest('/rest/v1/aparencia_versoes?id=eq.' + versao,
                { metodo: 'PATCH', corpo: { estado: 'descartada' }, prefer: 'return=minimal' })
      .then(function () {
        if (cartao && cartao.querySelector('.ia-bts')) {
          cartao.querySelector('.sub').textContent = 'descartado'; cartao.querySelector('.ia-bts').remove();
        }
      });
  }

  // ------------------------------------------- módulos no menu de baixo
  // Todo módulo aplicado vira um item do menu, ao lado de Mês, Cartão...
  function menuDosModulos() {
    return rest('/rest/v1/modulos?select=id,nome,icone,versao_ativa&versao_ativa=not.is.null&order=criado_em')
      .then(function (mods) {
        var nav = document.querySelector('nav'); if (!nav) return;
        Array.prototype.forEach.call(nav.querySelectorAll('a.ia-navmod'), function (a) { a.remove(); });
        mods.forEach(function (m) {
          var a = document.createElement('a');
          a.href = '#'; a.className = 'ia-navmod'; a.dataset.t = 'mod-' + m.id;
          a.innerHTML = '<b>' + esc(m.icone || '◆') + '</b>' + esc(m.nome);
          a.onclick = function (e) { e.preventDefault(); abrirNaTela(m, a); };
          nav.appendChild(a);
        });
        nav.classList.toggle('ia-muitos', nav.querySelectorAll('a').length > 6);
      }).catch(function () {});
  }
  /* Um quadro NOVO a cada módulo aberto, com o conteúdo posto uma vez só.
     Reaproveitar o mesmo quadro (vazio primeiro, o módulo depois) deixava a
     tela em branco: a segunda troca não chegava a desenhar. */
  function novoQuadro(id, html) {
    var velho = $(id);
    var f = document.createElement('iframe');
    f.id = id; f.title = 'módulo';
    f.setAttribute('sandbox', 'allow-scripts allow-modals allow-forms');
    f.srcdoc = pagina(html);
    velho.parentNode.replaceChild(f, velho);
    return f;
  }

  function abrirNaTela(m, link) {
    (window.TELAS || []).forEach(function (x) { var e = $('tela-' + x); if (e) e.classList.add('hide'); });
    Array.prototype.forEach.call(document.querySelectorAll('nav a'), function (a) { a.classList.toggle('on', a === link); });
    $('iaTela').classList.remove('hide');
    quadros = quadros.filter(function (x) { return x.tipo !== 'tela'; });
    rest('/rest/v1/modulo_versoes?select=html&id=eq.' + m.versao_ativa).then(function (r) {
      var f = novoQuadro('iaTelaFrame', r[0] ? r[0].html : '<p>módulo sem versão</p>');
      quadros.push({ frame: f, modulo: m.id, tipo: 'tela' });
    });
    window.scrollTo(0, 0);
  }

  function aba(qual) {
    $('iaAbaChat').classList.toggle('on', qual === 'chat');
    $('iaAbaHist').classList.toggle('on', qual === 'hist');
    $('iaAbaMods').classList.toggle('on', qual === 'mods');
    $('iaMsgs').hidden = qual !== 'chat';
    $('iaPe').hidden = qual !== 'chat';
    $('iaAnx').hidden = qual !== 'chat' || !IA.anexos.length;
    $('iaHist').hidden = qual !== 'hist';
    $('iaMods').hidden = qual !== 'mods';
    if (qual === 'mods') listarModulos();
    if (qual === 'hist') listarHistorico();
  }

  // ----------------------------------------------------------- abrir
  function abrir() {
    if (!P() || !P().sessao()) return;
    $('ia').hidden = false; IA.aberto = true;
    desenharMotor();
    if (!IA.carregado) carregar();
  }

  function inicioDoMes() {
    var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1).toISOString();
  }

  /* O contador: quanto o mês dá (o incluído no plano + créditos), quanto já
     foi gasto e quanto sobra - com uma barrinha que esvazia. */
  function atualizarMes() {
    return rest('/rest/v1/rpc/minha_conta', { metodo: 'POST', corpo: {} }).then(function (c) {
      var ia = (c && c.ia) || {};
      var total = Number(ia.franquia || 0) + Number(ia.creditos || 0) + Math.max(0, Number(ia.gasto_mes || 0) - Number(ia.franquia || 0));
      IA.mes = Number(ia.gasto_mes || 0);
      if (ia.liberado && ia.plano === 'cortesia') return desenharSaldo(-1, IA.mes, null);
      desenharSaldo(total, IA.mes, Number(ia.disponivel || 0));
    }).catch(function () {
      return rest('/rest/v1/pedidos_ia?select=valor_cobrado&criado_em=gte.' + encodeURIComponent(inicioDoMes()))
        .then(function (r) {
          IA.mes = r.reduce(function (a, x) { return a + Number(x.valor_cobrado || 0); }, 0);
          desenharSaldo(0, IA.mes, null);
        });
    });
  }
  function desenharSaldo(total, gasto, saldo) {
    var e = $('iaMes'); if (!e) return;
    if (total === -1) {   // cortesia: sem franquia
      e.innerHTML = '<div class="ia-st"><span>⭐ cortesia</span><b>livre</b></div>' +
        '<div class="ia-st"><span>✦ gasto</span><b>' + reais(gasto) + '</b></div>' +
        '<div class="ia-st"><span>saldo</span><b style="color:#22c55e">∞</b></div>';
      return;
    }
    var pc = total > 0 ? Math.max(0, Math.min(100, saldo / total * 100)) : 0;
    var cor = pc > 40 ? '#22c55e' : pc > 15 ? '#f59e0b' : '#ef4444';
    e.innerHTML =
      '<div class="ia-st"><span>💳 crédito do mês</span><b>' + (total ? reais(total) : '—') + '</b></div>' +
      '<div class="ia-st"><span>✦ gasto</span><b>' + reais(gasto) + '</b></div>' +
      '<div class="ia-st"><span>saldo</span><b style="color:' + cor + '">' + (saldo === null ? '—' : reais(saldo)) + '</b></div>' +
      '<div class="ia-sbar"><i style="width:' + pc.toFixed(0) + '%;background:' + cor + '"></i></div>';
  }

  function carregar() {
    $('iaMsgs').innerHTML = barrinhas();
    Promise.all([
      atualizarMes(),
      rest('/rest/v1/chat_mensagens?select=papel,texto,criado_em,pedidos_ia(valor_cobrado,versao_id,modulo_id,criado_em)' +
           '&order=criado_em.desc,papel.asc&limit=20'),
      rest('/rest/v1/modulos?select=id,nome,icone,versao_ativa').catch(function () { return []; }),
      rest('/rest/v1/modulo_versoes?select=id,modulo_id,numero,estado').catch(function () { return []; })
    ]).then(function (r) {
      IA.carregado = true;
      var msgs = r[1].reverse();
      var mods = {}, vers = {};
      (r[2] || []).forEach(function (m) { mods[m.id] = m; });
      (r[3] || []).forEach(function (v) { vers[v.id] = v; });
      IA.hist = msgs.map(function (m) { return { papel: m.papel, texto: m.texto }; });
      $('iaMsgs').innerHTML = '';
      if (!msgs.length) boasVindas();
      msgs.forEach(function (m) {
        bolha(m.papel, m.texto);
        if (m.papel === 'assistant' && m.pedidos_ia) custo(Number(m.pedidos_ia.valor_cobrado), m.pedidos_ia.criado_em || m.criado_em);
        // o módulo que esta resposta montou continua a um toque: ver e aplicar
        // (antes, ao reabrir o chat, sobrava só o texto e não havia como aplicar)
        var pv = m.papel === 'assistant' && m.pedidos_ia && m.pedidos_ia.versao_id && vers[m.pedidos_ia.versao_id];
        if (pv && mods[pv.modulo_id]) cartaoVersao(mods[pv.modulo_id], pv);
      });
      if (msgs.length) mostrarPropostaPendente(null);
      rolar();
    }).catch(function (e) {
      $('iaMsgs').innerHTML = '<div class="ia-vazio">Não consegui abrir o assistente.<br>' + esc(e.message) + '</div>';
    });
  }

  function boasVindas() {
    var sug = ['Cria um controle dos meus investimentos, com aportes e total por ativo',
               'Cria um menu da minha empresa com clientes e contas a receber',
               'Cria uma lista de metas de economia com quanto falta para cada uma'];
    var h = '<div class="ia-vazio">Peça uma funcionalidade nova e eu monto para você ver antes de aplicar.' +
            '<br>Cada pedido mostra quanto custou.</div>';
    sug.forEach(function (s) { h += '<button class="ia-sug">' + esc(s) + '</button>'; });
    $('iaMsgs').innerHTML = h;
    Array.prototype.forEach.call(document.querySelectorAll('.ia-sug'), function (b) {
      b.onclick = function () { $('iaTxt').value = b.textContent; $('iaTxt').focus(); };
    });
  }

  function bolha(papel, t) {
    var d = document.createElement('div');
    d.className = 'ia-m ' + (papel === 'user' ? 'eu' : 'ele');
    d.innerHTML = papel === 'user' ? esc(t).replace(/\n/g, '<br>') : texto(t);
    $('iaMsgs').appendChild(d);
    return d;
  }
  function custo(v, quando) {
    var d = document.createElement('div');
    d.className = 'ia-custo';
    var data = new Date(quando || Date.now());
    var horario = isNaN(data.getTime()) ? '' : data.toLocaleDateString('pt-BR') + ' às ' +
      data.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    d.textContent = 'este pedido: ' + reais(v) + (horario ? ' · ' + horario : '');
    $('iaMsgs').appendChild(d);
  }
  function rolar() { var m = $('iaMsgs'); m.scrollTop = m.scrollHeight; }

  // ----------------------------------------------------------- enviar
  var ouvindo = false;
  function ditar() {
    if (ouvindo || IA.ocupado) return;
    var cap = window.Capacitor;
    var nativo = cap && cap.nativePromise && cap.isNativePlatform && cap.isNativePlatform();
    var Reconhecimento = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!nativo && !Reconhecimento) {
      toastIA('Este navegador não oferece transcrição. Use o microfone do teclado.'); return;
    }
    ouvindo = true;
    $('iaVoz').disabled = true; $('iaEnvia').disabled = true;
    $('iaVoz').textContent = '…';
    function terminar() {
      ouvindo = false; $('iaVoz').disabled = false;
      $('iaEnvia').disabled = IA.ocupado; $('iaVoz').textContent = '🎤';
    }
    function inserir(t) {
      if (!t) return;
      var campo = $('iaTxt');
      campo.value = campo.value + (campo.value && !/\s$/.test(campo.value) ? ' ' : '') + t;
      campo.focus();
    }
    if (nativo) {
      cap.nativePromise('Voz', 'transcrever', {}).then(function (r) {
        inserir(r.texto);
      }).catch(function () {
        toastIA('Não foi possível transcrever. Confira o reconhecimento de voz do celular.');
      }).then(terminar);
      return;
    }
    var voz = new Reconhecimento();
    voz.lang = 'pt-BR'; voz.continuous = false; voz.interimResults = false;
    voz.onresult = function (e) { inserir(e.results[0][0].transcript); };
    voz.onerror = function (e) {
      if (e.error !== 'aborted') toastIA(e.error === 'not-allowed' ?
        'Permita o uso do microfone para ditar.' : 'Não consegui ouvir. Tente novamente.');
      terminar();
    };
    voz.onend = terminar;
    try { voz.start(); } catch (e) { terminar(); toastIA('Não consegui iniciar o microfone.'); }
  }

  function enviar() {
    var t = $('iaTxt').value.trim();
    var anexos = IA.anexos.slice();
    if ((!t && !anexos.length) || IA.ocupado || ouvindo) return;
    if (anexos.some(function (a) { return !a.pronto; })) { toastIA('Espere terminar de ler o anexo'); return; }
    if (!t) t = 'Leia o anexo e me mostre a prévia.';
    IA.ocupado = true; $('iaEnvia').disabled = true;
    $('iaTxt').value = '';
    IA.anexos = []; mostrarAnexos();
    Array.prototype.forEach.call(document.querySelectorAll('.ia-sug,.ia-vazio'), function (x) { x.remove(); });
    var minha = bolha('user', t);
    if (anexos.length) {
      var ax = document.createElement('div'); ax.className = 'anx';
      anexos.forEach(function (a) {
        if (a.thumb) { var im = document.createElement('img'); im.src = a.thumb; ax.appendChild(im); }
        else { var sp = document.createElement('span'); sp.textContent = (a.tipo === 'pdf' ? '📄 ' : '📊 ') + a.nome; ax.appendChild(sp); }
      });
      minha.insertBefore(ax, minha.firstChild);
    }
    var nomesAnx = anexos.map(function (a) { return a.nome; }).join(', ');
    var espera = bolha('assistant', '');
    espera.innerHTML = barrinhas();
    rolar();
    var desde = new Date(Date.now() - 5000).toISOString();

    // passa antes pela ponte: se o login venceu (vale 1 hora), ela renova
    atualizarMes().then(function () {
      var s = P().sessao();
      return fetch(CFG.url + '/functions/v1/assistente', {
        method: 'POST',
        headers: { 'apikey': CFG.anon, 'Authorization': 'Bearer ' + s.token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ mensagem: t, historico: IA.hist.slice(-10), motor: motor(),
          anexos: anexos.map(function (a) { return { nome: a.nome, tipo: a.tipo, mime: a.mime, base64: a.base64 }; }) })
      });
    }).then(function (r) {
      if (!r.ok && r.status !== 200) throw new Error('o servidor respondeu ' + r.status);
      return lerLinhas(r);
    }).then(function (fim) {
      espera.remove();
      if (!fim) throw new Error('a conexão caiu antes da resposta');
      if (fim.t === 'erro') { bolha('assistant', fim.msg); return; }
      IA.hist.push({ papel: 'user', texto: (nomesAnx ? '📎 ' + nomesAnx + '\n' : '') + t },
                   { papel: 'assistant', texto: fim.resposta });
      bolha('assistant', fim.resposta);
      custo(fim.custo.cobrado);
      if (fim.rascunho) cartaoRascunho(fim.rascunho);
      if (fim.proposta) cartaoProposta(fim.proposta);
      if (fim.dados) { cartaoDados(fim.dados, fim.custo && fim.custo.cobrado); recarregarApp(); }
      atualizarMes();
    }).catch(function (e) {
      espera.remove();
      // a conexão caiu (a pessoa saiu do app, a tela apagou, a rede piscou): o
      // pedido continua no servidor e a resposta é gravada; o app vai buscar
      if (!/servidor respondeu|413|anexo/i.test(e.message)) { esperarResposta(desde); return; }
      if (anexos.length && /Failed to fetch|NetworkError|413|load failed/i.test(e.message)) {
        IA.anexos = anexos; mostrarAnexos();
      }
      bolha('assistant', 'Não consegui: ' + e.message);
    }).then(function () {
      IA.ocupado = false; mostrarAnexos(); rolar();
    });
  }

  // ---- a resposta que ficou para depois: o servidor termina o pedido mesmo com
  // a conexão caída e grava em chat_mensagens; aqui se busca a cada 5 s e
  // sempre que o app volta para a frente, por até 8 minutos
  function esperarResposta(desde) {
    var b = bolha('assistant', '');
    b.innerHTML = '<div style="font-size:13px;margin-bottom:6px">A conexão caiu, mas o pedido continua no servidor. ' +
      'Pode sair do app: a resposta aparece aqui quando ficar pronta.</div>' + barrinhas();
    IA.aguardando = { desde: desde, b: b, fim: Date.now() + 8 * 60e3, timer: null };
    rolar();
    checarAguardando();
  }
  function checarAguardando() {
    var a = IA.aguardando; if (!a) return;
    clearTimeout(a.timer);
    rest('/rest/v1/chat_mensagens?select=texto,criado_em,pedidos_ia(valor_cobrado,versao_id,modulo_id,lote,alteracoes,criado_em)' +
         '&papel=eq.assistant&criado_em=gt.' + encodeURIComponent(a.desde) + '&order=criado_em.desc&limit=1')
      .then(function (r) {
        if (IA.aguardando !== a) return;
        var m = r && r[0];
        if (!m) {
          if (Date.now() > a.fim) {
            IA.aguardando = null;
            a.b.innerHTML = 'A resposta não chegou. Se o pedido mudou algo, aparece no Histórico; se não, mande de novo.';
            return;
          }
          a.timer = setTimeout(checarAguardando, document.hidden ? 15000 : 5000);
          return;
        }
        IA.aguardando = null; a.b.remove();
        bolha('assistant', m.texto);
        IA.hist.push({ papel: 'assistant', texto: m.texto });
        var pd = m.pedidos_ia || {};
        if (pd.valor_cobrado !== undefined && pd.valor_cobrado !== null) custo(Number(pd.valor_cobrado), pd.criado_em || m.criado_em);
        if (pd.versao_id) {
          Promise.all([rest('/rest/v1/modulos?select=id,nome,icone,versao_ativa&id=eq.' + pd.modulo_id),
                       rest('/rest/v1/modulo_versoes?select=id,modulo_id,numero,estado&id=eq.' + pd.versao_id)])
            .then(function (x) { if (x[0][0] && x[1][0]) { cartaoVersao(x[0][0], x[1][0]); rolar(); } }).catch(function () {});
        }
        if (pd.alteracoes > 0 && pd.lote) { cartaoDados({ lote: pd.lote, alteracoes: pd.alteracoes }, pd.valor_cobrado); recarregarApp(); }
        mostrarPropostaPendente(a.desde);
        atualizarMes(); rolar();
        toastIA('O assistente respondeu');
      })
      .catch(function () { if (IA.aguardando === a) a.timer = setTimeout(checarAguardando, 8000); });
  }
  // prévia de dados que ficou sem cartão (a conexão caiu antes de ela chegar)
  function mostrarPropostaPendente(desde) {
    funcao({ acao: 'proposta_pendente' }).then(function (r) {
      var p = r && r.proposta;
      if (!p || (desde && p.criado_em && p.criado_em < desde)) return;
      if (document.querySelector('[data-proposta="' + p.id + '"]')) return;
      cartaoProposta(p); rolar();
    }).catch(function () {});
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && IA.aguardando) checarAguardando(); });

  // a função responde em linhas de JSON: "status" enquanto trabalha, o resto no fim
  function lerLinhas(r) {
    if (!r.body || !r.body.getReader) {
      return r.text().then(function (t) {
        var ls = t.trim().split('\n'); return JSON.parse(ls[ls.length - 1]);
      });
    }
    var leitor = r.body.getReader(), dec = new TextDecoder(), resto = '', fim = null;
    function passo() {
      return leitor.read().then(function (x) {
        if (x.done) return fim;
        resto += dec.decode(x.value, { stream: true });
        var ls = resto.split('\n'); resto = ls.pop();
        ls.forEach(function (l) {
          if (!l.trim()) return;
          var o = JSON.parse(l);
          if (o.t !== 'status') fim = o;
        });
        return passo();
      });
    }
    return passo();
  }

  // ----------------------------------------------------------- anexos
  // Print vira JPEG de até 1600 px aqui mesmo (um print de celular cru tem
  // 3 a 5 MB; reduzido, uns 300 KB e o Claude lê igual). Planilha e PDF vão
  // como estão: quem abre a planilha é o servidor.
  var MAX_ARQ = 4.5 * 1024 * 1024;
  function tipoDe(f) {
    var nm = String(f.name || '').toLowerCase();
    if (/^image\//.test(f.type) || /\.(jpe?g|png|webp|gif|heic)$/.test(nm)) return 'imagem';
    if (f.type === 'application/pdf' || /\.pdf$/.test(nm)) return 'pdf';
    if (/\.(xlsx|xlsm|xls|ods|csv)$/.test(nm) || /spreadsheet|excel|csv/.test(f.type)) return 'planilha';
    return '';
  }
  function lerBase64(f) {
    return new Promise(function (ok, falha) {
      var r = new FileReader();
      r.onload = function () { ok(String(r.result).replace(/^data:[^,]*,/, '')); };
      r.onerror = function () { falha(new Error('não consegui ler ' + f.name)); };
      r.readAsDataURL(f);
    });
  }
  function reduzir(f) {
    return new Promise(function (ok, falha) {
      var url = URL.createObjectURL(f), im = new Image();
      im.onload = function () {
        var k = Math.min(1, 1600 / Math.max(im.width, im.height));
        var c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        var d = c.toDataURL('image/jpeg', 0.82);
        ok({ base64: d.replace(/^data:[^,]*,/, ''), thumb: d });
      };
      im.onerror = function () { URL.revokeObjectURL(url); falha(new Error('não consegui abrir a imagem ' + f.name)); };
      im.src = url;
    });
  }
  function anexar(files) {
    var lista = Array.prototype.slice.call(files || []);
    if (IA.anexos.length + lista.length > 5) { toastIA('No máximo 5 anexos por mensagem'); lista = lista.slice(0, 5 - IA.anexos.length); }
    lista.forEach(function (f) {
      var tipo = tipoDe(f);
      if (!tipo) { toastIA('Não sei ler ' + f.name + '. Mande planilha (xlsx, csv), print ou PDF.'); return; }
      if (tipo !== 'imagem' && f.size > MAX_ARQ) { toastIA(f.name + ' é grande demais (máx. 4 MB)'); return; }
      var item = { nome: String(f.name || tipo).slice(0, 80), tipo: tipo, mime: tipo === 'imagem' ? 'image/jpeg' : (f.type || ''),
                   base64: '', thumb: '', pronto: false };
      IA.anexos.push(item); mostrarAnexos();
      (tipo === 'imagem' ? reduzir(f) : lerBase64(f).then(function (b) { return { base64: b }; })).then(function (r) {
        item.base64 = r.base64; item.thumb = r.thumb || ''; item.pronto = true; mostrarAnexos();
      }).catch(function (e) {
        IA.anexos = IA.anexos.filter(function (x) { return x !== item; }); mostrarAnexos(); toastIA(e.message);
      });
    });
  }
  function mostrarAnexos() {
    var c = $('iaAnx'); if (!c) return;
    c.hidden = !IA.anexos.length;
    c.innerHTML = '';
    IA.anexos.forEach(function (a, i) {
      var sp = document.createElement('span');
      sp.innerHTML = (a.thumb ? '<img src="' + a.thumb + '">' : '<i>' + (a.tipo === 'pdf' ? '📄' : a.tipo === 'imagem' ? '🖼' : '📊') + '</i>') +
        '<em>' + esc(a.pronto ? a.nome : 'lendo...') + '</em><button aria-label="tirar">×</button>';
      sp.querySelector('button').onclick = function () { IA.anexos.splice(i, 1); mostrarAnexos(); };
      c.appendChild(sp);
    });
    var lendo = IA.anexos.some(function (a) { return !a.pronto; });
    $('iaEnvia').disabled = IA.ocupado || lendo;
  }

  // ------------------------------------------- a prévia do que veio do anexo
  function mesCurto(ref) {
    var n = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
    return n[+String(ref).slice(5, 7) - 1] + '/' + String(ref).slice(2, 4);
  }
  function funcao(corpo) {
    // passa antes pela ponte: se o login venceu, ela renova
    return atualizarMes().then(function () {
      return fetch(CFG.url + '/functions/v1/assistente', {
        method: 'POST',
        headers: { 'apikey': CFG.anon, 'Authorization': 'Bearer ' + P().sessao().token, 'Content-Type': 'application/json' },
        body: JSON.stringify(corpo)
      });
    }).then(function (r) { return r.json(); });
  }
  function cartaoProposta(p) {
    var d = document.createElement('div');
    d.className = 'ia-card';
    d.setAttribute('data-proposta', p.id);
    var h = '<div class="nm">📋 Prévia — nada foi gravado ainda</div>' +
      '<div class="sub">' + esc(p.resumo || '') + '</div><div class="ia-prev">';
    (p.contas || []).forEach(function (c) {
      h += '<div class="ln"><div class="a"><b>' + esc(c.conta) + (c.nova ? '<span class="nova">NOVA</span>' : '') + '</b>' +
        '<span class="' + (c.natureza === 'RECEITA' ? 'rec' : 'des') + '">' + reais(c.media) + '/mês</span></div>' +
        '<div class="b">' + c.meses + (c.meses === 1 ? ' mês' : ' meses') + ' · ' + mesCurto(c.de) +
        (c.ate !== c.de ? ' a ' + mesCurto(c.ate) : '') + (c.origem ? ' · da linha "' + esc(c.origem) + '"' : '') + '</div>' +
        '<div class="meses">' + (c.valores || []).map(function (m) { return '<span>' + mesCurto(m.mes) + ' ' + reais(m.valor) + '</span>'; }).join('') +
        '</div></div>';
    });
    var L = p.lancamentos || { n: 0 };
    if (L.n) {
      h += '<div class="ln"><div class="a"><b>' + L.n + (L.n === 1 ? ' lançamento' : ' lançamentos') + '</b><span>' + reais(L.total) + '</span></div>' +
        '<div class="b">toque para ver</div><div class="meses" style="grid-template-columns:1fr">' +
        (L.itens || []).map(function (l) {
          return '<span>' + esc(String(l.data).slice(8, 10) + '/' + String(l.data).slice(5, 7)) + ' · ' + esc(l.descricao) + ' · ' +
            (l.natureza === 'RECEITA' ? '+' : '') + reais(l.valor) + (l.conta ? ' · ' + esc(l.conta) : '') + '</span>';
        }).join('') + '</div></div>';
    }
    h += '</div><div class="ia-bts"><button data-a="ok" class="ok">Aplicar</button><button data-a="no" class="no">Descartar</button></div>';
    d.innerHTML = h;
    Array.prototype.forEach.call(d.querySelectorAll('.ln'), function (l) { l.onclick = function () { l.classList.toggle('on'); }; });
    var bts = d.querySelector('.ia-bts');
    d.querySelector('[data-a=ok]').onclick = function () {
      bts.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
      funcao({ acao: 'proposta', id: p.id, aplicar: true }).then(function (r) {
        if (r.erro) throw new Error(r.erro);
        bts.remove();
        d.querySelector('.sub').textContent = 'aplicado' + (r.erros && r.erros.length ? ' · ' + r.erros.length + ' itens não entraram: ' + r.erros.join('; ') : '');
        if (r.alteracoes) { cartaoDados({ lote: r.lote, alteracoes: r.alteracoes }); recarregarApp(); }
        rolar();
      }).catch(function (e) {
        bts.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
        toastIA('Não consegui aplicar: ' + e.message);
      });
    };
    d.querySelector('[data-a=no]').onclick = function () {
      funcao({ acao: 'proposta', id: p.id, aplicar: false }).then(function () {
        bts.remove(); d.querySelector('.sub').textContent = 'descartado';
      });
    };
    $('iaMsgs').appendChild(d);
  }

  // cartão de uma versão já salva (histórico do chat e Meus módulos)
  function cartaoVersao(m, v, onde) {
    var noAr = m.versao_ativa === v.id;
    var d = document.createElement('div');
    d.className = 'ia-card';
    d.innerHTML = '<div class="nm">' + esc(m.icone || '🧩') + ' ' + esc(m.nome) + '</div>' +
      '<div class="sub">versão ' + v.numero + ' · ' + (noAr ? 'Ativo' : v.estado === 'rascunho' ? 'Rascunho' : 'Desabilitado · salvo para reaplicar') + '</div>' +
      (noAr ? '<div class="ia-bts"><button data-a="abrir" class="ok">Abrir</button><button data-a="desf">Desfazer</button></div>' : '<div class="ia-bts"><button data-a="ver">Ver prévia</button><button data-a="ok" class="ok">Aplicar</button></div>');
    if (noAr) {
      d.querySelector('[data-a=abrir]').onclick = function () { abrirModulo(m.id, v.id, m.nome); };
      d.querySelector('[data-a=desf]').onclick = function () {
        if (!confirm('Desfazer esta versão? Ela ficará desabilitada e salva em Módulos. Se houver uma versão anterior, ela será reativada.')) return;
        rest('/rest/v1/rpc/desfazer_modulo', { metodo: 'POST', corpo: { p_modulo: m.id } })
          .then(function () { menuDosModulos(); return listarModulos(); }).catch(function (e) { toastIA(e.message); });
      };
    }
    if (!noAr) {
      d.querySelector('[data-a=ver]').onclick = function () {
        abrirModulo(m.id, v.id, (m.icone || '🧩') + ' ' + m.nome + ' · prévia v' + v.numero, d);
      };
      d.querySelector('[data-a=ok]').onclick = function () {
        if (m.versao_ativa && !confirm('Aplicar a versão ' + v.numero + ' de ' + m.nome + '? A que está no ar vira versão antiga (dá para desfazer).')) return;
        aplicar(v.id, d).then(function () { m.versao_ativa = v.id; if ($('iaMods') && !$('iaMods').hidden) listarModulos(); });
      };
    }
    (onde || $('iaMsgs')).appendChild(d);
  }

  function cartaoRascunho(r) {
    if (r.tipo === 'aparencia') return cartaoAparencia(r);
    var d = document.createElement('div');
    d.className = 'ia-card';
    d.innerHTML = '<div class="nm">' + esc(r.icone) + ' ' + esc(r.nome) + '</div>' +
      '<div class="sub">versão ' + r.numero + ' · rascunho</div>' +
      '<div class="ia-bts"><button data-a="ver">Ver prévia</button>' +
      '<button data-a="ok" class="ok">Aplicar</button><button data-a="no" class="no">Descartar</button></div>';
    d.querySelector('[data-a=ver]').onclick = function () {
      abrirModulo(r.modulo_id, r.versao_id, r.icone + ' ' + r.nome + ' · prévia', d);
    };
    d.querySelector('[data-a=ok]').onclick = function () { aplicar(r.versao_id, d); };
    d.querySelector('[data-a=no]').onclick = function () { descartar(r.versao_id, d); };
    $('iaMsgs').appendChild(d);
  }

  // o assistente mexeu nos dados: mostra quanto e oferece desfazer o pedido inteiro
  function cartaoDados(d, custoPedido) {
    var c = document.createElement('div');
    c.className = 'ia-card';
    c.innerHTML = '<div class="nm">✓ Dados alterados</div>' +
      '<div class="sub">' + d.alteracoes + (d.alteracoes === 1 ? ' item mudou' : ' itens mudaram') +
      (custoPedido !== undefined && custoPedido !== null ? ' · custou ' + reais(custoPedido) : '') +
      ' · o app já foi atualizado</div><div class="ia-mud">' + barrinhas() + '</div>' +
      '<div class="ia-bts"><button data-a="desf" class="no">Desfazer tudo deste pedido</button></div>';
    descreverLote(d.lote).then(function (linhas) {
      var m = c.querySelector('.ia-mud'); if (m) m.innerHTML = linhas.join('') || '';
    });
    c.querySelector('[data-a=desf]').onclick = function () {
      if (!confirm('Desfazer as ' + d.alteracoes + ' alterações deste pedido?')) return;
      rest('/rest/v1/rpc/desfazer_pedido', { metodo: 'POST', corpo: { p_lote: d.lote } }).then(function (n) {
        c.querySelector('.sub').textContent = 'desfeito: ' + n + ' itens voltaram como estavam';
        c.querySelector('.ia-bts').remove();
        recarregarApp();
      }).catch(function (e) { toastIA('Não consegui desfazer: ' + e.message); });
    };
    $('iaMsgs').appendChild(c);
  }
  // as telas do app guardam o que já buscaram; depois de mudar dados, esquece e busca de novo
  function recarregarApp() {
    try {
      // o mesmo do botão ↻: esquece tudo e redesenha a tela aberta
      if (typeof window.atualizarTudo === 'function') return window.atualizarTudo(true);
      var st = window.ST;
      if (st) { st.cacheMes = {}; st.extras = null; st.ano = null; st.plano = null; st.metas = null;
                st.config = null; st.projLonga = null; st.extrato = null; }
      if (typeof window.carregar === 'function' && st && st.mes) window.carregar(st.mes, false);
    } catch (e) {}
  }

  function cartaoAparencia(r) {
    var d = document.createElement('div');
    d.className = 'ia-card';
    d.innerHTML = '<div class="nm">🎨 Aparência do app</div>' +
      '<div class="sub">' + esc(r.descricao || '') + ' · versão ' + r.numero + ' · rascunho</div>' +
      '<div class="ia-bts"><button data-a="ver">Ver prévia</button>' +
      '<button data-a="ok" class="ok">Aplicar</button><button data-a="no" class="no">Descartar</button></div>';
    d.querySelector('[data-a=ver]').onclick = function () { previaAparencia(r, d); };
    d.querySelector('[data-a=ok]').onclick = function () { aplicarAparencia(r.versao_id, d); };
    d.querySelector('[data-a=no]').onclick = function () { descartarAparencia(r.versao_id, d); };
    $('iaMsgs').appendChild(d);
  }

  function aplicar(versao, cartao) {
    return rest('/rest/v1/rpc/ativar_versao', { metodo: 'POST', corpo: { p_versao: versao } })
      .then(function () {
        if (cartao) cartao.querySelector('.sub').textContent = 'aplicado · está em Meus módulos';
        if (cartao) cartao.querySelector('.ia-bts').remove();
        toastIA('Módulo aplicado: já está no menu de baixo');
        menuDosModulos();
      }).catch(function (e) { toastIA('Não consegui aplicar: ' + e.message); });
  }
  function descartar(versao, cartao) {
    return rest('/rest/v1/modulo_versoes?id=eq.' + versao,
                { metodo: 'PATCH', corpo: { estado: 'descartada' }, prefer: 'return=minimal' })
      .then(function () {
        if (cartao) { cartao.querySelector('.sub').textContent = 'descartado'; cartao.querySelector('.ia-bts').remove(); }
      });
  }
  function toastIA(m) {
    if (typeof window.toast === 'function') window.toast(m); else alert(m);
  }

  // ------------------------------------------------- o que mudou, por extenso
  var MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  function mesTxt(ref) { return MESES[+String(ref).slice(5, 7) - 1] + '/' + String(ref).slice(2, 4); }
  var CAMPOS = { nome: 'nome', grupo: 'família', natureza: 'tipo', sai_por: 'sai por', previsto_padrao: 'previsto',
                 reajuste: 'reajuste', mes_reajuste: 'mês do reajuste', ate: 'até quando', ativa: 'ativa' };
  function descrever(alts, nomes) {
    var linhas = [], prev = {};
    alts.forEach(function (a) {
      var dp = a.depois || {}, an = a.antes || {};
      if (a.tabela === 'previstos') {
        var cid = (a.chave || {}).categoria_id, g = prev[cid] = prev[cid] || { meses: [], valores: {} };
        g.meses.push((a.chave || {}).mes_ref); g.valores[Number(dp.valor)] = 1;
      } else if (a.tabela === 'categorias') {
        if (!a.antes) linhas.push('➕ conta criada: <b>' + esc(dp.nome) + '</b>');
        else {
          var mud = Object.keys(CAMPOS).filter(function (k) { return String(an[k]) !== String(dp[k]); })
            .map(function (k) { return CAMPOS[k] + ' ' + esc(an[k] == null ? '—' : an[k]) + ' → ' + esc(dp[k] == null ? '—' : dp[k]); });
          linhas.push('✏️ conta <b>' + esc(dp.nome || an.nome) + '</b>' + (mud.length ? ': <small>' + mud.join(' · ') + '</small>' : ''));
        }
      } else if (a.tabela === 'lancamentos' && a.operacao === 'delete') {
        linhas.push('🗑️ apagado: <b>' + esc(an.descricao) + '</b> ' + reais(an.valor) +
          ' <small>' + esc(String(an.data || '').split('-').reverse().join('/')) + '</small>');
      } else if (a.tabela === 'lancamentos') {
        if (!a.antes) linhas.push('🧾 lançamento: <b>' + esc(dp.descricao) + '</b> ' + reais(dp.valor) +
          ' <small>' + esc(String(dp.data || '').split('-').reverse().join('/')) + '</small>');
        else linhas.push('✏️ lançamento corrigido: <b>' + esc(dp.descricao || an.descricao) + '</b>' +
          (Number(an.valor) !== Number(dp.valor) ? ' <small>' + reais(an.valor) + ' → ' + reais(dp.valor) + '</small>' : '') +
          (dp.status === 'IGNORADO' && an.status !== 'IGNORADO' ? ' <small>(tirado das contas)</small>' : ''));
      } else if (a.tabela === 'contas') {
        var mb = [];
        if (an.nome !== dp.nome) mb.push('nome ' + esc(an.nome) + ' → ' + esc(dp.nome));
        if (an.titular !== dp.titular) mb.push('de ' + esc(an.titular) + ' → ' + esc(dp.titular));
        if (String(an.final) !== String(dp.final)) mb.push('final ' + esc(an.final || '—') + ' → ' + esc(dp.final || '—'));
        if (Number(an.saldo_inicial) !== Number(dp.saldo_inicial) || an.saldo_desde !== dp.saldo_desde) mb.push('saldo de hoje corrigido');
        if (an.ativa !== dp.ativa) mb.push(dp.ativa ? 'reativado' : 'desativado');
        linhas.push('🏦 banco <b>' + esc(dp.nome || an.nome) + '</b>' + (mb.length ? ': <small>' + mb.join(' · ') + '</small>' : ''));
      } else if (a.tabela === 'config') {
        linhas.push('⚙️ ajuste <b>' + esc((a.chave || {}).chave) + '</b>: <small>' + esc(an.valor == null ? '—' : an.valor) + ' → ' + esc(dp.valor) + '</small>');
      }
    });
    Object.keys(prev).forEach(function (cid) {
      var g = prev[cid], ms = g.meses.sort(), vs = Object.keys(g.valores);
      linhas.push('📅 previsto de <b>' + esc(nomes[cid] || 'conta') + '</b>: ' + ms.length + (ms.length === 1 ? ' mês' : ' meses') +
        ' <small>(' + mesTxt(ms[0]) + (ms.length > 1 ? ' a ' + mesTxt(ms[ms.length - 1]) : '') + ')' +
        (vs.length === 1 ? ' · ' + reais(vs[0]) + '/mês' : '') + '</small>');
    });
    return linhas.map(function (l) { return '<div>' + l + '</div>'; });
  }
  var _nomesCat = null;
  function nomesCategorias() {
    if (_nomesCat) return Promise.resolve(_nomesCat);
    return rest('/rest/v1/categorias?select=id,nome').then(function (r) {
      _nomesCat = {}; r.forEach(function (c) { _nomesCat[c.id] = c.nome; }); return _nomesCat;
    });
  }
  function descreverLote(lote) {
    return Promise.all([
      rest('/rest/v1/ia_alteracoes?select=tabela,operacao,chave,antes,depois&lote=eq.' + lote + '&desfeita=is.false&order=id'),
      nomesCategorias()
    ]).then(function (r) { _nomesCat = null; return descrever(r[0], r[1]); })
      .catch(function () { return []; });
  }

  /* Histórico: toda alteração que o assistente fez, com data, custo e o que
     mudou. Desfeita, ela sai da lista. */
  function listarHistorico() {
    var c = $('iaHist');
    c.innerHTML = barrinhas();
    Promise.all([
      rest('/rest/v1/pedidos_ia?select=id,criado_em,pedido,valor_cobrado,lote,alteracoes,modulo_id,versao_id,aparencia_id' +
           '&or=(alteracoes.gt.0,versao_id.not.is.null,aparencia_id.not.is.null)&order=criado_em.desc&limit=60'),
      nomesCategorias(),
      rest('/rest/v1/modulos?select=id,nome,icone'),
      rest('/rest/v1/modulo_versoes?select=id,numero,estado'),
      rest('/rest/v1/aparencia_versoes?select=id,numero,estado,descricao')
    ]).then(function (R) {
      var peds = R[0], nomes = R[1];
      var mods = {}, vers = {}, aps = {};
      R[2].forEach(function (m) { mods[m.id] = m; });
      R[3].forEach(function (v) { vers[v.id] = v; });
      R[4].forEach(function (v) { aps[v.id] = v; });
      var lotes = peds.filter(function (p) { return p.lote && p.alteracoes > 0; }).map(function (p) { return p.lote; });
      return (lotes.length
        ? rest('/rest/v1/ia_alteracoes?select=lote,tabela,operacao,chave,antes,depois&desfeita=is.false&order=id&lote=in.(' + lotes.join(',') + ')')
        : Promise.resolve([])).then(function (alts) {
        var porLote = {};
        alts.forEach(function (a) { (porLote[a.lote] = porLote[a.lote] || []).push(a); });
        var h = '', total = 0;
        peds.forEach(function (p) {
          var linhas = [];
          if (p.lote && porLote[p.lote]) linhas = linhas.concat(descrever(porLote[p.lote], nomes));
          var v = p.versao_id && vers[p.versao_id], m = p.modulo_id && mods[p.modulo_id];
          if (v && v.estado !== 'descartada' && m) {
            linhas.push('<div>🧩 módulo <b>' + esc(m.icone || '') + ' ' + esc(m.nome) + '</b> <small>versão ' + v.numero + ' · ' +
              (v.estado === 'ativa' ? 'no ar' : v.estado === 'rascunho' ? 'rascunho' : 'versão antiga') + '</small></div>');
          }
          var ap = p.aparencia_id && aps[p.aparencia_id];
          if (ap && ap.estado !== 'descartada') {
            linhas.push('<div>🎨 aparência: <b>' + esc(ap.descricao || 'mudança visual') + '</b> <small>' +
              (ap.estado === 'ativa' ? 'em uso' : ap.estado === 'rascunho' ? 'rascunho' : 'versão antiga') + '</small></div>');
          }
          if (!linhas.length) return;                     // tudo desfeito: sai da lista
          total += Number(p.valor_cobrado || 0);
          var d = new Date(p.criado_em);
          h += '<div class="ia-h"><div class="q">' + esc(String(p.pedido || '').replace(/^\[📎[^\]]*\]\s*/, '📎 ').slice(0, 140)) + '</div>' +
            '<div class="w">' + ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + ' ' +
            ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + ' · custou <b>' + reais(p.valor_cobrado) + '</b></div>' +
            '<div class="ia-mud">' + linhas.join('') + '</div>' +
            (p.lote && porLote[p.lote] ? '<div class="ia-bts"><button class="no" data-lote="' + p.lote + '">Desfazer</button></div>' : '') +
            '</div>';
        });
        c.innerHTML = h ? '<div class="m" style="font-size:12px;color:#8b99b5;margin:0 2px 8px">' +
            'Tudo o que o assistente mudou no seu app. Desfeito, sai da lista.</div>' + h
          : '<div class="ia-vazio">Nenhuma alteração ainda.<br>O que o assistente mudar aparece aqui.</div>';
        Array.prototype.forEach.call(c.querySelectorAll('[data-lote]'), function (b) {
          b.onclick = function () {
            if (!confirm('Desfazer tudo o que este pedido mudou?')) return;
            b.disabled = true;
            rest('/rest/v1/rpc/desfazer_pedido', { metodo: 'POST', corpo: { p_lote: b.dataset.lote } })
              .then(function () { recarregarApp(); listarHistorico(); })
              .catch(function (e) { b.disabled = false; toastIA('Não consegui desfazer: ' + e.message); });
          };
        });
      });
    }).catch(function (e) { c.innerHTML = '<div class="ia-vazio">' + esc(e.message) + '</div>'; });
  }

  // ------------------------------------------------------- meus módulos
  function listarModulos() {
    var c = $('iaMods');
    c.innerHTML = barrinhas();
    return Promise.all([
      rest('/rest/v1/modulos?select=id,nome,descricao,icone,versao_ativa&order=criado_em'),
      rest('/rest/v1/modulo_versoes?select=id,modulo_id,numero,estado&order=numero.desc'),
      rest('/rest/v1/aparencia_versoes?select=id,numero,estado,descricao,css,menus&order=numero.desc')
    ]).then(function (r) {
      c.innerHTML = '<div class="ia-vazio">Módulos e layouts ficam salvos aqui. Desfazer mantém a versão desabilitada para aplicar novamente, sem outro pedido ao assistente.</div>';
      r[0].forEach(function (m) {
        r[1].filter(function (v) { return v.modulo_id === m.id; }).forEach(function (v) {
          cartaoVersao(m, v, c);
        });
      });
      r[2].forEach(function (v) {
        var ativa = v.estado === 'ativa';
        var d = document.createElement('div'); d.className = 'ia-card';
        d.innerHTML = '<div class="nm">🎨 Layout · versão ' + v.numero + '</div>' +
          '<div class="sub">' + esc(v.descricao || 'Aparência do app') + '<br>' +
          (ativa ? 'Ativo' : v.estado === 'rascunho' ? 'Rascunho' : 'Desabilitado · salvo para reaplicar') +
          '</div><div class="ia-bts">' + (ativa
            ? '<button data-a="desf">Desfazer</button><button data-a="pad">Voltar ao padrão</button>'
            : '<button data-a="ver">Ver prévia</button><button data-a="ok" class="ok">Aplicar</button>') + '</div>';
        if (ativa) {
          var desfazer = function (rpc) {
            return rest('/rest/v1/rpc/' + rpc, { metodo: 'POST', corpo: {} })
              .then(carregarTemaAtivo).then(listarModulos).catch(function (e) { toastIA(e.message); });
          };
          d.querySelector('[data-a=desf]').onclick = function () { desfazer('desfazer_aparencia'); };
          d.querySelector('[data-a=pad]').onclick = function () { desfazer('aparencia_padrao'); };
        } else {
          d.querySelector('[data-a=ver]').onclick = function () {
            previaAparencia({ versao_id: v.id, css: v.css, menus: v.menus }, d);
          };
          d.querySelector('[data-a=ok]').onclick = function () { aplicarAparencia(v.id, d).then(listarModulos); };
        }
        c.appendChild(d);
      });
      if (!r[0].length && !r[2].length) c.innerHTML = '<div class="ia-vazio">Nenhum módulo ou layout ainda.<br>Peça um no Chat.</div>';
    }).catch(function (e) { c.innerHTML = '<div class="ia-vazio">' + esc(e.message) + '</div>'; });
  }

  // ------------------------------------------------- o módulo na tela
  // A ponte que vai DENTRO do quadro: o módulo chama EASY.listar(...) e a
  // conversa vira mensagens com o app, que é quem consulta o banco.
  var SHIM = "(function(){var n=0,e={};addEventListener('message',function(ev){var d=ev.data||{};" +
    "if(d.__easy&&e[d.id]){var p=e[d.id];delete e[d.id];d.erro?p[1](new Error(d.erro)):p[0](d.res);}});" +
    "function c(op,a){return new Promise(function(ok,f){var id=++n;e[id]=[ok,f];parent.postMessage({__easy:1,id:id,op:op,args:a},'*');});}" +
    "window.EASY={listar:function(x){return c('listar',[x])},salvar:function(x,d,id){return c('salvar',[x,d,id])}," +
    "apagar:function(id){return c('apagar',[id])},lancamentos:function(m){return c('lancamentos',[m])}," +
    "contas:function(){return c('contas',[])},mesAtual:function(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)}," +
    "moeda:function(v){return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}};})();";

  function pagina(html) {
    return '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width,initial-scale=1">' +
      // sem internet: nada sai do quadro além das mensagens para o app
      '<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; script-src \'unsafe-inline\'; ' +
      'style-src \'unsafe-inline\'; img-src data:; font-src data:; form-action \'none\'">' +
      '<style>html,body{margin:0;background:#0f1420;color:#e8edf7;font:14px -apple-system,system-ui,sans-serif}' +
      'body{padding:12px}</style><script>' + SHIM + '<\/script></head><body>' + html + '</body></html>';
  }

  function abrirModulo(moduloId, versaoId, titulo, cartao) {
    $('iaVerNome').textContent = titulo;
    var acoes = $('iaVerAcoes');
    acoes.innerHTML = '';
    if (cartao !== undefined) {         // prévia de um rascunho: dá para aplicar daqui
      var b = document.createElement('button');
      b.className = 'ok'; b.textContent = 'Aplicar';
      b.onclick = function () { aplicar(versaoId, cartao).then(function () { b.remove(); }); };
      acoes.appendChild(b);
    }
    $('iaVer').hidden = false;
    quadros = quadros.filter(function (x) { return x.tipo !== 'ver'; });
    var poe = function (html) {
      var f = novoQuadro('iaFrame', html);
      quadros = quadros.filter(function (x) { return x.tipo !== 'ver'; }).concat({ frame: f, modulo: moduloId, tipo: 'ver' });
    };
    rest('/rest/v1/modulo_versoes?select=html&id=eq.' + versaoId).then(function (r) {
      if (!r.length) throw new Error('versão não encontrada');
      poe(r[0].html);
    }).catch(function (e) { poe('<p>' + esc(e.message) + '</p>'); });
  }
  function fecharModulo() {
    $('iaVer').hidden = true; novoQuadro('iaFrame', '');
    quadros = quadros.filter(function (x) { return x.tipo !== 'ver'; });
    if (!$('iaMods').hidden) listarModulos();
  }

  // o que o módulo pode pedir ao app - e nada além disso
  function ponte(ev) {
    var q = quadros.filter(function (x) { return x.frame.contentWindow === ev.source; })[0];
    var d = ev.data || {};
    if (!q || !d.__easy) return;
    var M = q.modulo, a = d.args || [];
    var responde = function (res) { ev.source.postMessage({ __easy: 1, id: d.id, res: res }, '*'); };
    var falha = function (e) { ev.source.postMessage({ __easy: 1, id: d.id, erro: String(e && e.message || e) }, '*'); };
    var col = function (x) { return encodeURIComponent(String(x || '').slice(0, 60)); };
    var plano = function (r) { var o = JSON.parse(JSON.stringify(r.dados || {})); o.id = r.id; o.criado_em = r.criado_em; return o; };
    var p;
    if (d.op === 'listar') {
      p = rest('/rest/v1/registros?select=id,dados,criado_em&modulo_id=eq.' + M + '&colecao=eq.' + col(a[0]) +
               '&order=criado_em&limit=2000').then(function (r) { return r.map(plano); });
    } else if (d.op === 'salvar') {
      var dados = JSON.parse(JSON.stringify(a[1] || {}));
      delete dados.id; delete dados.criado_em;
      p = a[2]
        ? rest('/rest/v1/registros?id=eq.' + encodeURIComponent(a[2]) + '&modulo_id=eq.' + M,
               { metodo: 'PATCH', corpo: { dados: dados, atualizado_em: new Date().toISOString() },
                 prefer: 'return=representation' }).then(function (r) { return r[0] ? plano(r[0]) : null; })
        : rest('/rest/v1/registros', { metodo: 'POST', prefer: 'return=representation',
               corpo: { user_id: P().sessao().user_id, modulo_id: M, colecao: String(a[0] || '').slice(0, 60), dados: dados } })
            .then(function (r) { return plano(r[0]); });
    } else if (d.op === 'apagar') {
      p = rest('/rest/v1/registros?id=eq.' + encodeURIComponent(a[0]) + '&modulo_id=eq.' + M,
               { metodo: 'DELETE', prefer: 'return=minimal' }).then(function () { return true; });
    } else if (d.op === 'lancamentos') {
      var mes = /^\d{4}-\d{2}$/.test(a[0]) ? a[0] : new Date().toISOString().slice(0, 7);
      p = rest('/rest/v1/lancamentos?select=data,valor,natureza,descricao,fornecedor,meio,contas(nome),categorias(nome)' +
               '&mes_ref=eq.' + mes + '&status=neq.IGNORADO&order=data&limit=3000').then(function (r) {
        return r.map(function (l) {
          return { data: l.data, valor: Number(l.valor), natureza: l.natureza,
                   descricao: l.fornecedor || l.descricao, categoria: (l.categorias || {}).nome || '',
                   conta: (l.contas || {}).nome || '', meio: l.meio };
        });
      });
    } else if (d.op === 'contas') {
      p = rest('/rest/v1/categorias?select=nome,grupo,natureza&ativa=is.true&order=nome');
    } else {
      p = Promise.reject(new Error('operação não permitida: ' + d.op));
    }
    p.then(responde, falha);
  }

  // veio do primeiro acesso com "importar minha planilha": abre o chat já
  // com o botão de escolher o arquivo (o seletor só abre com um toque)
  function convitePlanilha() {
    var f = false;
    try { f = sessionStorage.getItem('easyapp:abrir-planilha') === '1'; sessionStorage.removeItem('easyapp:abrir-planilha'); } catch (e) {}
    if (!f) return;
    setTimeout(function () {
      abrir();
      $('iaTxt').value = 'Essa é a minha planilha de contas. Lê e me mostra a prévia da projeção dos próximos 12 meses.';
      var d = document.createElement('div');
      d.className = 'ia-card';
      d.innerHTML = '<div class="nm">📎 Sua planilha</div><div class="sub">Escolha o arquivo: eu leio, mostro a prévia e só gravo quando você aprovar.</div>' +
        '<div class="ia-bts"><button class="ok">Escolher a planilha</button></div>';
      d.querySelector('button').onclick = function () { $('iaArq').click(); };
      setTimeout(function () { $('iaMsgs').appendChild(d); rolar(); }, 900);
    }, 1200);
  }
  window.EASYAPP_IA = { abrir: abrir, anexar: function () { abrir(); $('iaArq').click(); } };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { montar(); convitePlanilha(); });
  else { montar(); convitePlanilha(); }
})();
</script>
<script>/* Minha conta: o que é do CLIENTE e não das finanças dele.
 *
 *   - termos de uso e privacidade: o aceite (e o reaceite quando mudarem);
 *   - plano: teste de 14 dias, assinatura mensal/anual pelo Mercado Pago,
 *     e a tela de "seu teste terminou";
 *   - créditos do assistente (pré-pagos);
 *   - avisos de compra: os dados prontos para o MacroDroid (Android) e para
 *     o app Atalhos (iPhone);
 *   - Open Finance com a conta Pluggy da própria pessoa;
 *   - excluir a conta.
 *
 * Quem decide plano e crédito é o servidor (funções cobranca e mp-aviso);
 * daqui só se LÊ e se pede.
 */
(function () {
  'use strict';

  var P = window.EASYAPP_PONTE, CFG = window.EASYAPP_CFG || {};
  var VERSAO_TERMOS = '2026-10-02';
  var SITE = 'https://easyappfinancial.com.br/';
  /* A versão nova do APK sai daqui, direto de onde o build publica: o site só
     copiava de 5 em 5 minutos (e o GitHub atrasa esse relógio, às vezes meia
     hora), então o app demorava para ver a atualização. */
  var APK_BASE = 'https://nhngqhgxmrnqbcnklrwc.supabase.co/storage/v1/object/public/app/';
  var cap = window.Capacitor;
  var nativo = !!(cap && cap.nativePromise && cap.isNativePlatform && cap.isNativePlatform());
  var iniciado = false;

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function reais(v) { return 'R$ ' + (Number(v) || 0).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  function data(iso) { var d = new Date(iso); return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear(); }
  function dataHora(iso) { var d = new Date(iso); return isNaN(d.getTime()) ? 'data indisponível' : data(iso) + ' às ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }
  function aviso(m) { if (typeof window.toast === 'function') window.toast(m); else alert(m); }
  function uid() { var s = P.sessao(); return s && s.user_id; }

  // chama uma função do servidor com o login (a ponte renova o token antes)
  function fn(nome, corpo) {
    return P.rest('/rest/v1/perfis?select=id&limit=1').then(function () {
      return fetch(CFG.url + '/functions/v1/' + nome, {
        method: 'POST',
        headers: { 'apikey': CFG.anon, 'Authorization': 'Bearer ' + P.sessao().token, 'Content-Type': 'application/json' },
        body: JSON.stringify(corpo || {})

  function lembreteLigado() { try { return localStorage.getItem('easyapp:lembrete') !== 'nao'; } catch (e) { return true; } }

  // conta, e a tarefa do Android avisa com 5 dias, com 1 e no dia. É do
  // aparelho (cada celular tem o seu MacroDroid), por isso fica no celular.
  // Valor: 'AAAA-MM-DD' (fim do tempo grátis), 'PRO' ou '' (não informado).
  function macroVence() { try { return localStorage.getItem('easyapp:macro') || ''; } catch (e) { return ''; } }
  function macroDias() {
    var v = macroVence(); if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return null;
    var f = new Date(v + 'T12:00:00'), h = new Date(); h.setHours(12, 0, 0, 0);
    return Math.round((f - h) / 864e5);
  }

  // O APK leva as telas dentro dele: versão nova só chega instalando de novo.

  // sem querer, é só tocar. Na web (iPhone) não precisa: já abre a nova.
  function numVersao(t) {
    var m = String(t || '').match(/(\d+)\.(\d+)\.(\d+)/);
    return m ? (+m[1]) * 1e6 + (+m[2]) * 1e3 + (+m[3]) : 0;
  }

    fetch(location.pathname + '?x=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
      var m = t.match(/"versao": "(\d+\.\d+\.\d+)/), nova = m ? numVersao(m[1]) : 0;
      if (!nova || nova === minha) return;
      var ja = ''; try { ja = sessionStorage.getItem('easyapp:recarregou') || ''; } catch (e) {}
      if (ja === m[1]) return;
      try { sessionStorage.setItem('easyapp:recarregou', m[1]); } catch (e) {}
      location.replace(location.pathname + '?v=' + m[1]);
    }).catch(function () {});

<script>
/* Trava por digital / rosto.
 *
 * APK: plugin proprio (BiometriaPlugin) - rosto, digital ou PIN do celular.
 * Navegador (iPhone pelo Safari, PWA): uma chave de acesso (passkey/WebAuthn)
 *   criada NESTE aparelho; abrir o app pede essa chave e o iPhone confirma com
 *   Face ID ou Touch ID. E uma trava local, como a do APK: nao substitui o
 *   login, so impede que quem pega o celular desbloqueado veja os seus dados.
 *   O Safari so libera a chave depois de um toque: na web a trava mostra o
 *   botao "Desbloquear" em vez de chamar sozinha.
 *
 * A sessao fica guardada no celular (por isso o app abre direto, sem senha).
 * A trava e a porta da frente: com ela ligada, abrir o app ou voltar a ele
 * depois de PAUSA segundos fora pede o rosto ou a digital - e, se a
 * biometria falhar, o PIN/padrao do proprio celular.
 *
 * Ligar: o app oferece logo depois de entrar com e-mail e senha.
 * Desligar: "Entrar com e-mail e senha" na trava e, depois, "Agora não".
 */
(function(){
  var CHAVE = 'easyapp:biometria', PAUSA = 60000;   // 1 minuto fora antes de pedir de novo
  var cap = window.Capacitor;
  var nativo = !!(cap && cap.nativePromise && cap.isNativePlatform && cap.isNativePlatform());
  var web = !nativo && !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext);
  var apple = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
  var CHAVE_ID = 'easyapp:passkey';
  var tela = document.getElementById('trava'), msg = document.getElementById('tMsg');
  var bSim = document.getElementById('tSim'), bNao = document.getElementById('tNao');
  var verificando = false, saiuEm = null, oferecendo = false;

  function ligada() { try { return localStorage.getItem(CHAVE) === 'sim'; } catch (e) { return false; } }
  function gravar(v) { try { v ? localStorage.setItem(CHAVE, 'sim') : localStorage.removeItem(CHAVE); } catch (e) {} }
  function temSessao() { return !!(window.EASYAPP_PONTE && window.EASYAPP_PONTE.sessao()); }

  // ---- passkey (web)
  function b64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
  function deB64(t) { return Uint8Array.from(atob(t), function (c) { return c.charCodeAt(0); }); }
  function acaso(n) { return crypto.getRandomValues(new Uint8Array(n)); }
  function idGuardado() { try { return localStorage.getItem(CHAVE_ID) || ''; } catch (e) { return ''; } }
  function webVerificar(criar) {
    var id = idGuardado();
    if (criar || !id) {
      var ses = (window.EASYAPP_PONTE && window.EASYAPP_PONTE.sessao()) || {};
      return navigator.credentials.create({ publicKey: {
        challenge: acaso(32), rp: { name: 'EasyAPP Financial', id: location.hostname },
        user: { id: acaso(16), name: ses.email || 'EasyAPP', displayName: 'EasyAPP Financial' },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
        timeout: 60000 } }).then(function (c) {
          try { localStorage.setItem(CHAVE_ID, b64(c.rawId)); } catch (e) {}
          return { ok: true };
        });
    }
    return navigator.credentials.get({ publicKey: {
      challenge: acaso(32), rpId: location.hostname, userVerification: 'required', timeout: 60000,
      allowCredentials: [{ type: 'public-key', id: deB64(id), transports: ['internal'] }] } })
      .then(function () { return { ok: true }; });
  }

  function chamar(metodo, op) {
    op = op || {};
    if (nativo) return cap.nativePromise('Biometria', metodo, op);
    if (!web) return Promise.reject(new Error('sem biometria'));
    if (metodo === 'disponivel') {
      return PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(function (ok) {
        return { disponivel: ok, biometria: ok, nome: apple ? 'o Face ID ou o Touch ID' : 'a digital ou o rosto' };
      });
    }
    return webVerificar(!!op.criar);
  }
  function disponivel() {
    return chamar('disponivel').catch(function () { return { disponivel: false }; });
  }
  function nomeDoMetodo(d) {
    if (d.nome) return d.nome;
    if (d.rosto && d.digital) return 'o rosto ou a digital';
    if (d.rosto) return 'o rosto';
    if (d.digital) return 'a digital';
    return 'o bloqueio do celular';
  }

  function mostrar(modo, texto, botoes) {
    tela.dataset.modo = modo;
    msg.textContent = texto || '';
    bSim.style.display = botoes ? '' : 'none';
    bNao.style.display = botoes ? '' : 'none';
    tela.hidden = false;
  }
  function soltar() { tela.hidden = true; }

  function desbloquear() {
    if (verificando) return;
    verificando = true;
    mostrar('trava', '', false);
    // web: o pedido da chave tem de sair DENTRO do toque (o Safari recusa se
    // passar antes por outra espera) - vai direto, sem conferir disponibilidade
    (web ? Promise.resolve({ disponivel: true, direto: true }) : disponivel()).then(function (d) {
      if (d.direto) return chamar('verificar');
      // biometria e senha do celular removidas: travar seria trancar o dono
      // do lado de fora. Abre e desliga - a oferta volta no proximo login.
      if (!d.disponivel) { gravar(false); return { ok: true }; }
      return chamar('verificar', { subtitulo: 'Use ' + nomeDoMetodo(d) + ' para abrir' });
    }).then(function (r) {
      verificando = false;
      if (r && r.ok) soltar();
      else mostrar('trava', 'Não foi possível confirmar que é você.', true);
    }, function () {
      verificando = false;
      mostrar('trava', 'Não foi possível confirmar que é você.', true);
    });
  }

  function travar() {
    if (!(nativo || web) || !ligada() || !temSessao()) return;
    // na web a chave só sai com um toque: a trava espera o "Desbloquear"
    if (web) { mostrar('trava', 'Toque em Desbloquear para entrar.', true); return; }
    desbloquear();
  }

  bSim.onclick = function () {
    if (oferecendo) { oferecendo = false; ativar(); } else desbloquear();
  };
  bNao.onclick = function () {
    if (oferecendo) { oferecendo = false; gravar(false); soltar(); bSim.textContent = 'Desbloquear'; bNao.textContent = 'Entrar com e-mail e senha'; return; }
    // a senha resolve tudo: some a sessao e o app volta para a tela de entrar
    try { localStorage.removeItem('easyapp:sessao'); } catch (e) {}
    location.reload();
  };

  /* Ligar exige passar pela biometria uma vez: se o rosto/digital nao
     funcionam neste celular, melhor descobrir agora do que na proxima abertura. */
  function ativar() {
    verificando = true;
    mostrar('oferta', 'confirmando...', false);
    chamar('verificar', { subtitulo: 'Confirme para ligar a trava', criar: true }).then(function (r) {
      verificando = false;
      if (r && r.ok) gravar(true);
      bSim.textContent = 'Desbloquear'; bNao.textContent = 'Entrar com e-mail e senha';
      soltar();
    }, function () {
      verificando = false;
      bSim.textContent = 'Desbloquear'; bNao.textContent = 'Entrar com e-mail e senha';
      soltar();
    });
  }

  function depoisDoLogin() {
    if (!(nativo || web)) return;
    gravar(false);
    disponivel().then(function (d) {
      if (!d.disponivel) return;
      oferecendo = true;
      bSim.textContent = d.biometria ? 'Sim, usar ' + nomeDoMetodo(d) : 'Sim, usar o bloqueio do celular';
      bNao.textContent = 'Agora não';
      mostrar('oferta', 'Pedir ' + nomeDoMetodo(d) + ' sempre que abrir o app?', true);
    });
  }

  /* Saiu do app: tampa a tela na hora (a miniatura de "recentes" nao mostra
     saldo) e marca o relogio. Voltou depois de PAUSA: pede de novo. Voltou
     antes: so destampa. A tela de PIN do celular tambem tira o app da frente -
     por isso nada disso conta enquanto ha uma verificacao aberta. */
  function saiu() {
    if (verificando || oferecendo || !(nativo || web) || !ligada() || !temSessao()) return;
    if (saiuEm === null) saiuEm = Date.now();
    if (tela.hidden) mostrar('tampa', '', false);
  }
  function voltou() {
    if (verificando || saiuEm === null) return;
    var fora = Date.now() - saiuEm;
    saiuEm = null;
    if (fora >= PAUSA) travar();
    else if (tela.dataset.modo === 'tampa') soltar();
  }
  if (nativo && cap.Plugins && cap.Plugins.App && cap.Plugins.App.addListener) {
    cap.Plugins.App.addListener('appStateChange', function (e) { e.isActive ? voltou() : saiu(); });
  }
  document.addEventListener('visibilitychange', function () {
    document.visibilityState === 'hidden' ? saiu() : voltou();
  });

  window.EASYAPP_TRAVA = { depoisDoLogin: depoisDoLogin, travar: travar };
  /* Ao abrir, a trava É a entrada: cobre a tela já com o logo nascendo
     (as mesmas barras da abertura) e só chama a biometria depois que a
     animação termina. Chamando na hora, o diálogo do Android atropelava a
     entrada e ela nunca aparecia. */
  if (nativo && ligada() && temSessao()) {
    mostrar('tampa', '', false);
    setTimeout(travar, 2500);   // depois da logo, com calma
  } else if (web && ligada() && temSessao()) {
    travar();
  }
})();
</script>

  /* ---------- ABERTURA ----------
     Cobre os segundos em que o servidor ainda esta montando o mes. Some

  /* O formulario de "conta nova" aberto a partir do Extrato precisa de um

  /* Entrada: as três barras do ícone nascem uma a uma, com um quique, e

  .ab-tile{width:112px;height:112px;border-radius:26px;background:#141b2b;display:flex;align-items:center;justify-content:center;

<script>
// Qualquer erro passa a aparecer na tela. Antes, um erro dentro do retorno
// do servidor deixava o app parado em "Carregando..." para sempre.
function mostrarFalha(titulo, detalhe){
  try{ fecharAbertura(); }catch(e){}
  var c=document.getElementById('tela-mes');
  if(!c) return;
  c.innerHTML='<div class="card" style="border-color:#7f1d1d;background:#2a1414">'+
    '<b style="color:#fca5a5">'+titulo+'</b>'+
    '<div style="font:12px/1.5 ui-monospace,monospace;color:#e8b4b4;margin-top:8px;'+
    'white-space:pre-wrap;word-break:break-word">'+String(detalhe)+'</div>'+
    '<button class="bt-ac" style="margin-top:12px" onclick="location.reload()">Recarregar</button></div>';
  document.querySelectorAll('nav a').forEach(function(x){x.classList.remove('on');});
  var p=document.querySelector('nav a[data-t=mes]'); if(p) p.classList.add('on');
  ['pendentes','painel','cartao','extrato','plano','novo'].forEach(function(t){
    var e=document.getElementById('tela-'+t); if(e) e.classList.add('hide');
  });
  var e=document.getElementById('tela-mes'); if(e) e.classList.remove('hide');
}
window.onerror=function(msg,arq,lin,col){ mostrarFalha('Erro no app', msg+'  (linha '+lin+')'); };

var ST = { mes:null, filtro:'TUDO', meio:'TUDO', familia:'TUDO',
           pendentes:[], semCategoria:null, resumo:null, cartao:null,
           categorias:[], extrato:null, busca:'', cacheMes:{} };

// cor fixa por familia: o olho reconhece antes de ler
/* Cada família com uma cor SÓ dela. As conhecidas têm cor fixa; as outras
   (CASA DE PRAIA, MORADIA, EMPRESA...) recebem, na ordem em que aparecem, a
   próxima cor ainda livre da paleta - nunca duas famílias com a mesma cor.
   (PESSOAL e LOJA eram dois roxos quase iguais.) */
var CORES = { CASA:'#3b82f6', PESSOAL:'#a855f7', VEICULO:'#f59e0b', SAUDE:'#22c55e',
              EDUCACAO:'#06b6d4', LAZER:'#ec4899', IMPOSTOS:'#ef4444', INVEST:'#14b8a6',
              DIVIDA:'#f97316', CARTAO:'#64748b', LOJA:'#84cc16', FAMILIA:'#eab308',
              RECEITA:'#22c55e', OUTROS:'#94a3b8' };
var PALETA_LIVRE = ['#0ea5e9','#f43f5e','#d946ef','#facc15','#10b981','#6366f1','#fb923c','#2dd4bf',
                    '#e879f9','#a3e635','#38bdf8','#fda4af','#c4b5fd','#fcd34d','#5eead4','#fdba74'];
function cor(g){
  var k=String(g||'OUTROS').toUpperCase();
  if(CORES[k]) return CORES[k];
  var usadas={}; Object.keys(CORES).forEach(function(x){ usadas[CORES[x]]=1; });
  for(var i=0;i<PALETA_LIVRE.length;i++) if(!usadas[PALETA_LIVRE[i]]) return (CORES[k]=PALETA_LIVRE[i]);
  return CORES.OUTROS;
}
function ponto(g){ return '<i class="pt" style="background:'+cor(g)+'"></i>'; }
var NOMES_MES = ['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho',
                 'Agosto','Setembro','Outubro','Novembro','Dezembro'];

// numero com ponto de milhar, para os campos editaveis
/* Numeros grandes ficam ilegiveis por extenso: 2.484.161 vira 2,5 mi */
/* O mesmo numero sem o "R$ " na frente. Numa tabela de quatro colunas de
   valor o simbolo se repete dezesseis vezes e nao acrescenta nada - o
   cabecalho ja diz que sao reais. */
function seco(v){ return mil(v).replace('R$ ',''); }

function mil(v){
  v=Number(v)||0;
  var s=v<0?'-':''; v=Math.abs(v);
  if(v>=1000000) return s+'R$ '+(v/1000000).toFixed(v>=10000000?0:1).replace('.',',')+' mi';
  if(v>=10000)   return s+'R$ '+Math.round(v/1000)+'K';
  return moeda(s==='-'?-v:v);
}
function num(v){ return (Number(v)||0).toLocaleString('pt-BR',
  {minimumFractionDigits:2,maximumFractionDigits:2}); }
function moeda(v){ return (v<0?'-':'') + 'R$ ' +
  Math.abs(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function el(id){ return document.getElementById(id); }
/* Texto que veio de fora (banco, aviso do celular, planilha, IA) vai para a
   tela como TEXTO: um nome de loja com "<img onerror=...>" virava código
   rodando dentro do app, com acesso ao login (auditoria A03). */
function tx(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(m){ var t=el('toast'); if(!t) return; t.textContent=m; t.classList.add('on');
  setTimeout(function(){t.classList.remove('on');},1900); }

/* Trocar de menu tem que abrir no comeco da tela. Como todas as telas dividem
   a mesma rolagem da pagina, sair do Extrato la embaixo e entrar no Painel
   abria o Painel no meio. Rolamos de novo depois do render porque o conteudo
   chega do servidor e muda a altura da pagina. */
function aoTopo(){
  ST.lugar = null;
  try{
    window.scrollTo(0,0);
    document.documentElement.scrollTop=0;
    document.body.scrollTop=0;
  }catch(e){}
}
function aoTopoJaEDepois(){
  aoTopo();
  requestAnimationFrame(aoTopo);
  setTimeout(aoTopo,120);
  setTimeout(aoTopo,400);
}

var TELAS=['pendentes','mes','painel','cartao','extrato','plano','novo','config','metas','patrimonio'];

/* Painel e Plano viraram um menu so - "Analise" - com duas abas por dentro,
   do mesmo jeito que o Extrato tem conta corrente e cartao. Foi assim que
   abriu lugar na barra para o Configuracoes. */
function irParaTela(t){
  document.querySelectorAll('nav a').forEach(function(x){
    x.classList.toggle('on', x.dataset.t===t); });
  ST.telaAtual=t;

  if(t==='analise'){
    ST.modoAnalise = ST.modoAnalise || 'PAINEL';
    // o painel e redesenhado junto com o resto do app (render), as vezes com
    // outra aba da Analise ativa - e ficava com a aba errada acesa
    if(ST.modoAnalise==='PAINEL') renderPainel();
    if(ST.modoAnalise==='PLANO') carregarPlano();
    if(ST.modoAnalise==='METAS') carregarMetas();
    if(ST.modoAnalise==='PATRIMONIO') carregarPatrimonio();
  }
  if(t==='cartao' && ST.saldos && ST.saldos.cartoes &&
     ST.saldos.cartoes.mes && ST.saldos.cartoes.mes!==ST.mes){
    carregar(ST.saldos.cartoes.mes, true);
  }
  if(t==='mes' && ST.mes!==mesDeHoje()) carregar(mesDeHoje(), true);
  if(t==='extrato') mesDoExtrato();
  if(t==='config') carregarConfig();

  var DA_ANALISE = { PLANO:'plano', METAS:'metas', PATRIMONIO:'patrimonio' };
  var visiveis = (t==='analise') ? [DA_ANALISE[ST.modoAnalise] || 'painel'] : [t];
  TELAS.forEach(function(x){
    el('tela-'+x).classList.toggle('hide', visiveis.indexOf(x)<0);
  });
  ajustarFiltros();
  aoTopoJaEDepois();
}

function mesDeHoje(){
  var d=new Date();
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);
}
var CURTO=['','JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];

function irPara(ano, mes){

}

function renderCabecalho(){

             'style="border-left:3px solid '+cor(f)+'">'+f+'</button>';
    }).join('');

function mudarFiltro(f){

}

  // o Cartao tambem obedece ao filtro: ele estava de fora, e trocar a
  // familia mudava o Mes enquanto a lista de verbas do cartao ficava igual
