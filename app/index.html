          }
          var f = por[chave];
          f.vezes++; f.valor = n(f.valor + Number(l.valor));
          f.meses[l.mes_ref] = true;
          total += Number(l.valor);
          var d = String(l.data).split('-');
          var s = d[2] + '/' + d[1] + '/' + d[0].slice(2);
          if (!f.ultima || s > f.ultima) f.ultima = s;
        });
        var lista = Object.keys(por).map(function (k) {
          var f = por[k];
          f.qtdMeses = Object.keys(f.meses).length;   // a tela escreve "1x · 1 mês"
          delete f.meses;
          return f;
        }).sort(function (a, b) { return b.valor - a.valor; });
        return { quantos: lista.length, total: n(total), fornecedores: lista };
      });
  }


  /* ------------------------------------------------------------ painel */
  /* O ano inteiro: doze meses, o que foi para cada conta e os derivados.
     As somas vêm prontas do banco (ano_mes e ano_categoria); aqui só se
     monta o formato que a tela espera e se calculam os três números que
     dependem do total - taxa de poupança, peso do cartão e meses com dado. */
  function ano(a) {
    a = Number(a) || Number(hojeRef().slice(0, 4));
    return Promise.all([
      rest('/rest/v1/ano_mes?select=*&mes_ref=gte.' + a + '-01&mes_ref=lte.' + a + '-12&order=mes_ref'),
      rest('/rest/v1/ano_categoria?select=categoria,grupo,valor&ano=eq.' + a),
      rest('/rest/v1/lancamentos?select=mes_ref&order=mes_ref.asc&limit=1'),
      rest('/rest/v1/lancamentos?select=mes_ref&order=mes_ref.desc&limit=1')
    ]).then(function (r) {
      var porMes = {};
      r[0].forEach(function (x) { porMes[x.mes_ref] = x; });

      /* Mes FUTURO nao e "mes com dados", mesmo tendo lancamento: a fatura
         de novembro ja existe por causa das parcelas, mas o salario de
         novembro nao. Contar esses meses derruba a media de receita e infla
         o peso do cartao - o diagnostico passa a dizer bobagem. */
      var agora = new Date();
      var anoAtual = agora.getFullYear();
      var mesLimite = (a < anoAtual) ? 12 : (a > anoAtual) ? 0 : (agora.getMonth() + 1);

      var serie = [];
      for (var m = 1; m <= 12; m++) {
        var ref = a + '-' + ('0' + m).slice(-2);
        var x = porMes[ref] || {};
        var receita = n(x.receita), despesa = n(x.despesa);
        serie.push({
          mes: m, receita: receita, despesa: despesa,
          saldo: n(receita - despesa), cartao: n(x.cartao),
          aClassificar: n(x.a_classificar),
          previstoDespesa: n(x.previsto_despesa),
          previstoReceita: n(x.previsto_receita),
          futuro: m > mesLimite,
          temDados: (m <= mesLimite) && (receita > 0 || despesa > 0)
        });
      }

      var porCat = {}, porGrupo = {};
      r[1].forEach(function (x) {
        porCat[x.categoria] = n((porCat[x.categoria] || 0) + Number(x.valor));
        porGrupo[x.grupo] = n((porGrupo[x.grupo] || 0) + Number(x.valor));
      });
      var lista = function (o, campo) {
        return Object.keys(o).map(function (k) {
          var y = { valor: o[k] }; y[campo] = k; return y;
        }).sort(function (p, q) { return q.valor - p.valor; });
      };

      // Os totais e as medias so olham o que ja aconteceu, pela mesma razao.
      var receitaTotal = 0, despesaTotal = 0, cartaoTotal = 0, comDados = 0;
      serie.forEach(function (s) {
        if (s.mes > mesLimite) return;
        receitaTotal += s.receita; despesaTotal += s.despesa; cartaoTotal += s.cartao;
        if (s.temDados) comDados++;
      });

      var anos = {};
      [r[2][0], r[3][0]].forEach(function (x) { if (x) anos[x.mes_ref.slice(0, 4)] = true; });
      anos[String(a)] = true;

      return {
        ano: a, serie: serie,
        categorias: lista(porCat, 'categoria'),
        grupos: lista(porGrupo, 'grupo'),
        receitaTotal: n(receitaTotal), despesaTotal: n(despesaTotal),
        saldoTotal: n(receitaTotal - despesaTotal), cartaoTotal: n(cartaoTotal),
        mesesComDados: comDados,
        taxaPoupanca: receitaTotal ? Math.round((receitaTotal - despesaTotal) / receitaTotal * 100) : 0,
        // Peso do cartao e sobre a RECEITA, nao sobre a despesa: a pergunta
        // que ele responde e "quanto do que entra ja esta comprometido com a
        // fatura", e nao "que fatia do gasto passa no cartao".
        pesoCartao: receitaTotal ? Math.round(cartaoTotal / receitaTotal * 1000) / 10 : 0,
        anosDisponiveis: Object.keys(anos).sort()
      };
    });
  }



  /* ====================================================== PROJEÇÃO =====
   * Porte de projetarPorConta_ e apiProjecaoFutura.
   *
   * O calendário da sua vida mora na tabela `config`, não aqui: IPTU, IPVA,
   * a NF cheia de novembro, o condomínio que muda de patamar em 2028. Já
   * estiveram escritos neste arquivo, o que só servia para uma pessoa. Vazio
   * = não existe, e quem instalar o app não herda a conta de ninguém.
   *
   * A gramática é a mesma do Codigo.gs: itens separados por ';', campos
   * por '|'.
   */

  var _cfgCache = null;
  function config() {
    if (_cfgCache) return Promise.resolve(_cfgCache);
    return rest('/rest/v1/config?select=chave,valor').then(function (r) {
      var m = {};
      r.forEach(function (x) { m[x.chave] = x.valor; });
      return (_cfgCache = m);
    });
  }
  function cfgNum(c, chave, padrao) {
    var v = Number(c[chave]);
    return isNaN(v) || c[chave] === '' || c[chave] == null ? padrao : v;
  }
  function numeroCfg(v) {
    return Number(String(v == null ? '' : v).trim().replace(',', '.')) || 0;
  }

  /** SAZONAIS = 'CONTA|meses|valor|reajuste; ...'
      'CASA - IPTU|4,5,6,7,8,9|250'  ·  'OUTROS RENDIMENTOS (13 NF)|11|14197.95|contrato'
      O 4º campo é opcional: uma taxa ao ano, 'contrato' ou 'inflacao'. */
  function lerSazonais(c) {
    var m = {};
    String(c.SAZONAIS || '').split(';').forEach(function (p) {
      var x = p.split('|');
      if (x.length < 3) return;
      var nome = x[0].trim();
      var meses = x[1].split(',').map(function (k) { return Number(k.trim()); })
                      .filter(function (k) { return k >= 1 && k <= 12; });
      if (!nome || !meses.length) return;
      var reaj = null, r = String(x[3] || '').trim().toLowerCase();
      if (r === 'contrato' || r === 'inflacao' || r === 'inflação') {
        reaj = (r === 'contrato') ? 'contrato' : 'inflacao';
      } else if (r) { var v = Number(r.replace(',', '.')); if (v) reaj = v > 1 ? v / 100 : v; }
      m[nome] = { meses: meses, valor: numeroCfg(x[2]), reajuste: reaj };
    });
    return m;
  }

  /** CALENDARIO e DEGRAUS = 'CONTA|AAAA-MM:valor,AAAA-MM:valor; ...' */
  function porMesDaCfg(c, chave) {
    var m = {};
    String(c[chave] || '').split(';').forEach(function (p) {
      var x = p.split('|');
      if (x.length < 2) return;
      var nome = x[0].trim();
      if (!nome) return;
      var quando = {};
      x[1].split(',').forEach(function (par) {
        var y = par.split(':');
        if (y.length === 2 && /^\d{4}-\d{2}$/.test(y[0].trim())) quando[y[0].trim()] = numeroCfg(y[1]);
      });
      if (Object.keys(quando).length) m[nome] = quando;
    });
    return m;
  }

  /** PARCELAS_FIXAS = 'CONTA; CONTA' - parcela que não corrige por nada. */
  function lerFixas(c) {
    var m = {};
    String(c.PARCELAS_FIXAS || '').split(';').forEach(function (k) { k = k.trim(); if (k) m[k] = true; });
    return m;
  }

  /** CONTAS_COM_FIM = 'CONTA|AAAA-MM; ...' - depois desse mês vale zero. */
  function lerFim(c) {
    var m = {};
    String(c.CONTAS_COM_FIM || '').split(';').forEach(function (p) {
      var x = p.split('|');
      if (x.length === 2 && /^\d{4}-\d{2}$/.test(x[1].trim())) m[x[0].trim()] = x[1].trim();
    });
    return m;
  }

  /** REAJUSTE_POR_CONTA = 'CONTA|taxa|mes|desde; ...'
      'SAÚDE - PLANO DE SAUDE|0.10|10|2027' sobe 10% todo outubro, desde 2027.
      Mês e ano são opcionais; sem eles o reajuste cai na virada do ano. */
  function lerReajustePorConta(c) {
    var m = {};
    String(c.REAJUSTE_POR_CONTA || '').split(';').forEach(function (p) {
      var x = p.split('|');
      if (x.length < 2) return;
      var nome = x[0].trim(), v = numeroCfg(x[1]);
      if (!nome || !v) return;
      var mes = Number(String(x[2] || '').trim()) || 0;
      m[nome] = { taxa: v > 1 ? v / 100 : v, mes: (mes >= 1 && mes <= 12) ? mes : 0,
                  desde: Number(String(x[3] || '').trim()) || 0 };
    });
    return m;
  }

  /** Até onde a projeção vai. Por padrão, até o ano da meta. */
  /* Sempre até a aposentadoria: o ano em que a pessoa faz a idade da meta
     (NASCIMENTO + IDADE_APOSENTADORIA). Sem nascimento, o ano do alvo do
     plano; sem nenhum dos dois, 3 anos. */
  function anosDaProjecao(c) {
    var hojeA = new Date().getFullYear();
    var mN = String(c.NASCIMENTO || '').match(/^(\d{4})-/);
    if (mN) {
      var fim = Number(mN[1]) + cfgNum(c, 'IDADE_APOSENTADORIA', 60);
      if (fim > hojeA) return Math.min(50, fim - hojeA);
    }
    var alvo = 0;
    try { alvo = Number((JSON.parse(String(c.PLANO_ALVO || '{}')) || {}).ano) || 0; } catch (e) {}
    var hoje = new Date().getFullYear();
    return (alvo > hoje) ? (alvo - hoje) : 3;
  }

  function pluxeeDe(serie, ref, base) {
    if (serie[ref] !== undefined) return n(serie[ref]);
    var chaves = Object.keys(serie).sort();
    if (!chaves.length) return n(base);
    var ultima = chaves[chaves.length - 1];
    return ref > ultima ? n(serie[ultima]) : n(base);
  }

  /** previsto de um mês, conta a conta - o que era a FC. */
  function previstosDoMes(mes, previstos) {
    var o = {};
    (previstos[mes] || []).forEach(function (p) { o[p.categoria] = n(p.valor); });
    return o;
  }

  var _projCache = {};
  function projetarPorConta(anos) {
    return config().then(function (c) {
      anos = Number(anos) || anosDaProjecao(c);
      /* Vale por 2 minutos. Lançamento que chega de fora com o app aberto
         (aviso do banco, Open Finance) não passa pelas escritas do app e não
         limpava este cache: o Mês já via o lançamento novo e o Plano ainda
         partia do saldo velho - os dois "fim do mês" diferiam por centavos. */
      var guardado = _projCache[anos];
      if (guardado && Date.now() - guardado.t < 120000) return guardado.p;
      var p = montarProjecao(anos, c);
      _projCache[anos] = { p: p, t: Date.now() };
      return p;
    });
  }

  function montarProjecao(anos, c) {
    return Promise.all([
      rest('/rest/v1/categorias?select=nome,grupo,natureza,reajuste,mes_reajuste,ate'
           + '&ativa=is.true&order=nome'),
      lerTudo('/rest/v1/previstos?select=mes_ref,valor,categorias(nome)&order=mes_ref'),
      lerTudo('/rest/v1/resumo_mes?select=mes_ref,categoria,realizado&order=mes_ref'),
      saldos(hojeRef())
    ]).then(function (R) {
      var cats = R[0];
      var prevPorMes = {};
      R[1].forEach(function (p) {
        var nome = (p.categorias || {}).nome;
        if (!nome) return;
        (prevPorMes[p.mes_ref] = prevPorMes[p.mes_ref] || []).push({ categoria: nome, valor: p.valor });
      });
      var realizado = {};
      R[2].forEach(function (x) {
        (realizado[x.mes_ref] = realizado[x.mes_ref] || {})[x.categoria] = n(x.realizado);
      });
      var sal = R[3];

      var hoje = new Date(), a0 = hoje.getFullYear(), m0 = hoje.getMonth() + 1;
      var info = {};
      cats.forEach(function (x) { info[x.nome] = { grupo: x.grupo, natureza: x.natureza }; });

      var reajSal = cfgNum(c, 'REAJUSTE_CONTRATO', 0.05);
      var mesReaj = cfgNum(c, 'MES_REAJUSTE_CONTRATO', 10);
      var inflacao = cfgNum(c, 'INFLACAO', 0.045);

      // Quem sobe mais que a inflação vem de REAJUSTE_POR_CONTA; o cadastro
      // da conta (tela de Config) manda por cima - percentual, mês do
      // reajuste e até quando ela existe.
      var PORCONTA = lerReajustePorConta(c);
      var FIM = lerFim(c);
      cats.forEach(function (x) {
        var rj = Number(x.reajuste) || 0;
        if (rj) {
          var mr = Number(x.mes_reajuste) || 0;
          PORCONTA[x.nome] = { taxa: rj > 1 ? rj / 100 : rj,
                               mes: (mr >= 1 && mr <= 12) ? mr : 0, desde: 0 };
        }
        if (/^\d{4}-\d{2}$/.test(String(x.ate || ''))) FIM[x.nome] = x.ate;
      });

      var serie = {};
      String(c.PLUXEE_SERIE || '').split(';').forEach(function (p) {
        var x = p.split(':'); if (x.length === 2) serie[x[0].trim()] = Number(x[1]) || 0;
      });
      var eventos = String(c.EVENTOS_FUTUROS || '').split(';').map(function (p) {
        var x = p.split('|');
        return { ano: Number(x[0]), mes: Number(x[1]), valor: Number(x[2]) || 0,
                 oque: String(x[3] || 'Evento') };
      }).filter(function (e) { return e.ano && e.valor; });

      var FIXAS = lerFixas(c);
      /* Contas que NÃO caem todo mês. A projeção parte de dezembro: sem
         isto, o IPTU (que em dezembro é zero) sumiria do ano inteiro, e o
         que cai só em dezembro seria cobrado doze vezes. */
      var SAZONAIS = lerSazonais(c);
      var CALENDARIO = porMesDaCfg(c, 'CALENDARIO');
      var DEGRAUS = porMesDaCfg(c, 'DEGRAUS');
      var degrauOrdem = {};
      Object.keys(DEGRAUS).forEach(function (k) { degrauOrdem[k] = Object.keys(DEGRAUS[k]).sort(); });
      function degrauDe(nome, ref) {
        var d = DEGRAUS[nome]; if (!d) return null;
        var v = null, ks = degrauOrdem[nome];
        for (var i = 0; i < ks.length; i++) if (ref >= ks[i]) v = d[ks[i]];
        return v;
      }

      var baseDez = previstosDoMes(a0 + '-12', prevPorMes);
      var anosAbertos = {};
      Object.keys(prevPorMes).forEach(function (r) { anosAbertos[Number(r.slice(0, 4))] = true; });
      var prevCache = {};
      function prevDe(ref) { return prevCache[ref] || (prevCache[ref] = previstosDoMes(ref, prevPorMes)); }

      var refs = [], ano2 = a0, mes2 = m0;
      var limite = (a0 + anos) + '-' + ('0' + m0).slice(-2);
      while ((ano2 + '-' + ('0' + mes2).slice(-2)) <= limite) {
        refs.push({ ref: ano2 + '-' + ('0' + mes2).slice(-2), ano: ano2, mes: mes2 });
        mes2++; if (mes2 > 12) { mes2 = 1; ano2++; }
      }

      var nomes = Object.keys(info).filter(function (x) {
        return info[x].natureza === 'RECEITA' || info[x].natureza === 'DESPESA';
      });

      var linhas = nomes.map(function (nome) {
        var base = n(baseDez[nome] || 0);
        var valores = refs.map(function (r) {
          // Ano com previsto próprio manda: é o que VOCÊ decidiu, não o que
          // o código inventou corrigindo pela inflação.
          if (r.ano === a0 || anosAbertos[r.ano]) return n(prevDe(r.ref)[nome] || 0);
          if (FIM[nome] && r.ref > FIM[nome]) return 0;
          if (CALENDARIO[nome]) return n(CALENDARIO[nome][r.ref] || 0);
          var degrau = degrauDe(nome, r.ref);
          if (degrau !== null) return degrau;
          if (SAZONAIS[nome]) {
            var sz = SAZONAIS[nome];
            if (sz.meses.indexOf(r.mes) < 0) return 0;
            // O valor informado já é o daquele mês no ano corrente: de
            // Nov/2026 para Nov/2027 passa UM reajuste, não dois.
            var anosSz = r.ano - a0;
            if (sz.reajuste === 'contrato') return n(sz.valor * Math.pow(1 + reajSal, anosSz));
            if (sz.reajuste === 'inflacao') return n(sz.valor * Math.pow(1 + inflacao, anosSz));
            if (typeof sz.reajuste === 'number') return n(sz.valor * Math.pow(1 + sz.reajuste, anosSz));
            return n(sz.valor);
          }
          if (nome === 'OUTROS CREDITOS - PLU') return pluxeeDe(serie, r.ref, base);
          var passados = r.ano - a0;
          if (nome === 'SALARIO MENSAL') {
            return n(base * Math.pow(1 + reajSal, passados + (r.mes >= mesReaj ? 1 : 0)));
          }
          if (PORCONTA[nome] !== undefined) {
            var rj = PORCONTA[nome], quantos = passados;
            if (rj.mes) {
              // reajuste com data marcada: conta quantos já aconteceram até aqui
              quantos = 0;
              for (var y = (rj.desde || (a0 + 1)); y <= r.ano; y++) {
                if (y < r.ano || r.mes >= rj.mes) quantos++;
              }
            }
            return n(base * Math.pow(1 + rj.taxa, quantos));
          }
          if (FIXAS[nome]) return n(base);
          return n(base * Math.pow(1 + inflacao, passados));
        });
        var reais = refs.map(function (r) {
          return n((realizado[r.ref] && realizado[r.ref][nome]) || 0);
        });
        return { conta: nome, grupo: info[nome].grupo, natureza: info[nome].natureza,
                 previsto: valores, realizado: reais };
      });

      var porEvento = {};
      eventos.forEach(function (e) { (porEvento[e.oque] = porEvento[e.oque] || []).push(e); });
      Object.keys(porEvento).forEach(function (oque) {
        var valores = refs.map(function (r) {
          var t = 0;
          porEvento[oque].forEach(function (e) { if (e.ano === r.ano && e.mes === r.mes) t += e.valor; });
          return t;
        });
        linhas.push({ conta: oque.toUpperCase(), grupo: 'EVENTO', natureza: 'DESPESA',
                      previsto: valores, realizado: refs.map(function () { return 0; }) });
      });

      return { refs: refs, linhas: linhas, saldoInicial: n(sal.totalPF + sal.totalPJ) };
    }).catch(function (e) { _projCache = {}; throw e; });
  }

  function projecaoFutura(anos) {
    return config().then(function (c) {
      anos = Number(anos) || anosDaProjecao(c);
      var a0 = new Date().getFullYear();
      return Promise.all([projetarPorConta(anos), carregarFluxo(hojeRef(), a0 + '-12')])
        .then(function (R) { return montarProjecaoFutura(R[0], R[1], c); });
    });
  }

  function montarProjecaoFutura(p, fluxo, c) {
    var eventos = String(c.EVENTOS_FUTUROS || '').split(';').map(function (q) {
      var x = q.split('|');
      return { ano: Number(x[0]), mes: Number(x[1]), valor: Number(x[2]) || 0,
               oque: String(x[3] || 'Evento') };
    }).filter(function (e) { return e.ano && e.valor; });

    // total por mês vindo da projeção conta a conta (anos futuros)
    var totalRef = {};
    p.refs.forEach(function (r, i) {
      var rec = 0, des = 0;
      p.linhas.forEach(function (l) {
        if (l.grupo === 'EVENTO') return;   // os eventos entram depois
        var v = n(l.previsto[i]);
        if (l.natureza === 'RECEITA') rec += v; else des += v;
      });
      totalRef[r.ref] = { receita: rec, despesa: des };
    });

    var a0 = new Date().getFullYear();
    var saldo = p.saldoInicial, meses = [], porAno = {};

    p.refs.forEach(function (r) {
      var receita = 0, despesa = 0, jaFoi = 0;
      if (r.ano === a0) {
        /* A MESMA conta da tela do Mês: quem sai por caixa pelo que falta
           gastar, mais a fatura do mês pelo que ainda não foi paga dela.
           Enquanto eram duas contas, o Painel e o Mês diziam números
           diferentes para o mesmo mês. */
        var fx = fluxo(r.ref);
        receita = fx.aReceber; despesa = fx.aPagar;
        /* O saldo de partida já é o de HOJE, então o acumulado anda só pelo
           que falta. Mas o "no mês" do mês corrente é o mês inteiro - o que
           já entrou e já saiu também. É este número que o Plano usa. */
        if (r.ref === hojeRef()) {
          jaFoi = fx.jaEntrou - fx.jaSaiu;
          receita += fx.jaEntrou; despesa += fx.jaSaiu;
        }
      } else {
        var t = totalRef[r.ref] || { receita: 0, despesa: 0 };
        receita = t.receita; despesa = t.despesa;
      }
      eventos.forEach(function (e) {
        if (e.ano === r.ano && e.mes === r.mes) despesa += e.valor;
      });

      saldo += receita - despesa - jaFoi;
      // com centavos: o Painel arredonda na hora de mostrar, mas o
      // Consolidado vai para o Excel e tem que fechar com o extrato
      meses.push({ ano: r.ano, mes: r.mes, ref: r.ref,
                   receita: n(receita), despesa: n(despesa),
                   saldo: n(receita - despesa), acumulado: n(saldo) });
      var a = porAno[r.ano] = porAno[r.ano] || { ano: r.ano, receita: 0, despesa: 0, meses: 0 };
      a.receita += receita; a.despesa += despesa; a.meses++;
      a.acumulado = Math.round(saldo);
    });

    var lista = Object.keys(porAno).map(function (k) {
      var x = porAno[k];
      return { ano: x.ano, meses: x.meses,
               receita: Math.round(x.receita), despesa: Math.round(x.despesa),
               saldo: Math.round(x.receita - x.despesa),
               mediaMes: Math.round((x.receita - x.despesa) / x.meses),
               acumulado: x.acumulado };
    }).sort(function (a, b) { return a.ano - b.ano; });

    return { saldoInicial: p.saldoInicial, meses: meses, anos: lista,
             eventos: eventos,
             reajusteContrato: cfgNum(c, 'REAJUSTE_CONTRATO', 0.05),
             mesReajuste: cfgNum(c, 'MES_REAJUSTE_CONTRATO', 10) };
  }

  /* ================================================== CONSOLIDADO =====
   * A planilha conta a conta, mês a mês, para abrir no Excel.
   *
   * No app da planilha ela nasce como aba do Google e sai em xlsx. Aqui não
   * há planilha: o arquivo é montado no próprio navegador, em CSV com ';' e
   * vírgula decimal - o formato que o Excel em português abre com duplo
   * clique, sem perguntar nada.
   */
  function gerarConsolidado(anos) {
    anos = Number(anos) || 3;
    return Promise.all([projetarPorConta(anos), projecaoFutura(anos)]).then(function (R) {
      var d = R[0], proj = R[1];
      var cab = ['CONTA', 'FAMILIA', 'TIPO'].concat(d.refs.map(function (r) { return r.ref; }));
      var linhas = [cab], vazio = cab.map(function () { return ''; });
      var receitas = d.linhas.filter(function (l) { return l.natureza === 'RECEITA'; });
      var despesas = d.linhas.filter(function (l) { return l.natureza === 'DESPESA'; });

      function bloco(titulo, conjunto) {
        linhas.push([titulo].concat(vazio.slice(1)));
        conjunto.sort(function (a, b) { return a.conta < b.conta ? -1 : 1; });
        conjunto.forEach(function (l) {
          linhas.push([l.conta, l.grupo, 'previsto'].concat(l.previsto));
          if (l.realizado.some(function (v) { return v; })) {
            linhas.push([l.conta, l.grupo, 'realizado'].concat(l.realizado));
          }
        });
      }
      bloco('RECEITAS', receitas);
      bloco('DESPESAS', despesas);

      // Totais do ORÇAMENTO: a soma das linhas acima, conta por conta.
      function total(conjunto) {
        return d.refs.map(function (_, i) {
          return n(conjunto.reduce(function (s, l) { return s + l.previsto[i]; }, 0));
        });
      }
      // O CAIXA é outra conta, e vem pronta da projeção - a mesma do Painel e
      // da tela do Mês: a compra no cartão consome a verba na hora, mas o
      // dinheiro só sai quando a fatura é paga.
      var porRef = {};
      (proj.meses || []).forEach(function (m) { porRef[m.ref] = m; });
      function daProj(campo) {
        return d.refs.map(function (r) { var m = porRef[r.ref]; return m ? n(m[campo]) : ''; });
      }
      linhas.push(vazio);
      linhas.push(['TOTAL RECEITAS', '', 'orçamento'].concat(total(receitas)));
      linhas.push(['TOTAL DESPESAS', '', 'orçamento'].concat(total(despesas)));
      linhas.push(vazio);
      linhas.push(['CAIXA - ENTRA', '', 'dinheiro'].concat(daProj('receita')));
      linhas.push(['CAIXA - SAI', '', 'inclui a fatura'].concat(daProj('despesa')));
      linhas.push(['SALDO DO MES', '', 'entra - sai'].concat(daProj('saldo')));
      linhas.push(['SALDO ACUMULADO', '', 'parte de ' + String(proj.saldoInicial).replace('.', ',')]
                  .concat(daProj('acumulado')));

      function celula(v) {
        if (typeof v === 'number') return String(v).replace('.', ',');
        var t = String(v == null ? '' : v);
        return /[;"\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
      }
      // o BOM faz o Excel ler os acentos como UTF-8
      var csv = '﻿' + linhas.map(function (l) { return l.map(celula).join(';'); }).join('\r\n');
      var link = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      NOMES_DOWNLOAD[link] = 'EasyAPP-Consolidado-' + d.refs[0].ref + '-a-'
                             + d.refs[d.refs.length - 1].ref + '.csv';
      return { ok: true, linhas: linhas.length, meses: d.refs.length, abas: 1,
               de: d.refs[0].ref, ate: d.refs[d.refs.length - 1].ref, link: link };
    });
  }

  /* O link de um arquivo montado no navegador (blob:) não tem nome: sem
     isto o download sairia como um código sem extensão. O Index.html só
     sabe fazer <a href>, então o nome é posto no clique. */
  var NOMES_DOWNLOAD = {};
  document.addEventListener('click', function (ev) {
    var a = ev.target && ev.target.closest && ev.target.closest('a[href^="blob:"]');
    if (a && NOMES_DOWNLOAD[a.href]) {
      a.setAttribute('download', NOMES_DOWNLOAD[a.href]);
      a.removeAttribute('target');
    }
  }, true);

  /* ==================================================== LONGO PRAZO =====
   * Porte de calcularPlano_: o imóvel valorizando, o financiamento
   * amortizando pela Price, o carro depreciando e sendo trocado, e os juros
   * compostos sobre o que você guardar.
   *
   * Nada aqui é aproximação: é a mesma simulação mês a mês até a idade da
   * meta (NASCIMENTO e IDADE_APOSENTADORIA, nos ajustes).
   */

  function patrimonio() {
    return Promise.all([
      rest('/rest/v1/patrimonio?select=tipo,descricao,valor,fonte,atualizado'),
      rest('/rest/v1/saldos_contas?select=nome,tipo,titular,saldo')
    ]).then(function (r) {
      var bens = [], dividas = [], investimentos = [];
      r[0].forEach(function (x) {
        var item = { descricao: x.descricao, valor: n(x.valor), fonte: x.fonte,
                     atualizado: x.atualizado };
        if (x.tipo === 'DIVIDA') dividas.push(item);
        else if (x.tipo === 'INVESTIMENTO') investimentos.push(item);
        else bens.push(item);
      });
      var caixa = 0, investido = 0;
      r[1].forEach(function (c) {
        if (c.tipo === 'INVESTIMENTO') investido += n(c.saldo);
        else if (c.tipo === 'CORRENTE') caixa += n(c.saldo);
      });
      var contasInv = r[1].filter(function (c) { return c.tipo === 'INVESTIMENTO'; })
        .map(function (c) { return { conta: c.nome, saldo: n(c.saldo) }; });
      var tb = bens.reduce(function (a, x) { return a + x.valor; }, 0);
      var td = dividas.reduce(function (a, x) { return a + x.valor; }, 0);
      var tm = investimentos.reduce(function (a, x) { return a + x.valor; }, 0);
      return { bens: bens, dividas: dividas, investimentos: investimentos,
               contasInvestimento: contasInv, caixa: n(caixa),
               totalBens: n(tb), totalDividas: n(td),
               totalInvestido: n(investido + tm),
               liquido: n(tb + caixa + investido + tm - td) };
    });
  }

  function planoLongoPrazo() {
    return Promise.all([config(), patrimonio(), projetarPorConta(3),
                        ano(new Date().getFullYear()),
                        lerTudo('/rest/v1/lancamentos?select=mes_ref,valor,meio,status&meio=eq.CARTAO_CREDITO&order=id')
    ]).then(function (R) {
      var c = R[0], pat = R[1], pc = R[2], anoAtual = R[3], cartaoLanc = R[4];

      /* A data de nascimento e a idade da meta vêm dos ajustes de cada um.
         Sem nascimento gravado, o plano supõe 35 anos hoje - a tela de
         ajustes mostra o campo vazio para a pessoa preencher. */
      var hoje = new Date();
      var IDADE_META = cfgNum(c, 'IDADE_APOSENTADORIA', 60);
      var nascTxt = String(c.NASCIMENTO || '').trim(), mN;
      var NASC = (mN = nascTxt.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)) ? new Date(+mN[1], mN[2] - 1, +mN[3])
               : (mN = nascTxt.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/)) ? new Date(+mN[3], mN[2] - 1, +mN[1])
               : new Date(hoje.getFullYear() - 35, hoje.getMonth(), 1);
      var ALVO = new Date(NASC.getFullYear() + IDADE_META, NASC.getMonth(), NASC.getDate());
      if (ALVO <= hoje) ALVO = new Date(hoje.getFullYear() + 1, hoje.getMonth(), 1);
      try { window.EASYAPP_IDADE_META = IDADE_META; } catch (e) {}
      var nMeses = (ALVO.getFullYear() - hoje.getFullYear()) * 12
                 + (ALVO.getMonth() - hoje.getMonth());
      var idade = Math.floor((hoje - NASC) / 31557600000);

      var taxa       = cfgNum(c, 'RENTABILIDADE_REAL', 0.08);
      var valorizIm  = cfgNum(c, 'VALORIZACAO_IMOVEL', 0.05);
      var trocaCarro = Math.max(1, cfgNum(c, 'TROCA_CARRO_ANOS', PADRAO_AJUSTE.TROCA_CARRO_ANOS));
      var custoTroca = cfgNum(c, 'CUSTO_TROCA_CARRO', PADRAO_AJUSTE.CUSTO_TROCA_CARRO);
      var viagemAno  = cfgNum(c, 'RESERVA_VIAGEM_ANO', PADRAO_AJUSTE.RESERVA_VIAGEM_ANO);
      var jurosImov  = cfgNum(c, 'JUROS_FINANCIAMENTO', PADRAO_AJUSTE.JUROS_FINANCIAMENTO);
      var retirada   = cfgNum(c, 'TAXA_RETIRADA', 0.06);
      /* Parcela do imóvel, do carro e o aluguel recebido saem das próprias
         contas: a média do previsto nos próximos 12 meses (só os meses com
         valor) das contas cujo nome bate. Nada disso é ajuste à parte. */
      function mediaContas(natureza, re, fora) {
        var tot = 0;
        pc.linhas.forEach(function (l) {
          if (l.grupo === 'EVENTO' || l.natureza !== natureza) return;
          var nome = String(l.conta || '').toUpperCase();
          if (!re.test(nome) || (fora && fora.test(nome))) return;
          var soma = 0, meses = 0;
          for (var q = 1; q < pc.refs.length && q <= 12; q++) {
            var v = n(l.previsto[q]);
            if (v) { soma += v; meses++; }
          }
          if (meses) tot += soma / meses;
        });
        return tot;
      }
      var VEICULO = /VE[IÍ]CULO|CARRO|MOTO/;
      var parcelaImovel = mediaContas('DESPESA', /(PARCELA|FINANC).*(APART|APTO|IM[OÓ]VEL|CASA|MORADIA)|(APART|APTO|IM[OÓ]VEL|CASA|MORADIA).*(PARCELA|FINANC)/, VEICULO);
      var parcelaCarro  = mediaContas('DESPESA', /(PARCELA|FINANC).*(VE[IÍ]CULO|CARRO|MOTO)|(VE[IÍ]CULO|CARRO|MOTO).*(PARCELA|FINANC)/);
      var aluguelHoje   = mediaContas('RECEITA', /ALUGUE/);

      var imovel = 0, carro = 0, dividaImovel = 0, dividaCarro = 0;
      pat.bens.forEach(function (b) {
        if (/apart|imov|casa/i.test(b.descricao)) imovel += b.valor; else carro += b.valor;
      });
      pat.dividas.forEach(function (x) {
        if (/apto|imov|cef|caixa/i.test(x.descricao)) dividaImovel += x.valor;
        else dividaCarro += x.valor;
      });

      /* Quanto sobra por mês. A sobra sai do FUTURO INTEIRO que o app sabe
         projetar, não de uma janela de 12 meses: uma janela curta pega um
         outubro com férias vendidas e promete uma sobra que não se repete —
         e o contrário também vale, uma janela azarada esconderia folga. */
      var receita = 0, despesa = 0, janela = 0, anoSobra = {};
      for (var q = 1; q < pc.refs.length; q++) {
        var rq = 0, dq = 0;
        pc.linhas.forEach(function (l) {
          if (l.grupo === 'EVENTO') return;
          var v = n(l.previsto[q]);
          if (l.natureza === 'RECEITA') rq += v; else dq += v;
        });
        receita += rq; despesa += dq; janela++;
        var an = pc.refs[q].ano;
        if (!anoSobra[an]) anoSobra[an] = { ano: an, receita: 0, despesa: 0, meses: 0 };
        anoSobra[an].receita += rq; anoSobra[an].despesa += dq; anoSobra[an].meses++;
      }
      if (janela) { receita /= janela; despesa /= janela; }
      var sobra = receita - despesa;

      var compromissos = String(c.COMPROMISSOS || '').split(';').map(function (p) {
        var x = p.split('|');
        return { ano: Number(x[0]), mes: Number(x[1]), valor: Number(x[2]) || 0,
                 quem: String(x[3] || '') };
      }).filter(function (k) { return k.ano && k.valor; });

      var compAno = {};
      compromissos.forEach(function (k) { compAno[k.ano] = (compAno[k.ano] || 0) + k.valor; });
      var porAno = Object.keys(anoSobra).sort().map(function (k) {
        var x = anoSobra[k], ev = Number(compAno[x.ano] || 0), liq = x.receita - x.despesa;
        return { ano: x.ano, meses: x.meses,
                 receita: Math.round(x.receita), despesa: Math.round(x.despesa),
                 compromissos: Math.round(ev), sobra: Math.round(liq),
                 depois: Math.round(liq - ev), sobraMes: Math.round(liq / x.meses) };
      });

      // fatura média, só de meses já fechados
      var gastoCartao = 0, mesesCartao = {}, atual = hojeRef();
      cartaoLanc.forEach(function (l) {
        if (l.status === 'IGNORADO') return;
        if (l.mes_ref >= atual) return;
        mesesCartao[l.mes_ref] = true;
        gastoCartao += Number(l.valor) || 0;
      });
      var cartaoMes = gastoCartao / (Object.keys(mesesCartao).length || 1);

      var provisaoCarro = custoTroca / (trocaCarro * 12);
      var provisaoViagem = viagemAno / 12;
      var sobraReal = sobra - provisaoCarro - provisaoViagem;

      var i = Math.pow(1 + taxa, 1 / 12) - 1;
      var iImov = Math.pow(1 + jurosImov, 1 / 12) - 1;
      var iVal = Math.pow(1 + valorizIm, 1 / 12) - 1;
      // Quanto o carro perde por ano. 10% é a prática de mercado para carro
      // usado; troque em DEPRECIACAO_CARRO_ANO se o seu for outro.
      var depAno = cfgNum(c, 'DEPRECIACAO_CARRO_ANO', 0.10);
      var depMes = Math.pow(1 - Math.min(0.9, Math.max(0, depAno)), 1 / 12);

      function simular(aporte) {
        var inv = 0, sImovel = imovel, sDivida = dividaImovel, sCarro = carro;
        var dCarro = dividaCarro, serie = [], gastoTroca = 0;
        for (var m = 1; m <= nMeses; m++) {
          var a = hoje.getFullYear() + Math.floor((hoje.getMonth() + m) / 12);
          var mes = ((hoje.getMonth() + m) % 12) + 1;

          inv = inv * (1 + i) + aporte;
          sImovel = sImovel * (1 + iVal);
          // Price: a parcela é fixa; o saldo cai pela diferença entre ela e os juros
          // sem conta de parcela, a dívida fica parada (não cresce só com juros)
          if (sDivida > 0 && parcelaImovel > 0) {
            sDivida = Math.max(0, sDivida + sDivida * iImov - parcelaImovel);
          }
          if (dCarro > 0) dCarro = Math.max(0, dCarro - parcelaCarro * 0.85);
          sCarro = sCarro * depMes;
          if (m % (trocaCarro * 12) === 0) {              // troca: sai do bolso
            inv = Math.max(0, inv - custoTroca);
            sCarro = sCarro + custoTroca;
            gastoTroca += custoTroca;
          }
          compromissos.forEach(function (k) {
            if (k.ano === a && k.mes === mes) inv -= k.valor;
          });
          if (mes === 6 || m === nMeses) {
            serie.push({ ano: a, idade: a - NASC.getFullYear(),
                         investido: Math.round(inv),
                         imovel: Math.round(sImovel - sDivida),
                         carro: Math.round(sCarro - dCarro),
                         liquido: Math.round(inv + (sImovel - sDivida) + (sCarro - dCarro)) });
          }
        }
        var liq = inv + (sImovel - sDivida) + (sCarro - dCarro);
        /* Se o financiamento ainda roda na data da meta, o que o imóvel
           entrega é o aluguel MENOS a parcela. */
        var aluguelFuturo = aluguelHoje * Math.pow(1 + valorizIm, nMeses / 12);
        var aluguelLiquido = Math.max(0, aluguelFuturo - (sDivida > 0 ? parcelaImovel : 0));
        return { investido: Math.round(inv), liquido: Math.round(liq),
                 renda: Math.round(inv * retirada / 12),
                 aluguel: Math.round(aluguelLiquido),
                 aluguelBruto: Math.round(aluguelFuturo),
                 parcelaAinda: sDivida > 0 ? Math.round(parcelaImovel) : 0,
                 rendaTotal: Math.round(inv * retirada / 12 + aluguelLiquido),
                 rendaSeVenderTudo: Math.round(liq * retirada / 12),
                 gastoTroca: Math.round(gastoTroca), serie: serie };
      }

      var cartaoProj = Math.round(cartaoMes);
      var metaCartao = cfgNum(c, 'META_CARTAO', 0) || cartaoProj;   // sem meta = sem folga
      var folgaCartao = Math.max(0, cartaoProj - metaCartao);
      var base = Math.max(0, sobraReal);

      var defs = [
        { nome: 'Como está hoje', aporte: Math.round(base),
          como: 'sobra atual, já descontadas as provisões de carro e viagem' },
        { nome: 'Cartão na meta', aporte: Math.round(base + folgaCartao),
          como: 'fatura em ' + Math.round(metaCartao) + ' em vez de ' + Math.round(cartaoProj) },
        { nome: 'Cartão na meta + 10% de corte',
          aporte: Math.round(base + folgaCartao + despesa * 0.10),
          como: 'o acima, mais 10% de corte no resto das despesas' },
        { nome: 'Cartão na meta + 20% de corte',
          aporte: Math.round(base + folgaCartao + despesa * 0.20),
          como: 'corte firme, o cenário que constrói patrimônio de verdade' }
      ];

      var baseSim = simular(Math.round(base));
      function alavanca(oque, ganhoMes, detalhe) {
        if (ganhoMes <= 0) return null;
        var r = simular(Math.round(base + ganhoMes));
        return { oque: oque, detalhe: detalhe, ganhoMes: Math.round(ganhoMes),
                 aporte: Math.round(base + ganhoMes), patrimonio: r.liquido,
                 aMais: Math.round(r.liquido - baseSim.liquido), renda: r.rendaTotal,
                 rendaAMais: Math.round(r.rendaTotal - baseSim.rendaTotal) };
      }
      var alavancas = [
        alavanca('Cortar 10% do cartão', cartaoMes * 0.10,
                 'a fatura média é ' + Math.round(cartaoMes) + ' por mês'),
        alavanca('Cortar 20% do cartão', cartaoMes * 0.20,
                 'exige mexer em alimentação e refeição, que são as maiores'),
        alavanca('Trazer o cartão para a meta', folgaCartao,
                 'fatura em ' + Math.round(metaCartao) + ' em vez de ' + Math.round(cartaoProj)),
        alavanca('Cortar 5% de tudo que sai', despesa * 0.05,
                 'despesa média projetada de ' + Math.round(despesa) + ' por mês'),
        alavanca('Cortar 10% de tudo que sai', despesa * 0.10,
                 'o corte que muda o resultado de verdade')
      ].filter(function (x) { return x; });

      var cenarios = defs.map(function (d) {
        var r = simular(d.aporte);
        r.aporte = d.aporte; r.nome = d.nome; r.como = d.como;
        return r;
      });

      var nomesMes = ['', 'janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho',
                      'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
      var mesAgora = hoje.getMonth() + 1;
      var acoes = [];
      (anoAtual.serie || []).forEach(function (s) {
        if (s.mes < mesAgora || !s.previstoReceita) return;
        acoes.push({ mes: s.mes, nome: nomesMes[s.mes],
                     sobra: Math.round(s.previstoReceita - s.previstoDespesa),
                     receita: Math.round(s.previstoReceita),
                     despesa: Math.round(s.previstoDespesa) });
      });

      return {
        idade: idade, idadeMeta: IDADE_META, anoMeta: ALVO.getFullYear(), mesesAte: nMeses, anosAte: Math.round(nMeses / 12 * 10) / 10,
        taxa: taxa, valorizacaoImovel: valorizIm, retirada: retirada,
        receitaMes: Math.round(receita), despesaMes: Math.round(despesa),
        sobraMes: Math.round(sobra), mesesDaMedia: janela,
        porAno: porAno, alavancas: alavancas,
        provisaoCarro: Math.round(provisaoCarro), provisaoViagem: Math.round(provisaoViagem),
        sobraReal: Math.round(sobraReal),
        trocaCarroAnos: trocaCarro, custoTroca: custoTroca, viagemAno: viagemAno,
        depreciacaoAno: depAno,
        patrimonioDetalhe: pat,
        imovelHoje: imovel, carroHoje: carro,
        dividaImovel: dividaImovel, dividaCarro: dividaCarro,
        compromissos: compromissos, acoes: acoes, cenarios: cenarios,
        cartaoMes: Math.round(anoAtual.cartaoTotal / Math.max(1, anoAtual.mesesComDados)),
        cartaoProjecao: cartaoProj, metaCartao: metaCartao,
        folgaCartao: Math.round(folgaCartao),
        topCategorias: (anoAtual.categorias || []).slice(0, 8).map(function (x) {
          return { categoria: x.categoria,
                   mes: Math.round(x.valor / Math.max(1, anoAtual.mesesComDados)),
                   pct: Math.round(x.valor / anoAtual.despesaTotal * 1000) / 10 };
        })
      };
    });
  }

  /* ========================================================== METAS =====
   * Porte do Metas.gs, não reescrita. Esta é a parte que mais custou a
   * acertar, e cada regra aqui existe porque a versão anterior dela estava
   * errada de um jeito que só a vida real mostrou. Os comentários vieram
   * junto de propósito.
   */

  function moedaTxt(v) {
    v = Math.round((Number(v) || 0) * 100) / 100;
    var neg = v < 0; v = Math.abs(v);
    var i = Math.floor(v), c = ('0' + Math.round((v - i) * 100)).slice(-2);
    var t = String(i), fora = '';
    while (t.length > 3) { fora = '.' + t.slice(-3) + fora; t = t.slice(0, -3); }
    return (neg ? '-R$ ' : 'R$ ') + t + fora + ',' + c;
  }

  function alvoGuardado() {
    return rest('/rest/v1/config?select=valor&chave=eq.PLANO_ALVO&limit=1')
      .then(function (r) {
        if (!r.length || !r[0].valor) return null;
        try { var o = JSON.parse(r[0].valor); return (o && o.aporte) ? o : null; }
        catch (e) { return null; }
      });
  }

  /**
   * Como o mês deve FECHAR, conta a conta.
   *
   * Duas regras diferentes, e a diferença importa:
   *   conta paga em CAIXA (aluguel, escola, parcela): vale o maior entre o
   *     previsto e o realizado — a conta vai chegar de qualquer jeito;
   *   conta do CARTÃO: vale SÓ o realizado. A fatura só cresce se você
   *     gastar, e projetar o resto da verba seria cobrar um gasto que pode
   *     não acontecer.
   * Num mês que ainda não começou não há "já gastou": ali a verba do cartão
   * é a melhor previsão que existe.
   */
  function fechamentoPrevisto(mes) {
    return Promise.all([
      rest('/rest/v1/resumo_mes?select=categoria,grupo,natureza,sai_por,previsto,realizado'
           + '&mes_ref=eq.' + mes + '&limit=800'),
      resumo(mes)
    ]).then(function (r) {
      var linhas = r[0], res = r[1];
      var correndo = mes <= hojeRef();
      var rec = 0, des = 0;
      linhas.forEach(function (l) {
        var prev = n(l.previsto), real = n(l.realizado);
        if (l.natureza === 'RECEITA') { rec += Math.max(prev, real); return; }
        if (l.natureza !== 'DESPESA') return;
        des += (correndo && l.sai_por === 'CARTAO') ? real : Math.max(prev, real);
      });
      return {
        futuro: !correndo,
        receita: n(rec), despesa: n(des), sobra: n(rec - des),
        receitaHoje: res.totalRealizadoReceita, despesaHoje: res.totalRealizadoDespesa,
        sobraHoje: n(res.totalRealizadoReceita - res.totalRealizadoDespesa),
        dia: res.diaDeHoje, dias: res.diasNoMes, linhas: linhas
      };
    });
  }

  /**
   * Onde está a torneira aberta.
   *
   * Duas coisas contam, e só elas: a conta já gastou MAIS do que a verba do
   * mês inteiro, ou gastou sem ter verba nenhuma.
   *
   * O ritmo proporcional (previsto vezes a fração do mês) só vale para o que
   * passa no cartão, que é gasto pingado. Aplicar isso ao aluguel fazia a
   * parcela paga no dia 5 aparecer como "acima do ritmo" — e não há nada
   * para frear num aluguel que já foi pago inteiro.
   */
  function torneirasAbertas(fech) {
    var frac = Math.min(1, Math.max(0.05, fech.dia / Math.max(1, fech.dias)));
    var fora = [];
    fech.linhas.forEach(function (x) {
      if (x.natureza !== 'DESPESA') return;
      var prev = n(x.previsto), real = n(x.realizado);
      if (real <= 0.5) return;
      if (prev <= 0) {
        fora.push({ conta: x.categoria, grupo: x.grupo, previsto: 0, realizado: real,
                    esperado: 0, acima: real, pct: null, motivo: 'sem verba' });
        return;
      }
      if (real > prev + 0.5) {
        fora.push({ conta: x.categoria, grupo: x.grupo, previsto: prev, realizado: real,
                    esperado: prev, acima: n(real - prev),
                    pct: Math.round((real - prev) / prev * 1000) / 10,
                    motivo: 'estourou a verba' });
        return;
      }
      if (x.sai_por === 'CARTAO' && frac < 0.95) {
        var esperado = prev * frac;
        if (real > esperado + 0.5) {
          fora.push({ conta: x.categoria, grupo: x.grupo, previsto: prev, realizado: real,
                      esperado: n(esperado), acima: n(real - esperado),
                      pct: Math.round((real - esperado) / esperado * 1000) / 10,
                      motivo: 'acima do ritmo' });
        }
      }
    });
    return fora.sort(function (a, b) { return b.acima - a.acima; }).slice(0, 8);
  }

  /**
   * Os meses deste ano que já acabaram DEPOIS de o plano existir.
   * Cobrar os meses anteriores ao plano seria cobrar uma meta que não havia:
   * o atraso de 2026 inteiro caía sobre quatro meses e pedia dezoito mil por
   * mês. A conta começa no mês em que você definiu o alvo.
   */
  function mesesFechados(a, alvoBase, desdeRef) {
    return ano(a).then(function (x) {
      var atual = hojeRef(), fora = [];
      (x.serie || []).forEach(function (s) {
        var ref = a + '-' + ('0' + s.mes).slice(-2);
        if (ref >= atual) return;
        if (desdeRef && ref < desdeRef) return;
        if (!s.temDados) return;
        var sobra = n(s.receita - s.despesa);
        fora.push({ ref: ref, mes: s.mes, alvo: alvoBase, reserva: sobra,
                    diferenca: n(sobra - alvoBase), ok: sobra >= alvoBase });
      });
      return fora;
    });
  }

  function metas(mes) {
    mes = mes || hojeRef();
    return alvoGuardado().then(function (alvo) {
      if (!alvo) {
        return { ok: true, semPlano: true, mes: mes,
                 recado: 'Defina no Plano quanto você quer ter e quando. A meta do mês sai de lá.' };
      }
      var alvoBase = Number(alvo.aporte) || 0;
      var a = Number(mes.slice(0, 4)), mesNum = Number(mes.slice(5, 7));
      var desde = String(alvo.quando || '').substring(0, 7);

      return Promise.all([mesesFechados(a, alvoBase, desde), fechamentoPrevisto(mes)])
        .then(function (r) {
          var fechados = r[0], fech = r[1];

          var deficit = 0, sobrou = 0;
          fechados.forEach(function (f) {
            if (f.diferenca < 0) deficit += -f.diferenca; else sobrou += f.diferenca;
          });
          var atrasado = Math.max(0, deficit - sobrou);
          var mesesRestantes = Math.max(1, 12 - mesNum + 1);
          var ajuste = Math.round(atrasado / mesesRestantes);
          var alvoMes = alvoBase + ajuste;

          var falta = n(alvoMes - fech.sobra);
          var noCaminho = falta <= 0.5;
          var torneiras = noCaminho ? [] : torneirasAbertas(fech);

          var recado;
          if (fech.futuro) {
            recado = 'Este mês ainda não começou: o que aparece aqui é o previsto, '
                   + 'verba por verba. A cobrança do dia a dia começa quando ele virar.';
          } else if (noCaminho) {
            recado = 'Do jeito que o mês está indo, sobram ' + moedaTxt(fech.sobra)
                   + ' — ' + moedaTxt(fech.sobra - alvoMes) + ' acima da meta.';
          } else if (torneiras.length) {
            recado = 'Faltam ' + moedaTxt(falta) + '. ' + torneiras[0].conta
                   + ' está ' + moedaTxt(torneiras[0].acima) + ' acima do ritmo — é onde dá para frear.';
          } else {
            recado = 'Faltam ' + moedaTxt(falta) + ' e nenhuma verba está acima do ritmo: '
                   + 'o mês simplesmente não comporta essa meta.';
          }

          var reservadoAno = fechados.reduce(function (t, f) { return t + f.reserva; }, 0);

          return {
            ok: true, mes: mes, alvo: alvo,
            meta: {
              base: alvoBase, ajuste: ajuste, doMes: alvoMes,
              atrasado: Math.round(atrasado), mesesRestantes: mesesRestantes, desde: desde,
              porque: ajuste > 0
                ? 'Desde que o plano começou, ficaram ' + moedaTxt(atrasado)
                  + ' para trás. Isso foi dividido pelos ' + mesesRestantes + ' meses que faltam.'
                : (sobrou > deficit && fechados.length
                   ? 'Você já está ' + moedaTxt(sobrou - deficit) + ' à frente da meta.'
                   : (fechados.length ? 'Nenhum atraso a recuperar.'
                                      : 'O plano começou agora — ainda não há mês fechado para cobrar.'))
            },
            mesAtual: {
              dia: fech.dia, dias: fech.dias, futuro: !!fech.futuro,
              receita: fech.receita, despesa: fech.despesa, sobra: fech.sobra,
              receitaHoje: fech.receitaHoje, despesaHoje: fech.despesaHoje,
              sobraHoje: fech.sobraHoje,
              falta: falta, noCaminho: noCaminho, recado: recado, torneiras: torneiras
            },
            fechados: fechados,
            ano: {
              ano: a, meta: Math.round(alvoBase * 12),
              reservado: Math.round(reservadoAno),
              deviaAteAgora: Math.round(alvoBase * fechados.length),
              diferenca: Math.round(reservadoAno - alvoBase * fechados.length),
              mesesFechados: fechados.length, desde: desde
            }
          };
        });
    });
  }


  /* ================================================== O PLANO (tela) =====
   * A propriedade que faz isto ser barato: o patrimônio final é AFIM no
   * aporte. Dobrar o aporte não dobra o patrimônio (tem o imóvel e o carro
   * no meio), mas a relação é uma RETA. Então dois cenários já calculados
   * descrevem todos os outros — e a conta inversa ("quanto guardar para
   * chegar em X") sai exata, sem tentativa e erro.
   */

  function retaDoPlano() {
    return planoLongoPrazo().then(function (p) {
      var cs = (p.cenarios || []).filter(function (c) { return c.serie && c.serie.length; });
      if (cs.length < 2) return null;
      var a = cs[0], b = cs[cs.length - 1];
      var dx = Number(b.aporte) - Number(a.aporte);
      if (!dx) return null;
      var porAno = {};
      a.serie.forEach(function (pt, k) {
        var q = b.serie[k];
        if (!q || q.ano !== pt.ano) return;
        porAno[pt.ano] = {
          ano: pt.ano, idade: pt.idade,
          liq0: pt.liquido,   mLiq: (q.liquido - pt.liquido) / dx,
          inv0: pt.investido, mInv: (q.investido - pt.investido) / dx,
          imo0: pt.imovel,    mImo: (q.imovel - pt.imovel) / dx,
          car0: pt.carro,     mCar: (q.carro - pt.carro) / dx
        };
      });
      return { a0: Number(a.aporte), plano: p, anos: porAno,
               liq0: Number(a.liquido), mLiq: (Number(b.liquido) - Number(a.liquido)) / dx,
               ren0: Number(a.rendaTotal), mRen: (Number(b.rendaTotal) - Number(a.rendaTotal)) / dx };
    });
  }

  function naReta(r, base, incl, aporte) { return base + incl * (aporte - r.a0); }

  function patrimonioNoAno(r, a, aporte) {
    var x = r.anos[a];
    if (!x) return null;
    return { ano: a, idade: x.idade,
             investido: Math.round(naReta(r, x.inv0, x.mInv, aporte)),
             imovel:    Math.round(naReta(r, x.imo0, x.mImo, aporte)),
             carro:     Math.round(naReta(r, x.car0, x.mCar, aporte)),
             liquido:   Math.round(naReta(r, x.liq0, x.mLiq, aporte)) };
  }

  function aporteParaAlvo(r, a, alvo) {
    var x = r.anos[a];
    if (!x || !x.mLiq) return null;
    return Math.max(0, r.a0 + (alvo - x.liq0) / x.mLiq);
  }

  /** Quanto o mês REAL comporta: os meses projetados um a um, não média de
      média. Era daqui que vinha o disparate de pedir uma reserva maior do
      que o mês inteiro produz. */
  function capacidadeReal() {
    return projecaoFutura(3).then(function (proj) {
      var atual = hojeRef();
      var fut = (proj.meses || []).filter(function (m) { return m.ref > atual; });
      if (!fut.length) return { mes: 0, meses: 0, receita: 0, despesa: 0, doze: [] };
      var doze = fut.slice(0, 12);
      function med(campo) {
        return Math.round(doze.reduce(function (t, m) { return t + (Number(m[campo]) || 0); }, 0) / doze.length);
      }
      return { mes: med('saldo'), meses: doze.length,
               receita: med('receita'), despesa: med('despesa'), doze: doze };
    });
  }

  function sugestoesDeAlvo(r, cap, anoFinal) {
    var meia = patrimonioNoAno(r, anoFinal, Math.max(0, cap.mes * 0.5));
    var cheia = patrimonioNoAno(r, anoFinal, Math.max(0, cap.mes));
    var esticada = patrimonioNoAno(r, anoFinal, Math.max(0, cap.mes * 1.3));
    return [
      { nome: 'Confortável', aporte: Math.round(cap.mes * 0.5),
        patrimonio: meia ? meia.liquido : 0,
        como: 'metade do que o mês comporta — sobra folga para imprevisto' },
      { nome: 'No limite do que sobra', aporte: Math.round(cap.mes),
        patrimonio: cheia ? cheia.liquido : 0,
        como: 'tudo o que a projeção diz que vai sobrar' },
      { nome: 'Apertado', aporte: Math.round(cap.mes * 1.3),
        patrimonio: esticada ? esticada.liquido : 0,
        como: 'exige cortar 30% além do que já sobra' }
    ];
  }

  /* ==================== DIAGNOSTICO DO PLANO ====================
   * Este bloco e IDENTICO no app/ponte.js do Store: so recebe numeros e devolve
   * numeros, sem ler planilha nem banco. Mudou aqui, copie la.
   */

  /** Onde da para mexer, com o corte que costuma ser realista para cada uma. */
  var ALAVANCAS_PLANO = [
    { tipo: 'mercado', titulo: 'Mercado', corte: 0.15,
      re: /ALIMENTA|MERCADO|SUPERMERC|HORTI|ACOUGUE|PADARIA/,
      dica: 'lista fechada antes de sair, compra grande no atacarejo e marca própria nos básicos costumam tirar 15% sem mudar o que vai à mesa' },
    { tipo: 'refeicao', titulo: 'Refeição e delivery', corte: 0.30,
      re: /REFEI|IFOOD|DELIVERY|RESTAURANTE|LANCHE/,
      dica: 'trocar metade dos pedidos e almoços fora por comida feita em casa, e marmita nos dias de trabalho' },
    { tipo: 'semdono', titulo: 'Gasto sem dono (PIX, dia a dia, cartão a classificar)', corte: 0.30,
      re: /OUTRAS|DIA-A-DIA|A CLASSIFICAR|NAO CLASSIFICADO/,
      dica: 'é dinheiro que sai sem conta definida — classificar tudo por um mês e pôr um teto semanal costuma revelar o vazamento' },
    { tipo: 'lazer', titulo: 'Lazer e viagens', corte: 0.30,
      re: /LAZER|VIAGEM|PASSEIO|INGRESSO/,
      dica: 'uma viagem a menos por ano, destino mais perto, ou fora da alta temporada' },
    { tipo: 'compras', titulo: 'Compras, roupas e casa', corte: 0.40,
      re: /VESTUAR|COMPRAS|ONLINE|MOBILIA|DECORA|PRESENTE|ELETRO/,
      dica: 'esperar 48 horas antes de qualquer compra que não seja necessidade — boa parte desiste sozinha' },
    { tipo: 'assinaturas', titulo: 'Assinaturas', corte: 0.50,
      re: /ASSINATUR|STREAMING/,
      dica: 'cancelar o que ninguém usou no último mês; dá para revezar os streamings em vez de ter todos' },
    { tipo: 'cuidados', titulo: 'Beleza e cuidados', corte: 0.25,
      re: /BARBEAR|BELEZA|CUIDADOS PESSOAIS|ESTETICA/,
      dica: 'espaçar os serviços ou trocar por pacotes mensais' },
    { tipo: 'transporte', titulo: 'Combustível e transporte', corte: 0.10,
      re: /COMBUST|UBER|PEDAGIO|ESTACIONAMENTO/,
      dica: 'juntar saídas no mesmo trajeto e deixar o carro nos percursos curtos' }
  ];
  var MORADIA_RE = /ALUGUEL|CONDOMIN|MORADIA/;
  var LIMITE_MORADIA = 0.30;   // da renda: o que o mercado considera saudavel

  /**
   * Para onde vai o dinheiro, onde da para cortar, o que ja vai sobrar sozinho.
   *
   *   cap      { mes, receita, despesa }  - a media dos proximos 12 meses
   *   proj     { refs, linhas }           - a projecao conta a conta
   *   recente  { conta: media/mes }       - o gasto real dos ultimos 3 meses
   */
  function diagnosticoPlano(cap, proj, recente) {
    var receita = Math.max(1, Number(cap.receita) || 0);
    var refs = proj.refs || [];
    var doze = Math.min(12, Math.max(1, refs.length - 1));

    // quanto cada despesa custa por mes: o maior entre o planejado para os
    // proximos doze meses e o que ela custou de verdade nos ultimos tres
    var contas = [];
    (proj.linhas || []).forEach(function(l) {
      if (l.natureza !== 'DESPESA' || l.grupo === 'EVENTO') return;
      var soma = 0;
      for (var i = 1; i <= doze; i++) soma += Number(l.previsto[i]) || 0;
      var planejado = soma / doze;
      var real = Number(recente[l.conta]) || 0;
      var custo = Math.max(planejado, real);
      if (custo < 1) return;
      contas.push({ conta: l.conta, grupo: l.grupo, custo: custo,
                    planejado: planejado, real: real, linha: l });
    });
    contas.sort(function(a, b) { return b.custo - a.custo; });

    var maiores = contas.slice(0, 6).map(function(c) {
      return { conta: c.conta, gasto: Math.round(c.custo),
               pct: Math.round(c.custo / receita * 1000) / 10 };
    });

    // ---- cortes no dia a dia
    var porTipo = {};
    contas.forEach(function(c) {
      var nome = String(c.conta).toUpperCase();
      if (MORADIA_RE.test(nome)) return;
      for (var k = 0; k < ALAVANCAS_PLANO.length; k++) {
        var a = ALAVANCAS_PLANO[k];
        if (!a.re.test(nome)) continue;
        var t = porTipo[a.tipo] = porTipo[a.tipo] ||
          { tipo: a.tipo, titulo: a.titulo, dica: a.dica, corte: a.corte, gasto: 0, contas: [] };
        t.gasto += c.custo;
        t.contas.push(c.conta);
        return;
      }
    });
    var alavancas = Object.keys(porTipo).map(function(k) {
      var t = porTipo[k];
      return { tipo: t.tipo, titulo: t.titulo, dica: t.dica, contas: t.contas,
               gasto: Math.round(t.gasto), corte: t.corte,
               ganho: Math.round(t.gasto * t.corte / 10) * 10 };
    }).filter(function(a) { return a.ganho >= 50; });

    // ---- moradia: so entra se passar do que se considera saudavel
    var moradia = contas.filter(function(c) { return MORADIA_RE.test(String(c.conta).toUpperCase()); });
    var gastoMoradia = moradia.reduce(function(s, c) { return s + c.custo; }, 0);
    var pctMoradia = gastoMoradia / receita;
    if (pctMoradia > LIMITE_MORADIA) {
      var excesso = gastoMoradia - LIMITE_MORADIA * receita;
      var ganhoM = Math.round(Math.min(excesso, gastoMoradia * 0.3) / 10) * 10;
      if (ganhoM >= 50) {
        alavancas.push({ tipo: 'moradia', titulo: 'Moradia', estrutural: true,
          contas: moradia.map(function(c) { return c.conta; }),
          gasto: Math.round(gastoMoradia), ganho: ganhoM,
          dica: 'leva ' + Math.round(pctMoradia * 100) + '% do que entra — o saudável é até ' +
                Math.round(LIMITE_MORADIA * 100) + '%. Renegociar o aluguel na renovação ou ' +
                'procurar algo até ' + reaisPlano(gastoMoradia - ganhoM) + ' por mês fecha essa diferença' });
      }
    }
    alavancas.sort(function(a, b) { return b.ganho - a.ganho; });

    // ---- renda: o lado que quase ninguem olha
    var salario = 0;
    (proj.linhas || []).forEach(function(l) {
      if (l.natureza === 'RECEITA' && /SALARIO/.test(String(l.conta).toUpperCase())) {
        salario += Number(l.previsto[1]) || 0;
      }
    });
    var renda = {
      ganho: Math.round(receita * 0.10 / 10) * 10,
      salario: Math.round(salario),
      dica: '10% a mais no que entra: negociar o reajuste com números do que você entregou, ' +
            'uma consultoria ou serviço por fora por mês, ou pôr para render algo parado ' +
            '(vaga, equipamento, um cômodo)'
    };

    // ---- folgas ja contratadas: contas que acabam sozinhas no horizonte
    var folgas = [];
    contas.forEach(function(c) {
      var v = c.linha.previsto, ultimo = -1;
      for (var i = v.length - 1; i >= 0; i--) { if ((Number(v[i]) || 0) > 0.005) { ultimo = i; break; } }
      // so e folga se ficar zerada por pelo menos um ano depois: o IPVA de junho
      // nao "acaba" so porque a projecao termina em setembro
      if (ultimo < 0 || ultimo > v.length - 13) return;
      var soma = 0, n = 0;
      for (var j = 0; j <= ultimo; j++) { if ((Number(v[j]) || 0) > 0.005) { soma += Number(v[j]); n++; } }
      var libera = n ? soma / n : 0;
      if (libera < 100 || n < 3) return;                     // evento pontual nao e folga
      folgas.push({ conta: c.conta, ate: refs[ultimo] ? refs[ultimo].ref : '',
                    libera: Math.round(libera) });
    });
    folgas.sort(function(a, b) { return a.ate < b.ate ? -1 : 1; });

    return {
      receita: Math.round(receita), despesa: Math.round(Number(cap.despesa) || 0),
      sobra: Math.round(Number(cap.mes) || 0),
      maiores: maiores, alavancas: alavancas, renda: renda, folgas: folgas,
      cortes: alavancas.filter(function(a) { return !a.estrutural; })
                       .reduce(function(s, a) { return s + a.ganho; }, 0),
      moradia: (alavancas.filter(function(a) { return a.tipo === 'moradia'; })[0] || {}).ganho || 0
    };
  }

  /** 2580 -> "R$ 2.580" */
  function reaisPlano(v) {
    var t = String(Math.round(Math.abs(Number(v) || 0))), fora = '';
    while (t.length > 3) { fora = '.' + t.slice(-3) + fora; t = t.slice(0, -3); }
    return 'R$ ' + t + fora;
  }

  /** Cenarios que se pagam: cada um diz de onde sai o dinheiro. So os positivos. */
  function montarCenarios(sobra, d) {
    sobra = Math.round(Number(sobra) || 0);
    var leves = Math.round(d.cortes * 0.5 / 10) * 10;
    var lista = [];
    function add(nome, aporte, como) {
      aporte = Math.floor(aporte / 50) * 50;
      if (aporte < 100) return;
      if (lista.some(function(x) { return Math.abs(x.aporte - aporte) < 100; })) return;
      lista.push({ nome: nome, aporte: aporte, como: como });
    }
    var R = reaisPlano;
    // de onde sai o dinheiro, em linguagem de gente: "X por mes de cortes;
    // cobre a falta de Y e o resto vai para o plano"
    function frase(oque, valor) {
      return oque + ' (' + R(valor) + ' por mês)' +
        (sobra > 0 ? ' + o que já sobra (' + R(sobra) + ')'
                   : ': cobre a falta de ' + R(sobra) + ' e o resto vai para o plano');
    }
    if (sobra > 0) add('Com o que já sobra', sobra, 'sem mudar nada — só guardar a sobra todo mês');
    add('Ajustando o dia a dia', sobra + leves, frase('metade dos cortes sugeridos', leves));
    add('Cortes completos', sobra + d.cortes, frase('todos os cortes do dia a dia', d.cortes));
    if (d.moradia) {
      add('Cortes + moradia', sobra + d.cortes + d.moradia,
          frase('todos os cortes + moradia dentro de 30% da renda', d.cortes + d.moradia));
    }

  /* ======================== O PLANO DESTE MÊS ========================
   * O "guardar por mês" do plano é uma reta: a média dos próximos meses.
   * Mês a mês a história é outra - tem mês com festa, IPTU, fatura gorda.
   * Aqui o mês corrente vira um plano de ação próprio:
   *
   *   1. quanto ESTE mês produz em dinheiro: o mesmo "no mês" do Painel
   *      (o que já entrou e saiu + o que ainda vai entrar e sair);
   *   2. a meta: o aporte do plano + o que ficou para trás nos meses já
   *      fechados desde o início do plano, dividido em REPROGRAMAR meses;
   *   3. o gap entre os dois, e de onde tirar: só nas contas do dia a dia
   *      (as mesmas alavancas do diagnóstico), só no que ainda NÃO foi
   *      gasto, e só o necessário - nunca corta mais que o gap.

   * No cartão o que se gasta hoje cai na fatura ABERTA (a do mês que vem),

  function planoDoMes(alvo) {

          // o dinheiro do mês dia a dia, para a curva do saldo

                  + '&mes_ref=eq.' + mes + '&meio=neq.CARTAO_CREDITO&status=neq.IGNORADO&order=data')
        ]).then(function (R) { return [c, saiPor, aberta, R0[2]].concat(R); });

      .then(function (R) {

        // ---- o que ficou para trás: meses fechados, pelo dinheiro que
        // entrou e saiu de verdade

          var f = fluxoPassado(ref), sobra = n(f.jaEntrou - f.jaSaiu);
          return { mes: ref, sobra: sobra, faltou: n(aporte - sobra) };

        // ("fecha com" é o saldo em conta no último dia)

        var meta = aporte + reprog;

        var hoje = new Date();
        var diasMes = diasNoMes(mes) - hoje.getDate() + 1;

          lista.forEach(function (x) {

            // não cobriu é dinheiro que dá para não gastar
            if (MORADIA_RE.test(nome)) return;

            for (var k = 0; k < ALAVANCAS_PLANO.length; k++) {
              if (ALAVANCAS_PLANO[k].re.test(nome)) { tipo = ALAVANCAS_PLANO[k]; break; }

            if (!tipo) return;

            candidatos.push({

              previsto: x.previsto, gasto: x.realizado, restante: Math.max(0, restante),
              estourou: restante <= -1 ? n(-restante) : 0,
              possivel: restante > 0 ? Math.min(restante, x.previsto * tipo.corte) : 0,
              dias: cartao ? Math.max(1, cicloAb.dias - cicloAb.hoje) : Math.max(1, diasMes),

            (R[7] || []).forEach(function (l) {

              var dia = Number(String(l.data).slice(8, 10)), v = Number(l.valor) || 0;

  }

     nas outras foi o que fez as contas voltarem duplicadas. Aqui os
     lançamentos, as regras e os previstos apontam para o mesmo id — então
     renomear é uma linha só, e não há como esquecer um lugar. */
  function salvarConta(nome, dados) {
    return rest('/rest/v1/categorias?select=id&nome=eq.' + encodeURIComponent(nome) + '&limit=1')
      .then(function (r) {

        if (dados.reajuste !== undefined) campos.reajuste = Number(dados.reajuste) || 0;
        if (dados.mesReajuste !== undefined) campos.mes_reajuste = Number(dados.mesReajuste) || null;

  var TEMPOS = [];

  function ir(tela, aviso) {
    caixa.querySelector('.cx').innerHTML =
      (tela === 'entrar' ? '' : '<button class="topo" data-ir="entrar">← Voltar para entrar</button>') + TELAS[tela]();
    Array.prototype.forEach.call(caixa.querySelectorAll('[data-ir]'), function (b) {
      b.onclick = function () { lembrarEmail(); ir(b.dataset.ir); };
    });
    Array.prototype.forEach.call(caixa.querySelectorAll('[data-site]'), function (a) {
      a.onclick = function (ev) {
        ev.preventDefault();
        var url = SITE + a.dataset.site;
        if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) location.href = url;
        else window.open(url, '_blank', 'noopener');
      };
    });
    ACOES[tela]();
    if (aviso) msg(aviso, true);
    var primeiro = caixa.querySelector('input:not([value]),input[value=""]') || caixa.querySelector('input');
    if (primeiro && window.innerWidth > 700) primeiro.focus();
  }
  function lembrarEmail() {
    var e = $('eMail') || $('cMail') || $('rMail') || $('nMail');
    if (e && e.value.trim()) EMAIL = e.value.trim().toLowerCase();
  }
  function enter(id, f) { var e = $(id); if (e) e.onkeydown = function (ev) { if (ev.key === 'Enter') f(); }; }

  function entrou() {
    caixa.hidden = true; msg('');
    try { window.EASYAPP_TRAVA && window.EASYAPP_TRAVA.depoisDoLogin(); } catch (e) {}
    try { window.EASYAPP_CONTA && window.EASYAPP_CONTA.iniciar(); } catch (e) {}
    primeiroAcesso();
  }

  var ACOES = {
    entrar: function () {
      function vai() {
        var e = $('eMail').value.trim().toLowerCase(), s = $('eSenha').value;
        if (!emailOk(e) || !s) return msg('preencha e-mail e senha');
        EMAIL = e; msg('entrando...', true); ocupado(true);
        P.entrar(e, s).then(entrou).catch(function (x) {
          ocupado(false);
          if (/confirmar o e-mail/.test(x.message)) {
            P.auth('resend', { type: 'signup', email: e }).catch(function () {});
            return ir('confirmar', 'mandamos um código novo para o seu e-mail');
          }
          msg(x.message);
        });
      }
      $('eBt').onclick = vai; enter('eSenha', vai);
    },
    criar: function () {
      function vai() {
        var nome = $('cNome').value.trim(), e = $('cMail').value.trim().toLowerCase();
        var z = digitos($('cZap').value), s = $('cSenha').value, s2 = $('cSenha2').value;
        if (nome.length < 2) return msg('diga o seu nome');
        if (!emailOk(e)) return msg('e-mail inválido');
        if (z.length !== 10 && z.length !== 11) return msg('WhatsApp com DDD: (51) 99999-9999');
        if (s.length < 8) return msg('a senha precisa de pelo menos 8 caracteres');
        if (s !== s2) return msg('as duas senhas não são iguais');
        if (!$('cAceite').checked) return msg('para criar a conta, marque que concorda com os termos');
        window.EASYAPP_TERMOS_ACEITO = VERSAO_TERMOS;
        EMAIL = e; msg('criando...', true); ocupado(true);
        P.auth('signup?redirect_to=' + encodeURIComponent(PAGINA_SENHA), { email: e, password: s, data: { nome: nome.slice(0, 80), whatsapp: z } }).then(function (d) {
          ocupado(false);
          if (d.access_token) { P.usarSessao(d); return entrou(); }
          // projeto pede confirmação: o e-mail leva o código
          ir('confirmar');
        }).catch(function (x) { ocupado(false); msg(x.message); });
      }
      mascaraZap($('cZap'));
      $('cBt').onclick = vai; enter('cSenha2', vai);
    },
    confirmar: function () {
      function vai() {
        var c = digitos($('kCod').value);
        if (c.length !== 6) return msg('o código tem 6 dígitos');
        msg('conferindo...', true); ocupado(true);
        P.auth('verify', { type: 'signup', email: EMAIL, token: c }).then(function (d) {
          if (!d.access_token) throw new Error('não deu certo: entre com e-mail e senha');
          P.usarSessao(d); entrou();
        }).catch(function (x) { ocupado(false); msg(x.message); });
      }
      $('kBt').onclick = vai; enter('kCod', vai);
      $('kDeNovo').onclick = function () {
        ocupado(true);
        P.auth('resend', { type: 'signup', email: EMAIL })
          .then(function () { ocupado(false); msg('mandamos de novo', true); })
          .catch(function (x) { ocupado(false); msg(x.message); });
      };
    },
    esqueci: function () {
      function pega() {
        var e = $('rMail').value.trim().toLowerCase();
        if (!emailOk(e)) { msg('e-mail inválido'); return ''; }
        return (EMAIL = e);
      }
      $('rEmail').onclick = function () {
        var e = pega(); if (!e) return;
        ocupado(true); msg('mandando...', true);
        P.auth('recover?redirect_to=' + encodeURIComponent(PAGINA_SENHA), { email: e }).then(function () {
          ocupado(false); ir('nova', 'se o e-mail tiver cadastro, o código já está a caminho');
        }).catch(function (x) { ocupado(false); msg(x.message); });
      };
      $('rZap').onclick = function () {
        var e = pega(); if (!e) return;
        ocupado(true); msg('mandando...', true);
        fetch(CFG.url + '/functions/v1/recuperar', {
          method: 'POST', headers: { 'apikey': CFG.anon, 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: e })
        }).then(function (r) { return r.json(); }).then(function (d) {
          ocupado(false);
          if (d.erro) return msg(d.erro);
          ir('nova', d.msg);
        }).catch(function () { ocupado(false); msg('não consegui falar com o servidor'); });
      };
      if (zap === null) canais();
    },
    nova: function () {
      function vai() {
        if ($('nMail')) {
          var e = $('nMail').value.trim().toLowerCase();
          if (!emailOk(e)) return msg('e-mail inválido');
          EMAIL = e;
        }
        var c = digitos($('nCod').value), s = $('nSenha').value, s2 = $('nSenha2').value;
        if (c.length !== 6) return msg('o código tem 6 dígitos');
        if (s.length < 8) return msg('a senha precisa de pelo menos 8 caracteres');
        if (s !== s2) return msg('as duas senhas não são iguais');
        msg('salvando...', true); ocupado(true);
        P.auth('verify', { type: 'recovery', email: EMAIL, token: c }).then(function (d) {
          if (!d.access_token) throw new Error('código errado ou vencido: peça outro');
          return P.auth('user', { password: s }, 'PUT', d.access_token).then(function () { return d; });
        }).then(function (d) {
          P.usarSessao(d); entrou();
        }).catch(function (x) { ocupado(false); msg(x.message); });
      }
      $('nBt').onclick = vai; enter('nSenha2', vai);
    }
  };

  function montar() {
